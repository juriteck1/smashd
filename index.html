.drop-close:hover{background:rgba(255,255,255,.2)}

.drop-group{margin-bottom:15px}
.drop-label{font-size:11px;font-weight:700;color:#9A9A9A;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px}
.drop-input{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid #E8E8E8;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;background:#fff;box-sizing:border-box}
.drop-input:focus{border-color:#0A2A1E}
.mode-card{border:2px solid #E8E8E8;border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;background:#fff;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.mode-card:hover{border-color:#9A9A9A}
.mode-card.selected{border-color:#0A2A1E;background:#F0F7F4}
.mode-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mode-radio{width:20px;height:20px;border-radius:50%;border:2px solid #E8E8E8;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mode-radio.sel{border-color:#0A2A1E;background:#0A2A1E}
.btn-drop-primary{width:100%;background:#0A2A1E;color:#fff;border:none;border-radius:100px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-drop-primary:hover{background:#0d3a26}
.btn-drop-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-drop-secondary{width:100%;background:#F5F5F5;color:#0A0A0A;border:none;border-radius:100px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s;font-family:'Inter',sans-serif}
.status-badge{font-size:11px;font-weight:700;border-radius:100px;padding:4px 10px;white-space:nowrap}
.msg-bubble-me{background:#0A2A1E;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;align-self:flex-end;max-width:85%}
.msg-bubble-other{background:#F5F5F5;color:#0A0A0A;border-radius:10px;padding:8px 12px;font-size:13px;align-self:flex-start;max-width:85%}

  .drop-overlay{align-items:flex-end;padding:0}
  .drop-header{border-radius:20px 20px 0 0}
}

              <div style={{display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:16,padding:"12px 0 4px"}}>

          {step===3&&(

              <div style={{fontSize:18,fontWeight:900,marginBottom:8}}>Paiement sécurisé !</div>
              <div style={{fontSize:14,color:"#5A5A5A",lineHeight:1.8,marginBottom:20}}>
                <strong>{total} €</strong> bloqués chez SMASHD.<br/>

                Votre code Drop sera généré <strong>après votre choix de créneau</strong>.

              <div style={{background:"#F0F7F4",borderRadius:12,padding:"13px",marginBottom:20,textAlign:"left"}}>

function MessageInput({dropId, onSend, busy}){
  const[val,setVal]=useState("");
  return(
    <div style={{display:"flex",gap:8}}>
      <input
        value={val}
        onChange={e=>setVal(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&val.trim()){onSend(val);setVal("");}}}
        placeholder="Message (sans coordonnées personnelles)…"
        style={{flex:1,padding:"9px 12px",borderRadius:100,border:"1.5px solid #E8E8E8",fontSize:13,outline:"none"}}
      />
      <button onClick={()=>{if(val.trim()){onSend(val);setVal("");}}} disabled={busy} style={{background:"#0A0A0A",color:"#fff",border:"none",borderRadius:100,padding:"9px 16px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Envoyer</button>
    </div>
  );
}
 
function DropVendeurPanel({drops=[],creneaux=[],messages=[],user,tw,onRefresh}){
  const[sel,setSel]=useState(null);
  const[dates,setDates]=useState({});
  const[lieux,setLieux]=useState({});
  const[codeVal,setCodeVal]=useState("");
  const[codeErr,setCodeErr]=useState("");
  const[busy,setBusy]=useState(false);
 
  const proposer=async(drop)=>{
    const slots=[];
    for(let i=0;i<3;i++){
      if(dates[`${drop.id}_${i}`]&&lieux[`${drop.id}_${i}`])
        slots.push({remise_id:drop.id,date_heure:dates[`${drop.id}_${i}`],lieu_precis:lieux[`${drop.id}_${i}`]});
    }
    if(!slots.length){tw("Ajoutez au moins 1 créneau","error");return;}
    setBusy(true);
    try{
      await Promise.all(slots.map(s=>api("drop_creneaux",{method:"POST",body:JSON.stringify(s)})));
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({status:"creneaux_proposes",updated_at:new Date().toISOString()})});
      tw("Créneaux envoyés !");onRefresh();setSel(null);
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const envoyerMsg=async(drop,txt)=>{
    if(!txt||!txt.trim())return;
    const filtered=filterMsg(txt.trim());setBusy(true);
    try{
      await api("drop_messages",{method:"POST",body:JSON.stringify({remise_id:drop.id,auteur_id:user.id,contenu:filtered,contenu_brut:txt,filtre:filtered!==txt})});
      onRefresh();
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const validerCode=async(drop)=>{
    const code=codeVal.trim().toUpperCase();
    if(code!==drop.code){setCodeErr("Code incorrect — vérifiez avec l'acheteur");return;}
    setBusy(true);
    try{
      // Marquer code utilisé + confirmer
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({status:"confirme",code_used:true,updated_at:new Date().toISOString()})});
      await api(`commandes?id=eq.${drop.commande_id}`,{method:"PATCH",body:JSON.stringify({status:"livré",escrow_status:"libéré",drop_status:"confirme"})});
      tw("🎉 Transaction validée ! Fonds débloqués dans votre wallet.");
      onRefresh();setCodeVal("");setCodeErr("");
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const pending=drops.filter(d=>d.status==="mode_choisi");
  const active=drops.filter(d=>["creneaux_proposes","creneau_accepte","code_envoye"].includes(d.status));
  const done=drops.filter(d=>["confirme","litige","expire"].includes(d.status));
 
  const Card=({drop})=>{
    const isOpen=sel===drop.id;
    const mode=DROP_MODES[drop.mode_choisi]||DROP_MODES.meet;
    const dropMsgs=messages.filter(m=>m.remise_id===drop.id);
    const dropCr=creneaux.filter(c=>c.remise_id===drop.id);
    const border=drop.status==="mode_choisi"?"#F5C07A":drop.status==="confirme"?"#00C46A":drop.status==="litige"?"#E8290A":"#E8E8E8";
 
    return(
      <div style={{background:"#fff",border:`1.5px solid ${border}`,borderRadius:16,marginBottom:10,overflow:"hidden"}}>
        {/* Header cliquable */}
        <div onClick={()=>setSel(isOpen?null:drop.id)} style={{padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <div style={{display:"flex",gap:10,alignItems:"center",minWidth:0}}>
            <span style={{fontSize:22,flexShrink:0}}>{mode.icon}</span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:14,fontWeight:800}}>{mode.label}</div>
              <div style={{fontSize:11,color:"#9A9A9A",marginTop:1}}>#{drop.commande_id?.slice(0,8)} · {new Date(drop.created_at).toLocaleDateString("fr-FR")}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
            <StatusBadge s={drop.status}/>
            <span style={{color:"#9A9A9A",fontSize:12}}>{isOpen?"▲":"▼"}</span>
          </div>
        </div>
 
        {isOpen&&(
          <div style={{borderTop:"1px solid #F5F5F5",padding:"16px 18px"}}>
 
            {/* Mode choisi → proposer créneaux */}
            {drop.status==="mode_choisi"&&(
              <div>
                <div style={{background:"#FFF3E0",borderRadius:10,padding:"11px 14px",marginBottom:14,fontSize:13,color:"#8a4a00",lineHeight:1.6}}>
                  ⚡ L'acheteur a sélectionné <strong>{mode.label}</strong> et son paiement est <strong>bloqué en escrow</strong>. Proposez jusqu'à 3 créneaux.
                </div>
                {[0,1,2].map(i=>(
                  <div key={i} style={{background:"#FAFAFA",borderRadius:10,padding:"12px",marginBottom:8}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#9A9A9A",marginBottom:8}}>CRÉNEAU {i+1} {i===0?"*":""}</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      <input type="datetime-local" value={dates[`${drop.id}_${i}`]||""} onChange={e=>setDates(d=>({...d,[`${drop.id}_${i}`]:e.target.value}))} style={{flex:1,minWidth:150,padding:"9px 11px",borderRadius:9,border:"1.5px solid #E8E8E8",fontSize:13,outline:"none"}}/>
                      <input placeholder="Lieu précis (ex: Café République, Lyon 1er)" value={lieux[`${drop.id}_${i}`]||""} onChange={e=>setLieux(d=>({...d,[`${drop.id}_${i}`]:e.target.value}))} style={{flex:2,minWidth:180,padding:"9px 11px",borderRadius:9,border:"1.5px solid #E8E8E8",fontSize:13,outline:"none"}}/>
                    </div>
                  </div>
                ))}
                <button onClick={()=>proposer(drop)} disabled={busy} style={{width:"100%",background:"#0A2A1E",color:"#fff",border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:6}}>
                  {busy?"Envoi…":"📅 Envoyer les créneaux à l'acheteur"}
                </button>
              </div>
            )}
 
            {/* Créneaux proposés */}
            {drop.status==="creneaux_proposes"&&(
              <div>
                <div style={{background:"#E8F0FF",borderRadius:10,padding:"11px 14px",marginBottom:12,fontSize:13,color:"#1A3A8C"}}>
                  📅 Créneaux envoyés. En attente du choix de l'acheteur…
                </div>
                {dropCr.map((cr,i)=>(
                  <div key={cr.id} style={{background:"#FAFAFA",borderRadius:9,padding:"10px 12px",marginBottom:6,fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span><strong>Créneau {i+1} :</strong> {new Date(cr.date_heure).toLocaleString("fr-FR")} — {cr.lieu_precis}</span>
                    <span style={{fontSize:10,fontWeight:700,color:cr.status==="accepté"?"#1A5C3A":"#9A9A9A",textTransform:"uppercase"}}>{cr.status}</span>
                  </div>
                ))}
              </div>
            )}
 
            {/* RDV confirmé — attente code */}
            {drop.status==="creneau_accepte"&&(
              <div style={{background:"#F0F7F4",borderRadius:10,padding:"13px 14px"}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0A2A1E",marginBottom:4}}>✅ RDV confirmé — code envoyé à l'acheteur</div>
                <div style={{fontSize:13,color:"#1A5C3A"}}>📅 {drop.date_finale?new Date(drop.date_finale).toLocaleString("fr-FR"):"—"}<br/>📍 {drop.lieu_final||"—"}</div>
              </div>
            )}
 
            {/* Code envoyé → vendeur saisit le code de l'acheteur */}
            {drop.status==="code_envoye"&&(
              <div>
                <div style={{background:"#F0F7F4",borderRadius:10,padding:"13px 14px",marginBottom:14}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#0A2A1E",marginBottom:4}}>✅ RDV confirmé</div>
                  <div style={{fontSize:13,color:"#1A5C3A"}}>📅 {drop.date_finale?new Date(drop.date_finale).toLocaleString("fr-FR"):"—"}<br/>📍 {drop.lieu_final||"—"}</div>
                </div>
                <div style={{background:"#0A0A0A",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
                  <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>Le jour J — saisissez le code que l'acheteur vous remet</div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,.4)",lineHeight:1.5}}>L'acheteur a un code dans son app. Il vous le donne lors de la remise physique de l'article.</div>
                </div>
                <label style={{fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px",display:"block",marginBottom:8}}>Code remis par l'acheteur</label>
                <div style={{display:"flex",gap:8,marginBottom:codeErr?8:0}}>
                  <input value={codeVal} onChange={e=>setCodeVal(e.target.value.toUpperCase())} placeholder="SMD-XXXX" maxLength={8} style={{flex:1,padding:"12px 14px",borderRadius:12,border:`1.5px solid ${codeErr?"#E8290A":"#E8E8E8"}`,fontSize:18,fontFamily:"'DM Mono',monospace",letterSpacing:4,outline:"none",textTransform:"uppercase",fontWeight:700}}/>
                  <button onClick={()=>validerCode(drop)} disabled={busy} style={{background:"#0A2A1E",color:"#fff",border:"none",borderRadius:12,padding:"12px 18px",fontSize:14,fontWeight:700,cursor:"pointer"}}>
                    {busy?"…":"Valider →"}
                  </button>
                </div>
                {codeErr&&<div style={{fontSize:12,color:"#E8290A",fontWeight:600}}>❌ {codeErr}</div>}
              </div>
            )}
 
            {/* Terminé */}
            {drop.status==="confirme"&&(
              <div style={{background:"#F0F7F4",borderRadius:10,padding:"14px",display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontSize:24}}>🎉</span>
                <div><div style={{fontSize:14,fontWeight:800,color:"#0A2A1E"}}>Transaction validée !</div><div style={{fontSize:12,color:"#1A5C3A",marginTop:2}}>Fonds transférés dans votre wallet.</div></div>
              </div>
            )}
 
            {/* Messagerie */}
            {["mode_choisi","creneaux_proposes","creneau_accepte","code_envoye"].includes(drop.status)&&(
              <div style={{marginTop:16,borderTop:"1px solid #F5F5F5",paddingTop:14}}>
                <div style={{fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}}>Messagerie sécurisée</div>
                <div style={{fontSize:10,color:"#E8470A",fontWeight:600,marginBottom:10}}>⚠️ Téléphone, email et réseaux sociaux masqués automatiquement</div>
                <div style={{maxHeight:150,overflowY:"auto",marginBottom:8,display:"flex",flexDirection:"column",gap:6}}>
                  {dropMsgs.length===0
                    ?<div style={{fontSize:12,color:"#9A9A9A",textAlign:"center",padding:"10px"}}>Aucun message pour l'instant.</div>
                    :dropMsgs.map(m=>(
                      <div key={m.id} className={m.auteur_id===user.id?"msg-bubble-me":"msg-bubble-other"}>
                        {m.filtré&&<div style={{fontSize:10,opacity:.6,marginBottom:2}}>⚠️ Contenu partiellement masqué</div>}
                        {m.contenu}
                        <div style={{fontSize:10,opacity:.5,marginTop:3}}>{new Date(m.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</div>
                      </div>
                    ))
                  }
                </div>
                <MessageInput dropId={drop.id} onSend={txt=>envoyerMsg(drop,txt)} busy={busy}/>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };
 
  return(
    <div>
      <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Drop Vendeur</h2>
      <p style={{fontSize:14,color:"#9A9A9A",marginBottom:20}}>Gérez vos remises et proposez des créneaux à vos acheteurs.</p>
      {drops.length===0
        ?<div style={{textAlign:"center",padding:"44px",color:"#9A9A9A",background:"#fff",borderRadius:13,border:"1px solid #E8E8E8"}}><div style={{fontSize:32,marginBottom:12}}>📦</div><div style={{fontWeight:600}}>Aucune remise en cours</div></div>
        :<div>
          {pending.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:"#C25A00",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>⏳ Action requise ({pending.length})</div>{pending.map(d=><Card key={d.id} drop={d}/>)}</div>}
          {active.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:"#1A3A8C",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>📅 En cours ({active.length})</div>{active.map(d=><Card key={d.id} drop={d}/>)}</div>}
          {done.length>0&&<div><div style={{fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>✅ Terminés ({done.length})</div>{done.map(d=><Card key={d.id} drop={d}/>)}</div>}
        </div>
      }
    </div>
  );
}
 
// ═══ PANEL DROP ACHETEUR ═══
function DropAcheteurPanel({drops=[],creneaux=[],messages=[],user,tw,onRefresh}){
  const[sel,setSel]=useState(null);
  const[busy,setBusy]=useState(false);
 
  const accepter=async(drop,cr)=>{
    setBusy(true);
    try{
      await api(`drop_creneaux?id=eq.${cr.id}`,{method:"PATCH",body:JSON.stringify({status:"accepté"})});
      const autres=creneaux.filter(c=>c.remise_id===drop.id&&c.id!==cr.id);
      await Promise.all(autres.map(c=>api(`drop_creneaux?id=eq.${c.id}`,{method:"PATCH",body:JSON.stringify({status:"refusé"})})));
      const code=genCode();
      const expires=new Date(Date.now()+48*3600*1000).toISOString();
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({
        status:"code_envoye",creneau_retenu_id:cr.id,
        lieu_final:cr.lieu_precis,date_finale:cr.date_heure,
        code,code_expires_at:expires,updated_at:new Date().toISOString()
      })});
      tw("RDV confirmé ! Votre code Drop est prêt.");onRefresh();
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const envoyerMsg=async(drop,txt)=>{
    if(!txt||!txt.trim())return;
    const filtered=filterMsg(txt.trim());setBusy(true);
    try{
      await api("drop_messages",{method:"POST",body:JSON.stringify({remise_id:drop.id,auteur_id:user.id,contenu:filtered,contenu_brut:txt,filtre:filtered!==txt})});
      onRefresh();
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const Card=({drop})=>{
    const isOpen=sel===drop.id;
    const mode=DROP_MODES[drop.mode_choisi]||DROP_MODES.meet;
    const dropMsgs=messages.filter(m=>m.remise_id===drop.id);
    const dropCr=creneaux.filter(c=>c.remise_id===drop.id&&c.status==="proposé");
    const border=drop.status==="creneaux_proposes"?"#F5C07A":drop.status==="code_envoye"?"#0A2A1E":drop.status==="confirme"?"#00C46A":"#E8E8E8";
 
    return(
      <div style={{background:"#fff",border:`1.5px solid ${border}`,borderRadius:16,marginBottom:10,overflow:"hidden"}}>
        <div onClick={()=>setSel(isOpen?null:drop.id)} style={{padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <div style={{display:"flex",gap:10,alignItems:"center",minWidth:0}}>
            <span style={{fontSize:22,flexShrink:0}}>{mode.icon}</span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:14,fontWeight:800}}>{mode.label}</div>
              <div style={{fontSize:11,color:"#9A9A9A",marginTop:1}}>#{drop.commande_id?.slice(0,8)} · {new Date(drop.created_at).toLocaleDateString("fr-FR")}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
            <StatusBadge s={drop.status}/>
            <span style={{color:"#9A9A9A",fontSize:12}}>{isOpen?"▲":"▼"}</span>
          </div>
        </div>
 
        {isOpen&&(
          <div style={{borderTop:"1px solid #F5F5F5",padding:"16px 18px"}}>
 
            {drop.status==="mode_choisi"&&(
              <div style={{background:"#F5F5F5",borderRadius:10,padding:"12px 14px",fontSize:13,color:"#5A5A5A",lineHeight:1.6}}>
                ⏳ Votre paiement est sécurisé. Le vendeur prépare ses créneaux de rendez-vous. Vous serez notifié dès qu'ils sont disponibles.
              </div>
            )}
 
            {drop.status==="creneaux_proposes"&&dropCr.length>0&&(
              <div>
                <div style={{background:"#FFF3E0",borderRadius:10,padding:"11px 14px",marginBottom:14,fontSize:13,color:"#8a4a00",lineHeight:1.6}}>
                  📅 Le vendeur vous propose {dropCr.length} créneau{dropCr.length>1?"x":""}. <strong>Votre code Drop sera généré immédiatement après votre choix.</strong>
                </div>
                {dropCr.map((cr,i)=>(
                  <div key={cr.id} style={{background:"#FAFAFA",border:"1.5px solid #E8E8E8",borderRadius:12,padding:"14px",marginBottom:8}}>
                    <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>📅 {new Date(cr.date_heure).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</div>
                    <div style={{fontSize:13,color:"#5A5A5A",marginBottom:10}}>📍 {cr.lieu_precis}</div>
                    <button onClick={()=>accepter(drop,cr)} disabled={busy} style={{width:"100%",background:"#0A2A1E",color:"#fff",border:"none",borderRadius:100,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                      {busy?"…":"✓ Choisir ce créneau"}
                    </button>
                  </div>
                ))}
              </div>
            )}
 
            {drop.status==="code_envoye"&&(
              <div>
                <div style={{background:"#F0F7F4",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#0A2A1E",marginBottom:4}}>✅ RDV confirmé</div>
                  <div style={{fontSize:13,color:"#1A5C3A"}}>📅 {drop.date_finale?new Date(drop.date_finale).toLocaleString("fr-FR"):"—"}<br/>📍 {drop.lieu_final||"—"}</div>
                </div>
                <div style={{background:"#0A0A0A",borderRadius:14,padding:"20px",marginBottom:14,textAlign:"center"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:10}}>Votre code Drop — donnez-le au vendeur lors de la remise</div>
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:32,color:"#00C46A",letterSpacing:6,fontWeight:500,marginBottom:8}}>{drop.code}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,.25)"}}>Expire le {drop.code_expires_at?new Date(drop.code_expires_at).toLocaleDateString("fr-FR"):"—"} · Usage unique · Non transférable</div>
                </div>
                <div style={{background:"#FFF3E0",borderRadius:10,padding:"11px 14px",fontSize:12,color:"#8a4a00",lineHeight:1.6}}>
                  ⚠️ <strong>Important :</strong> Donnez ce code au vendeur <strong>uniquement après avoir vérifié l'état de l'article</strong>. Ce code libère définitivement le paiement.
                </div>
              </div>
            )}
 
            {drop.status==="confirme"&&(
              <div style={{background:"#F0F7F4",borderRadius:10,padding:"14px",display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontSize:24}}>✅</span>
                <div><div style={{fontSize:14,fontWeight:800,color:"#0A2A1E"}}>Transaction terminée !</div><div style={{fontSize:12,color:"#1A5C3A",marginTop:2}}>Article reçu · Vendeur payé · Merci !</div></div>
              </div>
            )}
 
            {/* Messagerie */}
            {["mode_choisi","creneaux_proposes","creneau_accepte","code_envoye"].includes(drop.status)&&(
              <div style={{marginTop:16,borderTop:"1px solid #F5F5F5",paddingTop:14}}>
                <div style={{fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}}>Messagerie sécurisée</div>
                <div style={{fontSize:10,color:"#E8470A",fontWeight:600,marginBottom:10}}>⚠️ Coordonnées personnelles masquées automatiquement</div>
                <div style={{maxHeight:150,overflowY:"auto",marginBottom:8,display:"flex",flexDirection:"column",gap:6}}>
                  {dropMsgs.length===0
                    ?<div style={{fontSize:12,color:"#9A9A9A",textAlign:"center",padding:"10px"}}>Aucun message pour l'instant.</div>
                    :dropMsgs.map(m=>(
                      <div key={m.id} className={m.auteur_id===user.id?"msg-bubble-me":"msg-bubble-other"}>
                        {m.filtré&&<div style={{fontSize:10,opacity:.6,marginBottom:2}}>⚠️ Contenu partiellement masqué</div>}
                        {m.contenu}
                        <div style={{fontSize:10,opacity:.5,marginTop:3}}>{new Date(m.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</div>
                      </div>
                    ))
                  }
                </div>
                <MessageInput dropId={drop.id} onSend={txt=>envoyerMsg(drop,txt)} busy={busy}/>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };
 
  return(
    <div>
      <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Drop Acheteur</h2>
      <p style={{fontSize:14,color:"#9A9A9A",marginBottom:20}}>Choisissez un créneau, obtenez votre code Drop et confirmez la remise.</p>
      {drops.length===0
        ?<div style={{textAlign:"center",padding:"44px",color:"#9A9A9A",background:"#fff",borderRadius:13,border:"1px solid #E8E8E8"}}><div style={{fontSize:32,marginBottom:12}}>🛒</div><div style={{fontWeight:600}}>Aucun achat en cours</div></div>
        :drops.map(d=><Card key={d.id} drop={d}/>)
      }
    </div>
  );
}
 
 
 
// ═══ API ═══
const api=async(p,o={})=>{
  const hdrs={"apikey":KEY,"Authorization":"Bearer "+gt(),"Content-Type":"application/json","Prefer":o.prefer||"return=representation"};
  const {prefer,headers,method,body}=o;
  const r=await fetch(SB+"/rest/v1/"+p,{method:method||"GET",headers:{...hdrs,...(headers||{})},body});
  if(!r.ok){const e=await r.json();throw new Error(e.message||"Err")}
  const t=await r.text();return t?JSON.parse(t):[];
};
const authApi=async(ep,b)=>{const r=await fetch(`${SB}/auth/v1/${ep}`,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(d.error||d.error_description)throw new Error(d.error_description||d.error);return d};
const uploadPhoto=async f=>{const x=f.name.split('.').pop(),n=`${Date.now()}-${Math.random().toString(36).slice(2)}.${x}`;const r=await fetch(`${SB}/storage/v1/object/smashd-photos/${n}`,{method:"POST",headers:{"apikey":KEY,"Authorization":`Bearer ${gt()}`,"Content-Type":f.type},body:f});if(!r.ok)throw new Error("Upload fail");return`${SB}/storage/v1/object/public/smashd-photos/${n}`};

// ═══ APP ═══
function App(){
  const[sc,setSc]=useState("home");
  const[user,setUser]=useState(null);
  const[prof,setProf]=useState(null);
  const[ann,setAnn]=useState([]);
  const[myA,setMyA]=useState([]);
  const[myO,setMyO]=useState([]);
  const[myS,setMyS]=useState([]);
  const[myDropsV,setMyDropsV]=useState([]);
  const[myDropsA,setMyDropsA]=useState([]);
  const[myDropCr,setMyDropCr]=useState([]);
  const[myDropMsgs,setMyDropMsgs]=useState([]);
  const[clubs,setClubs]=useState([]);
  const[toast,setToast]=useState(null);
  const[load,setLoad]=useState(false);
  const[srch,setSrch]=useState("");
  const[fcat,setFcat]=useState("Tous");
  const[fst,setFst]=useState("Tous");
  const[fpr,setFpr]=useState({min:"",max:""});
  const[sel,setSel]=useState(null);
  const[dtab,setDtab]=useState("overview");
  const[lang,setLang]=useState("FR");
  const[favs,setFavs]=useState({});
 
  const tw=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3500)};
  const go=(s,d=null)=>{setSc(s);if(d)setSel(d);window.scrollTo(0,0)};
 
  const loadA=async()=>{try{const d=await api("annonces?status=eq.active&order=created_at.desc&limit=60");setAnn(d)}catch(e){}};
 
  // Gérer retour Stripe
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const payment=params.get("payment");
    const session_id=params.get("session_id");
    if(payment==="success"&&session_id){
      tw("✅ Paiement confirmé ! Votre commande est sécurisée.");
      // Nettoyer l'URL
      window.history.replaceState({},"",window.location.pathname);
      setSc("dashboard");setDtab("drop-acheteur");
    } else if(payment==="cancelled"){
      tw("Paiement annulé.","error");
      window.history.replaceState({},"",window.location.pathname);
    }
  },[]);
  const loadClubs=async()=>{try{const d=await api("drop_clubs?actif=eq.true&order=departement");setClubs(d)}catch(e){}};
 
  const loadMy=async uid=>{
    try{
      const[a,o,s]=await Promise.all([
        api(`annonces?user_id=eq.${uid}&order=created_at.desc`),
        api(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),
        api(`commandes?seller_id=eq.${uid}&order=created_at.desc`)
      ]);
      setMyA(a);setMyO(o);setMyS(s);
    }catch(e){}
  };
 
  const loadDrops=async uid=>{
    try{
      const[dv,da]=await Promise.all([
        api(`drop_remises?vendeur_id=eq.${uid}&order=created_at.desc`),
        api(`drop_remises?acheteur_id=eq.${uid}&order=created_at.desc`)
      ]);
      setMyDropsV(dv);setMyDropsA(da);
      const allIds=[...dv,...da].map(d=>d.id);
      if(allIds.length>0){
        const[crs,msgs]=await Promise.all([
          api(`drop_creneaux?remise_id=in.(${allIds.join(",")})&order=created_at`),
          api(`drop_messages?remise_id=in.(${allIds.join(",")})&order=created_at`)
        ]);
        setMyDropCr(crs);setMyDropMsgs(msgs);
      }
    }catch(e){}
  };
 
  useEffect(()=>{loadA();loadClubs()},[]);
  useEffect(()=>{if(user?.id){loadMy(user.id);loadDrops(user.id)}},[user?.id]);
 
  const login=async(email,pwd)=>{setLoad(true);try{const d=await authApi("token?grant_type=password",{email,password:pwd});st(d.access_token);setUser(d.user);const p=await api(`profiles?id=eq.${d.user.id}`);setProf(p[0]||null);tw("Bienvenue !");go("home")}catch(e){throw e}finally{setLoad(false)}};
  const register=async(email,pwd,name,ut,siret,company)=>{setLoad(true);try{const d=await authApi("signup",{email,password:pwd});if(d.user){if(d.access_token)st(d.access_token);await api("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:ut,siret:siret||null,company:company||null})});setUser(d.user);setProf({id:d.user.id,name,email,user_type:ut});tw("Compte créé !");go("home")}}catch(e){throw e}finally{setLoad(false)}};
  const logout=()=>{ct();setUser(null);setProf(null);setMyA([]);setMyO([]);setMyS([]);setMyDropsV([]);setMyDropsA([]);go("home")};
 
  const publish=async f=>{
    if(!user){go("auth");return}
    setLoad(true);
    try{
      await api("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...f,status:"active"})});
      tw("Annonce publiée !");await loadA();await loadMy(user.id);go("dashboard");setDtab("annonces");
    }catch(e){tw("Erreur : "+e.message,"error")}
    finally{setLoad(false)}
  };
 
  const toggleA=async(id,status)=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});await loadMy(user.id);await loadA()}catch(e){}};
  const deleteA=async id=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});await loadMy(user.id);await loadA()}catch(e){}};
 
  const placeOrder=async(a,modeChoisi)=>{
    if(!user){go("auth");return false}
    setLoad(true);
    try{
      const c=parseFloat((a.price*.08).toFixed(2)),g=parseFloat((a.price-c).toFixed(2));
      const cmds=await api("commandes",{method:"POST",body:JSON.stringify({
        annonce_id:a.id,buyer_id:user.id,seller_id:a.user_id,
        price:a.price,commission:c,gain:g,
        shipping_method:modeChoisi,status:"en attente",
        escrow_status:"bloqué",drop_status:"en_attente"
      })});
      const cmd=cmds[0];
      if(cmd?.id){
        await api("drop_remises",{method:"POST",body:JSON.stringify({
          commande_id:cmd.id,annonce_id:a.id,
          vendeur_id:a.user_id,acheteur_id:user.id,
          mode_choisi:modeChoisi,status:"mode_choisi"
        })});
      }
      await api(`annonces?id=eq.${a.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});
      tw("Commande confirmée ! Paiement sécurisé en escrow.");
      await loadA();await loadMy(user.id);await loadDrops(user.id);
      return true;
    }catch(e){tw("Erreur","error");return false}
    finally{setLoad(false)}
  };
 
  const onDropRefresh=()=>{if(user?.id)loadDrops(user.id)};
 
  const fil=ann
    .filter(a=>fcat==="Tous"||a.category===fcat||a.sub_category===fcat)
    .filter(a=>fst==="Tous"||a.state===fst)
    .filter(a=>!fpr.min||a.price>=parseFloat(fpr.min))
    .filter(a=>!fpr.max||a.price<=parseFloat(fpr.max))
    .filter(a=>!srch||a.title?.toLowerCase().includes(srch.toLowerCase())||a.brand?.toLowerCase().includes(srch.toLowerCase()));
 
  const pendingV=myDropsV.filter(d=>d.status==="mode_choisi").length;
  const pendingA=myDropsA.filter(d=>d.status==="creneaux_proposes").length;
  const wal=myS.filter(s=>myDropsV.find(d=>d.commande_id===s.id&&d.status==="confirme")).reduce((acc,s)=>acc+(s.gain||0),0);
 
  const p={user,prof,load,tw,go,login,register,logout,publish,toggleA,deleteA,placeOrder,
    myA,myO,myS,myDropsV,myDropsA,myDropCr,myDropMsgs,clubs,wal,dtab,setDtab,
    ann:fil,allAnn:ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,sel,
    lang,setLang,favs,setFavs,pendingV,pendingA,onDropRefresh};
 
  return(
    <div>
      {toast&&<Toast {...toast}/>}
      {sc==="home"&&<Home {...p}/>}
      {sc==="auth"&&<Auth {...p}/>}
      {sc==="sell"&&<Sell {...p}/>}
      {sc==="article"&&<Article {...p}/>}
      {sc==="dashboard"&&<Dash {...p}/>}
    </div>
  );
}
 
// ═══ HOME ═══

            </div>
            {user?(

                <button onClick={()=>go("sell")} className="btn hm" style={{background:C.o,color:C.w,border:"none",borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Vendre</button>

// ═══ AUTH ═══
function Auth({login,register,load,go}){
  const[mode,setMode]=useState("login");
  const[step,setStep]=useState(0);
  const[ut,setUt]=useState("particulier");
  const[email,setEmail]=useState("");
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[name,setName]=useState("");
  const[siret,setSiret]=useState("");
  const[company,setCompany]=useState("");
  const[cgv,setCgv]=useState(false);
  const[err,setErr]=useState({});
 
  const inp={width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"};
  const v0=()=>{const e={};if(!email||!/\S+@\S+\.\S+/.test(email))e.email="Email invalide";if(!pwd||pwd.length<6)e.pwd="6 min";if(mode==="register"&&pwd!==pwd2)e.pwd2="Différents";setErr(e);return!Object.keys(e).length};
  const v1=()=>{const e={};if(!name)e.name="Requis";if(ut==="pro"&&!siret)e.siret="Requis";if(!cgv)e.cgv="Requis";setErr(e);return!Object.keys(e).length};
  const doLogin=async()=>{if(!v0())return;try{await login(email,pwd)}catch(e){setErr({email:"Email ou mot de passe incorrect"})}};
  const doReg=async()=>{if(!v1())return;try{await register(email,pwd,name,ut,siret,company)}catch(e){setErr({email:e.message})}};
 
  const Field=({label,children,error})=>(
    <div style={{marginBottom:14}}>
      <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>{label}</label>
      {children}
      {error&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{error}</div>}
    </div>
  );
 
  return(
    <div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center"}}><Logo s={18}/></nav>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%"}}>
          <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f400,fontSize:13,display:"flex",alignItems:"center",gap:5,marginBottom:20}}><Ico.chL/> Retour</button>
          <div style={{display:"flex",gap:6,marginBottom:24,background:C.f100,borderRadius:12,padding:4}}>
            {[["login","Connexion"],["register","S'inscrire"]].map(([m,l])=>(
              <button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?C.w:"transparent",color:mode===m?C.k:C.f400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>
            ))}
          </div>
          {mode==="login"&&(
            <div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Bon retour</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:22}}>Connectez-vous à votre compte SMASHD</p>
              <Field label="Email" error={err.email}><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vous@exemple.com" style={{...inp,border:`1.5px solid ${err.email?C.r:C.f200}`}}/></Field>
              <Field label="Mot de passe"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()} style={inp}/></Field>
              <button onClick={doLogin} disabled={load} className="btn" style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:8}}>{load?"Connexion…":"Se connecter"}</button>
            </div>
          )}
          {mode==="register"&&(
            <div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Créer un compte</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:18}}>Rejoignez la communauté SMASHD</p>
              <div style={{display:"flex",gap:6,marginBottom:18}}>
                {[["particulier","Particulier"],["pro","Vendeur Pro"]].map(([id,l])=>(
                  <button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?C.g:C.f100,color:ut===id?C.w:C.f600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{l}</button>
                ))}
              </div>
              {ut==="pro"&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:12,color:C.g,marginBottom:16,fontWeight:500}}>Abonnement 99€/an — Invendus + espace publicitaire</div>}
              <div style={{display:"flex",gap:4,marginBottom:20}}>{["Compte","Profil"].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>i?C.g:step===i?C.ga:C.f200,transition:"background .3s"}}/>)}</div>
              {step===0&&(
                <div>
                  <Field label="Email *" error={err.email}><input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{...inp,border:`1.5px solid ${err.email?C.r:C.f200}`}}/></Field>
                  <Field label="Mot de passe *" error={err.pwd}><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum" style={{...inp,border:`1.5px solid ${err.pwd?C.r:C.f200}`}}/></Field>
                  <Field label="Confirmer *" error={err.pwd2}><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} style={{...inp,border:`1.5px solid ${err.pwd2?C.r:C.f200}`}}/></Field>
                  <button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Continuer →</button>
                </div>
              )}
              {step===1&&(
                <div>
                  <Field label={ut==="pro"?"Nom du responsable *":"Nom complet *"} error={err.name}><input value={name} onChange={e=>setName(e.target.value)} placeholder="Jean Dupont" style={{...inp,border:`1.5px solid ${err.name?C.r:C.f200}`}}/></Field>
                  {ut==="pro"&&(
                    <div>
                      <Field label="SIRET *" error={err.siret}><input value={siret} onChange={e=>setSiret(e.target.value)} placeholder="123 456 789 00012" style={{...inp,border:`1.5px solid ${err.siret?C.r:C.f200}`}}/></Field>
                      <Field label="Nom commercial"><input value={company} onChange={e=>setCompany(e.target.value)} style={inp}/></Field>
                    </div>
                  )}
                  <div style={{marginBottom:18}}>
                    <label style={{display:"flex",alignItems:"flex-start",gap:9,cursor:"pointer",fontSize:13,color:C.f600}}>
                      <input type="checkbox" checked={cgv} onChange={e=>setCgv(e.target.checked)} style={{marginTop:3,accentColor:C.g}}/>
                      <span>J'accepte les <span style={{color:C.g,fontWeight:600}}>CGV</span> et la <span style={{color:C.g,fontWeight:600}}>Politique de confidentialité</span></span>
                    </label>
                    {err.cgv&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.cgv}</div>}
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>setStep(0)} style={{flex:1,background:C.f100,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Retour</button>
                    <button onClick={doReg} disabled={load} className="btn" style={{flex:2,background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"Création…":ut==="pro"?"Créer compte Pro":"Créer mon compte"}</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

          }
        </div>
      </div>
    </div>
  );
}

            </div>

          </div>
          <div style={{borderTop:`1px solid ${C.f200}`,paddingTop:16}}>
            {[[<Ico.drop/>,"Livraison SMASHD Drop gratuite"],[<Ico.shld/>,"Paiement bloqué en escrow"],[<Ico.chk/>,"Protection acheteur garantie"],[<Ico.leaf/>,"Article éco-responsable"]].map(([icon,l],i)=>(
              <div key={i} style={{display:"flex",gap:10,alignItems:"center",fontSize:13,color:C.f600,marginBottom:9}}><div style={{color:C.g,flexShrink:0}}>{icon}</div>{l}</div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
 
// ═══ DASHBOARD ═══

                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:5}}>Solde disponible</div>
                <div style={{fontSize:44,fontWeight:900,letterSpacing:"-2px",marginBottom:4}}>{wal.toFixed(2)} €</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:18}}>Uniquement les remises Drop confirmées</div>
                <button className="btn" style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Retirer les fonds</button>
              </div>
              <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Historique</div>
                {myDropsV.length===0?<div style={{textAlign:"center",padding:"14px",color:C.f400,fontSize:13}}>Aucune transaction.</div>:myDropsV.map((d,i)=>{
                  const sale=myS.find(s=>s.id===d.commande_id);
                  return(
                    <div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<myDropsV.length-1?`1px solid ${C.f100}`:"none"}}>
                      <div><div style={{fontSize:13,fontWeight:600}}>{DROP_MODES[d.mode_choisi]?.icon} #{d.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400}}>{new Date(d.created_at).toLocaleDateString("fr-FR")} · {d.status}</div></div>
                      <div style={{fontSize:14,fontWeight:800,color:d.status==="confirme"?C.g:C.f400}}>{d.status==="confirme"?`+${sale?.gain||"—"} €`:"En attente"}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
 
          {dtab==="settings"&&(
            <div>
              <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Paramètres</h2>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {[["Informations personnelles","Nom, email, téléphone"],["Sécurité","Mot de passe, 2FA"],["Moyens de paiement","Carte, IBAN"],["Notifications","Email, push, SMS"],["Langue","Français / English"],["Supprimer mon compte","Irréversible"]].map(([t,s],i)=>(
                  <div key={t} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                    <div><div style={{fontSize:14,fontWeight:600,color:i===5?C.r:C.k}}>{t}</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>{s}</div></div>
                    <Ico.chR/>
                  </div>
                ))}
                <div onClick={logout} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                  <div><div style={{fontSize:14,fontWeight:600,color:C.r}}>Déconnexion</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>Se déconnecter de SMASHD</div></div>
                  <Ico.chR/>
                </div>
              </div>
            </div>
          )}
 
        </div>
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
