// APP
function App(){
  const[sc,setSc]=useState("home");
  const[user,setUser]=useState(null);
  const[prof,setProf]=useState(null);
  const[ann,setAnn]=useState([]);
  const[myA,setMyA]=useState([]);
  const[myO,setMyO]=useState([]);
  const[myS,setMyS]=useState([]);
  const[toast,setToast]=useState(null);
  const[load,setLoad]=useState(false);
  const[srch,setSrch]=useState("");
  const[fcat,setFcat]=useState("Tous");
  const[fst,setFst]=useState("Tous");
  const[fpr,setFpr]=useState({min:"",max:""});
  const[sel,setSel]=useState(null);
  const[dtab,setDtab]=useState("overview");
  const[lang,setLang]=useState("FR");
  const[favs,setFavs]=useState({});
  const T=TR[lang];

  const tw=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000)};
  const go=(s,d=null)=>{setSc(s);if(d)setSel(d);window.scrollTo(0,0)};

  const loadA=async()=>{try{const d=await api("annonces?status=eq.active&order=created_at.desc&limit=60");setAnn(d)}catch(e){}};
  const loadMy=async uid=>{try{const[a,o,s]=await Promise.all([api(`annonces?user_id=eq.${uid}&order=created_at.desc`),api(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),api(`commandes?seller_id=eq.${uid}&order=created_at.desc`)]);setMyA(a);setMyO(o);setMyS(s)}catch(e){}};
  useEffect(()=>{loadA()},[]);

  const login=async(email,pwd)=>{setLoad(true);try{const d=await auth("token?grant_type=password",{email,password:pwd});st(d.access_token);setUser(d.user);const p=await api(`profiles?id=eq.${d.user.id}`);setProf(p[0]||null);await loadMy(d.user.id);tw("Bienvenue !");go("home")}catch(e){throw e}finally{setLoad(false)}};
  const register=async(email,pwd,name,ut,siret,company)=>{setLoad(true);try{const d=await auth("signup",{email,password:pwd});if(d.user){if(d.access_token)st(d.access_token);await api("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:ut,siret:siret||null,company:company||null})});setUser(d.user);setProf({id:d.user.id,name,email,user_type:ut});tw("Compte créé !");go("home")}}catch(e){throw e}finally{setLoad(false)}};
  const logout=()=>{ct();setUser(null);setProf(null);setMyA([]);setMyO([]);setMyS([]);go("home")};
  const publish=async f=>{if(!user){go("auth");return}setLoad(true);try{await api("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...f,status:"active"})});tw("Annonce publiée !");await loadA();await loadMy(user.id);go("dashboard");setDtab("annonces")}catch(e){tw("Erreur : "+e.message,"error")}finally{setLoad(false)}};
  const toggleA=async(id,status)=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});await loadMy(user.id);await loadA()}catch(e){}};
  const deleteA=async id=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});await loadMy(user.id);await loadA()}catch(e){}};
  const order=async(a,sm)=>{if(!user){go("auth");return false}setLoad(true);try{const c=parseFloat((a.price*.08).toFixed(2)),g=parseFloat((a.price-c).toFixed(2));await api("commandes",{method:"POST",body:JSON.stringify({annonce_id:a.id,buyer_id:user.id,seller_id:a.user_id,price:a.price,commission:c,gain:g,shipping_method:sm,status:"en attente"})});await api(`annonces?id=eq.${a.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});tw("Commande confirmée !");await loadA();await loadMy(user.id);return true}catch(e){tw("Erreur","error");return false}finally{setLoad(false)}};

  const fil=ann.filter(a=>fcat==="Tous"||a.category===fcat).filter(a=>fst==="Tous"||a.state===fst).filter(a=>!fpr.min||a.price>=parseFloat(fpr.min)).filter(a=>!fpr.max||a.price<=parseFloat(fpr.max)).filter(a=>!srch||a.title?.toLowerCase().includes(srch.toLowerCase())||a.brand?.toLowerCase().includes(srch.toLowerCase()));
  const wal=Math.round(myS.reduce((acc,s)=>acc+(s.gain||0),0)*100)/100;
  const p={user,prof,load,tw,go,login,register,logout,publish,toggleA,deleteA,order,myA,myO,myS,wal,dtab,setDtab,ann:fil,allAnn:ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,sel,loadMy,lang,setLang,T,favs,setFavs};
  return<div>{toast&&<Toast {...toast}/>}{sc==="home"&&<Home {...p}/>}{sc==="auth"&&<Auth {...p}/>}{sc==="sell"&&<Sell {...p}/>}{sc==="article"&&<Article {...p}/>}{sc==="dashboard"&&<Dash {...p}/>}</div>;
}

// HOME
function Home({user,prof,ann,allAnn,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,go,lang,setLang,T,favs,setFavs}){
  const[sc,setSc]=useState(false);
  const[mob,setMob]=useState(false);
  useEffect(()=>{const h=()=>setSc(window.scrollY>10);window.addEventListener("scroll",h);return()=>window.removeEventListener("scroll",h)},[]);
  const fn=prof?.name?.split(" ")[0]||prof?.email?.charAt(0)||"?";
  return<div style={{minHeight:"100vh",background:C.w}}>
    {/* NAV */}
    <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:C.w,borderBottom:`1px solid ${sc?C.f200:"transparent"}`,transition:"border .3s",padding:"0 20px"}}>
      <div style={{maxWidth:1200,margin:"0 auto",height:58,display:"flex",alignItems:"center",gap:12}}>
        <div onClick={()=>go("home")} style={{flexShrink:0}}><Logo s={20}/></div>
        {/* Desktop search */}
        <div style={{flex:1,maxWidth:360,position:"relative",margin:"0 12px"}} className="hide-m">
          <div style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.f400}}><I.search/></div>
          <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder={T.s} style={{width:"100%",padding:"8px 14px 8px 34px",borderRadius:100,border:`1.5px solid ${C.f200}`,fontSize:13,outline:"none",background:C.f50,boxSizing:"border-box"}}/>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          {/* Lang switch — desktop */}
          <div style={{display:"flex",background:C.f100,borderRadius:100,overflow:"hidden",border:`1px solid ${C.f200}`}} className="hide-m">
            {["FR","EN"].map(l=><button key={l} onClick={()=>setLang(l)} style={{padding:"5px 12px",fontSize:12,fontWeight:700,border:"none",cursor:"pointer",background:lang===l?C.g:"transparent",color:lang===l?C.w:C.f400,borderRadius:100,transition:"all .15s"}}>{l}</button>)}
          </div>
          {user?(
            <>
              <button onClick={()=>go("sell")} className="btn hide-m" style={{background:C.o,color:C.w,border:"none",borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><I.plus/> {T.sell}</button>
              <button onClick={()=>go("dashboard")} className="btn" style={{width:36,height:36,borderRadius:"50%",background:C.g,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:C.w,fontWeight:700,fontSize:14}}>{fn.charAt(0).toUpperCase()}</button>
            </>
          ):(
            <>
              {/* Desktop: both buttons */}
              <button onClick={()=>go("auth")} className="btn hide-m" style={{background:"transparent",color:C.k,border:`1.5px solid ${C.f200}`,borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.log}</button>
              <button onClick={()=>go("auth")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{T.reg}</button>
              {/* Mobile: show login button too */}
              <button onClick={()=>go("auth")} className="btn" style={{background:"transparent",color:C.k,border:`1.5px solid ${C.f200}`,borderRadius:100,padding:"8px 14px",fontSize:12,fontWeight:600,cursor:"pointer",display:"none"}} id="mob-login">{T.log}</button>
            </>

function Auth({login,register,load,go,T}){
  const[mode,setMode]=useState("login");

  const[email,setEmail]=useState("");
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[name,setName]=useState("");
  const[siret,setSiret]=useState("");
  const[company,setCompany]=useState("");
  const[cgv,setCgv]=useState(false);
  const[err,setErr]=useState({});

  const v0=()=>{const e={};if(!email||!/\S+@\S+\.\S+/.test(email))e.email=T.iem;if(!pwd||pwd.length<6)e.pwd=T.spd;if(mode==="register"&&pwd!==pwd2)e.pwd2=T.pnm;setErr(e);return!Object.keys(e).length};
  const v1=()=>{const e={};if(!name)e.name=T.nr;if(ut==="pro"&&!siret)e.siret=T.sr;if(!cgv)e.cgv=T.cr;setErr(e);return!Object.keys(e).length};
  const doLogin=async()=>{if(!v0())return;try{await login(email,pwd)}catch(e){setErr({email:T.wc})}};
  const doReg=async()=>{if(!v1())return;try{await register(email,pwd,name,ut,siret,company)}catch(e){setErr({email:e.message})}};

  return<div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center",gap:12}}>
      <Logo s={18}/>
    </nav>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
      <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%",boxShadow:"0 4px 24px rgba(0,0,0,.06)"}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f400,fontSize:13,display:"flex",alignItems:"center",gap:5,marginBottom:20}}><I.chL/> {T.back}</button>
        {/* Mode tabs */}
        <div style={{display:"flex",gap:6,marginBottom:24,background:C.f100,borderRadius:12,padding:4}}>
          {[["login",T.log],["register",T.reg]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?C.w:"transparent",color:mode===m?C.k:C.f400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}
        </div>

        {/* LOGIN */}
        {mode==="login"&&<>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.lti}</h2>
          <p style={{fontSize:13,color:C.f400,marginBottom:22}}>{T.lts}</p>
          <Inp label={T.ema} type="email" val={email} set={setEmail} ph="vous@exemple.com" err={err.email}/>
          <Inp label={T.pwd} type="password" val={pwd} set={setPwd} ph="••••••••" kd={e=>e.key==="Enter"&&doLogin()}/>
          <button onClick={doLogin} disabled={load} className="btn" style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:4}}>{load?T.co2:T.con}</button>
        </>}

        {/* REGISTER */}
        {mode==="register"&&<>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.rti}</h2>
          <p style={{fontSize:13,color:C.f400,marginBottom:18}}>{T.rts}</p>
          <div style={{display:"flex",gap:6,marginBottom:18}}>
            {[["particulier",T.ind],["pro",T.pra]].map(([id,l])=><button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?C.g:C.f100,color:ut===id?C.w:C.f600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}
          </div>
          {ut==="pro"&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:12,color:C.g,marginBottom:16,fontWeight:500}}>{T.prn}</div>}

          {step===0&&<>
            <Inp label={T.ema+" *"} type="email" val={email} set={setEmail} ph="vous@exemple.com" err={err.email}/>
            <Inp label={T.pwd+" *"} type="password" val={pwd} set={setPwd} ph={T.spd} err={err.pwd}/>
            <Inp label={T.cnf+" *"} type="password" val={pwd2} set={setPwd2} ph={T.cnf} err={err.pwd2}/>
            <button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{T.cont}</button>
          </>}
          {step===1&&<>
            <Inp label={(ut==="pro"?T.mna:T.nam)+" *"} val={name} set={setName} ph="Jean Dupont" err={err.name}/>
            {ut==="pro"&&<><Inp label={T.sir+" *"} val={siret} set={setSiret} ph="123 456 789 00012" err={err.siret}/><Inp label={T.cmp} val={company} set={setCompany} ph="Mon Shop Tennis"/></>}

            <div style={{display:"flex",gap:8}}><button onClick={()=>setStep(0)} style={{flex:1,background:C.f100,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>{T.back}</button><button onClick={doReg} disabled={load} className="btn" style={{flex:2,background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?T.cr2:ut==="pro"?T.crp:T.cre}</button></div>
          </>}
          {err.email&&step===0&&<div style={{background:C.rl,color:C.r,borderRadius:8,padding:"10px 13px",fontSize:13,marginTop:10}}>❌ {err.email}</div>}
        </>}
      </div>
    </div>
  </div>;

    </nav>

      {step===0&&<div><h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.steps[0]}</h2><p style={{color:C.f400,fontSize:14,marginBottom:24}}>Sélectionnez la catégorie de votre article.</p><div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>{CATS.map(c=><button key={c} onClick={()=>setCat(c)} className="btn" style={{background:cat===c?C.g:C.f50,border:`1.5px solid ${cat===c?C.g:C.f200}`,borderRadius:14,padding:"20px 16px",cursor:"pointer",textAlign:"left",transition:"all .15s"}}><div style={{fontSize:11,fontWeight:700,color:cat===c?"rgba(255,255,255,.5)":"rgba(0,0,0,.3)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:5}}>Sport</div><div style={{fontSize:16,fontWeight:800,color:cat===c?C.w:C.k}}>{c}</div></button>)}</div></div>}
      {step===1&&<div><h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Photos</h2><p style={{color:C.f400,fontSize:14,marginBottom:20}}>Jusqu'à 8 photos. La première sera la principale.</p><div onClick={()=>!up&&ref.current.click()} style={{border:`2px dashed ${C.f200}`,borderRadius:16,padding:"36px",textAlign:"center",cursor:"pointer",background:C.f50,marginBottom:14}}><div style={{width:44,height:44,background:C.g,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px",color:C.w}}><I.plus/></div><div style={{fontSize:14,fontWeight:700,marginBottom:3}}>{up?T.up:"Ajouter des photos"}</div><div style={{fontSize:12,color:C.f400}}>JPG, PNG — Max 8</div><input ref={ref} type="file" accept="image/*" multiple onChange={handleUp} style={{display:"none"}}/></div>{photos.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>{photos.map((url,i)=><div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:10,overflow:"hidden",border:`2px solid ${i===0?C.g:C.f200}`}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>{i===0&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:C.g,color:C.w,fontSize:9,fontWeight:700,padding:"3px",textAlign:"center"}}>PRINCIPALE</div>}<button onClick={()=>setPhotos(p=>p.filter((_,j)=>j!==i))} style={{position:"absolute",top:4,right:4,width:20,height:20,background:"rgba(0,0,0,.65)",color:C.w,border:"none",borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I.x/></button></div>)}{photos.length<8&&<div onClick={()=>ref.current.click()} style={{aspectRatio:"1",borderRadius:10,border:`2px dashed ${C.f200}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:20,color:C.f400,background:C.f50}}>+</div>}</div>}{photos.length===0&&<div style={{background:"#FFF8E1",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#8a6a00"}}>Au moins 1 photo requise.</div>}</div>}
      {step===2&&<div style={{display:"flex",flexDirection:"column",gap:16}}><h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",margin:0}}>L'article</h2><div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Marque</label><div style={{display:"flex",flexWrap:"wrap",gap:7}}>{[...(BRANDS[cat]||[])].filter((v,i,a)=>a.indexOf(v)===i).map(b=><Pill key={b} l={b} a={brand===b} onClick={()=>setBrand(b)}/>)}</div></div><div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>État</label><div style={{display:"flex",flexWrap:"wrap",gap:7}}>{STATES.map(s=><Pill key={s} l={s} a={state===s} onClick={()=>setState(s)}/>)}</div></div><Inp label="Titre *" val={title} set={setTitle} ph={`Ex: ${brand||"Wilson"} ${cat}`}/><div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:6,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Description</label><textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={4} placeholder="Décrivez l'article…" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,resize:"vertical",boxSizing:"border-box",outline:"none"}}/></div></div>}
      {step===3&&<div><h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Le prix</h2><p style={{color:C.f400,fontSize:14,marginBottom:28}}>Positionnez-vous bien pour vendre rapidement.</p><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:24}}><input type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0" style={{width:150,padding:"14px 16px",borderRadius:14,border:`2px solid ${C.k}`,fontSize:30,fontWeight:900,textAlign:"center",outline:"none",letterSpacing:"-1px"}}/><span style={{fontSize:30,fontWeight:900,color:C.f400}}>€</span></div>{price>0&&<div style={{background:C.gl,borderRadius:14,padding:"16px 20px"}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:10}}>Récapitulatif</div>{[["Prix de vente",`${price} €`],["Commission (8%)",`- ${comm} €`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:7,color:C.f600}}><span>{k}</span><span>{v}</span></div>)}<div style={{borderTop:`1px solid ${C.f200}`,paddingTop:9,display:"flex",justifyContent:"space-between",fontSize:17,fontWeight:900}}><span>Vous recevez</span><span style={{color:C.g}}>{gain} €</span></div></div>}</div>}
      {step===4&&<div><h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>L'envoi</h2><p style={{color:C.f400,fontSize:14,marginBottom:20}}>L'étiquette est générée automatiquement.</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{SHIP.map(s=><button key={s.id} onClick={()=>setShip(s.id)} className="btn" style={{background:ship===s.id?C.g:C.w,border:`1.5px solid ${ship===s.id?C.g:C.f200}`,borderRadius:14,padding:"16px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left",transition:"all .15s"}}><div><div style={{fontWeight:700,fontSize:14,color:ship===s.id?C.w:C.k}}>{s.l}</div><div style={{fontSize:12,color:ship===s.id?"rgba(255,255,255,.6)":C.f400,marginTop:2}}>{s.d}</div></div><div style={{fontWeight:800,fontSize:16,color:ship===s.id?C.w:C.k}}>{s.p===0?"Gratuit":`${s.p} €`}</div></button>)}</div></div>}
      {step===5&&<div><h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Vérification</h2><p style={{color:C.f400,fontSize:14,marginBottom:20}}>Tout est correct ? Publiez votre annonce.</p><div style={{background:C.w,border:`1.5px solid ${C.f200}`,borderRadius:16,overflow:"hidden"}}>{photos.length>0?<img src={photos[0]} alt="" style={{width:"100%",height:180,objectFit:"cover"}}/>:<div style={{height:100,background:C.f100,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:36,height:36,background:CBG[cat]||C.g,borderRadius:8}}></div></div>}<div style={{padding:"16px 18px"}}><Tag state={state}/><div style={{fontSize:17,fontWeight:800,margin:"7px 0 3px"}}>{title}</div><div style={{fontSize:13,color:C.f400,marginBottom:12}}>{brand} · {cat}</div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:24,fontWeight:900,letterSpacing:"-1px"}}>{price} €</div><div style={{fontSize:13,color:C.f400,textAlign:"right"}}>Vous recevrez {gain} €<br/>via {SHIP.find(s=>s.id===ship)?.l}</div></div></div></div></div>}

      <div style={{display:"flex",justifyContent:"space-between",marginTop:32,paddingTop:24,borderTop:`1px solid ${C.f100}`}}>
        {step>0?<button onClick={()=>setStep(s=>s-1)} style={{background:C.f100,color:C.k,border:"none",borderRadius:100,padding:"12px 22px",fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><I.chL/> {T.back}</button>:<div/>}
        {step<T.steps.length-1?<button onClick={()=>canN()&&setStep(s=>s+1)} disabled={!canN()||up} className="btn" style={{background:canN()&&!up?C.k:"#ccc",color:C.w,border:"none",borderRadius:100,padding:"12px 26px",fontSize:14,fontWeight:700,cursor:canN()?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:6}}>{up?T.up:T.cont} {!up&&<I.arr/>}</button>:<button onClick={()=>publish({title,description:desc,category:cat,brand,state,price:parseFloat(price),shipping:ship,photo_url:photos[0]||null,photos})} disabled={load} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"12px 26px",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>{load?T.pu:T.post} {!load&&<I.arr/>}</button>}
      </div>
    </div>
  </div>;
}

// ARTICLE
function Article({sel,go,user,order,load,T,favs,setFavs}){
  const a=sel;
  const[tab,setTab]=useState("desc");
  const[ship,setShip]=useState("mondial");
  const[ofr,setOfr]=useState("");
  const[ofrSent,setOfrSent]=useState(false);
  const[checkout,setCheckout]=useState(false);
  const[ordered,setOrdered]=useState(false);
  const[mp,setMp]=useState(0);
  if(!a)return null;
  const photos=a.photos&&a.photos.length>0?a.photos:(a.photo_url?[a.photo_url]:[]);
  const comm=(a.price*.08).toFixed(2);
  const sc=SHIP.find(s=>s.id===ship)?.p||0;
  const tot=(parseFloat(a.price)+parseFloat(comm)+sc).toFixed(2);
  const doOrder=async()=>{const ok=await order(a,ship);if(ok)setOrdered(true)};

  return<div style={{minHeight:"100vh",background:C.w}}>
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><I.chL/> {T.back}</button>
      <Logo s={18}/>
    </nav>

    {checkout&&!ordered&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
      <div style={{background:C.w,borderRadius:20,padding:"26px",maxWidth:440,width:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><h3 style={{fontSize:17,fontWeight:800}}>{T.fin}</h3><button onClick={()=>setCheckout(false)} style={{background:C.f100,border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><I.x/></button></div>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:18,background:C.f50,borderRadius:12,padding:"11px"}}>{photos.length>0?<img src={photos[0]} alt="" style={{width:48,height:48,objectFit:"cover",borderRadius:8}}/>:<div style={{width:48,height:48,background:C.f200,borderRadius:8}}/>}<div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{a.title}</div><Tag state={a.state}/></div><div style={{fontWeight:900,fontSize:16}}>{a.price} €</div></div>
        <div style={{marginBottom:16}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:9}}>{T.del}</div>{SHIP.map(s=><button key={s.id} onClick={()=>setShip(s.id)} style={{width:"100%",background:ship===s.id?C.gl:C.w,border:`1.5px solid ${ship===s.id?C.g:C.f200}`,borderRadius:10,padding:"10px 13px",cursor:"pointer",display:"flex",justifyContent:"space-between",marginBottom:5,textAlign:"left",transition:"all .15s"}}><div><div style={{fontSize:13,fontWeight:600}}>{s.l}</div><div style={{fontSize:11,color:C.f400}}>{s.d}</div></div><div style={{fontWeight:700,color:ship===s.id?C.g:C.k}}>{s.p===0?"Gratuit":`${s.p} €`}</div></button>)}</div>
        <div style={{background:C.f50,borderRadius:12,padding:"13px",marginBottom:14}}>{[["Article",`${a.price} €`],["Livraison",`${sc} €`],["Protection acheteur",`${comm} €`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4,color:C.f600}}><span>{k}</span><span>{v}</span></div>)}<div style={{borderTop:`1px solid ${C.f200}`,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:16,marginTop:4}}><span>{T.tot}</span><span style={{color:C.g}}>{tot} €</span></div></div>
        <div style={{fontSize:12,color:C.f400,marginBottom:13,display:"flex",alignItems:"center",gap:5}}><I.shld/> {T.sec}</div>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setCheckout(false)} style={{flex:1,background:C.f100,color:C.k,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>{T.can}</button><button onClick={doOrder} disabled={load} className="btn" style={{flex:2,background:C.o,color:C.w,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"…":`${T.pay} ${tot} €`}</button></div>
      </div>
    </div>}

    {ordered&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
      <div style={{background:C.w,borderRadius:20,padding:"40px 32px",maxWidth:360,textAlign:"center"}}>
        <div style={{width:60,height:60,background:C.gl,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px",color:C.g,fontSize:24}}><I.chk/></div>
        <h3 style={{fontSize:20,fontWeight:900,marginBottom:8}}>{T.ok}</h3>
        <p style={{color:C.f400,fontSize:14,marginBottom:24,lineHeight:1.7}}>{T.okd}</p>
        <button onClick={()=>go("dashboard")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"14px 28px",fontSize:14,fontWeight:700,cursor:"pointer",width:"100%"}}>{T.vo}</button>
      </div>
    </div>}

    <div style={{maxWidth:1060,margin:"0 auto",padding:"36px 20px",display:"grid",gridTemplateColumns:"1fr 320px",gap:40}} className="grid1m">
      <div>
        <div style={{background:C.f100,borderRadius:16,height:340,overflow:"hidden",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
          {photos.length>0?<img src={photos[mp]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:60,height:60,background:CBG[a.category]||C.g,borderRadius:14}}/>}
        </div>
        {photos.length>1&&<div style={{display:"flex",gap:8,marginBottom:24,overflowX:"auto"}}>{photos.map((url,i)=><div key={i} onClick={()=>setMp(i)} style={{width:64,height:64,borderRadius:10,overflow:"hidden",border:`2px solid ${mp===i?C.k:C.f200}`,cursor:"pointer",flexShrink:0}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>)}</div>}
        <div style={{display:"flex",borderBottom:`1px solid ${C.f200}`,marginBottom:18}}>
          {[[`desc`,T.desc],[`specs`,T.spec]].map(([id,l])=><button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===id?C.k:"transparent"}`,padding:"10px 0",marginRight:24,fontSize:14,fontWeight:tab===id?700:400,color:tab===id?C.k:C.f400,cursor:"pointer"}}>{l}</button>)}
        </div>
        {tab==="desc"&&<p style={{fontSize:14,lineHeight:1.8,color:C.f600}}>{a.description||"Aucune description."}</p>}
        {tab==="specs"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["Catégorie",a.category],["Marque",a.brand||"—"],["État",a.state],["Livraison",SHIP.find(s=>s.id===a.shipping)?.l||"—"]].map(([k,v])=><div key={k} style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}><div style={{fontSize:11,fontWeight:700,color:C.f400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{k}</div><div style={{fontSize:14,fontWeight:600}}>{v}</div></div>)}</div>}
      </div>
      <div style={{position:"sticky",top:64,alignSelf:"start"}}>
        <div style={{fontSize:11,fontWeight:700,color:C.f400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>{a.brand} · {a.category}</div>
        <h1 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:7,lineHeight:1.2}}>{a.title}</h1>
        <Tag state={a.state}/>
        <div style={{fontSize:36,fontWeight:900,letterSpacing:"-2px",margin:"13px 0 4px"}}>{a.price} €</div>
        <div style={{fontSize:13,color:C.f400,marginBottom:20}}>+ protection acheteur {comm} €</div>
        {ofrSent&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:13,color:C.g,marginBottom:13}}>Offre de <strong>{ofr} €</strong> envoyée.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:18}}>
          <button onClick={()=>user?setCheckout(true):go("auth")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"15px",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>{T.buy} <I.arr/></button>
          <div style={{display:"flex",gap:7}}><input type="number" value={ofr} onChange={e=>setOfr(e.target.value)} placeholder="Proposer un prix €" style={{flex:1,padding:"12px 13px",borderRadius:100,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none"}}/><button onClick={()=>ofr&&setOfrSent(true)} className="btn" style={{background:C.w,color:C.k,border:`1.5px solid ${C.k}`,borderRadius:100,padding:"12px 16px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{T.ofer}</button></div>
          <button onClick={()=>setFavs(f=>({...f,[a.id]:!f[a.id]}))} style={{background:"none",border:`1.5px solid ${favs[a.id]?C.o:C.f200}`,borderRadius:100,padding:"11px",fontSize:14,fontWeight:600,cursor:"pointer",color:favs[a.id]?C.o:C.f400,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><I.heart(favs[a.id])/> {favs[a.id]?T.saved:T.sav}</button>
        </div>
        <div style={{borderTop:`1px solid ${C.f200}`,paddingTop:16}}>
          {[[<I.trk/>,T.tr2[1][0]],[<I.shld/>,T.tr2[0][0]],[<I.chk/>,T.tr2[3][0]],[<I.leaf/>,T.tr2[2][0]]].map(([icon,l],i)=><div key={i} style={{display:"flex",gap:10,alignItems:"center",fontSize:13,color:C.f600,marginBottom:9}}><div style={{color:C.g,flexShrink:0}}>{icon}</div>{l}</div>)}
        </div>
      </div>
    </div>
  </div>;
}

// DASHBOARD

        <div style={{width:34,height:34,borderRadius:"50%",background:isPro?C.k:C.g,display:"flex",alignItems:"center",justifyContent:"center",color:C.w,fontWeight:700,fontSize:13,flexShrink:0}} className="hide-m">{fn.charAt(0).toUpperCase()}</div>

          {DTABS.map(t=><button key={t.id} onClick={()=>setDtab(t.id)} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:dtab===t.id?C.k:"transparent",color:dtab===t.id?C.w:C.f600,fontWeight:dtab===t.id?700:500,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left",transition:"all .15s"}}>{t.l}</button>)}
          <div style={{borderTop:`1px solid ${C.f200}`,marginTop:7,paddingTop:7}}>
            <button onClick={logout} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:"transparent",color:C.r,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>{T.out}</button>
          </div>
        </div>
      </div>

      {/* MAIN */}
      <div style={{minWidth:0,paddingBottom:24}}>
        {/* Mobile tab bar */}
        <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:20,paddingBottom:4}}>
          {DTABS.slice(0,6).map(t=><button key={t.id} onClick={()=>setDtab(t.id)} className="btn" style={{padding:"7px 14px",borderRadius:100,border:`1.5px solid ${dtab===t.id?C.g:C.f200}`,background:dtab===t.id?C.g:C.w,color:dtab===t.id?C.w:C.f600,fontSize:12,fontWeight:dtab===t.id?700:500,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{t.l}</button>)}
        </div>

        {/* OVERVIEW */}
        {dtab==="overview"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>{T.hi}, {fn} 👋</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}} className="grid2m">
            {[[`${rev.toFixed(2)} €`,T.rev,C.g],[myA.filter(a=>a.status==="active").length,T.al,C.k],[myS.length,T.sal,C.o],[myO.length,T.pur,C.f600]].map(([v,l,col])=><div key={l} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"16px"}}><div style={{fontSize:22,fontWeight:900,color:col,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:C.f400,marginTop:3,fontWeight:500}}>{l}</div></div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="grid1m">
            <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>{T.rec}</div>
              {myA.slice(0,4).map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.f100}`}}><div style={{width:36,height:36,borderRadius:8,overflow:"hidden",background:C.f100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:16,height:16,background:CBG[a.category]||C.g,borderRadius:4}}/>}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div><div style={{fontSize:12,color:C.f400}}>{a.price} €</div></div><div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:C.f400,textTransform:"uppercase"}}>{a.status==="active"?T.nl:T.ni2}</div></div>)}
              {myA.length===0&&<div style={{fontSize:13,color:C.f400,textAlign:"center",padding:"14px 0"}}>{T.nol}</div>}
            </div>
            <div style={{background:C.g,borderRadius:14,padding:"20px",color:C.w}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:6}}>{T.wa}</div>
              <div style={{fontSize:34,fontWeight:900,letterSpacing:"-2px",marginBottom:4}}>{wal.toFixed(2)} €</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:18}}>{T.bal}</div>
              <button onClick={()=>setDtab("wallet")} style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.mw}</button>
            </div>
          </div>
        </div>}

        {/* ANNONCES */}
        {dtab==="annonces"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px"}}>{T.ma}</h2>
            <button onClick={()=>go("sell")} className="btn" style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><I.plus/> {T.nl}</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myA.map(a=><div key={a.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:52,height:52,borderRadius:9,overflow:"hidden",background:C.f100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:20,height:20,background:CBG[a.category]||C.g,borderRadius:5}}/>}</div>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{a.category} · {a.price} €</div></div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:a.status==="pause"?C.o:C.f400,textTransform:"uppercase",letterSpacing:".5px",background:a.status==="active"?C.gl:a.status==="pause"?"#FFF3E0":C.f100,padding:"4px 9px",borderRadius:100}}>{a.status==="active"?"En ligne":a.status==="pause"?"Pause":a.status==="vendu"?"Vendu":"—"}</div>
                {a.status!=="vendu"&&a.status!=="supprimé"&&<>
                  <button onClick={()=>toggleA(a.id,a.status==="pause"?"active":"pause")} style={{background:C.f100,color:C.k,border:"none",borderRadius:7,padding:"5px 9px",fontSize:11,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap"}}>{a.status==="pause"?T.act:T.pau}</button>
                  {!boosted.includes(a.id)?<button onClick={()=>setBoostId(a.id)} style={{background:"#FFF3E0",color:C.o,border:"none",borderRadius:7,padding:"5px 9px",fontSize:11,cursor:"pointer",fontWeight:600}}>{T.boo}</button>:<span style={{fontSize:11,color:C.g,fontWeight:700}}>{T.bood}</span>}
                  <button onClick={()=>deleteA(a.id)} style={{background:C.f100,color:C.f400,border:"none",borderRadius:7,padding:"5px 7px",fontSize:11,cursor:"pointer"}}>{T.del2}</button>
                </>}
              </div>
            </div>)}
            {myA.length===0&&<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>{T.nol} <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("sell")}>{T.pf2}</span></div>}
          </div>
          {boostId&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
            <div style={{background:C.w,borderRadius:18,padding:"26px",maxWidth:320,width:"90%",textAlign:"center"}}>
              <div style={{width:48,height:48,background:"#FFF3E0",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 13px",fontSize:20}}>⚡</div>
              <h3 style={{fontSize:16,fontWeight:800,marginBottom:7}}>{T.btit}</h3>
              <p style={{fontSize:13,color:C.f400,marginBottom:20,lineHeight:1.6}}>{T.bdesc}</p>
              <div style={{display:"flex",gap:8}}><button onClick={()=>setBoostId(null)} style={{flex:1,background:C.f100,border:"none",borderRadius:100,padding:"11px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.can}</button><button onClick={()=>{setBoosted(b=>[...b,boostId]);setBoostId(null);tw&&tw("Annonce boostée !")}} className="btn" style={{flex:2,background:C.o,color:C.w,border:"none",borderRadius:100,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Payer 3,50 €</button></div>
            </div>
          </div>}
        </div>}

        {/* VENTES */}
        {dtab==="ventes"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>{T.ms}</h2>
          {myS.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>{T.ns}</div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myS.map(v=><div key={v.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}><div><div style={{fontSize:14,fontWeight:700}}>#{v.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:10,fontWeight:700,color:v.status==="livré"?C.g:C.o,textTransform:"uppercase"}}>{v.status}</div></div><div style={{display:"flex",gap:18,fontSize:13,flexWrap:"wrap"}}><span><span style={{color:C.f400}}>{T.pri} : </span><strong>{v.price} €</strong></span><span><span style={{color:C.f400}}>{T.com} : </span><span style={{color:C.r}}>- {v.commission} €</span></span><span><span style={{color:C.f400}}>{T.net} : </span><strong style={{color:C.g}}>{v.gain} €</strong></span></div></div>)}
          </div>}
        </div>}

        {/* ACHATS */}
        {dtab==="achats"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>{T.mb}</h2>
          {myO.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>{T.nb} <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>{T.exp}</span></div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myO.map(o=><div key={o.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{fontSize:14,fontWeight:700}}>#{o.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:10,fontWeight:700,color:o.status==="livré"?C.g:C.o,textTransform:"uppercase"}}>{o.status}</div></div><div style={{fontSize:14,fontWeight:700,marginTop:8}}>{o.price} € · {o.shipping_method}</div></div>)}
          </div>}
        </div>}

        {/* WALLET */}
        {dtab==="wallet"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>{T.wa}</h2>
          <div style={{background:C.g,borderRadius:16,padding:"26px 28px",marginBottom:16,color:C.w}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:5}}>{T.bal}</div>
            <div style={{fontSize:44,fontWeight:900,letterSpacing:"-2px",marginBottom:18}}>{wal.toFixed(2)} €</div>
            <button className="btn" style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.wd}</button>
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>{T.tr}</div>
            {myS.length===0?<div style={{textAlign:"center",padding:"14px",color:C.f400,fontSize:13}}>{T.nt}</div>:myS.map((s,i)=><div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:i<myS.length-1?`1px solid ${C.f100}`:"none"}}><div><div style={{fontSize:13,fontWeight:600}}>#{s.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400}}>{new Date(s.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:14,fontWeight:800,color:C.g}}>+{s.gain} €</div></div>)}
          </div>
        </div>}

        {/* STATS */}
        {dtab==="stats"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>{T.st}</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}} className="grid2m">
            {[[myA.reduce((a,x)=>a+(x.views||0),0),T.vw],[myA.reduce((a,x)=>a+(x.favs||0),0),T.fav],[myS.length,T.sal],[`${rev.toFixed(0)} €`,T.rev]].map(([v,l])=><div key={l} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"16px"}}><div style={{fontSize:22,fontWeight:900,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:C.f400,marginTop:3}}>{l}</div></div>)}
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>{T.pf}</div>
            {myA.length===0?<div style={{textAlign:"center",padding:"14px",color:C.f400}}>{T.nd}</div>:myA.map(a=><div key={a.id} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"70%"}}>{a.title}</span><span style={{color:C.f400}}>{a.views||0} vues</span></div><div style={{background:C.f100,borderRadius:4,height:5,overflow:"hidden"}}><div style={{background:C.g,height:"100%",borderRadius:4,width:`${Math.min((a.views||0)/Math.max(...myA.map(x=>x.views||1))*100,100)}%`,transition:"width .5s"}}/></div></div>)}
          </div>
        </div>}

        {/* PRO */}
        {dtab==="pro"&&isPro&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.pro}</h2>
          <p style={{color:C.f400,marginBottom:18,fontSize:14}}>Gérez vos invendus et votre espace publicitaire.</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}} className="grid1m">
            <div style={{background:C.k,borderRadius:14,padding:"20px",color:C.w}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.3)",marginBottom:8}}>Abonnement</div><div style={{fontSize:17,fontWeight:800,marginBottom:2}}>PRO Actif</div><div style={{fontSize:12,color:"rgba(255,255,255,.3)"}}>Renouvellement 01/01/2027</div></div>
            <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"20px"}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:8}}>Publicité</div><div style={{fontSize:17,fontWeight:800,marginBottom:2}}>Espace pub</div><div style={{fontSize:12,color:C.f400}}>Gérez vos bannières</div></div>
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"20px"}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Invendus</div>
            <button onClick={()=>go("sell")} className="btn" style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><I.plus/> Ajouter un invendu</button>
          </div>
        </div>}

        {/* SETTINGS */}
        {dtab==="settings"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>{T.set}</h2>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {T.si.map(([t,s],i)=><div key={t} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}><div><div style={{fontSize:14,fontWeight:600,color:i===T.si.length-1?C.r:C.k}}>{t}</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>{s}</div></div><I.chR/></div>)}
            <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={logout}><div><div style={{fontSize:14,fontWeight:600,color:C.r}}>{T.out}</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>Se déconnecter de SMASHD</div></div><I.chR/></div>
          </div>
        </div>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
