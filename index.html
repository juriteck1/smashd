const authApi=async(ep,b)=>{const r=await fetch(`${SB}/auth/v1/${ep}`,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(d.error||d.error_description)throw new Error(d.error_description||d.error);return d};
const uploadPhoto=async f=>{const x=f.name.split('.').pop(),n=`${Date.now()}-${Math.random().toString(36).slice(2)}.${x}`;const r=await fetch(`${SB}/storage/v1/object/smashd-photos/${n}`,{method:"POST",headers:{"apikey":KEY,"Authorization":`Bearer ${gt()}`,"Content-Type":f.type},body:f});if(!r.ok)throw new Error("Upload fail");return`${SB}/storage/v1/object/public/smashd-photos/${n}`};

// ═══ APP ═══
function App(){
  const[sc,setSc]=useState("home");
  const[user,setUser]=useState(null);
  const[prof,setProf]=useState(null);
  const[ann,setAnn]=useState([]);
  const[myA,setMyA]=useState([]);
  const[myO,setMyO]=useState([]);
  const[myS,setMyS]=useState([]);
  const[toast,setToast]=useState(null);
  const[load,setLoad]=useState(false);
  const[srch,setSrch]=useState("");
  const[fcat,setFcat]=useState("Tous");
  const[fst,setFst]=useState("Tous");
  const[fpr,setFpr]=useState({min:"",max:""});
  const[sel,setSel]=useState(null);
  const[dtab,setDtab]=useState("overview");
  const[lang,setLang]=useState("FR");
  const[favs,setFavs]=useState({});

  const tw=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000)};
  const go=(s,d=null)=>{setSc(s);if(d)setSel(d);window.scrollTo(0,0)};
  const loadA=async()=>{try{const d=await api("annonces?status=eq.active&order=created_at.desc&limit=60");setAnn(d)}catch(e){}};
  const loadMy=async uid=>{try{const[a,o,s]=await Promise.all([api(`annonces?user_id=eq.${uid}&order=created_at.desc`),api(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),api(`commandes?seller_id=eq.${uid}&order=created_at.desc`)]);setMyA(a);setMyO(o);setMyS(s)}catch(e){}};
  useEffect(()=>{loadA()},[]);

  const login=async(email,pwd)=>{setLoad(true);try{const d=await authApi("token?grant_type=password",{email,password:pwd});st(d.access_token);setUser(d.user);const p=await api(`profiles?id=eq.${d.user.id}`);setProf(p[0]||null);await loadMy(d.user.id);tw("Bienvenue !");go("home")}catch(e){throw e}finally{setLoad(false)}};
  const register=async(email,pwd,name,ut,siret,company)=>{setLoad(true);try{const d=await authApi("signup",{email,password:pwd});if(d.user){if(d.access_token)st(d.access_token);await api("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:ut,siret:siret||null,company:company||null})});setUser(d.user);setProf({id:d.user.id,name,email,user_type:ut});tw("Compte créé !");go("home")}}catch(e){throw e}finally{setLoad(false)}};
  const logout=()=>{ct();setUser(null);setProf(null);setMyA([]);setMyO([]);setMyS([]);go("home")};

  const publish=async f=>{if(!user){go("auth");return}setLoad(true);try{await api("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...f,status:"active"})});tw("Annonce publiée !");await loadA();await loadMy(user.id);go("dashboard");setDtab("annonces")}catch(e){tw("Erreur : "+e.message,"error")}finally{setLoad(false)}};
  const toggleA=async(id,status)=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});await loadMy(user.id);await loadA()}catch(e){}};
  const deleteA=async id=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});await loadMy(user.id);await loadA()}catch(e){}};
  const placeOrder=async(a,sm)=>{if(!user){go("auth");return false}setLoad(true);try{const c=parseFloat((a.price*.08).toFixed(2)),g=parseFloat((a.price-c).toFixed(2));await api("commandes",{method:"POST",body:JSON.stringify({annonce_id:a.id,buyer_id:user.id,seller_id:a.user_id,price:a.price,commission:c,gain:g,shipping_method:sm,status:"en attente"})});await api(`annonces?id=eq.${a.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});tw("Commande confirmée !");await loadA();await loadMy(user.id);return true}catch(e){tw("Erreur","error");return false}finally{setLoad(false)}};

  const fil=ann.filter(a=>fcat==="Tous"||a.category===fcat||a.sub_category===fcat).filter(a=>fst==="Tous"||a.state===fst).filter(a=>!fpr.min||a.price>=parseFloat(fpr.min)).filter(a=>!fpr.max||a.price<=parseFloat(fpr.max)).filter(a=>!srch||a.title?.toLowerCase().includes(srch.toLowerCase())||a.brand?.toLowerCase().includes(srch.toLowerCase()));
  const wal=Math.round(myS.reduce((acc,s)=>acc+(s.gain||0),0)*100)/100;
  const p={user,prof,load,tw,go,login,register,logout,publish,toggleA,deleteA,placeOrder,myA,myO,myS,wal,dtab,setDtab,ann:fil,allAnn:ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,sel,loadMy,lang,setLang,favs,setFavs};
  return<div>{toast&&<Toast {...toast}/>}{sc==="home"&&<Home {...p}/>}{sc==="auth"&&<Auth {...p}/>}{sc==="sell"&&<Sell {...p}/>}{sc==="article"&&<Article {...p}/>}{sc==="dashboard"&&<Dash {...p}/>}</div>;
}

// ═══ AUTH ═══
function Auth({login,register,load,go}){
  const[mode,setMode]=useState("login");
  const[step,setStep]=useState(0);
  const[ut,setUt]=useState("particulier");
  const[email,setEmail]=useState("");
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[name,setName]=useState("");
  const[siret,setSiret]=useState("");
  const[company,setCompany]=useState("");
  const[cgv,setCgv]=useState(false);
  const[err,setErr]=useState({});

  const v0=()=>{const e={};if(!email||!/\S+@\S+\.\S+/.test(email))e.email="Email invalide";if(!pwd||pwd.length<6)e.pwd="6 caractères minimum";if(mode==="register"&&pwd!==pwd2)e.pwd2="Mots de passe différents";setErr(e);return!Object.keys(e).length};
  const v1=()=>{const e={};if(!name)e.name="Nom requis";if(ut==="pro"&&!siret)e.siret="SIRET requis";if(!cgv)e.cgv="Requis";setErr(e);return!Object.keys(e).length};
  const doLogin=async()=>{if(!v0())return;try{await login(email,pwd)}catch(e){setErr({email:"Email ou mot de passe incorrect"})}};
  const doReg=async()=>{if(!v1())return;try{await register(email,pwd,name,ut,siret,company)}catch(e){setErr({email:e.message})}};

  return<div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center"}}><Logo s={18}/></nav>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
      <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%"}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f400,fontSize:13,display:"flex",alignItems:"center",gap:5,marginBottom:20}}><Ico.chL/> Retour</button>
        <div style={{display:"flex",gap:6,marginBottom:24,background:C.f100,borderRadius:12,padding:4}}>
          {[["login","Connexion"],["register","S'inscrire"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?C.w:"transparent",color:mode===m?C.k:C.f400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}
        </div>
        {mode==="login"&&<>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Bon retour</h2>
          <p style={{fontSize:13,color:C.f400,marginBottom:22}}>Connectez-vous à votre compte SMASHD</p>
          <div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vous@exemple.com" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.email?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.email&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.email}</div>}</div>
          <div style={{marginBottom:22}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Mot de passe</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/></div>
          <button onClick={doLogin} disabled={load} className="btn" style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>{load?"Connexion…":"Se connecter"}</button>
        </>}
        {mode==="register"&&<>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Créer un compte</h2>
          <p style={{fontSize:13,color:C.f400,marginBottom:18}}>Rejoignez la communauté SMASHD</p>
          <div style={{display:"flex",gap:6,marginBottom:18}}>
            {[["particulier","Particulier"],["pro","Vendeur Pro"]].map(([id,l])=><button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?C.g:C.f100,color:ut===id?C.w:C.f600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{l}</button>)}
          </div>
          {ut==="pro"&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:12,color:C.g,marginBottom:16,fontWeight:500}}>Abonnement 99€/an — Invendus + espace publicitaire</div>}
          <div style={{display:"flex",gap:4,marginBottom:20}}>{["Compte","Profil"].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>i?C.g:step===i?C.ga:C.f200,transition:"background .3s"}}/>)}</div>
          {step===0&&<>
            <div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Email *</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vous@exemple.com" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.email?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.email&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.email}</div>}</div>
            <div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Mot de passe *</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.pwd?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.pwd&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.pwd}</div>}</div>
            <div style={{marginBottom:22}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Confirmer *</label><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} placeholder="Répétez" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.pwd2?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.pwd2&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.pwd2}</div>}</div>
            <button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Continuer →</button>
          </>}
          {step===1&&<>
            <div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>{ut==="pro"?"Nom du responsable *":"Nom complet *"}</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Jean Dupont" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.name?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.name&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.name}</div>}</div>
            {ut==="pro"&&<>
              <div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>SIRET *</label><input value={siret} onChange={e=>setSiret(e.target.value)} placeholder="123 456 789 00012" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.siret?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.siret&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.siret}</div>}</div>
              <div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Nom commercial</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Mon Shop Tennis" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/></div>
            </>}
            <div style={{marginBottom:18}}><label style={{display:"flex",alignItems:"flex-start",gap:9,cursor:"pointer",fontSize:13,color:C.f600}}><input type="checkbox" checked={cgv} onChange={e=>setCgv(e.target.checked)} style={{marginTop:3,accentColor:C.g}}/><span>J'accepte les <span style={{color:C.g,fontWeight:600}}>CGV</span> et la <span style={{color:C.g,fontWeight:600}}>Politique de confidentialité</span></span></label>{err.cgv&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.cgv}</div>}</div>
            <div style={{display:"flex",gap:8}}><button onClick={()=>setStep(0)} style={{flex:1,background:C.f100,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Retour</button><button onClick={doReg} disabled={load} className="btn" style={{flex:2,background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"Création…":ut==="pro"?"Créer compte Pro":"Créer mon compte"}</button></div>
          </>}
          {err.email&&step===0&&<div style={{background:C.rl,color:C.r,borderRadius:8,padding:"10px 13px",fontSize:13,marginTop:10}}>❌ {err.email}</div>}
        </>}
      </div>
    </div>
  </div>;
}

// ═══ SELL — Tunnel avec arborescence complète ═══
function Sell({publish,load,go}){
  // Steps: 0=Sport, 1=Sous-catégorie, 2=Photos, 3=Caractéristiques, 4=Détails (titre/desc/prix), 5=Envoi, 6=Vérification
  const[step,setStep]=useState(0);
  const[sport,setSport]=useState("");
  const[subCat,setSubCat]=useState("");
  const[attrs,setAttrs]=useState({}); // {brand, size_eu, etc.}
  const[title,setTitle]=useState("");
  const[desc,setDesc]=useState("");
  const[price,setPrice]=useState("");
  const[state,setState]=useState("");
  const[ship,setShip]=useState("mondial");
  const[photos,setPhotos]=useState([]);
  const[up,setUp]=useState(false);
  const ref=useRef();

  const setAttr=(k,v)=>setAttrs(a=>({...a,[k]:v}));
  const comm=price?(price*.08).toFixed(2):0;
  const gain=price?(price*.92).toFixed(2):0;

  const sportData=sport?CAT_TREE[sport]:null;
  const subData=subCat&&sportData?sportData.subs[subCat]:null;
  const subCats=sportData?Object.keys(sportData.subs):[];

  // Check all required fields filled
  const attrsComplete=()=>{
    if(!subData)return false;
    return subData.fields.every(f=>attrs[f.key]);
  };

  const STEPS=["Sport","Type","Photos","Détails","Annonce","Envoi","Vérif."];

  const handleUp=async e=>{const fs=Array.from(e.target.files);if(photos.length+fs.length>8)return;setUp(true);try{const urls=await Promise.all(fs.map(f=>uploadPhoto(f)));setPhotos(p=>[...p,...urls])}catch(e){alert("Erreur upload")}finally{setUp(false)}};

  const canNext=()=>{
    if(step===0)return sport;
    if(step===1)return subCat;
    if(step===2)return photos.length>0;
    if(step===3)return attrsComplete()&&state;
    if(step===4)return title&&price>0;
    if(step===5)return ship;
    return true;
  };

  const doPublish=()=>{
    publish({
      title,description:desc,
      category:sport,sub_category:subCat,
      brand:attrs.brand||"",
      state,price:parseFloat(price),shipping:ship,
      photo_url:photos[0]||null,photos,
      attributes:JSON.stringify(attrs),
    });
  };

  return<div style={{minHeight:"100vh",background:C.w}}>
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>step>0?setStep(s=>s-1):go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><Ico.chL/> Retour</button>
      <Logo s={18}/>
      <div style={{flex:1,display:"flex",justifyContent:"center",gap:4,overflowX:"auto",padding:"0 8px"}} className="hm">
        {STEPS.map((s,i)=><React.Fragment key={s}>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:i<step?C.g:i===step?C.k:C.f100,color:i<=step?C.w:C.f400,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{i<step?<Ico.chk/>:i+1}</div>
            <span style={{fontSize:11,color:i===step?C.k:C.f400,fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{s}</span>
          </div>
          {i<STEPS.length-1&&<div style={{width:12,height:1,background:i<step?C.g:C.f200,flexShrink:0}}/>}
        </React.Fragment>)}
      </div>
      <span style={{fontSize:12,color:C.f400,fontWeight:500,flexShrink:0}}>{step+1}/{STEPS.length}</span>
    </nav>

    <div style={{maxWidth:600,margin:"0 auto",padding:"36px 20px"}}>

      {/* STEP 0 — Sport */}
      {step===0&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Quel sport ?</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Sélectionnez le sport de l'article que vous vendez.</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {SPORTS.map(s=><button key={s} onClick={()=>{setSport(s);setSubCat("");setAttrs({})}} className="btn" style={{background:sport===s?C.g:C.f50,border:`1.5px solid ${sport===s?C.g:C.f200}`,borderRadius:14,padding:"18px 12px",cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
            <div style={{fontSize:28,marginBottom:6}}>{CAT_TREE[s].icon}</div>
            <div style={{fontSize:13,fontWeight:700,color:sport===s?C.w:C.k,lineHeight:1.2}}>{s}</div>
          </button>)}
        </div>
      </div>}

      {/* STEP 1 — Sous-catégorie */}
      {step===1&&sport&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Quel type d'article ?</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:8}}>Sport : <strong>{CAT_TREE[sport].icon} {sport}</strong></p>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Sélectionnez le type d'article.</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
          {subCats.map(s=><button key={s} onClick={()=>setSubCat(s)} className="btn" style={{background:subCat===s?C.g:C.f50,border:`1.5px solid ${subCat===s?C.g:C.f200}`,borderRadius:14,padding:"20px 16px",cursor:"pointer",textAlign:"left",transition:"all .15s"}}>
            <div style={{fontSize:15,fontWeight:700,color:subCat===s?C.w:C.k}}>{s}</div>
            <div style={{fontSize:12,color:subCat===s?"rgba(255,255,255,.6)":C.f400,marginTop:4}}>{sportData.subs[s].fields.length} caractéristiques</div>
          </button>)}
        </div>
      </div>}

      {/* STEP 2 — Photos */}
      {step===2&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Photos de l'article</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:4}}>
          <strong>{CAT_TREE[sport].icon} {sport}</strong> › <strong>{subCat}</strong>
        </p>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Jusqu'à 8 photos. La première sera la principale.</p>
        <div onClick={()=>!up&&ref.current.click()} style={{border:`2px dashed ${C.f200}`,borderRadius:16,padding:"36px",textAlign:"center",cursor:"pointer",background:C.f50,marginBottom:14}}>
          <div style={{width:44,height:44,background:C.g,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px",color:C.w}}><Ico.plus/></div>
          <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>{up?"Upload en cours…":"Ajouter des photos"}</div>
          <div style={{fontSize:12,color:C.f400}}>JPG, PNG — Max 8 photos</div>
          <input ref={ref} type="file" accept="image/*" multiple onChange={handleUp} style={{display:"none"}}/>
        </div>
        {photos.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {photos.map((url,i)=><div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:10,overflow:"hidden",border:`2px solid ${i===0?C.g:C.f200}`}}>
            <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            {i===0&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:C.g,color:C.w,fontSize:9,fontWeight:700,padding:"3px",textAlign:"center"}}>PRINCIPALE</div>}
            <button onClick={()=>setPhotos(p=>p.filter((_,j)=>j!==i))} style={{position:"absolute",top:4,right:4,width:20,height:20,background:"rgba(0,0,0,.65)",color:C.w,border:"none",borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico.x/></button>
          </div>)}
          {photos.length<8&&<div onClick={()=>ref.current.click()} style={{aspectRatio:"1",borderRadius:10,border:`2px dashed ${C.f200}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:20,color:C.f400,background:C.f50}}>+</div>}
        </div>}
        {photos.length===0&&<div style={{background:"#FFF8E1",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#8a6a00"}}>⚠️ Au moins 1 photo requise.</div>}
      </div>}

      {/* STEP 3 — Caractéristiques dynamiques */}
      {step===3&&subData&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Caractéristiques</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:4}}><strong>{CAT_TREE[sport].icon} {sport}</strong> › <strong>{subCat}</strong></p>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Renseignez les détails de votre article.</p>

        {/* État */}
        <div style={{marginBottom:22}}>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>État *</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {STATES.map(s=><Pill key={s} l={s} a={state===s} onClick={()=>setState(s)}/>)}
          </div>
        </div>

        {/* Dynamic fields */}
        {subData.fields.map(field=><div key={field.key} style={{marginBottom:22}}>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>
            {field.label} *
            {attrs[field.key]&&<span style={{marginLeft:8,color:C.g,fontWeight:600,textTransform:"none",letterSpacing:"normal",fontSize:11}}>✓ {attrs[field.key]}</span>}
          </label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {field.opts.map(opt=><Pill key={opt} l={opt} a={attrs[field.key]===opt} onClick={()=>setAttr(field.key,opt)}/>)}
          </div>
        </div>)}

        {!attrsComplete()&&state&&<div style={{background:"#FFF8E1",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#8a6a00",marginTop:8}}>
          ⚠️ Veuillez renseigner toutes les caractéristiques obligatoires.
        </div>}
      </div>}

      {/* STEP 4 — Titre / Description / Prix */}
      {step===4&&<div style={{display:"flex",flexDirection:"column",gap:18}}>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",margin:0}}>L'annonce</h2>
        <p style={{color:C.f400,fontSize:14,margin:0}}>Donnez un titre accrocheur et fixez votre prix.</p>

        <div>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Titre *</label>
          <input value={title} onChange={e=>setTitle(e.target.value)}
            placeholder={`Ex: ${attrs.brand||"Wilson"} ${subCat} — ${state||"Très bon état"}`}
            style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:15,outline:"none",boxSizing:"border-box"}}/>
        </div>

        <div>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Description</label>
          <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={4}
            placeholder="Décrivez votre article : origine, raison de la vente, défauts éventuels…"
            style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,resize:"vertical",boxSizing:"border-box",outline:"none"}}/>
        </div>

        <div>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:12,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Prix *</label>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <input type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0"
              style={{width:140,padding:"14px 16px",borderRadius:14,border:`2px solid ${C.k}`,fontSize:28,fontWeight:900,textAlign:"center",outline:"none",letterSpacing:"-1px"}}/>
            <span style={{fontSize:28,fontWeight:900,color:C.f400}}>€</span>
          </div>
        </div>

        {price>0&&<div style={{background:C.gl,borderRadius:14,padding:"16px 20px"}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:10}}>Récapitulatif</div>
          {[["Prix de vente",`${price} €`],["Commission SMASHD (8%)",`- ${comm} €`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:7,color:C.f600}}><span>{k}</span><span>{v}</span></div>)}
          <div style={{borderTop:`1px solid ${C.f200}`,paddingTop:9,display:"flex",justifyContent:"space-between",fontSize:17,fontWeight:900}}><span>Vous recevez</span><span style={{color:C.g}}>{gain} €</span></div>
        </div>}
      </div>}

      {/* STEP 5 — Envoi */}
      {step===5&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Mode d'envoi</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>L'étiquette est générée automatiquement après la vente.</p>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {SHIP.map(s=><button key={s.id} onClick={()=>setShip(s.id)} className="btn" style={{background:ship===s.id?C.g:C.w,border:`1.5px solid ${ship===s.id?C.g:C.f200}`,borderRadius:14,padding:"16px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left",transition:"all .15s"}}>
            <div><div style={{fontWeight:700,fontSize:14,color:ship===s.id?C.w:C.k}}>{s.l}</div><div style={{fontSize:12,color:ship===s.id?"rgba(255,255,255,.6)":C.f400,marginTop:2}}>{s.d}</div></div>
            <div style={{fontWeight:800,fontSize:16,color:ship===s.id?C.w:C.k}}>{s.p===0?"Gratuit":`${s.p} €`}</div>
          </button>)}
        </div>
      </div>}

      {/* STEP 6 — Vérification */}
      {step===6&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Vérification</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:20}}>Tout est correct ? Publiez votre annonce.</p>
        <div style={{background:C.w,border:`1.5px solid ${C.f200}`,borderRadius:16,overflow:"hidden",marginBottom:16}}>
          {photos.length>0?<img src={photos[0]} alt="" style={{width:"100%",height:200,objectFit:"cover"}}/>:<div style={{height:100,background:C.f100,display:"flex",alignItems:"center",justifyContent:"center",fontSize:40}}>{CAT_TREE[sport]?.icon}</div>}
          <div style={{padding:"16px 18px"}}>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <span style={{background:C.gl,color:C.g,fontSize:11,fontWeight:700,borderRadius:6,padding:"3px 9px"}}>{sport}</span>
              <span style={{background:C.f100,color:C.f600,fontSize:11,fontWeight:600,borderRadius:6,padding:"3px 9px"}}>{subCat}</span>
              <Tag state={state}/>
            </div>
            <div style={{fontSize:18,fontWeight:800,margin:"6px 0 4px"}}>{title}</div>
            <div style={{fontSize:13,color:C.f400,marginBottom:10}}>
              {Object.entries(attrs).slice(0,4).map(([k,v])=>`${v}`).join(" · ")}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:26,fontWeight:900,letterSpacing:"-1px"}}>{price} €</div>
              <div style={{fontSize:13,color:C.f400,textAlign:"right"}}>Vous recevrez {gain} €<br/>via {SHIP.find(s=>s.id===ship)?.l}</div>
            </div>
          </div>
        </div>
        {/* Récap attributs */}
        <div style={{background:C.f50,borderRadius:12,padding:"14px 16px",marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:10}}>Caractéristiques</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {Object.entries(attrs).map(([k,v])=>{
              const field=subData?.fields.find(f=>f.key===k);
              return<div key={k} style={{background:C.w,borderRadius:8,padding:"8px 10px"}}>
                <div style={{fontSize:10,fontWeight:700,color:C.f400,textTransform:"uppercase",letterSpacing:".5px",marginBottom:2}}>{field?.label||k}</div>
                <div style={{fontSize:13,fontWeight:600}}>{v}</div>
              </div>
            })}
          </div>
        </div>
      </div>}

      {/* Navigation */}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:32,paddingTop:24,borderTop:`1px solid ${C.f100}`}}>
        {step>0?<button onClick={()=>setStep(s=>s-1)} style={{background:C.f100,color:C.k,border:"none",borderRadius:100,padding:"12px 22px",fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.chL/> Retour</button>:<div/>}
        {step<STEPS.length-1
          ?<button onClick={()=>canNext()&&setStep(s=>s+1)} disabled={!canNext()||up} className="btn"
              style={{background:canNext()&&!up?C.k:"#ccc",color:C.w,border:"none",borderRadius:100,padding:"12px 26px",fontSize:14,fontWeight:700,cursor:canNext()?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:6}}>
              {up?"Upload…":"Continuer"} {!up&&<Ico.arr/>}
            </button>
          :<button onClick={doPublish} disabled={load} className="btn"
              style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"12px 26px",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
              {load?"Publication…":"Publier l'annonce"} {!load&&<Ico.arr/>}
            </button>
        }
      </div>
    </div>
  </div>;
}

// ═══ ARTICLE ═══
function Article({sel,go,user,placeOrder,load,favs,setFavs}){
  const a=sel;
  const[tab,setTab]=useState("desc");
  const[ship,setShip]=useState("mondial");
  const[ofr,setOfr]=useState("");
  const[ofrSent,setOfrSent]=useState(false);
  const[checkout,setCheckout]=useState(false);
  const[ordered,setOrdered]=useState(false);
  const[mp,setMp]=useState(0);
  if(!a)return null;
  const photos=a.photos&&a.photos.length>0?a.photos:(a.photo_url?[a.photo_url]:[]);
  const comm=(a.price*.08).toFixed(2);
  const sc=SHIP.find(s=>s.id===ship)?.p||0;
  const tot=(parseFloat(a.price)+parseFloat(comm)+sc).toFixed(2);
  const doOrder=async()=>{const ok=await placeOrder(a,ship);if(ok)setOrdered(true)};
  let parsedAttrs={};try{if(a.attributes)parsedAttrs=JSON.parse(a.attributes)}catch(e){}

  return<div style={{minHeight:"100vh",background:C.w}}>
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><Ico.chL/> Retour</button>
      <Logo s={18}/>
    </nav>

    {checkout&&!ordered&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
      <div style={{background:C.w,borderRadius:20,padding:"26px",maxWidth:440,width:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><h3 style={{fontSize:17,fontWeight:800}}>Finaliser l'achat</h3><button onClick={()=>setCheckout(false)} style={{background:C.f100,border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico.x/></button></div>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:18,background:C.f50,borderRadius:12,padding:"11px"}}>{photos.length>0?<img src={photos[0]} alt="" style={{width:48,height:48,objectFit:"cover",borderRadius:8}}/>:<div style={{width:48,height:48,background:C.f200,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{CAT_TREE[a.category]?.icon}</div>}<div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{a.title}</div><Tag state={a.state}/></div><div style={{fontWeight:900,fontSize:16}}>{a.price} €</div></div>
        <div style={{marginBottom:16}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:9}}>Livraison</div>{SHIP.map(s=><button key={s.id} onClick={()=>setShip(s.id)} style={{width:"100%",background:ship===s.id?C.gl:C.w,border:`1.5px solid ${ship===s.id?C.g:C.f200}`,borderRadius:10,padding:"10px 13px",cursor:"pointer",display:"flex",justifyContent:"space-between",marginBottom:5,textAlign:"left"}}><div><div style={{fontSize:13,fontWeight:600}}>{s.l}</div><div style={{fontSize:11,color:C.f400}}>{s.d}</div></div><div style={{fontWeight:700,color:ship===s.id?C.g:C.k}}>{s.p===0?"Gratuit":`${s.p} €`}</div></button>)}</div>
        <div style={{background:C.f50,borderRadius:12,padding:"13px",marginBottom:14}}>{[["Article",`${a.price} €`],["Livraison",`${sc} €`],["Protection acheteur",`${comm} €`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4,color:C.f600}}><span>{k}</span><span>{v}</span></div>)}<div style={{borderTop:`1px solid ${C.f200}`,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:16,marginTop:4}}><span>Total</span><span style={{color:C.g}}>{tot} €</span></div></div>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setCheckout(false)} style={{flex:1,background:C.f100,color:C.k,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Annuler</button><button onClick={doOrder} disabled={load} className="btn" style={{flex:2,background:C.o,color:C.w,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"…":`Payer ${tot} €`}</button></div>
      </div>
    </div>}

    {ordered&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
      <div style={{background:C.w,borderRadius:20,padding:"40px 32px",maxWidth:360,textAlign:"center"}}>
        <div style={{width:60,height:60,background:C.gl,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px",color:C.g,fontSize:24}}><Ico.chk/></div>
        <h3 style={{fontSize:20,fontWeight:900,marginBottom:8}}>Commande confirmée !</h3>
        <p style={{color:C.f400,fontSize:14,marginBottom:24,lineHeight:1.7}}>Le vendeur a 7 jours pour expédier.</p>
        <button onClick={()=>go("dashboard")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"14px 28px",fontSize:14,fontWeight:700,cursor:"pointer",width:"100%"}}>Voir mes commandes</button>
      </div>
    </div>}

    <div style={{maxWidth:1060,margin:"0 auto",padding:"36px 20px",display:"grid",gridTemplateColumns:"1fr 320px",gap:40}} className="g1m">
      <div>
        <div style={{background:C.f100,borderRadius:16,height:340,overflow:"hidden",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
          {photos.length>0?<img src={photos[mp]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{fontSize:80}}>{CAT_TREE[a.category]?.icon||"🏅"}</div>}
        </div>
        {photos.length>1&&<div style={{display:"flex",gap:8,marginBottom:24,overflowX:"auto"}}>{photos.map((url,i)=><div key={i} onClick={()=>setMp(i)} style={{width:64,height:64,borderRadius:10,overflow:"hidden",border:`2px solid ${mp===i?C.k:C.f200}`,cursor:"pointer",flexShrink:0}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>)}</div>}
        <div style={{display:"flex",borderBottom:`1px solid ${C.f200}`,marginBottom:18}}>
          {[["desc","Description"],["specs","Caractéristiques"],["attrs","Détails"]].map(([id,l])=><button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===id?C.k:"transparent"}`,padding:"10px 0",marginRight:24,fontSize:14,fontWeight:tab===id?700:400,color:tab===id?C.k:C.f400,cursor:"pointer"}}>{l}</button>)}
        </div>
        {tab==="desc"&&<p style={{fontSize:14,lineHeight:1.8,color:C.f600}}>{a.description||"Aucune description fournie."}</p>}
        {tab==="specs"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["Sport",a.category],["Type",a.sub_category||"—"],["État",a.state],["Livraison",SHIP.find(s=>s.id===a.shipping)?.l||"—"]].map(([k,v])=><div key={k} style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}><div style={{fontSize:11,fontWeight:700,color:C.f400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{k}</div><div style={{fontSize:14,fontWeight:600}}>{v}</div></div>)}</div>}
        {tab==="attrs"&&<div>{Object.keys(parsedAttrs).length>0?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {Object.entries(parsedAttrs).map(([k,v])=>{
            const sportD=CAT_TREE[a.category];
            const subD=a.sub_category&&sportD?sportD.subs[a.sub_category]:null;
            const field=subD?.fields.find(f=>f.key===k);
            return<div key={k} style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}><div style={{fontSize:11,fontWeight:700,color:C.f400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{field?.label||k}</div><div style={{fontSize:14,fontWeight:600}}>{v}</div></div>
          })}
        </div>:<div style={{fontSize:14,color:C.f400}}>Aucun détail supplémentaire.</div>}</div>}
      </div>
      <div style={{position:"sticky",top:64,alignSelf:"start"}}>
        <div style={{display:"flex",gap:7,marginBottom:10,flexWrap:"wrap"}}>
          <span style={{background:C.gl,color:C.g,fontSize:11,fontWeight:700,borderRadius:6,padding:"3px 9px"}}>{CAT_TREE[a.category]?.icon} {a.category}</span>
          {a.sub_category&&<span style={{background:C.f100,color:C.f600,fontSize:11,fontWeight:600,borderRadius:6,padding:"3px 9px"}}>{a.sub_category}</span>}
        </div>
        <h1 style={{fontSize:20,fontWeight:900,letterSpacing:"-0.5px",marginBottom:7,lineHeight:1.2}}>{a.title}</h1>
        <Tag state={a.state}/>
        <div style={{fontSize:36,fontWeight:900,letterSpacing:"-2px",margin:"13px 0 4px"}}>{a.price} €</div>
        <div style={{fontSize:13,color:C.f400,marginBottom:20}}>+ protection acheteur {comm} €</div>
        {ofrSent&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:13,color:C.g,marginBottom:13}}>Offre de <strong>{ofr} €</strong> envoyée.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:18}}>
          <button onClick={()=>user?setCheckout(true):go("auth")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"15px",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>Acheter maintenant <Ico.arr/></button>
          <div style={{display:"flex",gap:7}}><input type="number" value={ofr} onChange={e=>setOfr(e.target.value)} placeholder="Proposer un prix €" style={{flex:1,padding:"12px 13px",borderRadius:100,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none"}}/><button onClick={()=>ofr&&setOfrSent(true)} className="btn" style={{background:C.w,color:C.k,border:`1.5px solid ${C.k}`,borderRadius:100,padding:"12px 16px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Offrir</button></div>
          <button onClick={()=>setFavs(f=>({...f,[a.id]:!f[a.id]}))} style={{background:"none",border:`1.5px solid ${favs[a.id]?C.o:C.f200}`,borderRadius:100,padding:"11px",fontSize:14,fontWeight:600,cursor:"pointer",color:favs[a.id]?C.o:C.f400,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><Ico.heart(favs[a.id])/> {favs[a.id]?"Sauvegardé":"Sauvegarder"}</button>
        </div>
        <div style={{borderTop:`1px solid ${C.f200}`,paddingTop:16}}>
          {[[<Ico.trk/>,"Livraison dès 3,99 €"],[<Ico.shld/>,"Paiement sécurisé"],[<Ico.chk/>,"Protection acheteur"],[<Ico.leaf/>,"Article éco-responsable"]].map(([icon,l],i)=><div key={i} style={{display:"flex",gap:10,alignItems:"center",fontSize:13,color:C.f600,marginBottom:9}}><div style={{color:C.g,flexShrink:0}}>{icon}</div>{l}</div>)}
        </div>
      </div>
    </div>
  </div>;
}

// ═══ DASHBOARD ═══
function Dash({user,prof,go,logout,myA,myO,myS,wal,dtab,setDtab,toggleA,deleteA,tw}){
  const[boosted,setBoosted]=useState([]);
  const[boostId,setBoostId]=useState(null);
  const isPro=prof?.user_type==="pro";
  const rev=myS.reduce((acc,s)=>acc+(s.gain||0),0);
  const fn=prof?.name?.split(" ")[0]||"là";
  const DTABS=[{id:"overview",l:"Vue d'ensemble"},{id:"annonces",l:"Mes annonces"},{id:"ventes",l:"Mes ventes"},{id:"achats",l:"Mes achats"},{id:"wallet",l:"E-Wallet"},{id:"stats",l:"Statistiques"},...(isPro?[{id:"pro",l:"Espace Pro"}]:[]),{id:"settings",l:"Paramètres"}];

  return<div style={{minHeight:"100vh",background:C.f50}}>
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",fontSize:14}}><Ico.chL/></button>
      <Logo s={18}/>
      <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
        <button onClick={()=>go("sell")} className="btn" style={{background:C.o,color:C.w,border:"none",borderRadius:100,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Vendre</button>
        <button onClick={logout} className="btn" style={{background:C.f100,color:C.r,border:`1px solid ${C.f200}`,borderRadius:100,padding:"8px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Déconnexion</button>
      </div>
    </nav>

    <div style={{maxWidth:1060,margin:"0 auto",padding:"24px 20px",display:"grid",gridTemplateColumns:"190px 1fr",gap:20}} className="g1m">
      {/* Sidebar desktop */}
      <div className="hm" style={{display:"flex",flexDirection:"column",gap:4}}>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"14px",marginBottom:10}}>
          <div style={{fontSize:15,fontWeight:700}}>{fn}</div>
          <div style={{fontSize:12,color:C.f400,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prof?.email}</div>
          {isPro&&<div style={{marginTop:7,background:C.k,color:C.w,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,display:"inline-block"}}>PRO</div>}
        </div>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"8px"}}>
          {DTABS.map(t=><button key={t.id} onClick={()=>setDtab(t.id)} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:dtab===t.id?C.k:"transparent",color:dtab===t.id?C.w:C.f600,fontWeight:dtab===t.id?700:500,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left",transition:"all .15s"}}>{t.l}</button>)}
          <div style={{borderTop:`1px solid ${C.f200}`,marginTop:7,paddingTop:7}}>
            <button onClick={logout} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:"transparent",color:C.r,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>Déconnexion</button>
          </div>
        </div>
      </div>

      {/* Main */}
      <div style={{minWidth:0}}>
        {/* Mobile tab scrollbar */}
        <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:20,paddingBottom:4}}>
          {DTABS.slice(0,6).map(t=><button key={t.id} onClick={()=>setDtab(t.id)} className="btn" style={{padding:"7px 14px",borderRadius:100,border:`1.5px solid ${dtab===t.id?C.g:C.f200}`,background:dtab===t.id?C.g:C.w,color:dtab===t.id?C.w:C.f600,fontSize:12,fontWeight:dtab===t.id?700:500,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{t.l}</button>)}
        </div>

        {dtab==="overview"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Bonjour, {fn} 👋</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}} className="g2m">
            {[[`${rev.toFixed(2)} €`,"Revenus",C.g],[myA.filter(a=>a.status==="active").length,"Annonces actives",C.k],[myS.length,"Ventes",C.o],[myO.length,"Achats",C.f600]].map(([v,l,col])=><div key={l} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"16px"}}><div style={{fontSize:22,fontWeight:900,color:col,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:C.f400,marginTop:3}}>{l}</div></div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="g1m">
            <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Annonces récentes</div>
              {myA.slice(0,4).map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.f100}`}}>
                <div style={{width:36,height:36,borderRadius:8,overflow:"hidden",background:C.f100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:CAT_TREE[a.category]?.icon||"🏅"}</div>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div><div style={{fontSize:12,color:C.f400}}>{a.price} €</div></div>
                <div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:C.f400,textTransform:"uppercase"}}>{a.status==="active"?"En ligne":"—"}</div>
              </div>)}
              {myA.length===0&&<div style={{fontSize:13,color:C.f400,textAlign:"center",padding:"14px 0"}}>Aucune annonce</div>}
            </div>
            <div style={{background:C.g,borderRadius:14,padding:"20px",color:C.w}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:6}}>E-Wallet</div>
              <div style={{fontSize:34,fontWeight:900,letterSpacing:"-2px",marginBottom:4}}>{wal.toFixed(2)} €</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:18}}>Solde disponible</div>
              <button onClick={()=>setDtab("wallet")} style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Gérer mon wallet</button>
            </div>
          </div>
        </div>}

        {dtab==="annonces"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px"}}>Mes annonces</h2>
            <button onClick={()=>go("sell")} className="btn" style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Nouvelle</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myA.map(a=><div key={a.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:52,height:52,borderRadius:9,overflow:"hidden",background:C.f100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:CAT_TREE[a.category]?.icon||"🏅"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                <div style={{fontSize:12,color:C.f400,marginTop:1}}>{a.category}{a.sub_category?` › ${a.sub_category}`:""} · {a.price} €</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:a.status==="pause"?C.o:C.f400,textTransform:"uppercase",background:a.status==="active"?C.gl:a.status==="pause"?"#FFF3E0":C.f100,padding:"4px 9px",borderRadius:100}}>{a.status==="active"?"En ligne":a.status==="pause"?"Pause":"Vendu"}</div>
                {a.status!=="vendu"&&a.status!=="supprimé"&&<>
                  <button onClick={()=>toggleA(a.id,a.status==="pause"?"active":"pause")} style={{background:C.f100,color:C.k,border:"none",borderRadius:7,padding:"5px 9px",fontSize:11,cursor:"pointer",fontWeight:600}}>{a.status==="pause"?"Activer":"Pause"}</button>
                  {!boosted.includes(a.id)?<button onClick={()=>setBoostId(a.id)} style={{background:"#FFF3E0",color:C.o,border:"none",borderRadius:7,padding:"5px 9px",fontSize:11,cursor:"pointer",fontWeight:600}}>Booster</button>:<span style={{fontSize:11,color:C.g,fontWeight:700}}>Boosté</span>}
                  <button onClick={()=>deleteA(a.id)} style={{background:C.f100,color:C.f400,border:"none",borderRadius:7,padding:"5px 7px",fontSize:11,cursor:"pointer"}}>Suppr.</button>
                </>}
              </div>
            </div>)}
            {myA.length===0&&<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucune annonce. <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("sell")}>Publiez votre premier article</span></div>}
          </div>
          {boostId&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
            <div style={{background:C.w,borderRadius:18,padding:"26px",maxWidth:320,width:"90%",textAlign:"center"}}>
              <div style={{width:48,height:48,background:"#FFF3E0",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 13px",fontSize:20}}>⚡</div>
              <h3 style={{fontSize:16,fontWeight:800,marginBottom:7}}>Booster cette annonce</h3>
              <p style={{fontSize:13,color:C.f400,marginBottom:20,lineHeight:1.6}}>Mise en avant 7 jours pour <strong>3,50 €</strong>. ×5 vues.</p>
              <div style={{display:"flex",gap:8}}><button onClick={()=>setBoostId(null)} style={{flex:1,background:C.f100,border:"none",borderRadius:100,padding:"11px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Annuler</button><button onClick={()=>{setBoosted(b=>[...b,boostId]);setBoostId(null);tw&&tw("Annonce boostée !")}} className="btn" style={{flex:2,background:C.o,color:C.w,border:"none",borderRadius:100,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Payer 3,50 €</button></div>
            </div>
          </div>}
        </div>}

        {dtab==="ventes"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Mes ventes</h2>
          {myS.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucune vente pour l'instant.</div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myS.map(v=><div key={v.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}><div><div style={{fontSize:14,fontWeight:700}}>#{v.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:10,fontWeight:700,color:v.status==="livré"?C.g:C.o,textTransform:"uppercase"}}>{v.status}</div></div><div style={{display:"flex",gap:18,fontSize:13,flexWrap:"wrap"}}><span><span style={{color:C.f400}}>Prix : </span><strong>{v.price} €</strong></span><span><span style={{color:C.f400}}>Commission : </span><span style={{color:C.r}}>- {v.commission} €</span></span><span><span style={{color:C.f400}}>Net : </span><strong style={{color:C.g}}>{v.gain} €</strong></span></div></div>)}
          </div>}
        </div>}

        {dtab==="achats"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Mes achats</h2>
          {myO.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucun achat. <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>Explorer le catalogue</span></div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myO.map(o=><div key={o.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{fontSize:14,fontWeight:700}}>#{o.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:10,fontWeight:700,color:o.status==="livré"?C.g:C.o,textTransform:"uppercase"}}>{o.status}</div></div><div style={{fontSize:14,fontWeight:700,marginTop:8}}>{o.price} € · {o.shipping_method}</div></div>)}
          </div>}
        </div>}

        {dtab==="wallet"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>E-Wallet</h2>
          <div style={{background:C.g,borderRadius:16,padding:"26px 28px",marginBottom:16,color:C.w}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:5}}>Solde disponible</div>
            <div style={{fontSize:44,fontWeight:900,letterSpacing:"-2px",marginBottom:18}}>{wal.toFixed(2)} €</div>
            <button className="btn" style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Retirer les fonds</button>
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Transactions</div>
            {myS.length===0?<div style={{textAlign:"center",padding:"14px",color:C.f400,fontSize:13}}>Aucune transaction.</div>:myS.map((s,i)=><div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:i<myS.length-1?`1px solid ${C.f100}`:"none"}}><div><div style={{fontSize:13,fontWeight:600}}>#{s.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400}}>{new Date(s.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:14,fontWeight:800,color:C.g}}>+{s.gain} €</div></div>)}
          </div>
        </div>}

        {dtab==="stats"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Statistiques</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:16}} className="g2m">
            {[[myA.reduce((a,x)=>a+(x.views||0),0),"Vues totales"],[myA.reduce((a,x)=>a+(x.favs||0),0),"Favoris"],[myS.length,"Ventes"],[`${rev.toFixed(0)} €`,"Revenus"]].map(([v,l])=><div key={l} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"16px"}}><div style={{fontSize:22,fontWeight:900,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:C.f400,marginTop:3}}>{l}</div></div>)}
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Performance par annonce</div>
            {myA.length===0?<div style={{textAlign:"center",padding:"14px",color:C.f400}}>Pas encore de données.</div>:myA.map(a=><div key={a.id} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"70%"}}>{a.title}</span><span style={{color:C.f400}}>{a.views||0} vues</span></div><div style={{background:C.f100,borderRadius:4,height:5,overflow:"hidden"}}><div style={{background:C.g,height:"100%",borderRadius:4,width:`${Math.min((a.views||0)/Math.max(...myA.map(x=>x.views||1))*100,100)}%`,transition:"width .5s"}}/></div></div>)}
          </div>
        </div>}

        {dtab==="pro"&&isPro&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Espace Pro</h2>
          <p style={{color:C.f400,marginBottom:18,fontSize:14}}>Gérez vos invendus et votre espace publicitaire.</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}} className="g1m">
            <div style={{background:C.k,borderRadius:14,padding:"20px",color:C.w}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.3)",marginBottom:8}}>Abonnement</div><div style={{fontSize:17,fontWeight:800,marginBottom:2}}>PRO Actif</div><div style={{fontSize:12,color:"rgba(255,255,255,.3)"}}>Renouvellement 01/01/2027</div></div>
            <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"20px"}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:8}}>Publicité</div><div style={{fontSize:17,fontWeight:800,marginBottom:2}}>Espace pub</div><div style={{fontSize:12,color:C.f400}}>Gérez vos bannières</div></div>
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"20px"}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Invendus</div><button onClick={()=>go("sell")} className="btn" style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Ajouter un invendu</button></div>
        </div>}

        {dtab==="settings"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Paramètres</h2>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[["Informations personnelles","Nom, email, téléphone"],["Sécurité","Mot de passe, 2FA"],["Moyens de paiement","Carte, IBAN"],["Notifications","Email, push, SMS"],["Langue","Français / English"],["Supprimer mon compte","Irréversible"]].map(([t,s],i)=><div key={t} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}><div><div style={{fontSize:14,fontWeight:600,color:i===5?C.r:C.k}}>{t}</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>{s}</div></div><Ico.chR/></div>)}
            <div onClick={logout} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}><div><div style={{fontSize:14,fontWeight:600,color:C.r}}>Déconnexion</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>Se déconnecter de SMASHD</div></div><Ico.chR/></div>
          </div>
        </div>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
