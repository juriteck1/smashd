// API
const sbApi=async(path,opts={})=>{
  const res=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{"apikey":SB_KEY,"Authorization":`Bearer ${getToken()}`,"Content-Type":"application/json","Prefer":opts.prefer||"return=representation",...(opts.headers||{})},...opts});
  if(!res.ok){const e=await res.json();throw new Error(e.message||"Erreur")}
  const tx=await res.text();return tx?JSON.parse(tx):[];
};
const sbAuth=async(ep,body)=>{
  const res=await fetch(`${SB_URL}/auth/v1/${ep}`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await res.json();if(d.error||d.error_description)throw new Error(d.error_description||d.error);return d;
};
const uploadPhoto=async(file)=>{
  const ext=file.name.split('.').pop();
  const name=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const res=await fetch(`${SB_URL}/storage/v1/object/smashd-photos/${name}`,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":`Bearer ${getToken()}`,"Content-Type":file.type},body:file});
  if(!res.ok)throw new Error("Upload failed");
  return `${SB_URL}/storage/v1/object/public/smashd-photos/${name}`;
};

  const filtered=annonces.filter(a=>filterCat==="Tous"||a.category===filterCat).filter(a=>filterState==="Tous"||a.state===filterState).filter(a=>!filterPrice.min||a.price>=parseFloat(filterPrice.min)).filter(a=>!filterPrice.max||a.price<=parseFloat(filterPrice.max)).filter(a=>!search||a.title?.toLowerCase().includes(search.toLowerCase())||a.brand?.toLowerCase().includes(search.toLowerCase()));
  const wallet=Math.round(mySales.reduce((acc,s)=>acc+(s.gain||0),0)*100)/100;
  const p={user,profile,loading,toast2,go,login,register,logout,publishAnn,toggleAnn,deleteAnn,placeOrder,myAnn,myOrders,mySales,wallet,dashTab,setDashTab,annonces:filtered,allAnn:annonces,search,setSearch,filterCat,setFilterCat,filterState,setFilterState,filterPrice,setFilterPrice,selected,loadMyData,lang,setLang,T,favs,setFavs};

}

// AUTH
function Auth({login,register,loading,go,T}){
  const[mode,setMode]=useState("login");
  const[step,setStep]=useState(0);
  const[ut,setUt]=useState("particulier");
  const[f,setF]=useState({email:"",pwd:"",pwd2:"",name:"",siret:"",company:"",cgv:false});
  const[err,setErr]=useState({});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const v0=()=>{const e={};if(!f.email||!/\S+@\S+\.\S+/.test(f.email))e.email=T.invalidEmail;if(!f.pwd||f.pwd.length<6)e.pwd=T.shortPwd;if(mode==="register"&&f.pwd!==f.pwd2)e.pwd2=T.pwdMismatch;setErr(e);return!Object.keys(e).length};
  const v1=()=>{const e={};if(!f.name)e.name=T.nameReq;if(ut==="pro"&&!f.siret)e.siret=T.siretReq;if(!f.cgv)e.cgv=T.cgvReq;setErr(e);return!Object.keys(e).length};
  const doLogin=async()=>{if(!v0())return;try{await login(f.email,f.pwd)}catch(e){setErr({email:T.wrongCreds})}};
  const doReg=async()=>{if(!v1())return;try{await register(f.email,f.pwd,f.name,ut,f.siret,f.company)}catch(e){setErr({email:e.message})}};
  const inp={width:"100%",padding:"13px 15px",borderRadius:12,border:`1.5px solid ${D.g200}`,fontSize:14,outline:"none",boxSizing:"border-box",background:D.white,color:D.black};

  return<div style={{minHeight:"100vh",background:D.g50,display:"flex",flexDirection:"column"}}>
    <nav style={{background:D.white,borderBottom:`1px solid ${D.g200}`,padding:"0 24px",height:56,display:"flex",alignItems:"center"}}><Logo size={18}/></nav>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:20,padding:"32px 28px",maxWidth:420,width:"100%",boxShadow:"0 4px 24px rgba(0,0,0,.06)"}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:D.g400,fontSize:13,display:"flex",alignItems:"center",gap:6,marginBottom:24}}><Ico.chevL/> {T.back}</button>
        <div style={{display:"flex",gap:6,marginBottom:28,background:D.g100,borderRadius:12,padding:4}}>
          {[["login",T.login],["register",T.register]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?D.white:"transparent",color:mode===m?D.black:D.g400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}
        </div>

        {mode==="login"&&<>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.loginTitle}</h2>
          <p style={{fontSize:13,color:D.g400,marginBottom:24}}>{T.loginSub}</p>
          <Inp label={T.emailL} type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="vous@exemple.com" error={err.email}/>
          <Inp label={T.pwdL} type="password" value={f.pwd} onChange={e=>set("pwd",e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()}/>
          <button onClick={doLogin} disabled={loading} className="btn" style={{width:"100%",background:loading?"#9FE1CB":D.green,color:D.white,border:"none",borderRadius:12,padding:"15px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:8}}>{loading?T.connecting:T.connectL}</button>
        </>}

        {mode==="register"&&<>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.registerTitle}</h2>
          <p style={{fontSize:13,color:D.g400,marginBottom:20}}>{T.registerSub}</p>
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            {[["particulier",T.individual],["pro",T.proAccount]].map(([id,l])=><button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?D.green:D.g100,color:ut===id?D.white:D.g600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}
          </div>
          {ut==="pro"&&<div style={{background:D.greenL,border:`1px solid ${D.greenA}`,borderRadius:10,padding:"11px 14px",fontSize:12,color:D.green,marginBottom:18,fontWeight:500}}>{T.proNote}</div>}
          <div style={{display:"flex",gap:4,marginBottom:22}}>{["Compte","Profil"].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>i?D.green:step===i?D.greenA:D.g200,transition:"background .3s"}}/>)}</div>
          {step===0&&<>
            <Inp label={T.emailL+" *"} type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="vous@exemple.com" error={err.email}/>
            <Inp label={T.pwdL+" *"} type="password" value={f.pwd} onChange={e=>set("pwd",e.target.value)} placeholder={T.shortPwd}/>
            <Inp label={T.confirmL+" *"} type="password" value={f.pwd2} onChange={e=>set("pwd2",e.target.value)} placeholder={T.confirmL} error={err.pwd2}/>
            <button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:D.green,color:D.white,border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{T.continue}</button>
          </>}
          {step===1&&<>
            <Inp label={(ut==="pro"?T.managerName:T.nameL)+" *"} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Jean Dupont" error={err.name}/>
            {ut==="pro"&&<><Inp label={T.siretL+" *"} value={f.siret} onChange={e=>set("siret",e.target.value)} placeholder="123 456 789 00012" error={err.siret}/><Inp label={T.companyL} value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Mon Shop Tennis"/></>}
            <div style={{marginBottom:20}}><label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",fontSize:13,color:D.g600}}><input type="checkbox" checked={f.cgv} onChange={e=>set("cgv",e.target.checked)} style={{marginTop:3,accentColor:D.green}}/><span>{T.cgvText} <span style={{color:D.green,fontWeight:600}}>{T.cgvLink}</span> {T.andText} <span style={{color:D.green,fontWeight:600}}>{T.privacyLink}</span></span></label>{err.cgv&&<div style={{fontSize:12,color:D.red,marginTop:4}}>{err.cgv}</div>}</div>
            <div style={{display:"flex",gap:8}}><button onClick={()=>setStep(0)} style={{flex:1,background:D.g100,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:600,cursor:"pointer"}}>{T.back}</button><button onClick={doReg} disabled={loading} className="btn" style={{flex:2,background:loading?"#9FE1CB":D.green,color:D.white,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{loading?T.creating:ut==="pro"?T.createPro:T.createL}</button></div>
          </>}
          {err.email&&step===0&&mode==="register"&&<div style={{background:D.redL,color:D.red,borderRadius:8,padding:"10px 14px",fontSize:13,marginTop:12}}>❌ {err.email}</div>}
        </>}
      </div>
    </div>
  </div>;
}

  const[f,setF]=useState({title:"",description:"",category:"",brand:"",state:"",price:"",shipping:"mondial"});
  const[photos,setPhotos]=useState([]);
  const[uploading,setUploading]=useState(false);
  const ref=useRef();
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const comm=f.price?(f.price*.08).toFixed(2):0;
  const gain=f.price?(f.price*.92).toFixed(2):0;
  const canNext=()=>{if(step===0)return f.category;if(step===1)return photos.length>0;if(step===2)return f.brand&&f.state&&f.title;if(step===3)return f.price>0;if(step===4)return f.shipping;return true};
  const handleUpload=async e=>{const files=Array.from(e.target.files);if(photos.length+files.length>8)return;setUploading(true);try{const urls=await Promise.all(files.map(f=>uploadPhoto(f)));setPhotos(p=>[...p,...urls])}catch(e){alert("Erreur upload")}finally{setUploading(false)}};

  return<div style={{minHeight:"100vh",background:D.white}}>
    <nav style={{background:D.white,borderBottom:`1px solid ${D.g200}`,padding:"0 24px",height:56,display:"flex",alignItems:"center",gap:16,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:D.g600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><Ico.chevL/> {T.back}</button>

      </div>
    </nav>
    <div style={{maxWidth:560,margin:"0 auto",padding:"40px 24px"}}>
      {step===0&&<div><h2 style={{fontSize:26,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.whichSport}</h2><p style={{color:D.g400,fontSize:14,marginBottom:28}}>{T.pickCat}</p><div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>{CATS.map(c=><button key={c} onClick={()=>set("category",c)} className="btn" style={{background:f.category===c?D.green:D.g50,border:`1.5px solid ${f.category===c?D.green:D.g200}`,borderRadius:14,padding:"22px 18px",cursor:"pointer",textAlign:"left",transition:"all .15s"}}><div style={{fontSize:12,fontWeight:700,color:f.category===c?"rgba(255,255,255,.5)":"rgba(0,0,0,.3)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>{T.brand}</div><div style={{fontSize:16,fontWeight:800,color:f.category===c?D.white:D.black}}>{c}</div></button>)}</div></div>}
      {step===1&&<div><h2 style={{fontSize:26,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.photosTitle}</h2><p style={{color:D.g400,fontSize:14,marginBottom:24}}>{T.photosDesc}</p><div onClick={()=>!uploading&&ref.current.click()} style={{border:`2px dashed ${D.g200}`,borderRadius:18,padding:"40px",textAlign:"center",cursor:"pointer",background:D.g50,marginBottom:16}}><div style={{width:48,height:48,background:D.green,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",color:D.white}}><Ico.plus/></div><div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{uploading?T.uploading:T.addPhotos}</div><div style={{fontSize:13,color:D.g400}}>JPG, PNG — Max 8</div><input ref={ref} type="file" accept="image/*" multiple onChange={handleUpload} style={{display:"none"}}/></div>{photos.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>{photos.map((url,i)=><div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:10,overflow:"hidden",border:`2px solid ${i===0?D.green:D.g200}`}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>{i===0&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:D.green,color:D.white,fontSize:9,fontWeight:700,padding:"3px",textAlign:"center",textTransform:"uppercase"}}>Principal</div>}<button onClick={()=>setPhotos(p=>p.filter((_,idx)=>idx!==i))} style={{position:"absolute",top:5,right:5,width:22,height:22,background:"rgba(0,0,0,.6)",color:D.white,border:"none",borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico.x/></button></div>)}{photos.length<8&&<div onClick={()=>ref.current.click()} style={{aspectRatio:"1",borderRadius:10,border:`2px dashed ${D.g200}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:22,color:D.g400,background:D.g50}}>+</div>}</div>}{photos.length===0&&<div style={{background:"#FFF8E1",borderRadius:10,padding:"12px 14px",fontSize:13,color:"#8a6a00"}}>{T.photoReq}</div>}</div>}
      {step===2&&<div style={{display:"flex",flexDirection:"column",gap:18}}><h2 style={{fontSize:26,fontWeight:900,letterSpacing:"-0.5px",margin:0}}>{T.articleTitle}</h2><div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:D.g400}}>{T.brand}</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{[...(BRANDS[f.category]||[]),"Autre"].filter((v,i,a)=>a.indexOf(v)===i).map(b=><Pill key={b} label={b} active={f.brand===b} onClick={()=>set("brand",b)}/>)}</div></div><div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:D.g400}}>{T.cond}</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{STATES.map(s=><Pill key={s} label={s} active={f.state===s} onClick={()=>set("state",s)}/>)}</div></div><Inp label={T.titleL+" *"} value={f.title} onChange={e=>set("title",e.target.value)} placeholder={`Ex: ${f.brand||"Wilson"} ${f.category}`}/><div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:D.g400}}>{T.descL}</label><textarea value={f.description} onChange={e=>set("description",e.target.value)} rows={4} placeholder="Décrivez l'article…" style={{width:"100%",padding:"13px 15px",borderRadius:12,border:`1.5px solid ${D.g200}`,fontSize:14,resize:"vertical",boxSizing:"border-box",outline:"none"}}/></div></div>}
      {step===3&&<div><h2 style={{fontSize:26,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.priceTitle}</h2><p style={{color:D.g400,fontSize:14,marginBottom:32}}>{T.priceDesc}</p><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:28}}><input type="number" value={f.price} onChange={e=>set("price",e.target.value)} placeholder="0" style={{width:160,padding:"16px",borderRadius:14,border:`2px solid ${D.black}`,fontSize:32,fontWeight:900,textAlign:"center",outline:"none",letterSpacing:"-1px"}}/><span style={{fontSize:32,fontWeight:900,color:D.g400}}>€</span></div>{f.price>0&&<div style={{background:D.greenL,borderRadius:14,padding:"18px 22px"}}><div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:12}}>Récap</div>{[["Prix de vente",`${f.price} €`],["Commission (8%)",`- ${comm} €`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:8,color:D.g600}}><span>{k}</span><span>{v}</span></div>)}<div style={{borderTop:`1px solid ${D.g200}`,paddingTop:10,display:"flex",justifyContent:"space-between",fontSize:17,fontWeight:900}}><span>Vous recevez</span><span style={{color:D.green}}>{gain} €</span></div></div>}</div>}
      {step===4&&<div><h2 style={{fontSize:26,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.shipTitle}</h2><p style={{color:D.g400,fontSize:14,marginBottom:24}}>{T.shipDesc}</p><div style={{display:"flex",flexDirection:"column",gap:10}}>{SHIP.map(s=><button key={s.id} onClick={()=>set("shipping",s.id)} className="btn" style={{background:f.shipping===s.id?D.green:D.white,border:`1.5px solid ${f.shipping===s.id?D.green:D.g200}`,borderRadius:14,padding:"18px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left",transition:"all .15s"}}><div><div style={{fontWeight:700,fontSize:15,color:f.shipping===s.id?D.white:D.black}}>{s.label}</div><div style={{fontSize:13,color:f.shipping===s.id?"rgba(255,255,255,.6)":D.g400,marginTop:2}}>{s.delay}</div></div><div style={{fontWeight:800,fontSize:17,color:f.shipping===s.id?D.white:D.black}}>{s.price===0?"Gratuit":`${s.price} €`}</div></button>)}</div></div>}
      {step===5&&<div><h2 style={{fontSize:26,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.verifyTitle}</h2><p style={{color:D.g400,fontSize:14,marginBottom:24}}>{T.verifyDesc}</p><div style={{background:D.white,border:`1.5px solid ${D.g200}`,borderRadius:18,overflow:"hidden"}}>{photos.length>0?<img src={photos[0]} alt="" style={{width:"100%",height:200,objectFit:"cover"}}/>:<div style={{height:120,background:D.g100,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:40,height:40,background:CAT_BG[f.category]||D.green,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",color:D.white}}><Ico.grid/></div></div>}<div style={{padding:"18px 20px"}}><StateTag state={f.state}/><div style={{fontSize:18,fontWeight:800,margin:"8px 0 4px"}}>{f.title}</div><div style={{fontSize:13,color:D.g400,marginBottom:14}}>{f.brand} · {f.category}</div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:26,fontWeight:900,letterSpacing:"-1px"}}>{f.price} €</div><div style={{fontSize:13,color:D.g400,textAlign:"right"}}>Vous recevrez {gain} €<br/>via {SHIP.find(s=>s.id===f.shipping)?.label}</div></div></div></div></div>}

      <div style={{display:"flex",justifyContent:"space-between",marginTop:36,paddingTop:28,borderTop:`1px solid ${D.g100}`}}>
        {step>0?<button onClick={()=>setStep(s=>s-1)} style={{background:D.g100,color:D.black,border:"none",borderRadius:100,padding:"13px 24px",fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}><Ico.chevL/> {T.back}</button>:<div/>}
        {step<T.steps.length-1?<button onClick={()=>canNext()&&setStep(s=>s+1)} disabled={!canNext()||uploading} className="btn" style={{background:canNext()&&!uploading?D.black:"#ccc",color:D.white,border:"none",borderRadius:100,padding:"13px 28px",fontSize:14,fontWeight:700,cursor:canNext()?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:6}}>{uploading?T.uploading:T.continue} {!uploading&&<Ico.arrow/>}</button>:<button onClick={()=>publishAnn({...f,photo_url:photos[0]||null,photos})} disabled={loading} className="btn" style={{background:D.green,color:D.white,border:"none",borderRadius:100,padding:"13px 28px",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>{loading?T.publishing:T.post} {!loading&&<Ico.arrow/>}</button>}
      </div>
    </div>
  </div>;
}

// ARTICLE
function Article({selected,go,user,placeOrder,loading,T,favs,setFavs}){

  const[ship,setShip]=useState("mondial");
  const[offer,setOffer]=useState("");
  const[offerSent,setOfferSent]=useState(false);
  const[checkout,setCheckout]=useState(false);
  const[ordered,setOrdered]=useState(false);
  const[mainP,setMainP]=useState(0);

  const photos=a.photos&&a.photos.length>0?a.photos:(a.photo_url?[a.photo_url]:[]);
  const comm=(a.price*.08).toFixed(2);

    {checkout&&!ordered&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
      <div style={{background:D.white,borderRadius:22,padding:"28px",maxWidth:460,width:"100%",boxShadow:"0 32px 80px rgba(0,0,0,.18)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><h3 style={{fontSize:18,fontWeight:800}}>{T.finalize}</h3><button onClick={()=>setCheckout(false)} style={{background:D.g100,border:"none",borderRadius:"50%",width:34,height:34,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico.x/></button></div>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:20,background:D.g50,borderRadius:12,padding:"12px"}}>{photos.length>0?<img src={photos[0]} alt="" style={{width:52,height:52,objectFit:"cover",borderRadius:8}}/>:<div style={{width:52,height:52,background:D.g200,borderRadius:8}}/>}<div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{a.title}</div><StateTag state={a.state}/></div><div style={{fontWeight:900,fontSize:17}}>{a.price} €</div></div>
        <div style={{marginBottom:18}}><div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:10}}>{T.deliveryL}</div>{SHIP.map(s=><button key={s.id} onClick={()=>setShip(s.id)} style={{width:"100%",background:ship===s.id?D.greenL:D.white,border:`1.5px solid ${ship===s.id?D.green:D.g200}`,borderRadius:10,padding:"11px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",marginBottom:6,textAlign:"left",transition:"all .15s"}}><div><div style={{fontSize:13,fontWeight:600}}>{s.label}</div><div style={{fontSize:11,color:D.g400}}>{s.delay}</div></div><div style={{fontWeight:700,color:ship===s.id?D.green:D.black}}>{s.price===0?"Gratuit":`${s.price} €`}</div></button>)}</div>
        <div style={{background:D.g50,borderRadius:12,padding:"14px",marginBottom:16}}>{[["Article",`${a.price} €`],["Livraison",`${sc} €`],["Protection acheteur",`${comm} €`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5,color:D.g600}}><span>{k}</span><span>{v}</span></div>)}<div style={{borderTop:`1px solid ${D.g200}`,paddingTop:9,display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:17,marginTop:5}}><span>{T.totalL}</span><span style={{color:D.green}}>{total} €</span></div></div>
        <div style={{fontSize:12,color:D.g400,marginBottom:14,display:"flex",alignItems:"center",gap:6}}><Ico.shield/> {T.paySecure}</div>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setCheckout(false)} style={{flex:1,background:D.g100,color:D.black,border:"none",borderRadius:100,padding:"13px",fontSize:14,fontWeight:600,cursor:"pointer"}}>{T.cancel}</button><button onClick={doOrder} disabled={loading} className="btn" style={{flex:2,background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{loading?"…":`${T.pay} ${total} €`}</button></div>
      </div>
    </div>}

    {ordered&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
      <div style={{background:D.white,borderRadius:22,padding:"44px 36px",maxWidth:380,textAlign:"center"}}>

        <h3 style={{fontSize:22,fontWeight:900,marginBottom:10}}>{T.orderOK}</h3>
        <p style={{color:D.g400,fontSize:14,marginBottom:28,lineHeight:1.7}}>{T.orderDesc}</p>

      </div>
    </div>}

    <div style={{maxWidth:1100,margin:"0 auto",padding:"40px 24px",display:"grid",gridTemplateColumns:"1fr 340px",gap:40}} className="grid-mobile-1">
      <div>

          {photos.length>0?<img src={photos[mainP]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:72,height:72,background:CAT_BG[a.category]||D.green,borderRadius:18}}/>}
        </div>
        {photos.length>1&&<div style={{display:"flex",gap:8,marginBottom:28,overflowX:"auto"}}>{photos.map((url,i)=><div key={i} onClick={()=>setMainP(i)} style={{width:68,height:68,borderRadius:10,overflow:"hidden",border:`2px solid ${mainP===i?D.black:D.g200}`,cursor:"pointer",flexShrink:0}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>)}</div>}
        <div style={{display:"flex",borderBottom:`1px solid ${D.g200}`,marginBottom:20}}>
          {[[`desc`,T.descTab],[`specs`,T.specsTab]].map(([id,l])=><button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===id?D.black:"transparent"}`,padding:"11px 0",marginRight:28,fontSize:14,fontWeight:tab===id?700:400,color:tab===id?D.black:D.g400,cursor:"pointer"}}>{l}</button>)}
        </div>
        {tab==="desc"&&<p style={{fontSize:14,lineHeight:1.8,color:D.g600}}>{a.description||"Aucune description fournie."}</p>}
        {tab==="specs"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>{[["Catégorie",a.category],["Marque",a.brand||"—"],["État",a.state],["Livraison",SHIP.find(s=>s.id===a.shipping)?.label||"—"]].map(([k,v])=><div key={k} style={{background:D.g50,borderRadius:10,padding:"13px 15px"}}><div style={{fontSize:11,fontWeight:700,color:D.g400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{k}</div><div style={{fontSize:14,fontWeight:600}}>{v}</div></div>)}</div>}

        </div>

          {[[<Ico.truck/>,T.trust[1][0]],[<Ico.shield/>,T.trust[0][0]],[<Ico.check/>,T.trust[3][0]],[<Ico.leaf/>,T.trust[2][0]]].map(([icon,l],i)=><div key={i} style={{display:"flex",gap:10,alignItems:"center",fontSize:13,color:D.g600,marginBottom:10}}><div style={{color:D.green,flexShrink:0}}>{icon}</div>{l}</div>)}
        </div>
      </div>
    </div>
  </div>;
}

// DASHBOARD
function Dash({user,profile,go,logout,myAnn,myOrders,mySales,wallet,dashTab,setDashTab,toggleAnn,deleteAnn,toast2,T}){
  const[boosted,setBoosted]=useState([]);
  const[boostId,setBoostId]=useState(null);
  const isPro=profile?.user_type==="pro";
  const totalRev=mySales.reduce((acc,s)=>acc+(s.gain||0),0);
  const firstName=profile?.name?.split(" ")[0]||profile?.name||"?";

  const TABS=[{id:"overview",label:T.overview},{id:"annonces",label:T.myAnn},{id:"ventes",label:T.mySales},{id:"achats",label:T.myBuys},{id:"wallet",label:T.walletL},{id:"stats",label:T.statsL},...(isPro?[{id:"pro",label:T.proL}]:[]),{id:"settings",label:T.settingsL}];

  return<div style={{minHeight:"100vh",background:D.g50}}>
    <nav style={{background:D.white,borderBottom:`1px solid ${D.g200}`,padding:"0 24px",height:56,display:"flex",alignItems:"center",gap:16,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:D.g600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><Ico.chevL/></button>
      <Logo size={18}/>
      <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>go("sell")} className="btn" style={{background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> {T.sell}</button>
        <div style={{width:36,height:36,borderRadius:"50%",background:isPro?D.black:D.green,display:"flex",alignItems:"center",justifyContent:"center",color:D.white,fontWeight:700,fontSize:14}}>{firstName.charAt(0)}</div>
      </div>
    </nav>

    <div style={{maxWidth:1100,margin:"0 auto",padding:"28px 24px",display:"grid",gridTemplateColumns:"200px 1fr",gap:24}} className="grid-mobile-1">
      {/* Sidebar */}
      <div className="sidebar-mobile" style={{display:"flex",flexDirection:"column",gap:4}}>
        <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"14px",marginBottom:10}} className="hide-mobile">
          <div style={{fontSize:15,fontWeight:700}}>{firstName}</div>
          <div style={{fontSize:12,color:D.g400,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{profile?.email}</div>
          {isPro&&<div style={{marginTop:8,background:D.black,color:D.white,borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,display:"inline-block"}}>PRO</div>}
        </div>
        <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"8px",overflow:"hidden"}} className="hide-mobile">
          {TABS.map(t=><button key={t.id} onClick={()=>setDashTab(t.id)} style={{width:"100%",display:"block",padding:"10px 12px",borderRadius:10,border:"none",background:dashTab===t.id?D.black:"transparent",color:dashTab===t.id?D.white:D.g600,fontWeight:dashTab===t.id?700:500,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left",transition:"all .15s"}}>{t.label}</button>)}
          <div style={{borderTop:`1px solid ${D.g200}`,marginTop:8,paddingTop:8}}><button onClick={logout} style={{width:"100%",display:"block",padding:"10px 12px",borderRadius:10,border:"none",background:"transparent",color:D.red,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>{T.logoutL}</button></div>
        </div>
        {/* Mobile bottom nav */}
        <div style={{display:"none"}} className="sidebar-mobile-inner">
          {TABS.slice(0,6).map(t=><button key={t.id} onClick={()=>setDashTab(t.id)} className="sidebar-btn-mobile" style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 4px",border:"none",background:dashTab===t.id?D.greenL:"transparent",borderRadius:8,cursor:"pointer",minWidth:50}}><div style={{width:20,height:20,background:dashTab===t.id?D.green:D.g200,borderRadius:4}}></div><span className="sidebar-label-mobile" style={{fontSize:10,fontWeight:600,color:dashTab===t.id?D.green:D.g400,textAlign:"center"}}>{t.label}</span></button>)}
        </div>
      </div>

      {/* Main */}
      <div className="main-mobile" style={{minWidth:0}}>
        {dashTab==="overview"&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:20}}>{T.hello}, {firstName} 👋</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}} className="grid-mobile-2">
            {[[`${totalRev.toFixed(2)} €`,T.revenueL,D.green],[myAnn.filter(a=>a.status==="active").length,T.activeListing,D.black],[mySales.length,T.salesL,D.orange],[myOrders.length,T.purchasesL,D.g800]].map(([v,l,c])=><div key={l} style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"18px"}}><div style={{fontSize:24,fontWeight:900,color:c,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:D.g400,marginTop:4,fontWeight:500}}>{l}</div></div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}} className="grid-mobile-1">
            <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"18px"}}>
              <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:14}}>{T.recentL}</div>
              {myAnn.slice(0,4).map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${D.g100}`}}><div style={{width:38,height:38,borderRadius:8,overflow:"hidden",background:D.g100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:18,height:18,background:CAT_BG[a.category]||D.green,borderRadius:4}}/>}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div><div style={{fontSize:12,color:D.g400}}>{a.price} €</div></div><div style={{fontSize:11,fontWeight:700,color:a.status==="active"?D.green:D.g400,textTransform:"uppercase"}}>{a.status==="active"?T.onlineL:T.inactiveL}</div></div>)}
              {myAnn.length===0&&<div style={{fontSize:13,color:D.g400,textAlign:"center",padding:"16px 0"}}>{T.noListings}</div>}
            </div>
            <div style={{background:D.green,borderRadius:14,padding:"22px"}}>
              <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.45)",marginBottom:6}}>{T.walletL}</div>
              <div style={{fontSize:36,fontWeight:900,color:D.white,letterSpacing:"-2px",marginBottom:4}}>{wallet.toFixed(2)} €</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,.45)",marginBottom:20}}>{T.balanceL}</div>
              <button onClick={()=>setDashTab("wallet")} style={{background:"rgba(255,255,255,.15)",color:D.white,border:"1px solid rgba(255,255,255,.25)",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.manageWallet}</button>
            </div>
          </div>
        </div>}

        {dashTab==="annonces"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px"}}>{T.myAnn}</h2>
            <button onClick={()=>go("sell")} className="btn" style={{background:D.black,color:D.white,border:"none",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> {T.newL}</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myAnn.map(a=><div key={a.id} style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"14px 18px",display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:56,height:56,borderRadius:10,overflow:"hidden",background:D.g100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:22,height:22,background:CAT_BG[a.category]||D.green,borderRadius:5}}/>}</div>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div><div style={{fontSize:12,color:D.g400,marginTop:2}}>{a.category} · {a.price} €</div></div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <div style={{fontSize:11,fontWeight:700,color:a.status==="active"?D.green:a.status==="pause"?D.orange:D.g400,textTransform:"uppercase",letterSpacing:".5px",background:a.status==="active"?D.greenL:a.status==="pause"?"#FFF3E0":D.g100,padding:"4px 10px",borderRadius:100}}>{a.status==="active"?T.onlineL:a.status==="pause"?"Pause":T.soldL}</div>
                {a.status!=="vendu"&&a.status!=="supprimé"&&<><button onClick={()=>toggleAnn(a.id,a.status==="pause"?"active":"pause")} style={{background:D.g100,color:D.black,border:"none",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap"}}>{a.status==="pause"?T.activateL:T.pauseL}</button>{!boosted.includes(a.id)?<button onClick={()=>setBoostId(a.id)} style={{background:"#FFF3E0",color:D.orange,border:"none",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>{T.boostL}</button>:<span style={{fontSize:11,color:D.green,fontWeight:700}}>{T.boostedL}</span>}<button onClick={()=>deleteAnn(a.id)} style={{background:D.g100,color:D.g400,border:"none",borderRadius:8,padding:"5px 8px",fontSize:12,cursor:"pointer"}}>{T.deleteL}</button></>}
              </div>
            </div>)}
            {myAnn.length===0&&<div style={{textAlign:"center",padding:"48px",color:D.g400,background:D.white,borderRadius:14,border:`1px solid ${D.g200}`}}>{T.noListings} <span style={{color:D.green,cursor:"pointer",fontWeight:600}} onClick={()=>go("sell")}>{T.postFirst}</span></div>}
          </div>
          {boostId&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
            <div style={{background:D.white,borderRadius:20,padding:"28px",maxWidth:340,width:"90%",textAlign:"center"}}>
              <div style={{width:52,height:52,background:"#FFF3E0",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",fontSize:22}}>⚡</div>
              <h3 style={{fontSize:17,fontWeight:800,marginBottom:8}}>{T.boostTitle}</h3>
              <p style={{fontSize:13,color:D.g400,marginBottom:22,lineHeight:1.6}}>{T.boostDesc}</p>
              <div style={{display:"flex",gap:8}}><button onClick={()=>setBoostId(null)} style={{flex:1,background:D.g100,border:"none",borderRadius:100,padding:"12px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.cancel}</button><button onClick={()=>{setBoosted(b=>[...b,boostId]);setBoostId(null);toast2&&toast2(T.boostSuccess||"Boosté!")}} className="btn" style={{flex:2,background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"12px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Payer 3,50 €</button></div>
            </div>
          </div>}
        </div>}

        {dashTab==="ventes"&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:20}}>{T.mySales}</h2>
          {mySales.length===0?<div style={{textAlign:"center",padding:"48px",color:D.g400,background:D.white,borderRadius:14,border:`1px solid ${D.g200}`}}>{T.noSales}</div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>{mySales.map(v=><div key={v.id} style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"16px 20px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><div><div style={{fontSize:14,fontWeight:700}}>#{v.id?.slice(0,8)}</div><div style={{fontSize:12,color:D.g400,marginTop:1}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:11,fontWeight:700,color:v.status==="livré"?D.green:D.orange,textTransform:"uppercase"}}>{v.status}</div></div><div style={{display:"flex",gap:20,fontSize:13,flexWrap:"wrap"}}><span><span style={{color:D.g400}}>{T.priceL} : </span><strong>{v.price} €</strong></span><span><span style={{color:D.g400}}>{T.commL} : </span><span style={{color:D.red}}>- {v.commission} €</span></span><span><span style={{color:D.g400}}>{T.netL} : </span><strong style={{color:D.green}}>{v.gain} €</strong></span></div></div>)}</div>}
        </div>}

        {dashTab==="achats"&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:20}}>{T.myBuys}</h2>
          {myOrders.length===0?<div style={{textAlign:"center",padding:"48px",color:D.g400,background:D.white,borderRadius:14,border:`1px solid ${D.g200}`}}>{T.noBuys} <span style={{color:D.green,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>{T.exploreCat}</span></div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>{myOrders.map(o=><div key={o.id} style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"16px 20px"}}><div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{fontSize:14,fontWeight:700}}>#{o.id?.slice(0,8)}</div><div style={{fontSize:12,color:D.g400,marginTop:1}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:11,fontWeight:700,color:o.status==="livré"?D.green:D.orange,textTransform:"uppercase"}}>{o.status}</div></div><div style={{fontSize:14,fontWeight:700,marginTop:8}}>{o.price} € · {o.shipping_method}</div></div>)}</div>}
        </div>}

        {dashTab==="wallet"&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:20}}>{T.walletL}</h2>
          <div style={{background:D.green,borderRadius:18,padding:"28px 32px",marginBottom:18,color:D.white}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.45)",marginBottom:6}}>{T.balanceL}</div>
            <div style={{fontSize:48,fontWeight:900,letterSpacing:"-2px",marginBottom:20}}>{wallet.toFixed(2)} €</div>
            <button className="btn" style={{background:"rgba(255,255,255,.15)",color:D.white,border:"1px solid rgba(255,255,255,.25)",borderRadius:100,padding:"11px 22px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{T.withdrawL}</button>
          </div>
          <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"18px"}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:14}}>{T.transL}</div>
            {mySales.length===0?<div style={{textAlign:"center",padding:"16px",color:D.g400,fontSize:13}}>{T.noTrans}</div>:mySales.map((s,i)=><div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"11px 0",borderBottom:i<mySales.length-1?`1px solid ${D.g100}`:"none"}}><div><div style={{fontSize:13,fontWeight:600}}>#{s.id?.slice(0,8)}</div><div style={{fontSize:12,color:D.g400}}>{new Date(s.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:15,fontWeight:800,color:D.green}}>+{s.gain} €</div></div>)}
          </div>
        </div>}

        {dashTab==="stats"&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:20}}>{T.statsL}</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:18}} className="grid-mobile-2">
            {[[myAnn.reduce((a,x)=>a+(x.views||0),0),T.viewsL],[myAnn.reduce((a,x)=>a+(x.favs||0),0),T.favsL],[mySales.length,T.salesL],[`${totalRev.toFixed(0)} €`,T.revenueL]].map(([v,l])=><div key={l} style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"18px"}}><div style={{fontSize:24,fontWeight:900,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:D.g400,marginTop:4}}>{l}</div></div>)}
          </div>
          <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"18px"}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:14}}>{T.perfL}</div>
            {myAnn.length===0?<div style={{textAlign:"center",padding:"16px",color:D.g400}}>{T.noData}</div>:myAnn.map(a=><div key={a.id} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}><span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"70%"}}>{a.title}</span><span style={{color:D.g400}}>{a.views||0} vues</span></div><div style={{background:D.g100,borderRadius:4,height:5,overflow:"hidden"}}><div style={{background:D.green,height:"100%",borderRadius:4,width:`${Math.min((a.views||0)/Math.max(...myAnn.map(x=>x.views||1))*100,100)}%`,transition:"width .5s"}}/></div></div>)}
          </div>
        </div>}

        {dashTab==="pro"&&isPro&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>{T.proL}</h2>
          <p style={{color:D.g400,marginBottom:20,fontSize:14}}>Gérez vos invendus et votre espace publicitaire.</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}} className="grid-mobile-1">
            <div style={{background:D.black,borderRadius:14,padding:"22px",color:D.white}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.35)",marginBottom:10}}>{T.subscriptionL}</div><div style={{fontSize:18,fontWeight:800,marginBottom:3}}>{T.proActive}</div><div style={{fontSize:12,color:"rgba(255,255,255,.35)"}}>{T.proRenew}</div></div>
            <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"22px"}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:10}}>{T.adSpace}</div><div style={{fontSize:18,fontWeight:800,marginBottom:3}}>{T.adSpace}</div><div style={{fontSize:12,color:D.g400}}>{T.adSpaceSub}</div></div>
          </div>
          <div style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:14,padding:"22px"}}><div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.g400,marginBottom:14}}>Invendus</div><button onClick={()=>go("sell")} className="btn" style={{background:D.black,color:D.white,border:"none",borderRadius:100,padding:"11px 22px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> {T.addUnsold}</button></div>
        </div>}

        {dashTab==="settings"&&<div>
          <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:20}}>{T.settingsL}</h2>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {T.settingsItems.map(([title,sub],i)=><div key={title} style={{background:D.white,border:`1px solid ${D.g200}`,borderRadius:12,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}><div><div style={{fontSize:14,fontWeight:600,color:i===T.settingsItems.length-1?D.red:D.black}}>{title}</div><div style={{fontSize:12,color:D.g400,marginTop:2}}>{sub}</div></div><Ico.chevR/></div>)}
          </div>
        </div>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
