<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0A0A0A;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes codeReveal{from{letter-spacing:8px;opacity:0}to{letter-spacing:4px;opacity:1}}
@keyframes checkDraw{from{stroke-dashoffset:50}to{stroke-dashoffset:0}}
.fu{animation:fu .4s ease forwards}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.btn{transition:all .15s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
 
/* ═══ SMASHD DROP MODAL ═══ */
.drop-overlay{position:fixed;inset:0;background:rgba(10,10,10,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px;animation:fu .2s ease}
.drop-modal{background:#fff;border-radius:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 32px 80px rgba(0,0,0,.25)}
.drop-header{background:#0A2A1E;border-radius:24px 24px 0 0;padding:28px 28px 24px;position:relative;overflow:hidden}
.drop-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0%,rgba(0,196,106,.15),transparent 60%)}
.drop-header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,196,106,.15);border:1px solid rgba(0,196,106,.25);border-radius:100px;padding:4px 12px;font-size:11px;font-weight:700;color:#00C46A;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px}
.drop-header h2{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1.1;margin-bottom:6px}
.drop-header p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}
.drop-close{position:absolute;top:18px;right:18px;width:32px;height:32px;background:rgba(255,255,255,.1);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:14px;transition:background .15s}
.drop-close:hover{background:rgba(255,255,255,.2)}
.drop-steps{display:flex;align-items:center;padding:20px 28px 0}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;transition:all .3s}
.step-dot.done{background:#0A2A1E;color:#fff}
.step-dot.active{background:#0A0A0A;color:#fff;box-shadow:0 0 0 4px rgba(10,10,10,.1)}
.step-dot.pending{background:#F5F5F5;color:#9A9A9A}
.step-lbl{font-size:11px;font-weight:600;color:#9A9A9A;white-space:nowrap;margin-left:6px}
.step-lbl.active{color:#0A0A0A}
.step-line{flex:1;height:2px;background:#E8E8E8;margin:0 8px;border-radius:2px;transition:background .3s}
.step-line.done{background:#0A2A1E}
.drop-body{padding:24px 28px 28px}
/* Mode cards */
.mode-card{border:2px solid #E8E8E8;border-radius:16px;padding:16px;cursor:pointer;transition:all .2s;background:#fff;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px}
.mode-card:hover{border-color:#9A9A9A;transform:translateY(-1px)}
.mode-card.selected{border-color:#0A2A1E;background:#F0F7F4}
.mode-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.mode-radio{width:20px;height:20px;border-radius:50%;border:2px solid #E8E8E8;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mode-radio.sel{border-color:#0A2A1E;background:#0A2A1E}
.mode-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;border-radius:100px;padding:3px 9px;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.badge-free{background:#E8F8F0;color:#1A5C3A}
.badge-fast{background:#FFF3E0;color:#C25A00}
.badge-eco{background:#F0F7F4;color:#0A2A1E}
/* Club items */
.club-item{border:1.5px solid #E8E8E8;border-radius:12px;padding:12px 15px;margin-bottom:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px}
.club-item:hover{border-color:#9A9A9A}
.club-item.selected{border-color:#0A2A1E;background:#F0F7F4}
.club-ping{position:relative;width:10px;height:10px;flex-shrink:0}
.club-ping-inner{width:10px;height:10px;border-radius:50%;background:#00C46A;position:relative;z-index:1}
.club-ping-wave{position:absolute;inset:0;border-radius:50%;background:#00C46A;animation:ping 1.5s ease infinite}
/* Code display */
.code-display{background:#0A0A0A;border-radius:16px;padding:22px;text-align:center;margin:16px 0}
.code-value{font-family:'DM Mono',monospace;font-size:34px;font-weight:500;color:#00C46A;letter-spacing:4px;animation:codeReveal .5s ease forwards}
.code-copy-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:7px 16px;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.code-copy-btn:hover{background:rgba(255,255,255,.15);color:#fff}
/* Timeline */
.tl-item{display:flex;gap:12px;margin-bottom:14px}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tl-line{width:2px;background:#E8E8E8;margin:4px 0;border-radius:2px;flex:1}
/* Info box */
.info-box{background:#F0F7F4;border:1px solid rgba(0,196,106,.2);border-radius:12px;padding:12px 14px;display:flex;gap:10px;margin-bottom:16px}
/* Form */
.drop-input{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid #E8E8E8;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;background:#fff;box-sizing:border-box}
.drop-input:focus{border-color:#0A2A1E}
.drop-label{font-size:11px;font-weight:700;color:#9A9A9A;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:7px}
.drop-group{margin-bottom:15px}
/* Nav buttons */
.drop-nav{display:flex;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #F5F5F5}
.btn-drop-back{background:#F5F5F5;color:#0A0A0A;border:none;border-radius:100px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:'Inter',sans-serif}
.btn-drop-next{flex:1;background:#0A0A0A;color:#fff;border:none;border-radius:100px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-family:'Inter',sans-serif}
.btn-drop-next:hover{background:#222}
.btn-drop-primary{width:100%;background:#0A2A1E;color:#fff;border:none;border-radius:100px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;font-family:'Inter',sans-serif}
.btn-drop-primary:hover{background:#0d3a26;transform:translateY(-1px)}
.btn-drop-secondary{width:100%;background:#F5F5F5;color:#0A0A0A;border:none;border-radius:100px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s;font-family:'Inter',sans-serif}
.drop-spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
/* Success */
.drop-success-icon{width:68px;height:68px;background:#F0F7F4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
 
@media(max-width:600px){
  .drop-modal{border-radius:20px 20px 0 0;max-height:95vh;position:fixed;bottom:0;left:0;right:0;width:100%}
  .drop-overlay{align-items:flex-end;padding:0}
  .drop-header{border-radius:20px 20px 0 0}
}
 
@media(max-width:768px){
  .hm{display:none!important}
  .g2m{grid-template-columns:1fr 1fr!important}
  .g1m{grid-template-columns:1fr!important}
  .ht{font-size:36px!important;letter-spacing:-1px!important}
  .hp{padding:96px 20px 52px!important}
}

function genDropCode(){
  const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  const[club,setClub]=useState(0);
  const[meetPlace,setMeetPlace]=useState("");
  const[meetDispo,setMeetDispo]=useState("");
  const[meetNote,setMeetNote]=useState("");
  const[boxType,setBoxType]=useState("");
  const[boxAddr,setBoxAddr]=useState("");
  const[boxNote,setBoxNote]=useState("");
  const[clubNote,setClubNote]=useState("");
  const[loading,setLoading]=useState(false);
  const[code,setCode]=useState("");
  const[copied,setCopied]=useState(false);
 
  const getLieu=()=>{
    if(mode==="meet")return meetPlace||"Lieu non précisé";
    if(mode==="club")return DROP_CLUBS[club].name;
    return boxAddr||"Adresse non précisée";
  };
 
  const goStep=n=>{
    if(n===3){
      setLoading(true);
      setStep(3);
      setTimeout(()=>{setCode(genDropCode());setLoading(false)},1400);
    } else {
      setStep(n);
    }
  };
 
  const copyCode=()=>{
    navigator.clipboard?.writeText(code);
    setCopied(true);
    setTimeout(()=>setCopied(false),2000);
  };
 
  const StepDot=({n})=>{
    const done=n<step;const active=n===step;
    return<div style={{display:"flex",alignItems:"center",gap:6,flex:n<3?1:"auto"}}>
      <div className={`step-dot ${done?"done":active?"active":"pending"}`}>
        {done?<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round"><path d="M20 6 9 17l-5-5"/></svg>:n}
      </div>
      <span className={`step-lbl ${active?"active":""}`}>{n===1?"Mode":n===2?"Lieu":"Confirmation"}</span>
      {n<3&&<div className={`step-line ${done?"done":""}`}/>}
    </div>;
  };
 
  const ModeCard=({id})=>{
    const m=DROP_MODES[id];
    const sel=mode===id;
    return<div className={`mode-card ${sel?"selected":""}`} onClick={()=>setMode(id)}>
      <div className="mode-icon" style={{background:m.color}}>{m.icon}</div>
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:3}}>{m.label}</div>
        <div style={{fontSize:12,color:C.f600,lineHeight:1.5,marginBottom:8}}>{m.desc}</div>
        <div>{m.badges.map(b=><span key={b} className={`mode-badge ${b==="Gratuit"?"badge-free":b==="Rapide"?"badge-fast":"badge-eco"}`}>{b==="Gratuit"?"✓ Gratuit":b==="Rapide"?"⚡ Rapide":"🌱 Éco"}</span>)}</div>
      </div>
      <div className={`mode-radio ${sel?"sel":""}`}>{sel&&<div style={{width:8,height:8,borderRadius:"50%",background:"#fff"}}/>}</div>
    </div>;
  };
 
  const Timeline=({m})=><div>{DROP_MODES[m].timeline.map((item,i,arr)=><div key={i} className="tl-item">
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:0}}>
      <div className="tl-dot" style={{background:i===0?C.g:C.f100}}>{item.e}</div>
      {i<arr.length-1&&<div className="tl-line"/>}
    </div>
    <div style={{flex:1,paddingTop:3}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{item.t}</div>
      <div style={{fontSize:12,color:C.f400,lineHeight:1.5}}>{item.d}</div>
    </div>
  </div>)}</div>;
 
  return<div className="drop-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="drop-modal">
      {/* HEADER */}
      <div className="drop-header">
        <button className="drop-close" onClick={onClose}>✕</button>
        <div className="drop-header-badge">
          <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
          SMASHD Drop
        </div>
        <h2>{step===1?"Comment livrer votre article ?":step===2?DROP_MODES[mode].label==="Point de rencontre"?"Où vous retrouver ?":DROP_MODES[mode].label==="Club partenaire SMASHD"?"Choisir un club partenaire":"Détails de la consigne":step===3?"Votre code de remise":"C'est parti !"}</h2>
        <p>{step===1?"Sans frais, sans transporteur — 100% communautaire.":step===2?"Renseignez les détails du lieu de remise.":step===3?"Conservez ce code — il sécurise la transaction.":""}</p>
      </div>
 
      {/* STEPS BAR */}
      {step<4&&<div className="drop-steps">
        <StepDot n={1}/><StepDot n={2}/><StepDot n={3}/>
      </div>}
 
      <div className="drop-body">
 
        {/* STEP 1 */}
        {step===1&&<div>
          <ModeCard id="meet"/>
          <ModeCard id="club"/>
          <ModeCard id="box"/>
          <div className="drop-nav">
            <button className="btn-drop-next" onClick={()=>goStep(2)}>
              Continuer
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>}
 
        {/* STEP 2 */}
        {step===2&&<div>
          {mode==="meet"&&<>
            <div className="info-box">
              <span style={{fontSize:16}}>💡</span>
              <span style={{fontSize:13,color:C.gm,lineHeight:1.6,fontWeight:500}}>Choisissez un lieu public et passant. Un code unique sécurisera la remise physique.</span>
            </div>
            <div className="drop-group"><label className="drop-label">Lieu de rencontre *</label><input className="drop-input" value={meetPlace} onChange={e=>setMeetPlace(e.target.value)} placeholder="Ex: Café Gare du Nord, Paris 10e"/></div>
            <div className="drop-group"><label className="drop-label">Vos disponibilités</label><input className="drop-input" value={meetDispo} onChange={e=>setMeetDispo(e.target.value)} placeholder="Ex: Lundi-Vendredi 18h-20h"/></div>
            <div className="drop-group"><label className="drop-label">Note pour l'acheteur</label><textarea className="drop-input" style={{resize:"vertical",minHeight:72}} value={meetNote} onChange={e=>setMeetNote(e.target.value)} placeholder="Ex: Je serai en veste verte près de l'entrée…"/></div>
          </>}
 
          {mode==="club"&&<>
            <div className="info-box">
              <span style={{fontSize:16}}>🏆</span>
              <span style={{fontSize:13,color:C.gm,lineHeight:1.6,fontWeight:500}}>Ces clubs partenaires SMASHD stockent vos articles gratuitement en échange de visibilité.</span>
            </div>
            <label className="drop-label" style={{marginBottom:10}}>Clubs disponibles près de vous</label>
            {DROP_CLUBS.map((cl,i)=><div key={i} className={`club-item ${club===i?"selected":""}`} onClick={()=>setClub(i)}>
              <div className="club-ping"><div className="club-ping-wave"/><div className="club-ping-inner"/></div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700}}>{cl.name}</div>
                <div style={{fontSize:11,color:C.f400,textTransform:"uppercase",letterSpacing:".5px",fontWeight:600}}>{cl.type}</div>
              </div>
              <div style={{fontSize:12,color:C.f400,fontWeight:500}}>{cl.dist}</div>
            </div>)}
            <div className="drop-group" style={{marginTop:12}}><label className="drop-label">Note pour le club</label><textarea className="drop-input" style={{resize:"vertical",minHeight:60}} value={clubNote} onChange={e=>setClubNote(e.target.value)} placeholder="Informations supplémentaires pour le club…"/></div>
          </>}
 
          {mode==="box"&&<>
            <div className="info-box">
              <span style={{fontSize:16}}>📦</span>
              <span style={{fontSize:13,color:C.gm,lineHeight:1.6,fontWeight:500}}>L'adresse et le code sont partagés uniquement après confirmation de commande.</span>
            </div>
            <div className="drop-group"><label className="drop-label">Type *</label>
              <select className="drop-input" value={boxType} onChange={e=>setBoxType(e.target.value)}>
                <option value="">Sélectionner…</option>
                <option>Boîte aux lettres accessible</option>
                <option>Consigne de gare</option>
                <option>Casier de club</option>
                <option>Point de garde chez un voisin</option>
              </select>
            </div>
            <div className="drop-group"><label className="drop-label">Adresse de dépôt *</label><input className="drop-input" value={boxAddr} onChange={e=>setBoxAddr(e.target.value)} placeholder="Adresse complète"/></div>
            <div className="drop-group"><label className="drop-label">Instructions pour l'acheteur</label><textarea className="drop-input" style={{resize:"vertical",minHeight:72}} value={boxNote} onChange={e=>setBoxNote(e.target.value)} placeholder="Ex: Sonnez au 3e, boîte verte en bas à gauche…"/></div>
          </>}
 
          <div className="drop-nav">
            <button className="btn-drop-back" onClick={()=>setStep(1)}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Retour
            </button>
            <button className="btn-drop-next" onClick={()=>goStep(3)}>
              Générer le code
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>}
 
        {/* STEP 3 */}
        {step===3&&<div>
          {loading?<div style={{textAlign:"center",padding:"36px 0"}}>
            <div style={{width:36,height:36,border:"3px solid #E8E8E8",borderTopColor:C.g,borderRadius:"50%",animation:"spin .7s linear infinite",margin:"0 auto 14px"}}/>
            <div style={{fontSize:13,color:C.f400,fontWeight:500}}>Génération du code de remise…</div>
          </div>:<div>
            {/* Recap */}
            <div style={{background:C.f50,borderRadius:13,padding:14,marginBottom:14,display:"flex",gap:12,alignItems:"center"}}>
              <div style={{fontSize:24}}>{DROP_MODES[mode].icon}</div>
              <div>
                <div style={{fontSize:13,fontWeight:800}}>{DROP_MODES[mode].label}</div>
                <div style={{fontSize:12,color:C.f400,marginTop:2}}>{getLieu()}</div>
              </div>
            </div>
            {/* Code */}
            <div className="code-display">
              <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:10}}>Code de remise SMASHD</div>
              <div className="code-value">{code}</div>
              <button className="code-copy-btn" onClick={copyCode}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                {copied?"✓ Copié !":"Copier le code"}
              </button>
              <div style={{fontSize:11,color:"rgba(255,255,255,.25)",marginTop:8}}>Activé à la première commande · Valable 30 jours</div>
            </div>
            {/* Timeline */}
            <div style={{fontSize:11,fontWeight:700,color:C.f400,textTransform:"uppercase",letterSpacing:"1px",marginBottom:12}}>Comment ça marche</div>
            <Timeline m={mode}/>
            <button className="btn-drop-primary" style={{marginTop:16}} onClick={()=>{onConfirm({mode,lieu:getLieu(),code,club:mode==="club"?DROP_CLUBS[club]:null});setStep(4)}}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M20 6 9 17l-5-5"/></svg>
              Confirmer et publier l'annonce
            </button>
            <button className="btn-drop-secondary" onClick={()=>setStep(2)}>Modifier</button>
          </div>}
        </div>}
 
        {/* STEP 4 — Succès */}
        {step===4&&<div style={{textAlign:"center",padding:"16px 0"}}>
          <div className="drop-success-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#00C46A" strokeWidth="2.5" strokeLinecap="round">
              <path d="M20 6 9 17l-5-5" strokeDasharray="50" style={{animation:"checkDraw .5s .2s ease forwards",strokeDashoffset:50}}/>
            </svg>
          </div>
          <div style={{fontSize:22,fontWeight:900,letterSpacing:"-.5px",marginBottom:8}}>Annonce publiée !</div>
          <div style={{fontSize:14,color:C.f600,lineHeight:1.7,maxWidth:300,margin:"0 auto 20px"}}>Votre article est en ligne. Le code sera activé dès la première commande.</div>
          <div style={{background:C.k,borderRadius:14,padding:"18px 24px",display:"inline-block",marginBottom:20,minWidth:220}}>
            <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:8}}>Votre code de remise</div>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:26,color:C.ga,letterSpacing:4,fontWeight:500}}>{code}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.25)",marginTop:6}}>Valable 30 jours après commande</div>
          </div>
          <button className="btn-drop-primary" onClick={onClose}>
            Voir mon annonce
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>}
 
      </div>
    </div>
  </div>;
}

function BuyerDropModal({ann,onClose,onConfirm,load}){

          {Object.entries(DROP_MODES).map(([id,m])=><div key={id} className={`mode-card ${ship===id?"selected":""}`} onClick={()=>setShip(id)} style={{padding:"12px 14px",marginBottom:8}}>
            <div className="mode-icon" style={{background:m.color,width:38,height:38,fontSize:18}}>{m.icon}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700}}>{m.label}</div>
              <div style={{fontSize:11,color:C.f600}}>{m.desc}</div>
            </div>
            <div className={`mode-radio ${ship===id?"sel":""}`}>{ship===id&&<div style={{width:8,height:8,borderRadius:"50%",background:"#fff"}}/>}</div>
          </div>)}
          {/* Total */}
          <div style={{background:C.f50,borderRadius:12,padding:"13px",margin:"16px 0"}}>
            {[["Article",`${ann.price} €`],["Protection acheteur",`${comm} €`],["Livraison","0,00 €"]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4,color:C.f600}}><span>{k}</span><span>{v}</span></div>)}
            <div style={{borderTop:`1px solid ${C.f200}`,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:16,marginTop:4}}><span>Total</span><span style={{color:C.g}}>{(parseFloat(ann.price)+parseFloat(comm)).toFixed(2)} €</span></div>
          </div>
          <button className="btn-drop-primary" onClick={doOrder} disabled={load}>

            </>}
          </button>
          <button className="btn-drop-secondary" onClick={onClose}>Annuler</button>
        </>}
      </div>
    </div>
  </div>;
}

function App(){
  const[sc,setSc]=useState("home");
  const[user,setUser]=useState(null);
  const[prof,setProf]=useState(null);
  const[ann,setAnn]=useState([]);
  const[myA,setMyA]=useState([]);
  const[myO,setMyO]=useState([]);
  const[myS,setMyS]=useState([]);
  const[toast,setToast]=useState(null);
  const[load,setLoad]=useState(false);
  const[srch,setSrch]=useState("");
  const[fcat,setFcat]=useState("Tous");
  const[fst,setFst]=useState("Tous");
  const[fpr,setFpr]=useState({min:"",max:""});
  const[sel,setSel]=useState(null);
  const[dtab,setDtab]=useState("overview");
  const[lang,setLang]=useState("FR");
  const[favs,setFavs]=useState({});
 
  const tw=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000)};
  const go=(s,d=null)=>{setSc(s);if(d)setSel(d);window.scrollTo(0,0)};
  const loadA=async()=>{try{const d=await api("annonces?status=eq.active&order=created_at.desc&limit=60");setAnn(d)}catch(e){}};
  const loadMy=async uid=>{try{const[a,o,s]=await Promise.all([api(`annonces?user_id=eq.${uid}&order=created_at.desc`),api(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),api(`commandes?seller_id=eq.${uid}&order=created_at.desc`)]);setMyA(a);setMyO(o);setMyS(s)}catch(e){}};
  useEffect(()=>{loadA()},[]);
 
  const login=async(email,pwd)=>{setLoad(true);try{const d=await authApi("token?grant_type=password",{email,password:pwd});st(d.access_token);setUser(d.user);const p=await api(`profiles?id=eq.${d.user.id}`);setProf(p[0]||null);await loadMy(d.user.id);tw("Bienvenue !");go("home")}catch(e){throw e}finally{setLoad(false)}};
  const register=async(email,pwd,name,ut,siret,company)=>{setLoad(true);try{const d=await authApi("signup",{email,password:pwd});if(d.user){if(d.access_token)st(d.access_token);await api("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:ut,siret:siret||null,company:company||null})});setUser(d.user);setProf({id:d.user.id,name,email,user_type:ut});tw("Compte créé !");go("home")}}catch(e){throw e}finally{setLoad(false)}};
  const logout=()=>{ct();setUser(null);setProf(null);setMyA([]);setMyO([]);setMyS([]);go("home")};
 
  const publish=async f=>{if(!user){go("auth");return}setLoad(true);try{await api("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...f,status:"active"})});tw("Annonce publiée !");await loadA();await loadMy(user.id);go("dashboard");setDtab("annonces")}catch(e){tw("Erreur : "+e.message,"error")}finally{setLoad(false)}};
  const toggleA=async(id,status)=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});await loadMy(user.id);await loadA()}catch(e){}};
  const deleteA=async id=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});await loadMy(user.id);await loadA()}catch(e){}};
  const placeOrder=async(a,sm)=>{if(!user){go("auth");return false}setLoad(true);try{const c=parseFloat((a.price*.08).toFixed(2)),g=parseFloat((a.price-c).toFixed(2));await api("commandes",{method:"POST",body:JSON.stringify({annonce_id:a.id,buyer_id:user.id,seller_id:a.user_id,price:a.price,commission:c,gain:g,shipping_method:sm,status:"en attente"})});await api(`annonces?id=eq.${a.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});tw("Commande confirmée !");await loadA();await loadMy(user.id);return true}catch(e){tw("Erreur","error");return false}finally{setLoad(false)}};
 
  const fil=ann.filter(a=>fcat==="Tous"||a.category===fcat||a.sub_category===fcat).filter(a=>fst==="Tous"||a.state===fst).filter(a=>!fpr.min||a.price>=parseFloat(fpr.min)).filter(a=>!fpr.max||a.price<=parseFloat(fpr.max)).filter(a=>!srch||a.title?.toLowerCase().includes(srch.toLowerCase())||a.brand?.toLowerCase().includes(srch.toLowerCase()));
  const wal=Math.round(myS.reduce((acc,s)=>acc+(s.gain||0),0)*100)/100;
  const p={user,prof,load,tw,go,login,register,logout,publish,toggleA,deleteA,placeOrder,myA,myO,myS,wal,dtab,setDtab,ann:fil,allAnn:ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,sel,loadMy,lang,setLang,favs,setFavs};
  return<div>{toast&&<Toast {...toast}/>}{sc==="home"&&<Home {...p}/>}{sc==="auth"&&<Auth {...p}/>}{sc==="sell"&&<Sell {...p}/>}{sc==="article"&&<Article {...p}/>}{sc==="dashboard"&&<Dash {...p}/>}</div>;
}
 
// ═══ HOME ═══
function Home({user,prof,ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,go,lang,setLang,favs,setFavs}){

  return<div style={{minHeight:"100vh",background:C.w}}>
    <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:C.w,borderBottom:`1px solid ${sc?C.f200:"transparent"}`,transition:"border .3s",padding:"0 20px"}}>
      <div style={{maxWidth:1200,margin:"0 auto",height:58,display:"flex",alignItems:"center",gap:12}}>

        <div style={{flex:1,maxWidth:360,position:"relative",margin:"0 12px"}} className="hm">
          <div style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.f400}}><Ico.search/></div>
          <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder={lang==="FR"?"Raquette, marque…":"Racket, brand…"} style={{width:"100%",padding:"8px 14px 8px 34px",borderRadius:100,border:`1.5px solid ${C.f200}`,fontSize:13,outline:"none",background:C.f50,boxSizing:"border-box"}}/>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          <div style={{display:"flex",background:C.f100,borderRadius:100,overflow:"hidden",border:`1px solid ${C.f200}`}} className="hm">
            {["FR","EN"].map(l=><button key={l} onClick={()=>setLang(l)} style={{padding:"5px 12px",fontSize:12,fontWeight:700,border:"none",cursor:"pointer",background:lang===l?C.g:"transparent",color:lang===l?C.w:C.f400,borderRadius:100}}>{l}</button>)}
          </div>
          {user?<>
            <button onClick={()=>go("sell")} className="btn hm" style={{background:C.o,color:C.w,border:"none",borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> {lang==="FR"?"Vendre":"Sell"}</button>
            <button onClick={()=>go("dashboard")} className="btn" style={{width:36,height:36,borderRadius:"50%",background:C.g,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:C.w,fontWeight:700,fontSize:14}}>{fn.charAt(0).toUpperCase()}</button>
          </>:<>
            <button onClick={()=>go("auth")} className="btn hm" style={{background:"transparent",color:C.k,border:`1.5px solid ${C.f200}`,borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{lang==="FR"?"Connexion":"Login"}</button>
            <button onClick={()=>go("auth")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"8px 18px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{lang==="FR"?"S'inscrire":"Sign up"}</button>
          </>}
          <button onClick={()=>setMob(!mob)} className="btn" style={{background:C.f100,border:"none",borderRadius:10,padding:"8px",cursor:"pointer",display:"flex"}}><Ico.menu/></button>
        </div>
      </div>
      <div style={{maxWidth:1200,margin:"0 auto",borderTop:`1px solid ${C.f100}`,display:"flex",overflowX:"auto"}} className="hm">
        <button onClick={()=>setFcat("Tous")} style={{padding:"9px 14px",fontSize:13,fontWeight:fcat==="Tous"?700:500,color:fcat==="Tous"?C.g:C.f600,border:"none",borderBottom:`2px solid ${fcat==="Tous"?C.g:"transparent"}`,background:"transparent",cursor:"pointer",whiteSpace:"nowrap"}}>Tous</button>
        {SPORTS.map(s=><button key={s} onClick={()=>setFcat(s)} style={{padding:"9px 14px",fontSize:13,fontWeight:fcat===s?700:500,color:fcat===s?C.g:C.f600,border:"none",borderBottom:`2px solid ${fcat===s?C.g:"transparent"}`,background:"transparent",cursor:"pointer",whiteSpace:"nowrap"}}>{CAT_TREE[s].icon} {s}</button>)}
      </div>
      {mob&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"16px 20px",boxShadow:"0 8px 24px rgba(0,0,0,.08)"}}>
        <div style={{position:"relative",marginBottom:12}}><div style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.f400}}><Ico.search/></div><input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Raquette, marque…" style={{width:"100%",padding:"10px 14px 10px 34px",borderRadius:100,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",background:C.f50,boxSizing:"border-box"}}/></div>
        {!user&&<div style={{display:"flex",gap:8,marginBottom:12}}><button onClick={()=>{go("auth");setMob(false)}} style={{flex:1,background:C.f100,color:C.k,border:`1.5px solid ${C.f200}`,borderRadius:100,padding:"10px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Connexion</button><button onClick={()=>{go("auth");setMob(false)}} style={{flex:1,background:C.g,color:C.w,border:"none",borderRadius:100,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer"}}>S'inscrire</button></div>}
        {user&&<div style={{display:"flex",gap:8,marginBottom:12}}><button onClick={()=>{go("sell");setMob(false)}} style={{flex:1,background:C.o,color:C.w,border:"none",borderRadius:100,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><Ico.plus/> Vendre</button><button onClick={()=>{go("dashboard");setMob(false)}} style={{flex:1,background:C.f100,color:C.k,border:`1.5px solid ${C.f200}`,borderRadius:100,padding:"10px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Mon compte</button></div>}
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>{SPORTS.map(s=><button key={s} onClick={()=>{setFcat(s);setMob(false)}} style={{padding:"7px 13px",fontSize:12,fontWeight:500,color:fcat===s?C.w:C.f600,border:`1.5px solid ${fcat===s?C.g:C.f200}`,background:fcat===s?C.g:"transparent",borderRadius:100,cursor:"pointer"}}>{CAT_TREE[s].icon} {s}</button>)}</div>
      </div>}
    </nav>
 
    {/* HERO */}
    <div className="hp" style={{background:C.g,minHeight:"88vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"110px 24px 68px",textAlign:"center",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,opacity:.04,backgroundImage:"radial-gradient(circle,white 1px,transparent 1px)",backgroundSize:"48px 48px"}}/>

      <h1 className="fu ht" style={{animationDelay:".1s",fontSize:64,fontWeight:900,color:C.w,lineHeight:1.06,letterSpacing:"-2px",maxWidth:740,margin:"0 0 18px"}}>
        {lang==="FR"?"La seconde main pour les":"The second-hand for"}<br/>
        <span style={{color:C.ga}}>{lang==="FR"?"sports de raquette":"racket sports"}</span>
      </h1>
      <p className="fu" style={{animationDelay:".15s",fontSize:16,color:"rgba(255,255,255,.6)",maxWidth:460,lineHeight:1.7,margin:"0 0 36px"}}>
        {lang==="FR"?"Achetez et vendez raquettes, chaussures, vêtements et accessoires. Simple, sécurisé, éco-responsable.":"Buy and sell rackets, shoes, clothes and accessories. Simple, secure, eco-friendly."}
      </p>
      <div className="fu" style={{animationDelay:".2s",display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
        <button onClick={()=>go("auth")} className="btn" style={{background:C.w,color:C.k,border:"none",borderRadius:100,padding:"14px 30px",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:7}}>{lang==="FR"?"Commencer gratuitement":"Get started free"} <Ico.arr/></button>
        <button onClick={()=>{window.scrollTo({top:700,behavior:"smooth"})}} className="btn" style={{background:"transparent",color:C.w,border:"1.5px solid rgba(255,255,255,.3)",borderRadius:100,padding:"14px 30px",fontSize:15,fontWeight:600,cursor:"pointer"}}>{lang==="FR"?"Voir les annonces":"Browse listings"}</button>
      </div>
      {/* SMASHD DROP badge hero */}
      <div className="fu" style={{animationDelay:".25s",marginTop:32,display:"inline-flex",alignItems:"center",gap:8,background:"rgba(0,196,106,.1)",border:"1px solid rgba(0,196,106,.2)",borderRadius:100,padding:"8px 18px"}}>
        <Ico.drop/><span style={{fontSize:13,color:C.ga,fontWeight:700}}>SMASHD Drop — Livraison communautaire gratuite</span>
      </div>
      <div className="fu" style={{animationDelay:".3s",display:"flex",gap:40,marginTop:44,paddingTop:36,borderTop:"1px solid rgba(255,255,255,.1)",flexWrap:"wrap",justifyContent:"center"}}>
        {[["4 200+",lang==="FR"?"articles en ligne":"items online"],["1 800+",lang==="FR"?"vendeurs actifs":"active sellers"],["98%",lang==="FR"?"avis positifs":"positive reviews"],["0€",lang==="FR"?"de frais de livraison":"delivery fees"]].map(([v,l])=><div key={l} style={{textAlign:"center"}}><div style={{fontSize:24,fontWeight:900,color:C.w,letterSpacing:"-1px"}}>{v}</div><div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginTop:3}}>{l}</div></div>)}
      </div>
    </div>
 
    {/* SMASHD DROP BANNER */}
    <div style={{background:C.k,padding:"28px 20px"}}>
      <div style={{maxWidth:960,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:20}} className="g1m">
        {[["📍","Point de rencontre","Choisissez un lieu public. Un code unique sécurise la remise."],["🏆","Club partenaire","Déposez chez un club SMASHD. L'acheteur vient quand il veut."],["📦","Boîte / Consigne","Adresse partagée après achat. Simple et sans contrainte."]].map(([icon,t,d])=><div key={t} style={{display:"flex",gap:12,alignItems:"flex-start"}}>

          <div><div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:3}}>{t}</div><div style={{fontSize:12,color:"rgba(255,255,255,.4)",lineHeight:1.6}}>{d}</div></div>
        </div>)}
      </div>
    </div>

      {SPORTS.map(s=><button key={s} onClick={()=>setFcat(s)} style={{padding:"7px 14px",fontSize:12,fontWeight:fcat===s?700:500,color:fcat===s?C.w:C.f600,border:`1.5px solid ${fcat===s?C.g:C.f200}`,background:fcat===s?C.g:"transparent",borderRadius:100,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{CAT_TREE[s].icon} {s}</button>)}
    </div>
 
    {/* GRID */}
    <div style={{padding:"16px 20px 80px",maxWidth:1200,margin:"0 auto"}}>
      {ann.length===0?<div style={{textAlign:"center",padding:"72px 0"}}>

        <div style={{fontSize:14,color:C.f400,marginBottom:24}}>Soyez le premier à vendre sur SMASHD</div>
        {user&&<button onClick={()=>go("sell")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"12px 26px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Publier une annonce</button>}
      </div>:<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:14}}>
        {ann.map(a=><div key={a.id} className="card" onClick={()=>go("article",a)} style={{background:C.w,borderRadius:16,overflow:"hidden",cursor:"pointer",border:`1px solid ${C.f200}`}}>
          <div style={{background:C.f100,height:170,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
            {a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:44,height:44,background:CBG[a.category]||C.g,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{CAT_TREE[a.category]?.icon||"🏅"}</div>}
            <button onClick={e=>{e.stopPropagation();setFavs(f=>({...f,[a.id]:!f[a.id]}))}} style={{position:"absolute",top:10,right:10,width:30,height:30,borderRadius:"50%",background:C.w,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:favs[a.id]?C.o:C.f400}}>{Ico.heart(favs[a.id])}</button>
            {a.brand&&<div style={{position:"absolute",bottom:8,left:8,background:"rgba(0,0,0,.65)",color:C.w,fontSize:11,fontWeight:700,borderRadius:6,padding:"3px 8px"}}>{a.brand}</div>}
            <div style={{position:"absolute",top:8,left:8,background:"rgba(10,42,30,.85)",color:C.ga,fontSize:9,fontWeight:700,borderRadius:6,padding:"2px 7px",display:"flex",alignItems:"center",gap:3}}><Ico.drop/><span>Drop</span></div>
          </div>
          <div style={{padding:"12px 14px"}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:5}}><Tag state={a.state}/>{a.sub_category&&<span style={{fontSize:10,fontWeight:600,color:C.f400}}>· {a.sub_category}</span>}</div>
            <div style={{fontSize:14,fontWeight:700,margin:"4px 0 3px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
            <div style={{fontSize:12,color:C.f400,marginBottom:10}}>{a.category}</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:20,fontWeight:900,letterSpacing:"-0.5px"}}>{a.price} €</span>
              <div style={{width:30,height:30,borderRadius:"50%",background:C.g,display:"flex",alignItems:"center",justifyContent:"center",color:C.w}}><Ico.arr/></div>
            </div>
          </div>
        </div>)}
      </div>}
    </div>
 
    {/* TRUST */}
    <div style={{background:C.f50,borderTop:`1px solid ${C.f200}`,padding:"56px 20px"}}>
      <div style={{maxWidth:960,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:36}}>
        {[[<Ico.shld/>,"Paiement sécurisé","Transactions protégées et chiffrées."],[<Ico.drop/>,"SMASHD Drop","Livraison communautaire 100% gratuite."],[<Ico.leaf/>,"Éco-responsable","Seconde vie à vos équipements."],[<Ico.chk/>,"Vendeurs vérifiés","Avis authentiques et profils contrôlés."]].map(([icon,t,d],i)=><div key={i}><div style={{width:38,height:38,background:C.gl,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",color:C.g,marginBottom:12}}>{icon}</div><div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{t}</div><div style={{fontSize:13,color:C.f600,lineHeight:1.6}}>{d}</div></div>)}
      </div>
    </div>
 
    <footer style={{background:C.k,color:C.w,padding:"44px 20px 32px"}}>
      <div style={{maxWidth:1200,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:28,marginBottom:36}}>

  const[err,setErr]=useState({});
  const v0=()=>{const e={};if(!email||!/\S+@\S+\.\S+/.test(email))e.email="Email invalide";if(!pwd||pwd.length<6)e.pwd="6 caractères minimum";if(mode==="register"&&pwd!==pwd2)e.pwd2="Mots de passe différents";setErr(e);return!Object.keys(e).length};

        <div style={{display:"flex",gap:6,marginBottom:24,background:C.f100,borderRadius:12,padding:4}}>{[["login","Connexion"],["register","S'inscrire"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?C.w:"transparent",color:mode===m?C.k:C.f400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}</div>

        {mode==="register"&&<><h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Créer un compte</h2><p style={{fontSize:13,color:C.f400,marginBottom:18}}>Rejoignez la communauté SMASHD</p><div style={{display:"flex",gap:6,marginBottom:18}}>{[["particulier","Particulier"],["pro","Vendeur Pro"]].map(([id,l])=><button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?C.g:C.f100,color:ut===id?C.w:C.f600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{l}</button>)}</div>{ut==="pro"&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:12,color:C.g,marginBottom:16,fontWeight:500}}>Abonnement 99€/an — Invendus + espace publicitaire</div>}<div style={{display:"flex",gap:4,marginBottom:20}}>{["Compte","Profil"].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>i?C.g:step===i?C.ga:C.f200,transition:"background .3s"}}/>)}</div>{step===0&&<><div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Email *</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.email?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.email&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.email}</div>}</div><div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Mot de passe *</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.pwd?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.pwd&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.pwd}</div>}</div><div style={{marginBottom:22}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Confirmer *</label><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.pwd2?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.pwd2&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.pwd2}</div>}</div><button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Continuer →</button></>}{step===1&&<><div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>{ut==="pro"?"Nom du responsable *":"Nom complet *"}</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Jean Dupont" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.name?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.name&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.name}</div>}</div>{ut==="pro"&&<><div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>SIRET *</label><input value={siret} onChange={e=>setSiret(e.target.value)} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.siret?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>{err.siret&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.siret}</div>}</div><div style={{marginBottom:14}}><label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Nom commercial</label><input value={company} onChange={e=>setCompany(e.target.value)} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/></div></>}<div style={{marginBottom:18}}><label style={{display:"flex",alignItems:"flex-start",gap:9,cursor:"pointer",fontSize:13,color:C.f600}}><input type="checkbox" checked={cgv} onChange={e=>setCgv(e.target.checked)} style={{marginTop:3,accentColor:C.g}}/><span>J'accepte les <span style={{color:C.g,fontWeight:600}}>CGV</span> et la <span style={{color:C.g,fontWeight:600}}>Politique de confidentialité</span></span></label>{err.cgv&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.cgv}</div>}</div><div style={{display:"flex",gap:8}}><button onClick={()=>setStep(0)} style={{flex:1,background:C.f100,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Retour</button><button onClick={doReg} disabled={load} className="btn" style={{flex:2,background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"Création…":ut==="pro"?"Créer compte Pro":"Créer mon compte"}</button></div></>}

      </div>

// ═══ SELL — avec SMASHD Drop intégré à l'étape 5 ═══
function Sell({publish,load,go}){
  const[step,setStep]=useState(0);
  const[sport,setSport]=useState("");
  const[subCat,setSubCat]=useState("");
  const[attrs,setAttrs]=useState({});
  const[title,setTitle]=useState("");
  const[desc,setDesc]=useState("");
  const[price,setPrice]=useState("");
  const[state,setState]=useState("");
  const[photos,setPhotos]=useState([]);
  const[up,setUp]=useState(false);
  const[dropInfo,setDropInfo]=useState(null); // résultat SMASHD Drop
  const[showDrop,setShowDrop]=useState(false);
  const ref=useRef();
 
  const setAttr=(k,v)=>setAttrs(a=>({...a,[k]:v}));
  const comm=price?(price*.08).toFixed(2):0;
  const gain=price?(price*.92).toFixed(2):0;
  const sportData=sport?CAT_TREE[sport]:null;
  const subData=subCat&&sportData?sportData.subs[subCat]:null;
  const subCats=sportData?Object.keys(sportData.subs):[];
  const attrsComplete=()=>{if(!subData)return false;return subData.fields.every(f=>attrs[f.key])};
  const STEPS=["Sport","Type","Photos","Détails","Annonce","Livraison","Vérif."];
 
  const handleUp=async e=>{const fs=Array.from(e.target.files);if(photos.length+fs.length>8)return;setUp(true);try{const urls=await Promise.all(fs.map(f=>uploadPhoto(f)));setPhotos(p=>[...p,...urls])}catch(e){alert("Erreur upload")}finally{setUp(false)}};
 
  const canNext=()=>{
    if(step===0)return sport;
    if(step===1)return subCat;
    if(step===2)return photos.length>0;
    if(step===3)return attrsComplete()&&state;
    if(step===4)return title&&price>0;
    if(step===5)return !!dropInfo; // livraison obligatoire
    return true;
  };
 
  const doPublish=()=>{
    publish({
      title,description:desc,
      category:sport,sub_category:subCat,
      brand:attrs.brand||"",
      state,price:parseFloat(price),
      shipping:dropInfo?.mode||"drop",
      photo_url:photos[0]||null,photos,
      attributes:JSON.stringify(attrs),
      drop_info:JSON.stringify(dropInfo),
    });
  };
 
  return<div style={{minHeight:"100vh",background:C.w}}>
    {showDrop&&<SmashdDrop
      onClose={()=>setShowDrop(false)}
      onConfirm={info=>{setDropInfo(info);setShowDrop(false)}}
      articleTitle={title}
    />}
 
    <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>step>0?setStep(s=>s-1):go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><Ico.chL/> Retour</button>
      <Logo s={18}/>
      <div style={{flex:1,display:"flex",justifyContent:"center",gap:4,overflowX:"auto",padding:"0 8px"}} className="hm">
        {STEPS.map((s,i)=><React.Fragment key={s}>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:i<step?C.g:i===step?C.k:C.f100,color:i<=step?C.w:C.f400,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{i<step?<Ico.chk/>:i+1}</div>
            <span style={{fontSize:11,color:i===step?C.k:C.f400,fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{s}</span>
          </div>
          {i<STEPS.length-1&&<div style={{width:12,height:1,background:i<step?C.g:C.f200,flexShrink:0}}/>}
        </React.Fragment>)}
      </div>
      <span style={{fontSize:12,color:C.f400,fontWeight:500,flexShrink:0}}>{step+1}/{STEPS.length}</span>
    </nav>
 
    <div style={{maxWidth:600,margin:"0 auto",padding:"36px 20px"}}>
 
      {step===0&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Quel sport ?</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Sélectionnez le sport de l'article que vous vendez.</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {SPORTS.map(s=><button key={s} onClick={()=>{setSport(s);setSubCat("");setAttrs({})}} className="btn" style={{background:sport===s?C.g:C.f50,border:`1.5px solid ${sport===s?C.g:C.f200}`,borderRadius:14,padding:"18px 12px",cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
            <div style={{fontSize:28,marginBottom:6}}>{CAT_TREE[s].icon}</div>
            <div style={{fontSize:13,fontWeight:700,color:sport===s?C.w:C.k,lineHeight:1.2}}>{s}</div>
          </button>)}
        </div>
      </div>}
 
      {step===1&&sport&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Quel type d'article ?</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Sport : <strong>{CAT_TREE[sport].icon} {sport}</strong></p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
          {subCats.map(s=><button key={s} onClick={()=>setSubCat(s)} className="btn" style={{background:subCat===s?C.g:C.f50,border:`1.5px solid ${subCat===s?C.g:C.f200}`,borderRadius:14,padding:"20px 16px",cursor:"pointer",textAlign:"left",transition:"all .15s"}}>
            <div style={{fontSize:15,fontWeight:700,color:subCat===s?C.w:C.k}}>{s}</div>
            <div style={{fontSize:12,color:subCat===s?"rgba(255,255,255,.6)":C.f400,marginTop:4}}>{sportData.subs[s].fields.length} caractéristiques</div>
          </button>)}
        </div>
      </div>}
 
      {step===2&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Photos de l'article</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}>Jusqu'à 8 photos. La première sera la principale.</p>
        <div onClick={()=>!up&&ref.current.click()} style={{border:`2px dashed ${C.f200}`,borderRadius:16,padding:"36px",textAlign:"center",cursor:"pointer",background:C.f50,marginBottom:14}}>
          <div style={{width:44,height:44,background:C.g,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px",color:C.w}}><Ico.plus/></div>
          <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>{up?"Upload en cours…":"Ajouter des photos"}</div>
          <div style={{fontSize:12,color:C.f400}}>JPG, PNG — Max 8 photos</div>
          <input ref={ref} type="file" accept="image/*" multiple onChange={handleUp} style={{display:"none"}}/>
        </div>
        {photos.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {photos.map((url,i)=><div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:10,overflow:"hidden",border:`2px solid ${i===0?C.g:C.f200}`}}>
            <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            {i===0&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:C.g,color:C.w,fontSize:9,fontWeight:700,padding:"3px",textAlign:"center"}}>PRINCIPALE</div>}
            <button onClick={()=>setPhotos(p=>p.filter((_,j)=>j!==i))} style={{position:"absolute",top:4,right:4,width:20,height:20,background:"rgba(0,0,0,.65)",color:C.w,border:"none",borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico.x/></button>
          </div>)}
          {photos.length<8&&<div onClick={()=>ref.current.click()} style={{aspectRatio:"1",borderRadius:10,border:`2px dashed ${C.f200}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:20,color:C.f400,background:C.f50}}>+</div>}
        </div>}
      </div>}
 
      {step===3&&subData&&<div>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Caractéristiques</h2>
        <p style={{color:C.f400,fontSize:14,marginBottom:24}}><strong>{CAT_TREE[sport].icon} {sport}</strong> › <strong>{subCat}</strong></p>
        <div style={{marginBottom:22}}>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>État *</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>{STATES.map(s=><Pill key={s} l={s} a={state===s} onClick={()=>setState(s)}/>)}</div>
        </div>
        {subData.fields.map(field=><div key={field.key} style={{marginBottom:22}}>
          <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>

          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>{field.opts.map(opt=><Pill key={opt} l={opt} a={attrs[field.key]===opt} onClick={()=>setAttr(field.key,opt)}/>)}</div>
        </div>)}
      </div>}
 
      {step===4&&<div style={{display:"flex",flexDirection:"column",gap:18}}>
        <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",margin:0}}>L'annonce</h2>
        <p style={{color:C.f400,fontSize:14,margin:0}}>Donnez un titre accrocheur et fixez votre prix.</p>
        <div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Titre *</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder={`Ex: ${attrs.brand||"Wilson"} ${subCat} — ${state||"Très bon état"}`} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:15,outline:"none",boxSizing:"border-box"}}/></div>
        <div><label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:C.f400}}>Description</label><textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={4} placeholder="Décrivez votre article…" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,resize:"vertical",boxSizing:"border-box",outline:"none"}}/></div>

              <div style={{fontSize:34,fontWeight:900,letterSpacing:"-2px",marginBottom:4}}>{wal.toFixed(2)} €</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:18}}>Solde disponible</div>
              <button onClick={()=>setDtab("wallet")} style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Gérer mon wallet</button>
            </div>
          </div>
        </div>}
        {dtab==="annonces"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px"}}>Mes annonces</h2>
            <button onClick={()=>go("sell")} className="btn" style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Nouvelle</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myA.map(a=>{
              let di={};try{if(a.drop_info)di=JSON.parse(a.drop_info)}catch(e){}
              return<div key={a.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:52,height:52,borderRadius:9,overflow:"hidden",background:C.f100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:CAT_TREE[a.category]?.icon||"🏅"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                  <div style={{fontSize:12,color:C.f400,marginTop:1}}>{a.category}{a.sub_category?` › ${a.sub_category}`:""} · {a.price} €</div>
                  {di.code&&<div style={{fontSize:11,color:C.ga,fontWeight:700,marginTop:2,fontFamily:"monospace",letterSpacing:1}}>{DROP_MODES[di.mode]?.icon} {di.code}</div>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                  <div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:a.status==="pause"?C.o:C.f400,textTransform:"uppercase",background:a.status==="active"?C.gl:a.status==="pause"?"#FFF3E0":C.f100,padding:"4px 9px",borderRadius:100}}>{a.status==="active"?"En ligne":a.status==="pause"?"Pause":"Vendu"}</div>
                  {a.status!=="vendu"&&a.status!=="supprimé"&&<>
                    <button onClick={()=>toggleA(a.id,a.status==="pause"?"active":"pause")} style={{background:C.f100,color:C.k,border:"none",borderRadius:7,padding:"5px 9px",fontSize:11,cursor:"pointer",fontWeight:600}}>{a.status==="pause"?"Activer":"Pause"}</button>
                    <button onClick={()=>deleteA(a.id)} style={{background:C.f100,color:C.f400,border:"none",borderRadius:7,padding:"5px 7px",fontSize:11,cursor:"pointer"}}>Suppr.</button>
                  </>}
                </div>
              </div>
            })}
            {myA.length===0&&<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucune annonce. <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("sell")}>Publiez votre premier article</span></div>}
          </div>
        </div>}
        {dtab==="ventes"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Mes ventes</h2>
          {myS.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucune vente pour l'instant.</div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {myS.map(v=><div key={v.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}><div><div style={{fontSize:14,fontWeight:700}}>#{v.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:10,fontWeight:700,color:v.status==="livré"?C.g:C.o,textTransform:"uppercase"}}>{v.status}</div></div><div style={{display:"flex",gap:18,fontSize:13,flexWrap:"wrap"}}><span><span style={{color:C.f400}}>Prix : </span><strong>{v.price} €</strong></span><span><span style={{color:C.f400}}>Net : </span><strong style={{color:C.g}}>{v.gain} €</strong></span></div></div>)}
          </div>}
        </div>}
        {dtab==="achats"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Mes achats</h2>
          {myO.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucun achat. <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>Explorer le catalogue</span></div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>{myO.map(o=><div key={o.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"14px 18px"}}><div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{fontSize:14,fontWeight:700}}>#{o.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</div></div><div style={{fontSize:10,fontWeight:700,color:o.status==="livré"?C.g:C.o,textTransform:"uppercase"}}>{o.status}</div></div><div style={{fontSize:14,fontWeight:700,marginTop:8}}>{o.price} € · SMASHD Drop</div></div>)}</div>}
        </div>}
        {dtab==="wallet"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>E-Wallet</h2>
          <div style={{background:C.g,borderRadius:16,padding:"26px 28px",marginBottom:16,color:C.w}}><div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:5}}>Solde disponible</div><div style={{fontSize:44,fontWeight:900,letterSpacing:"-2px",marginBottom:18}}>{wal.toFixed(2)} €</div><button className="btn" style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Retirer les fonds</button></div>
        </div>}
        {dtab==="settings"&&<div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Paramètres</h2>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[["Informations personnelles","Nom, email, téléphone"],["Sécurité","Mot de passe, 2FA"],["Moyens de paiement","Carte, IBAN"],["Notifications","Email, push, SMS"],["Langue","Français / English"],["Supprimer mon compte","Irréversible"]].map(([t,s],i)=><div key={t} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}><div><div style={{fontSize:14,fontWeight:600,color:i===5?C.r:C.k}}>{t}</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>{s}</div></div><Ico.chR/></div>)}
            <div onClick={logout} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}><div><div style={{fontSize:14,fontWeight:600,color:C.r}}>Déconnexion</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>Se déconnecter de SMASHD</div></div><Ico.chR/></div>
          </div>
        </div>}
      </div>
    </div>
  </div>;
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
