*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0A0A0A;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes checkDraw{from{stroke-dashoffset:50}to{stroke-dashoffset:0}}
.fu{animation:fu .4s ease forwards}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.btn{transition:all .15s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
/* DROP */
.drop-overlay{position:fixed;inset:0;background:rgba(10,10,10,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px;animation:fu .2s ease}
.drop-modal{background:#fff;border-radius:24px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 32px 80px rgba(0,0,0,.25)}
.drop-header{background:#0A2A1E;border-radius:24px 24px 0 0;padding:28px 28px 24px;position:relative;overflow:hidden}
.drop-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0%,rgba(0,196,106,.15),transparent 60%)}
.drop-header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,196,106,.15);border:1px solid rgba(0,196,106,.25);border-radius:100px;padding:4px 12px;font-size:11px;font-weight:700;color:#00C46A;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px}
.drop-header h2{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1.15;margin-bottom:6px}
.drop-header p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}
.drop-close{position:absolute;top:18px;right:18px;width:32px;height:32px;background:rgba(255,255,255,.1);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:14px;transition:background .15s}
.drop-close:hover{background:rgba(255,255,255,.2)}
.drop-body{padding:22px 26px 26px}
.drop-group{margin-bottom:15px}
.drop-label{font-size:11px;font-weight:700;color:#9A9A9A;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px}
.drop-input{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid #E8E8E8;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;background:#fff;box-sizing:border-box}
.drop-input:focus{border-color:#0A2A1E}
.mode-card{border:2px solid #E8E8E8;border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;background:#fff;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.mode-card:hover{border-color:#9A9A9A}
.mode-card.selected{border-color:#0A2A1E;background:#F0F7F4}
.mode-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mode-radio{width:20px;height:20px;border-radius:50%;border:2px solid #E8E8E8;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mode-radio.sel{border-color:#0A2A1E;background:#0A2A1E}
.btn-drop-primary{width:100%;background:#0A2A1E;color:#fff;border:none;border-radius:100px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-drop-primary:hover{background:#0d3a26}
.btn-drop-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-drop-secondary{width:100%;background:#F5F5F5;color:#0A0A0A;border:none;border-radius:100px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s;font-family:'Inter',sans-serif}
.status-badge{font-size:11px;font-weight:700;border-radius:100px;padding:4px 10px;white-space:nowrap}
.msg-bubble-me{background:#0A2A1E;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;align-self:flex-end;max-width:85%}
.msg-bubble-other{background:#F5F5F5;color:#0A0A0A;border-radius:10px;padding:8px 12px;font-size:13px;align-self:flex-start;max-width:85%}

.bottom-nav{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  background:#fff;

  padding:6px 0 calc(6px + env(safe-area-inset-bottom));

/* ── Touch targets ── */
@media(max-width:640px){
  button,a,[role="button"]{min-height:44px}
  input,textarea,select{font-size:16px!important} /* évite le zoom iOS */
}
 
/* ── Cards mobile ── */
@media(max-width:640px){
  .card:hover{transform:none!important;box-shadow:none!important}
}
 
/* ── Sell form mobile ── */
@media(max-width:640px){
  .sell-form{padding:16px!important}

}
 
/* ── Textes tronqués ── */
.truncate{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
        (function(){
          function loadAndInit(){
            if(window.THREE){ initRubiks(); return; }
            var s=document.createElement('script');
            s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            s.onload=function(){ initRubiks(); };
            document.head.appendChild(s);
          }
          function initRubiks(){
            const canvas=document.getElementById('heroRubiks');
            if(!canvas||!window.THREE)return;
            const container=canvas.parentElement;
            const SIZE=Math.min(420, container ? container.offsetWidth-20 : window.innerWidth/2-40);
            if(SIZE<100){ setTimeout(()=>initRubiks(),500); return; } // pas encore rendu
            const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
            renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
            renderer.setSize(SIZE,SIZE);
            const scene=new THREE.Scene();
            const camera=new THREE.PerspectiveCamera(38,1,0.1,100);
            camera.position.set(5.8,4.8,6.8); camera.lookAt(0,0,0);
            scene.add(new THREE.AmbientLight(0xffffff,0.55));
            const dl=new THREE.DirectionalLight(0xffffff,1.1); dl.position.set(8,12,8); scene.add(dl);
            const dl2=new THREE.DirectionalLight(0x00ff66,0.25); dl2.position.set(-5,-3,5); scene.add(dl2);
 
            function makeTex(drawFn){
              const c=document.createElement('canvas'); c.width=c.height=256;
              const ctx=c.getContext('2d'); drawFn(ctx);
              return new THREE.CanvasTexture(c);
            }
            function baseBg(ctx,bg){ ctx.fillStyle=bg; ctx.fillRect(0,0,256,256); ctx.strokeStyle='rgba(0,196,106,0.22)'; ctx.lineWidth=3; ctx.strokeRect(4,4,248,248); }
            function drawIcon(ctx,drawFn,color){ ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=11; ctx.lineCap='round'; ctx.lineJoin='round'; drawFn(ctx,128,128); }
            function patDots(ctx,color){ ctx.fillStyle=color; for(let x=24;x<256;x+=26) for(let y=24;y<256;y+=26){ ctx.beginPath(); ctx.arc(x,y,1.8,0,Math.PI*2); ctx.fill(); } }
            function patLines(ctx,color){ ctx.strokeStyle=color; ctx.lineWidth=1.5; for(let i=-256;i<512;i+=22){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+256,256); ctx.stroke(); } }
            function patGrid(ctx,color){ ctx.strokeStyle=color; ctx.lineWidth=1; for(let i=20;i<256;i+=28){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,256); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(256,i); ctx.stroke(); } }
            function patCircles(ctx,color){ ctx.strokeStyle=color; ctx.lineWidth=1.2; for(let r=20;r<200;r+=28){ ctx.beginPath(); ctx.arc(128,128,r,0,Math.PI*2); ctx.stroke(); } }
 
            const ico={
              racket:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.rotate(-0.5); ctx.beginPath(); ctx.ellipse(0,-20,38,48,0,0,Math.PI*2); ctx.lineWidth=10; ctx.stroke(); for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(-35,i*12-20); ctx.lineTo(35,i*12-20); ctx.lineWidth=3.5; ctx.globalAlpha=0.45; ctx.stroke(); } ctx.globalAlpha=1; ctx.beginPath(); ctx.moveTo(0,28); ctx.lineTo(0,80); ctx.lineWidth=12; ctx.stroke(); ctx.restore(); },
              recycle:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); const r=52; for(let i=0;i<3;i++){ ctx.save(); ctx.rotate((i*2*Math.PI)/3); ctx.beginPath(); ctx.arc(0,-r,r*0.68,0.55,Math.PI*1.5); ctx.lineWidth=11; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r*0.52,-r*0.18); ctx.lineTo(-r*0.7,-r*0.52); ctx.lineTo(-r*0.28,-r*0.46); ctx.closePath(); ctx.fill(); ctx.restore(); } ctx.restore(); },
              heart:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy+8); ctx.beginPath(); ctx.moveTo(0,26); ctx.bezierCurveTo(-58,-8,-68,-68,0,-38); ctx.bezierCurveTo(68,-68,58,-8,0,26); ctx.closePath(); ctx.fill(); ctx.restore(); },
              shield:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy-4); ctx.beginPath(); ctx.moveTo(0,-56); ctx.lineTo(50,-28); ctx.lineTo(50,12); ctx.quadraticCurveTo(50,58,0,70); ctx.quadraticCurveTo(-50,58,-50,12); ctx.lineTo(-50,-28); ctx.closePath(); ctx.lineWidth=10; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-20,8); ctx.lineTo(-5,26); ctx.lineTo(24,-14); ctx.lineWidth=11; ctx.stroke(); ctx.restore(); },
              pin:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy-8); ctx.beginPath(); ctx.arc(0,-28,36,0,Math.PI*2); ctx.lineWidth=10; ctx.stroke(); ctx.beginPath(); ctx.arc(0,-28,12,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-16,6); ctx.lineTo(0,56); ctx.lineTo(16,6); ctx.lineWidth=10; ctx.stroke(); ctx.restore(); },
              leaf:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.moveTo(0,58); ctx.bezierCurveTo(-58,18,-68,-52,18,-60); ctx.bezierCurveTo(68,-60,68,8,0,58); ctx.closePath(); ctx.lineWidth=9; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,58); ctx.quadraticCurveTo(-8,-18,16,-58); ctx.lineWidth=6; ctx.globalAlpha=0.55; ctx.stroke(); ctx.globalAlpha=1; ctx.restore(); },
              euro:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.arc(0,0,52,0.65,Math.PI*2-0.65); ctx.lineWidth=11; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-28,-9); ctx.lineTo(14,-9); ctx.moveTo(-28,9); ctx.lineTo(14,9); ctx.lineWidth=11; ctx.stroke(); ctx.restore(); },
              star:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); for(let i=0;i<5;i++){ const a=i*Math.PI*2/5-Math.PI/2,b=a+Math.PI/5; ctx.lineTo(Math.cos(a)*56,Math.sin(a)*56); ctx.lineTo(Math.cos(b)*23,Math.sin(b)*23); } ctx.closePath(); ctx.fill(); ctx.restore(); },
              lock:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.rect(-34,0,68,56); ctx.lineWidth=10; ctx.stroke(); ctx.beginPath(); ctx.arc(0,-12,28,Math.PI,0); ctx.lineWidth=10; ctx.stroke(); ctx.beginPath(); ctx.arc(0,28,9,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(0,37); ctx.lineTo(0,44); ctx.lineWidth=8; ctx.stroke(); ctx.restore(); },
              trophy:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.moveTo(-34,-52); ctx.lineTo(-34,8); ctx.quadraticCurveTo(-34,46,0,52); ctx.quadraticCurveTo(34,46,34,8); ctx.lineTo(34,-52); ctx.closePath(); ctx.lineWidth=10; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-52,-36); ctx.quadraticCurveTo(-56,0,-34,10); ctx.lineWidth=9; ctx.stroke(); ctx.beginPath(); ctx.moveTo(52,-36); ctx.quadraticCurveTo(56,0,34,10); ctx.lineWidth=9; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-18,54); ctx.lineTo(18,54); ctx.lineWidth=10; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-30,64); ctx.lineTo(30,64); ctx.lineWidth=10; ctx.stroke(); ctx.restore(); },
              flash:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.moveTo(16,-62); ctx.lineTo(-18,4); ctx.lineTo(10,4); ctx.lineTo(-16,62); ctx.lineTo(24,-8); ctx.lineTo(0,-8); ctx.closePath(); ctx.fill(); ctx.restore(); },
              handshake:(ctx,cx,cy)=>{ ctx.save(); ctx.translate(cx,cy); ctx.beginPath(); ctx.moveTo(-60,10); ctx.lineTo(-22,10); ctx.lineTo(0,-14); ctx.lineTo(22,10); ctx.lineTo(60,10); ctx.lineWidth=11; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-22,10); ctx.lineTo(-22,50); ctx.moveTo(22,10); ctx.lineTo(22,50); ctx.lineWidth=9; ctx.stroke(); ctx.beginPath(); ctx.arc(-60,10,10,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(60,10,10,0,Math.PI*2); ctx.fill(); ctx.restore(); },
            };
 
            const faceData=[
              [1,1,1,4,'icon','racket','#0a1810','#00C46A'],
              [0,1,1,4,'icon','leaf','#0a1810','#00ff88'],
              [-1,1,1,4,'icon','star','#0c1808','#FFD700'],
              [1,0,1,4,'icon','recycle','#0a1810','#00C46A'],
              [0,0,1,4,'patD','','#0a1208','rgba(0,196,106,0.12)'],
              [-1,0,1,4,'icon','euro','#0a1810','#00C46A'],
              [1,-1,1,4,'icon','flash','#0a1810','#00ff88'],
              [0,-1,1,4,'patA','','#080f08','rgba(0,196,106,0.15)'],
              [-1,-1,1,4,'icon','lock','#0a1810','#00C46A'],
              [1,1,1,0,'icon','shield','#0a1810','#00C46A'],
              [1,0,1,0,'patB','','#080e08','rgba(0,196,106,0.1)'],
              [1,-1,1,0,'icon','heart','#0a1810','#ff6b8a'],
              [1,1,0,0,'icon','trophy','#0a1810','#FFD700'],
              [1,0,0,0,'patC','','#090f09','rgba(0,196,106,0.1)'],
              [1,-1,0,0,'icon','pin','#0a1810','#00ff88'],
              [1,1,-1,0,'icon','handshake','#0a1810','#00C46A'],
              [1,0,-1,0,'patA','','#080e08','rgba(0,196,106,0.12)'],
              [1,-1,-1,0,'icon','recycle','#0a1810','#00C46A'],
              [1,1,1,2,'patD','','#080e08','rgba(0,196,106,0.12)'],
              [0,1,1,2,'icon','racket','#0a1810','#00ff88'],
              [-1,1,1,2,'patB','','#090f09','rgba(0,196,106,0.1)'],
              [1,1,0,2,'icon','euro','#0a1810','#00C46A'],
              [0,1,0,2,'icon','leaf','#0a1810','#00C46A'],
              [-1,1,0,2,'patA','','#080e08','rgba(0,196,106,0.12)'],
              [1,1,-1,2,'icon','flash','#0a1810','#FFD700'],
              [0,1,-1,2,'patC','','#090f09','rgba(0,196,106,0.1)'],
              [-1,1,-1,2,'icon','star','#0a1810','#FFD700'],
            ];
 
            const faceMap={};
            faceData.forEach(([x,y,z,f,type,data,bg,color])=>{ faceMap[x+','+y+','+z+','+f]={type,data,bg,color}; });
 
            const texCache={};
            function getTex(key,x,y,z,f){
              if(texCache[key]) return texCache[key];
              const fd=faceMap[x+','+y+','+z+','+f];
              if(!fd) return null;
              const tex=makeTex(ctx=>{
                baseBg(ctx,fd.bg);
                if(fd.type==='icon') drawIcon(ctx,ico[fd.data],fd.color);
                else if(fd.type==='patA') patDots(ctx,fd.color);
                else if(fd.type==='patB') patLines(ctx,fd.color);
                else if(fd.type==='patC') patGrid(ctx,fd.color);
                else if(fd.type==='patD') patCircles(ctx,fd.color);
              });
              texCache[key]=tex; return tex;
            }
 
            const group=new THREE.Group(); scene.add(group);
            const gap=1.05;
            for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++){
              if(x===0&&y===0&&z===0) continue;
              const mats=[];
              const expMap=[x===1,x===-1,y===1,y===-1,z===1,z===-1];
              for(let f=0;f<6;f++){
                let color=0x080808,roughness=0.72,metalness=0.12,map=null;
                if(expMap[f]){
                  const key=x+','+y+','+z+','+f;
                  const fd=faceMap[key];
                  if(fd){ map=getTex(key,x,y,z,f); color=0x0d1a10; roughness=0.4; metalness=0.08; }
                  else{
                    const dk=key+'_def';

                }

              }
              const geo=new THREE.BoxGeometry(0.93,0.93,0.93);
              const mesh=new THREE.Mesh(geo,mats);
              mesh.position.set(x*gap,y*gap,z*gap); group.add(mesh);
              mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x000000})));
            }
 
            const sh=new THREE.Mesh(new THREE.CircleGeometry(2.4,64),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.4}));
            sh.rotation.x=-Math.PI/2; sh.position.y=-2.6; scene.add(sh);
            const ring=new THREE.Mesh(new THREE.RingGeometry(1.9,2.4,64),new THREE.MeshBasicMaterial({color:0x00C46A,transparent:true,opacity:0.07,side:THREE.DoubleSide}));
            ring.rotation.x=-Math.PI/2; ring.position.y=-2.55; scene.add(ring);
 
            let dragging=false,pvx=0,pvy=0,vx=0,vy=0;
            canvas.addEventListener('mousedown',e=>{dragging=true;pvx=e.clientX;pvy=e.clientY;canvas.style.cursor='grabbing';});
            window.addEventListener('mouseup',()=>{dragging=false;canvas.style.cursor='grab';});
            window.addEventListener('mousemove',e=>{if(!dragging)return;vx=(e.clientY-pvy)*0.009;vy=(e.clientX-pvx)*0.009;pvx=e.clientX;pvy=e.clientY;});
            canvas.addEventListener('touchstart',e=>{pvx=e.touches[0].clientX;pvy=e.touches[0].clientY;});
            canvas.addEventListener('touchmove',e=>{e.preventDefault();vx=(e.touches[0].clientY-pvy)*0.011;vy=(e.touches[0].clientX-pvx)*0.011;pvx=e.touches[0].clientX;pvy=e.touches[0].clientY;},{passive:false});
 
            let t=0,ph=0;
            function animate(){
              requestAnimationFrame(animate); t+=0.01; ph+=0.004;
              if(!dragging){ group.rotation.y+=0.007+Math.sin(ph*0.7)*0.003; group.rotation.x+=0.0025+Math.cos(ph*0.5)*0.0015; group.rotation.z+=Math.sin(ph*0.35)*0.0012; }
              else{ group.rotation.x+=vx; group.rotation.y+=vy; vx*=0.88; vy*=0.88; }
              group.position.y=Math.sin(t*0.55)*0.09;
              sh.material.opacity=0.32+Math.sin(t*0.55)*0.06; sh.scale.x=sh.scale.z=0.88+Math.sin(t*0.55)*0.06;
              ring.material.opacity=0.05+Math.sin(t*1.1)*0.03; ring.scale.x=ring.scale.z=1+Math.sin(t*0.75)*0.07;
              renderer.render(scene,camera);
            }
            animate();
          }
          // Attendre que React rende le canvas avec retry
          function tryInit(attempts){
            if(attempts<=0) return;
            const cv=document.getElementById('heroRubiks');
            if(cv){ loadAndInit(); }
            else{ setTimeout(()=>tryInit(attempts-1), 300); }
          }
          setTimeout(()=>tryInit(10), 200);
        })();
      
  </script>

function DropVendeurPanel({drops=[],creneaux=[],messages=[],annonces=[],user,tw,onRefresh}){
  const[sel,setSel]=useState(null);
  const[dates,setDates]=useState({});
  const[lieux,setLieux]=useState({});
  const[codeVal,setCodeVal]=useState("");
  const[codeErr,setCodeErr]=useState("");
  const[busy,setBusy]=useState(false);
 
  const getAnnonce=(drop)=>annonces.find(a=>a.id===drop.annonce_id);
 
  const proposer=async(drop)=>{
    const slots=[];
    for(let i=0;i<3;i++){
      if(dates[`${drop.id}_${i}`]&&lieux[`${drop.id}_${i}`])
        slots.push({remise_id:drop.id,date_heure:dates[`${drop.id}_${i}`],lieu_precis:lieux[`${drop.id}_${i}`]});
    }
    if(!slots.length){tw("Ajoutez au moins 1 créneau","error");return;}
    setBusy(true);
    try{
      await Promise.all(slots.map(s=>api("drop_creneaux",{method:"POST",body:JSON.stringify(s)})));
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({status:"creneaux_proposes",updated_at:new Date().toISOString()})});
      tw("Créneaux envoyés à l'acheteur !");
      // Notifier l'acheteur
      try{
        const remiseData=await api("drop_remises?id=eq."+drop.id);
        const acheteur=await api("profiles?id=eq."+remiseData[0]?.acheteur_id);
        if(acheteur[0]?.email){
          const annonce=annonces.find(a=>a.id===drop.annonce_id);
          sendNotif("creneaux_disponibles",acheteur[0].email,{titre:annonce?.title||"Article",nb_creneaux:slots.length});
        }
      }catch(e){}
      onRefresh();setSel(null);
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const validerCode=async(drop)=>{
    const code=codeVal.trim().toUpperCase();
    if(code!==drop.code){setCodeErr("Code incorrect");return;}
    setBusy(true);
    try{
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({status:"confirme",code_used:true,updated_at:new Date().toISOString()})});
      await api(`commandes?id=eq.${drop.commande_id}`,{method:"PATCH",body:JSON.stringify({status:"livré",escrow_status:"libéré",drop_status:"confirme"})});
      tw("🎉 Transaction validée ! Fonds débloqués dans votre wallet.");
      // Notifier le vendeur
      try{
        const vendeur=await api("profiles?id=eq."+user.id);
        if(vendeur[0]?.email){
          const annonce=annonces.find(a=>a.id===drop.annonce_id);
          sendNotif("transaction_validee",vendeur[0].email,{titre:annonce?.title||"Article",gain:annonce?.price||"—"});
        }
      }catch(e){}
      onRefresh();setCodeVal("");setCodeErr("");
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
  const pending=drops.filter(d=>d.status==="mode_choisi");
  const active=drops.filter(d=>["creneaux_proposes","creneau_accepte","code_envoye"].includes(d.status));
  const done=drops.filter(d=>["confirme","litige","expire"].includes(d.status));
 
 
  return(
    <div>
      <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Drop Vendeur</h2>
      <p style={{fontSize:14,color:"#9A9A9A",marginBottom:20}}>Gérez vos ventes et proposez des créneaux à vos acheteurs.</p>
      {drops.length===0
        ?<div style={{textAlign:"center",padding:"44px",color:"#9A9A9A",background:"#fff",borderRadius:13,border:"1px solid #E8E8E8"}}><div style={{fontSize:32,marginBottom:12}}>📦</div><div style={{fontWeight:600}}>Aucune vente en cours</div></div>
        :<div>
          {pending.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:"#C25A00",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
              ⚡ Action requise — Proposez des créneaux ({pending.length})
            </div>
            {pending.map(d=><DropVendeurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} sel={sel} setSel={setSel} dates={dates} setDates={setDates} lieux={lieux} setLieux={setLieux} codeVal={codeVal} setCodeVal={setCodeVal} codeErr={codeErr} setCodeErr={setCodeErr} busy={busy} validerCode={validerCode} proposer={proposer} api={api} tw={tw}/>)}
          </div>}
          {active.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:"#1A3A8C",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>📅 En cours ({active.length})</div>
            {active.map(d=><DropVendeurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} sel={sel} setSel={setSel} dates={dates} setDates={setDates} lieux={lieux} setLieux={setLieux} codeVal={codeVal} setCodeVal={setCodeVal} codeErr={codeErr} setCodeErr={setCodeErr} busy={busy} validerCode={validerCode} proposer={proposer} api={api} tw={tw}/>)}
          </div>}
          {done.length>0&&<div>
            <div style={{fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>✅ Terminés ({done.length})</div>

function DropAcheteurPanel({drops=[],creneaux=[],messages=[],annonces=[],user,tw,onRefresh}){
  const[sel,setSel]=useState(null);
  const[busy,setBusy]=useState(false);
 
  const getAnnonce=(drop)=>annonces.find(a=>a.id===drop.annonce_id);
 
  const accepter=async(drop,cr)=>{
    setBusy(true);
    try{
      await api(`drop_creneaux?id=eq.${cr.id}`,{method:"PATCH",body:JSON.stringify({status:"accepté"})});
      const autres=creneaux.filter(c=>c.remise_id===drop.id&&c.id!==cr.id);
      await Promise.all(autres.map(c=>api(`drop_creneaux?id=eq.${c.id}`,{method:"PATCH",body:JSON.stringify({status:"refusé"})})));
      const code=genCode();
      const expires=new Date(Date.now()+48*3600*1000).toISOString();
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({
        status:"code_envoye",creneau_retenu_id:cr.id,
        lieu_final:cr.lieu_precis,date_finale:cr.date_heure,
        code,code_expires_at:expires,updated_at:new Date().toISOString()
      })});
      tw("✅ RDV confirmé ! Votre code Drop est prêt.");
      // Notifier le vendeur
      try{
        const remiseData=await api("drop_remises?id=eq."+drop.id);
        const vendeur=await api("profiles?id=eq."+remiseData[0]?.vendeur_id);
        if(vendeur[0]?.email){
          const annonce=annonces.find(a=>a.id===drop.annonce_id);
          const dateStr=new Date(cr.date_heure).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
          sendNotif("creneau_accepte",vendeur[0].email,{titre:annonce?.title||"Article",date:dateStr,lieu:cr.lieu_precis});
        }
      }catch(e){}
      onRefresh();
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };
 
 
  return(
    <div>
      <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Drop Acheteur</h2>
      <p style={{fontSize:14,color:"#9A9A9A",marginBottom:20}}>Suivez vos achats et confirmez les remises.</p>
      {drops.length===0
        ?<div style={{textAlign:"center",padding:"44px",color:"#9A9A9A",background:"#fff",borderRadius:13,border:"1px solid #E8E8E8"}}><div style={{fontSize:32,marginBottom:12}}>🛒</div><div style={{fontWeight:600}}>Aucun achat en cours</div></div>
        :drops.map(d=><DropAcheteurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} sel={sel} setSel={setSel} busy={busy} accepter={accepter} tw={tw}/>)
      }
    </div>
  );
}

function ResetPassword({go}){
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[load,setLoad]=useState(false);
  const[done,setDone]=useState(false);
  const[err,setErr]=useState("");
 
  const doReset=async()=>{
    if(!pwd||pwd.length<6){setErr("6 caractères minimum");return;}
    if(pwd!==pwd2){setErr("Les mots de passe ne correspondent pas");return;}
    setLoad(true);
    try{
      // Récupérer le token depuis le hash Supabase (#access_token=xxx&type=recovery)
      const hash=window.location.hash.substring(1); // enlever le #
      const hashParams=new URLSearchParams(hash);
      const searchParams=new URLSearchParams(window.location.search);
      const accessToken=hashParams.get("access_token")||searchParams.get("access_token")||hashParams.get("token");
      if(!accessToken){setErr("Lien invalide ou expiré");setLoad(false);return;}
      const r=await fetch(`${SB}/auth/v1/user`,{
        method:"PUT",
        headers:{"apikey":KEY,"Authorization":`Bearer ${accessToken}`,"Content-Type":"application/json"},
        body:JSON.stringify({password:pwd})
      });
      if(!r.ok){const e=await r.json();throw new Error(e.message||"Erreur");}
      setDone(true);
      // Nettoyer l'URL
      window.history.replaceState({},"",window.location.pathname);
    }catch(e){setErr(e.message||"Erreur, réessayez")}
    finally{setLoad(false)}
  };
 
  return(
    <div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center"}}><Logo s={18}/></nav>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%"}}>
          {done?(
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:48,marginBottom:16}}>✅</div>
              <h2 style={{fontSize:22,fontWeight:900,marginBottom:8}}>Mot de passe modifié !</h2>
              <p style={{fontSize:14,color:C.f400,marginBottom:24,lineHeight:1.7}}>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
              <button onClick={()=>go("auth")} style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:100,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Se connecter →</button>
            </div>
          ):(
            <div>
              <div style={{fontSize:40,marginBottom:16,textAlign:"center"}}>🔐</div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6,textAlign:"center"}}>Nouveau mot de passe</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:24,lineHeight:1.6,textAlign:"center"}}>Choisissez un nouveau mot de passe sécurisé.</p>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Nouveau mot de passe</label>
                <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
              </div>
              <div style={{marginBottom:20}}>
                <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Confirmer</label>
                <input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} placeholder="Répétez le mot de passe" onKeyDown={e=>e.key==="Enter"&&doReset()} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
              </div>
              {err&&<div style={{background:C.rl,color:C.r,borderRadius:10,padding:"10px 13px",fontSize:13,marginBottom:16}}>❌ {err}</div>}
              <button onClick={doReset} disabled={load} style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:100,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                {load?"Modification…":"Changer le mot de passe"}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
 
// ═══ APP ═══
function App(){
  // Détecter lien de reset Supabase
  const isReset=window.location.hash.includes("type=recovery")||window.location.search.includes("type=recovery");
  const[sc,setSc]=useState(isReset?"reset":"home");
  const[profileId,setProfileId]=useState(null);
  const[user,setUser]=useState(null);
  const[prof,setProf]=useState(null);
  const[ann,setAnn]=useState([]);
  const[myA,setMyA]=useState([]);
  const[myO,setMyO]=useState([]);
  const[myS,setMyS]=useState([]);
  const[myDropsV,setMyDropsV]=useState([]);
  const[myDropsA,setMyDropsA]=useState([]);
  const[myDropCr,setMyDropCr]=useState([]);
  const[myDropMsgs,setMyDropMsgs]=useState([]);
  const[clubs,setClubs]=useState([]);
  const[toast,setToast]=useState(null);
  const[load,setLoad]=useState(false);
  const[srch,setSrch]=useState("");
  const[fcat,setFcat]=useState("Tous");
  const[fst,setFst]=useState("Tous");
  const[fpr,setFpr]=useState({min:"",max:""});
  const[sel,setSel]=useState(null);
  const[dtab,setDtab]=useState("overview");
  const[lang,setLang]=useState("FR");
  const[favs,setFavs]=useState({});
 
  const tw=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3500)};
  const go=(s,d=null,pid=null)=>{
    setSc(s);
    if(d)setSel(d);
    if(pid)setProfileId(pid);
    window.scrollTo(0,0);
  };
 
  const loadA=async()=>{try{const d=await api("annonces?status=eq.active&order=created_at.desc&limit=60");setAnn(d)}catch(e){}};
 
  // Gérer retour Stripe
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const payment=params.get("payment");
    const session_id=params.get("session_id");
    if(payment==="success"&&session_id){
      tw("✅ Paiement confirmé ! Votre commande est sécurisée.");
      // Nettoyer l'URL
      window.history.replaceState({},"",window.location.pathname);
      setSc("dashboard");setDtab("drop-acheteur");
    } else if(payment==="cancelled"){
      tw("Paiement annulé.","error");
      window.history.replaceState({},"",window.location.pathname);
    }
  },[]);
  const loadClubs=async()=>{try{const d=await api("drop_clubs?actif=eq.true&order=departement");setClubs(d)}catch(e){}};
 
  const loadMy=async uid=>{
    try{
      const[a,o,s]=await Promise.all([
        api(`annonces?user_id=eq.${uid}&order=created_at.desc`),
        api(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),
        api(`commandes?seller_id=eq.${uid}&order=created_at.desc`)
      ]);
      setMyA(a);setMyO(o);setMyS(s);
    }catch(e){}
  };
 
  const loadDrops=async uid=>{
    try{
      const[dv,da]=await Promise.all([
        api(`drop_remises?vendeur_id=eq.${uid}&order=created_at.desc`),
        api(`drop_remises?acheteur_id=eq.${uid}&order=created_at.desc`)
      ]);
      setMyDropsV(dv);setMyDropsA(da);
      const allIds=[...dv,...da].map(d=>d.id);
      if(allIds.length>0){
        const[crs,msgs]=await Promise.all([
          api(`drop_creneaux?remise_id=in.(${allIds.join(",")})&order=created_at`),
          api(`drop_messages?remise_id=in.(${allIds.join(",")})&order=created_at`)
        ]);
        setMyDropCr(crs);setMyDropMsgs(msgs);
      }
    }catch(e){}
  };
 
  // Restaurer session depuis sessionStorage
  useEffect(()=>{
    loadA();loadClubs();
    const savedTok=sessionStorage.getItem("smashd_tok");
    const savedUser=sessionStorage.getItem("smashd_user");
    if(savedTok&&savedUser){
      try{
        const u=JSON.parse(savedUser);
        // Vérifier que le token est encore valide
        fetch(`${SB}/auth/v1/user`,{headers:{"apikey":KEY,"Authorization":"Bearer "+savedTok}})
          .then(r=>{
            if(r.ok){
              st(savedTok);setUser(u);
              return fetch(`${SB}/rest/v1/profiles?id=eq.${u.id}`,{headers:{"apikey":KEY,"Authorization":"Bearer "+savedTok}});
            } else {
              // Token expiré → nettoyer
              ct();sessionStorage.removeItem("smashd_user");
              return Promise.reject("expired");
            }
          })
          .then(r=>r&&r.json())
          .then(d=>{if(d&&d[0]){setProf(d[0]);loadMy(u.id);loadDrops(u.id);}})
          .catch(e=>console.log("Session:",e));
      }catch(e){ct();}
    }
  },[]);
  useEffect(()=>{if(user?.id){loadMy(user.id);loadDrops(user.id)}},[user?.id]);
 
  const login=async(email,pwd)=>{setLoad(true);try{const d=await authApi("token?grant_type=password",{email,password:pwd});st(d.access_token);setUser(d.user);sessionStorage.setItem('smashd_user',JSON.stringify(d.user));const p=await api(`profiles?id=eq.${d.user.id}`);setProf(p[0]||null);tw("Bienvenue !");go("home")}catch(e){throw e}finally{setLoad(false)}};
  const register=async(email,pwd,name,ut,siret,company)=>{setLoad(true);try{const d=await authApi("signup",{email,password:pwd});if(d.user){if(d.access_token)st(d.access_token);await api("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:ut,siret:siret||null,company:company||null})});setUser(d.user);setProf({id:d.user.id,name,email,user_type:ut});tw("Compte créé !");go("home")}}catch(e){throw e}finally{setLoad(false)}};
  const logout=()=>{ct();setUser(null);setProf(null);setMyA([]);setMyO([]);setMyS([]);setMyDropsV([]);setMyDropsA([]);go("home")};
 
  const publish=async f=>{
    if(!user){go("auth");return}
    setLoad(true);
    try{
      await api("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...f,status:"active"})});
      tw("Annonce publiée !");await loadA();await loadMy(user.id);go("dashboard");setDtab("annonces");
    }catch(e){tw("Erreur : "+e.message,"error")}
    finally{setLoad(false)}
  };
 
  const toggleA=async(id,status)=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});await loadMy(user.id);await loadA()}catch(e){}};
  const deleteA=async id=>{try{await api(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});await loadMy(user.id);await loadA()}catch(e){}};
 
 
  const sendNotif=async(type,to,data)=>{
    try{
      await fetch("https://gcnmgtwbouakwaufqswh.supabase.co/functions/v1/smashd-notify",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdjbm1ndHdib3Vha3dhdWZxc3doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNTk4NDQsImV4cCI6MjA5MzgzNTg0NH0.qtHQ4si2Ybsriiaaj9F-1Z6WeN52sZ1ry7T7VpcIMpM"},
        body:JSON.stringify({type,to,data})
      });
    }catch(e){console.log("Notif failed:",e)}
  };
 
  const placeOrder=async(a,modeChoisi)=>{
    if(!user){go("auth");return false}
    setLoad(true);
    try{
      const c=parseFloat((a.price*.08).toFixed(2)),g=parseFloat((a.price-c).toFixed(2));
      const cmds=await api("commandes",{method:"POST",body:JSON.stringify({
        annonce_id:a.id,buyer_id:user.id,seller_id:a.user_id,
        price:a.price,commission:c,gain:g,
        shipping_method:modeChoisi,status:"en attente",
        escrow_status:"bloqué",drop_status:"en_attente"
      })});
      const cmd=cmds[0];
      if(cmd?.id){
        await api("drop_remises",{method:"POST",body:JSON.stringify({
          commande_id:cmd.id,annonce_id:a.id,
          vendeur_id:a.user_id,acheteur_id:user.id,
          mode_choisi:modeChoisi,status:"mode_choisi"
        })});
      }
      await api(`annonces?id=eq.${a.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});
      tw("Commande confirmée ! Paiement sécurisé en escrow.");
      // Notifier le vendeur par email
      try{
        const vendeur=await api(`profiles?id=eq.${a.user_id}`);
        if(vendeur[0]?.email){
          sendNotif("vente_confirmee",vendeur[0].email,{titre:a.title,prix:a.price});
        }
      }catch(e){}
      await loadA();await loadMy(user.id);await loadDrops(user.id);
      return true;
    }catch(e){tw("Erreur","error");return false}
    finally{setLoad(false)}
  };
 
  const onDropRefresh=()=>{if(user?.id)loadDrops(user.id)};
 
  const fil=ann
    .filter(a=>fcat==="Tous"||a.category===fcat||a.sub_category===fcat)
    .filter(a=>fst==="Tous"||a.state===fst)
    .filter(a=>!fpr.min||a.price>=parseFloat(fpr.min))
    .filter(a=>!fpr.max||a.price<=parseFloat(fpr.max))
    .filter(a=>!srch||a.title?.toLowerCase().includes(srch.toLowerCase())||a.brand?.toLowerCase().includes(srch.toLowerCase()));
 
  const pendingV=myDropsV.filter(d=>d.status==="mode_choisi").length;
  const pendingA=myDropsA.filter(d=>d.status==="creneaux_proposes").length;
  const newSales=myDropsV.filter(d=>d.status==="mode_choisi");
  const wal=myS.filter(s=>myDropsV.find(d=>d.commande_id===s.id&&d.status==="confirme")).reduce((acc,s)=>acc+(s.gain||0),0);
 
  const p={user,prof,load,tw,go,login,register,logout,publish,toggleA,deleteA,placeOrder,
    myA,myO,myS,myDropsV,myDropsA,myDropCr,myDropMsgs,clubs,wal,dtab,setDtab,
    ann:fil,allAnn:ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,sel,
    lang,setLang,favs,setFavs,pendingV,pendingA,onDropRefresh};
 
  return(
    <div>
      {toast&&<Toast {...toast}/>}
      {sc==="reset"&&<ResetPassword go={go}/>}{sc==="profil"&&<ProfilPublic userId={profileId} go={go} user={user} tw={tw}/>}{sc==="home"&&<Home {...p}/>}
      {sc==="auth"&&<Auth {...p}/>}
      {sc==="sell"&&<Sell {...p}/>}
      {sc==="article"&&<Article {...p}/>}
      {sc==="dashboard"&&<Dash {...p}/>}
    </div>
  );
}

function Field({label,children,error}){
  return(
    <div style={{marginBottom:14}}>
      <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>{label}</label>
      {children}
      {error&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{error}</div>}
    </div>
  );
}
 
function Auth({login,register,load,go}){
  const[mode,setMode]=useState("login");
  const[step,setStep]=useState(0);
  const[ut,setUt]=useState("particulier");
  const[email,setEmail]=useState("");
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[name,setName]=useState("");
  const[siret,setSiret]=useState("");
  const[company,setCompany]=useState("");
  const[cgv,setCgv]=useState(false);
  const[err,setErr]=useState({});
  const[forgot,setForgot]=useState(false);
  const[forgotEmail,setForgotEmail]=useState("");
  const[forgotSent,setForgotSent]=useState(false);
  const[forgotLoad,setForgotLoad]=useState(false);
 
  const doForgot=async()=>{
    if(!forgotEmail||!/\S+@\S+\.\S+/.test(forgotEmail)){setErr({forgotEmail:"Email invalide"});return;}
    setForgotLoad(true);
    try{
      await fetch(`${SB}/auth/v1/recover`,{
        method:"POST",
        headers:{"apikey":KEY,"Content-Type":"application/json"},
        body:JSON.stringify({email:forgotEmail})
      });
      setForgotSent(true);
    }catch(e){setErr({forgotEmail:"Erreur, réessayez"})}
    finally{setForgotLoad(false)}
  };
 
  const inp={width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"};
  const v0=()=>{const e={};if(!email||!/\S+@\S+\.\S+/.test(email))e.email="Email invalide";if(!pwd||pwd.length<6)e.pwd="6 min";if(mode==="register"&&pwd!==pwd2)e.pwd2="Différents";setErr(e);return!Object.keys(e).length};
  const v1=()=>{const e={};if(!name)e.name="Requis";if(ut==="pro"&&!siret)e.siret="Requis";if(!cgv)e.cgv="Requis";setErr(e);return!Object.keys(e).length};
  const doLogin=async()=>{if(!v0())return;try{await login(email,pwd)}catch(e){setErr({email:"Email ou mot de passe incorrect"})}};
  const doReg=async()=>{if(!v1())return;try{await register(email,pwd,name,ut,siret,company)}catch(e){setErr({email:e.message})}};
 
 
 
  return(
    <div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center"}}><Logo s={18}/></nav>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%"}}>
          <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f400,fontSize:13,display:"flex",alignItems:"center",gap:5,marginBottom:20}}><Ico.chL/> Retour</button>
          <div style={{display:"flex",gap:6,marginBottom:24,background:C.f100,borderRadius:12,padding:4}}>
            {[["login","Connexion"],["register","S'inscrire"]].map(([m,l])=>(
              <button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?C.w:"transparent",color:mode===m?C.k:C.f400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>
            ))}
          </div>
          {mode==="login"&&(
            <div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Bon retour</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:22}}>Connectez-vous à votre compte SMASHD</p>
              <Field label="Email" error={err.email}><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vous@exemple.com" style={{...inp,border:`1.5px solid ${err.email?C.r:C.f200}`}}/></Field>
              <Field label="Mot de passe"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()} style={inp}/></Field>
              <button onClick={doLogin} disabled={load} className="btn" style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:8}}>{load?"Connexion…":"Se connecter"}</button>
              <button onClick={()=>setForgot(true)} style={{width:"100%",background:"none",border:"none",color:C.f400,fontSize:13,cursor:"pointer",marginTop:12,textDecoration:"underline"}}>Mot de passe oublié ?</button>
            </div>
          )}
 
          {/* FORGOT PASSWORD */}
          {forgot&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>
              <div style={{background:C.w,borderRadius:20,padding:"28px 24px",maxWidth:380,width:"100%"}}>
                {forgotSent?(
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:40,marginBottom:16}}>📧</div>
                    <h3 style={{fontSize:18,fontWeight:900,marginBottom:8}}>Email envoyé !</h3>
                    <p style={{fontSize:14,color:C.f400,lineHeight:1.7,marginBottom:20}}>Vérifiez votre boîte mail. Le lien est valable 1 heure.</p>
                    <button onClick={()=>{setForgot(false);setForgotSent(false);setForgotEmail("");}} style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:100,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Retour à la connexion</button>
                  </div>
                ):(
                  <div>
                    <h3 style={{fontSize:18,fontWeight:900,marginBottom:6}}>Mot de passe oublié</h3>
                    <p style={{fontSize:13,color:C.f400,marginBottom:20,lineHeight:1.6}}>Entrez votre email — nous vous enverrons un lien de réinitialisation.</p>
                    <div style={{marginBottom:16}}>
                      <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Email</label>
                      <input type="email" value={forgotEmail} onChange={e=>setForgotEmail(e.target.value)} placeholder="vous@exemple.com" onKeyDown={e=>e.key==="Enter"&&doForgot()} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.forgotEmail?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
                      {err.forgotEmail&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.forgotEmail}</div>}
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>{setForgot(false);setErr({});}} style={{flex:1,background:C.f100,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Annuler</button>
                      <button onClick={doForgot} disabled={forgotLoad} style={{flex:2,background:forgotLoad?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{forgotLoad?"Envoi…":"Envoyer le lien"}</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
          {mode==="register"&&(
            <div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Créer un compte</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:18}}>Rejoignez la communauté SMASHD</p>
              <div style={{display:"flex",gap:6,marginBottom:18}}>
                {[["particulier","Particulier"],["pro","Vendeur Pro"]].map(([id,l])=>(
                  <button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?C.g:C.f100,color:ut===id?C.w:C.f600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{l}</button>
                ))}
              </div>
              {ut==="pro"&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:12,color:C.g,marginBottom:16,fontWeight:500}}>Abonnement 99€/an — Invendus + espace publicitaire</div>}
              <div style={{display:"flex",gap:4,marginBottom:20}}>{["Compte","Profil"].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>i?C.g:step===i?C.ga:C.f200,transition:"background .3s"}}/>)}</div>
              {step===0&&(
                <div>
                  <Field label="Email *" error={err.email}><input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{...inp,border:`1.5px solid ${err.email?C.r:C.f200}`}}/></Field>
                  <Field label="Mot de passe *" error={err.pwd}><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum" style={{...inp,border:`1.5px solid ${err.pwd?C.r:C.f200}`}}/></Field>
                  <Field label="Confirmer *" error={err.pwd2}><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} style={{...inp,border:`1.5px solid ${err.pwd2?C.r:C.f200}`}}/></Field>
                  <button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Continuer →</button>
                </div>
              )}
              {step===1&&(
                <div>
                  <Field label={ut==="pro"?"Nom du responsable *":"Nom complet *"} error={err.name}><input value={name} onChange={e=>setName(e.target.value)} placeholder="Jean Dupont" style={{...inp,border:`1.5px solid ${err.name?C.r:C.f200}`}}/></Field>
                  {ut==="pro"&&(
                    <div>
                      <Field label="SIRET *" error={err.siret}><input value={siret} onChange={e=>setSiret(e.target.value)} placeholder="123 456 789 00012" style={{...inp,border:`1.5px solid ${err.siret?C.r:C.f200}`}}/></Field>
                      <Field label="Nom commercial"><input value={company} onChange={e=>setCompany(e.target.value)} style={inp}/></Field>
                    </div>
                  )}
                  <div style={{marginBottom:18}}>
                    <label style={{display:"flex",alignItems:"flex-start",gap:9,cursor:"pointer",fontSize:13,color:C.f600}}>
                      <input type="checkbox" checked={cgv} onChange={e=>setCgv(e.target.checked)} style={{marginTop:3,accentColor:C.g}}/>
                      <span>J'accepte les <span style={{color:C.g,fontWeight:600}}>CGV</span> et la <span style={{color:C.g,fontWeight:600}}>Politique de confidentialité</span></span>
                    </label>
                    {err.cgv&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.cgv}</div>}
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>setStep(0)} style={{flex:1,background:C.f100,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Retour</button>
                    <button onClick={doReg} disabled={load} className="btn" style={{flex:2,background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"Création…":ut==="pro"?"Créer compte Pro":"Créer mon compte"}</button>
                  </div>
                </div>

          )}

        </div>
      </div>
    </div>
  );
}

    </div>

}

                          <span><span style={{color:C.f400}}>Net : </span><strong style={{color:drop?.status==="confirme"?C.g:C.f400}}>{v.gain} € {drop?.status==="confirme"?"✓":"⏳"}</strong></span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
 
          {dtab==="achats"&&(
            <div>
              <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Mes achats</h2>
              {myO.length===0?<div style={{textAlign:"center",padding:"44px",color:C.f400,background:C.w,borderRadius:13,border:`1px solid ${C.f200}`}}>Aucun achat. <span style={{color:C.g,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>Explorer</span></div>:(
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {myO.map(o=>{
                    const drop=myDropsA.find(d=>d.commande_id===o.id);
                    return(
                      <div key={o.id} style={{background:C.w,border:`1px solid ${drop?.status==="creneaux_proposes"?"#F5C07A":C.f200}`,borderRadius:13,padding:"14px 18px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                          <div><div style={{fontSize:14,fontWeight:700}}>#{o.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400,marginTop:1}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</div></div>
                          {drop&&<span style={{fontSize:10,fontWeight:700,background:drop.status==="confirme"?C.gl:drop.status==="creneaux_proposes"?"#FFF3E0":"#F5F5F5",color:drop.status==="confirme"?C.gm:drop.status==="creneaux_proposes"?"#C25A00":"#9A9A9A",borderRadius:100,padding:"3px 9px"}}>Drop : {drop.status==="mode_choisi"?"En attente":drop.status==="creneaux_proposes"?"Créneaux dispo !":drop.status==="code_envoye"?"Code actif":drop.status==="confirme"?"Terminé":"—"}</span>}
                        </div>
                        <div style={{fontSize:13,color:"#9A9A9A",marginBottom:4}}>
                          {o.price} € · SMASHD Drop · {new Date(o.created_at).toLocaleDateString("fr-FR")}
                        </div>
                        {drop?.status==="creneaux_proposes"&&(
                          <button onClick={()=>setDtab("drop-acheteur")} style={{background:C.o,color:"#fff",border:"none",borderRadius:100,padding:"8px 16px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                            📅 Choisir un créneau →
                          </button>
                        )}
                        {drop?.status==="code_envoye"&&(
                          <button onClick={()=>setDtab("drop-acheteur")} style={{background:C.g,color:"#fff",border:"none",borderRadius:100,padding:"8px 16px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                            🔑 Voir mon code Drop →
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
 
          {dtab==="wallet"&&(
            <div>
              <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>E-Wallet</h2>
              <div style={{background:C.g,borderRadius:16,padding:"26px 28px",marginBottom:16,color:C.w}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:5}}>Solde disponible</div>
                <div style={{fontSize:44,fontWeight:900,letterSpacing:"-2px",marginBottom:4}}>{wal.toFixed(2)} €</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:18}}>Uniquement les remises Drop confirmées</div>
                <button className="btn" style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Retirer les fonds</button>
              </div>
              <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Historique</div>
                {myDropsV.length===0?<div style={{textAlign:"center",padding:"14px",color:C.f400,fontSize:13}}>Aucune transaction.</div>:myDropsV.map((d,i)=>{
                  const sale=myS.find(s=>s.id===d.commande_id);
                  return(
                    <div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<myDropsV.length-1?`1px solid ${C.f100}`:"none"}}>
                      <div><div style={{fontSize:13,fontWeight:600}}>{DROP_MODES[d.mode_choisi]?.icon} #{d.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.f400}}>{new Date(d.created_at).toLocaleDateString("fr-FR")} · {d.status}</div></div>
                      <div style={{fontSize:14,fontWeight:800,color:d.status==="confirme"?C.g:C.f400}}>{d.status==="confirme"?`+${sale?.gain||"—"} €`:"En attente"}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
 
          {dtab==="settings"&&(
            <div>
              <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Paramètres</h2>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {[["Informations personnelles","Nom, email, téléphone"],["Sécurité","Mot de passe, 2FA"],["Moyens de paiement","Carte, IBAN"],["Notifications","Email, push, SMS"],["Langue","Français / English"],["Supprimer mon compte","Irréversible"]].map(([t,s],i)=>(
                  <div key={t} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                    <div><div style={{fontSize:14,fontWeight:600,color:i===5?C.r:C.k}}>{t}</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>{s}</div></div>
                    <Ico.chR/>
                  </div>
                ))}
                <div onClick={logout} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                  <div><div style={{fontSize:14,fontWeight:600,color:C.r}}>Déconnexion</div><div style={{fontSize:12,color:C.f400,marginTop:2}}>Se déconnecter de SMASHD</div></div>
                  <Ico.chR/>
                </div>
              </div>
            </div>
          )}
 
        </div>
      </div>
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
