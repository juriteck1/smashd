// Upload photo vers Supabase Storage
const uploadPhoto = async (file) => {
  const ext = file.name.split('.').pop();
  const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const res = await fetch(`${SB_URL}/storage/v1/object/smashd-photos/${filename}`, {
    method: "POST",
    headers: {
      "apikey": SB_KEY,
      "Authorization": `Bearer ${getToken()}`,
      "Content-Type": file.type,
    },
    body: file,
  });
  if (!res.ok) throw new Error("Erreur upload photo");
  return `${SB_URL}/storage/v1/object/public/smashd-photos/${filename}`;
};

// API helpers
// Token stocké en mémoire (évite le blocage localStorage)
let _token = SB_KEY;
const getToken = () => _token;
const setToken = (token) => { _token = token || SB_KEY; };
const clearToken = () => { _token = SB_KEY; };

const sbApi = async (path, opts={}) => {
  const token = getToken();
  const res = await fetch(`${SB_URL}/rest/v1/${path}`,{
    headers:{"apikey":SB_KEY,"Authorization":`Bearer ${token}`,"Content-Type":"application/json","Prefer":opts.prefer||"return=representation",...(opts.headers||{})},
    ...opts
  });
  if(!res.ok){const e=await res.json();throw new Error(e.message||"Erreur API")}
  const tx=await res.text();return tx?JSON.parse(tx):[];
};
const sbAuth = async (ep,body) => {
  const res=await fetch(`${SB_URL}/auth/v1/${ep}`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await res.json();
  if(d.error||d.error_description)throw new Error(d.error_description||d.error);
  return d;
};

function App() {
  const [lang,setLang]=useState("FR");
  const T=TRANSLATIONS[lang];
  const [screen,setScreen]=useState("home");
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [annonces,setAnnonces]=useState([]);
  const [myAnnonces,setMyAnnonces]=useState([]);
  const [myOrders,setMyOrders]=useState([]);
  const [mySales,setMySales]=useState([]);
  const [messages,setMessages]=useState([]);
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(false);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("Tous");
  const [filterState,setFilterState]=useState("Tous");
  const [filterPrice,setFilterPrice]=useState({min:"",max:""});
  const [selected,setSelected]=useState(null);
  const [dashTab,setDashTab]=useState("overview");
  const [vacanceMode,setVacanceMode]=useState(false);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3500)};
  const go=(s,data=null)=>{setScreen(s);if(data)setSelected(data);window.scrollTo(0,0)};

  const loadAnnonces=async()=>{
    try{const d=await sbApi("annonces?status=eq.active&order=created_at.desc&limit=50");setAnnonces(d)}
    catch(e){console.error(e)}
  };

  const loadMyData=async(uid)=>{
    try{
      const [ann,orders,sales]=await Promise.all([
        sbApi(`annonces?user_id=eq.${uid}&order=created_at.desc`),
        sbApi(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),
        sbApi(`commandes?seller_id=eq.${uid}&order=created_at.desc`),
      ]);
      setMyAnnonces(ann);setMyOrders(orders);setMySales(sales);
    }catch(e){console.error(e)}
  };

  useEffect(()=>{loadAnnonces()},[]);

  const login=async(email,pwd)=>{
    setLoading(true);
    try{
      const d=await sbAuth("token?grant_type=password",{email,password:pwd});
      setUser(d.user);
      const p=await sbApi(`profiles?id=eq.${d.user.id}`);
      setProfile(p[0]||null);
      await loadMyData(d.user.id);
      showToast("Connecté avec succès !");
      go("home");
    }catch(e){throw e}
    finally{setLoading(false)}
  };

  const register=async(email,pwd,name,userType,siret,company)=>{
    setLoading(true);
    try{
      const d=await sbAuth("signup",{email,password:pwd});
      if(d.user){
        await sbApi("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:userType,siret:siret||null,company:company||null})});
        setUser(d.user);
        setProfile({id:d.user.id,name,email,user_type:userType});
        showToast("Bienvenue sur SMASHD ! 🎉");
        go("home");
      }
    }catch(e){throw e}
    finally{setLoading(false)}
  };

  const logout=()=>{setUser(null);setProfile(null);setMyAnnonces([]);setMyOrders([]);setMySales([]);clearToken();showToast("Déconnecté");go("home")};

  const publishAnnonce=async(form)=>{
    if(!user){go("auth");return}
    setLoading(true);
    try{
      await sbApi("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...form,status:"active"})});
      showToast("Annonce publiée ! 🎉");
      await loadAnnonces();
      await loadMyData(user.id);
      go("dashboard");setDashTab("annonces");
    }catch(e){showToast("Erreur publication","error")}
    finally{setLoading(false)}
  };

  const toggleAnnonceStatus=async(id,status)=>{
    try{
      await sbApi(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});
      await loadMyData(user.id);
      await loadAnnonces();
      showToast(status==="active"?"Annonce activée":"Annonce mise en pause");
    }catch(e){showToast("Erreur","error")}
  };

  const deleteAnnonce=async(id)=>{
    try{
      await sbApi(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});
      await loadMyData(user.id);
      await loadAnnonces();
      showToast("Annonce supprimée");
    }catch(e){showToast("Erreur","error")}
  };

  const sendMessage=async(annonce_id,receiver_id,content)=>{
    if(!user)return;
    try{
      await sbApi("messages",{method:"POST",body:JSON.stringify({annonce_id,sender_id:user.id,receiver_id,content})});
      showToast("Message envoyé !");
    }catch(e){showToast("Erreur envoi","error")}
  };

  const placeOrder=async(annonce,shippingMethod)=>{
    if(!user){go("auth");return}
    setLoading(true);
    try{
      const commission=parseFloat((annonce.price*0.08).toFixed(2));
      const gain=parseFloat((annonce.price-commission).toFixed(2));
      await sbApi("commandes",{method:"POST",body:JSON.stringify({annonce_id:annonce.id,buyer_id:user.id,seller_id:annonce.user_id,price:annonce.price,commission,gain,shipping_method:shippingMethod,status:"en attente"})});
      await sbApi(`annonces?id=eq.${annonce.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});
      await sbApi("transactions",{method:"POST",body:JSON.stringify({user_id:annonce.user_id,label:`Vente — ${annonce.title}`,amount:gain,type:"credit"})});
      showToast("Commande confirmée ! 🎉");
      await loadAnnonces();
      await loadMyData(user.id);
      go("dashboard");setDashTab("achats");
    }catch(e){showToast("Erreur commande","error")}
    finally{setLoading(false)}
  };

  const filtered=annonces
    .filter(a=>filterCat==="Tous"||a.category===filterCat)
    .filter(a=>filterState==="Tous"||a.state===filterState)
    .filter(a=>!filterPrice.min||a.price>=parseFloat(filterPrice.min))
    .filter(a=>!filterPrice.max||a.price<=parseFloat(filterPrice.max))
    .filter(a=>!search||a.title?.toLowerCase().includes(search.toLowerCase())||a.brand?.toLowerCase().includes(search.toLowerCase()));

  const wallet=(()=>{
    const credits=mySales.reduce((acc,s)=>acc+s.gain,0);
    return Math.round(credits*100)/100;
  })();

  const props={user,profile,loading,showToast,go,login,register,logout,publishAnnonce,toggleAnnonceStatus,deleteAnnonce,sendMessage,placeOrder,myAnnonces,myOrders,mySales,wallet,dashTab,setDashTab,vacanceMode,setVacanceMode,annonces:filtered,allAnnonces:annonces,search,setSearch,filterCat,setFilterCat,filterState,setFilterState,filterPrice,setFilterPrice,selected,setSelected,loadMyData,lang,setLang,T};

  return (
    <div>
      {toast&&<Toast {...toast}/>}
      {screen==="home"&&<Home {...props}/>}
      {screen==="auth"&&<Auth {...props}/>}
      {screen==="sell"&&<Sell {...props}/>}
      {screen==="article"&&<Article {...props}/>}
      {screen==="dashboard"&&<Dashboard {...props}/>}
    </div>
  );
}

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:14}}>
            {annonces.map(a=>(
              <div key={a.id} onClick={()=>go("article",a)} style={{background:C.w,border:`1px solid ${C.b}`,borderRadius:14,overflow:"hidden",cursor:"pointer"}}>
                <div style={{background:C.gl,height:140,display:"flex",alignItems:"center",justifyContent:"center",fontSize:60,position:"relative"}}>
                  {ICONS[a.category]||"📦"}
                  {a.user_type==="pro"&&<span style={{position:"absolute",top:8,left:8,background:C.a,color:"#fff",fontSize:10,fontWeight:700,borderRadius:4,padding:"2px 7px"}}>PRO</span>}
                </div>
                <div style={{padding:"12px 14px"}}>
                  <div style={{fontSize:11,color:C.m,marginBottom:2}}>{a.brand||"—"} · {a.category}</div>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:6,lineHeight:1.3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                  <Badge label={a.state}/>
                  <div style={{fontSize:18,fontWeight:900,marginTop:8}}>{a.price} €</div>
                </div>
              </div>
            ))}

        )}
      </div>

      {/* FOOTER */}
      <footer style={{background:C.pd,color:"#a8d5c5",padding:"28px 20px",display:"flex",gap:24,flexWrap:"wrap",justifyContent:"space-between",fontSize:13}}>
        <div>
          <div style={{color:"#fff",fontWeight:900,fontSize:20,marginBottom:8,letterSpacing:"-0.5px"}}>SMASH<span style={{color:"#f4a07a"}}>D</span></div>
          <div style={{maxWidth:220,lineHeight:1.6}}>Marketplace de seconde main dédiée aux sports de raquette.</div>
        </div>
        {[["Acheter",["Catalogue","Nouveautés","Bons plans"]],["Vendre",["Déposer une annonce","Espace Pro","Tarifs"]],["Aide",["FAQ","Livraison","Contact"]]].map(([t,ls])=>(
          <div key={t}>
            <div style={{color:"#fff",fontWeight:700,marginBottom:8}}>{t}</div>
            {ls.map(l=><div key={l} style={{marginBottom:4,cursor:"pointer"}}>{l}</div>)}
          </div>
        ))}
      </footer>
    </div>
  );
}

// AUTH
// ═══════════════════════════════════════════════
function Auth({login,register,loading,go}){
  const [mode,setMode]=useState("login");
  const [step,setStep]=useState(0);
  const [userType,setUserType]=useState("particulier");
  const [f,setF]=useState({email:"",pwd:"",pwd2:"",name:"",phone:"",siret:"",company:"",cgv:false});
  const [err,setErr]=useState({});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));

  const validate0=()=>{
    const e={};
    if(!f.email||!/\S+@\S+\.\S+/.test(f.email))e.email="Email invalide";
    if(!f.pwd||f.pwd.length<6)e.pwd="6 caractères minimum";
    if(mode==="register"&&f.pwd!==f.pwd2)e.pwd2="Les mots de passe ne correspondent pas";
    setErr(e);return!Object.keys(e).length;
  };
  const validate1=()=>{
    const e={};
    if(!f.name)e.name="Nom requis";
    if(userType==="pro"&&!f.siret)e.siret="SIRET requis";
    if(!f.cgv)e.cgv="Vous devez accepter les CGV";
    setErr(e);return!Object.keys(e).length;
  };

  const doLogin=async()=>{
    if(!validate0())return;
    try{await login(f.email,f.pwd)}
    catch(e){setErr({email:"Email ou mot de passe incorrect"})}
  };

  const doRegister=async()=>{
    if(!validate1())return;
    try{await register(f.email,f.pwd,f.name,userType,f.siret,f.company)}
    catch(e){setErr({email:e.message})}
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.w,border:`1px solid ${C.b}`,borderRadius:18,padding:"32px 28px",maxWidth:420,width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:24}}><Logo size={26}/></div>

        {/* MODE TABS */}
        <div style={{display:"flex",gap:8,marginBottom:24}}>
          {[["login","Connexion"],["register","Inscription"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}}
              style={{flex:1,background:mode===m?C.p:C.w,color:mode===m?"#fff":C.m,border:`1.5px solid ${mode===m?C.p:C.b}`,borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{l}</button>
          ))}
        </div>

        {/* LOGIN */}
        {mode==="login"&&(
          <>
            <Input label="Email" type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="vous@exemple.com" error={err.email} required/>
            <Input label="Mot de passe" type="password" value={f.pwd} onChange={e=>set("pwd",e.target.value)} placeholder="••••••••" error={err.pwd} required/>
            <Btn onClick={doLogin} disabled={loading} style={{width:"100%",marginBottom:12,padding:"13px"}}>
              {loading?"Connexion…":"Se connecter"}
            </Btn>
          </>
        )}

        {/* REGISTER */}
        {mode==="register"&&(
          <>
            {/* Type user */}
            <div style={{display:"flex",gap:8,marginBottom:18}}>
              {[["particulier","👤 Particulier"],["pro","🏪 Vendeur Pro"]].map(([id,l])=>(
                <button key={id} onClick={()=>setUserType(id)}
                  style={{flex:1,background:userType===id?C.p:C.w,color:userType===id?"#fff":C.t,border:`2px solid ${userType===id?C.p:C.b}`,borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
            {userType==="pro"&&(
              <div style={{background:C.warnl,border:`1px solid ${C.warn}`,borderRadius:8,padding:"10px 14px",fontSize:12,color:C.warn,marginBottom:14}}>
                🏅 Compte Pro — Abonnement annuel 99€/an. Vendez vos invendus et accédez à l'espace publicitaire.
              </div>
            )}

            {/* Stepper */}
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:20}}>
              {["Compte","Profil"].map((s,i)=>(
                <React.Fragment key={s}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:24,height:24,borderRadius:"50%",background:step>=i?C.p:C.gl,color:step>=i?"#fff":C.g,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700}}>{step>i?"✓":i+1}</div>
                    <span style={{fontSize:12,color:step===i?C.t:C.m,fontWeight:step===i?700:400}}>{s}</span>
                  </div>
                  {i===0&&<div style={{flex:1,height:1,background:step>0?C.p:C.b}}/>}
                </React.Fragment>
              ))}
            </div>

            {step===0&&(
              <>
                <Input label="Email" type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="vous@exemple.com" error={err.email} required/>
                <Input label="Mot de passe" type="password" value={f.pwd} onChange={e=>set("pwd",e.target.value)} placeholder="6 caractères minimum" error={err.pwd} required/>
                <Input label="Confirmer le mot de passe" type="password" value={f.pwd2} onChange={e=>set("pwd2",e.target.value)} placeholder="Répétez le mot de passe" error={err.pwd2} required/>
                <Btn onClick={()=>validate0()&&setStep(1)} style={{width:"100%",padding:"13px"}}>Continuer →</Btn>
              </>
            )}
            {step===1&&(
              <>
                <Input label={userType==="pro"?"Nom du responsable":"Nom complet"} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Jean Dupont" error={err.name} required/>
                <Input label="Téléphone" type="tel" value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="+33 6 00 00 00 00"/>
                {userType==="pro"&&(
                  <>
                    <Input label="Numéro SIRET" value={f.siret} onChange={e=>set("siret",e.target.value)} placeholder="123 456 789 00012" error={err.siret} required/>
                    <Input label="Nom commercial" value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Mon Shop Tennis"/>
                  </>
                )}
                <div style={{marginBottom:16}}>
                  <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",fontSize:13,color:C.m}}>
                    <input type="checkbox" checked={f.cgv} onChange={e=>set("cgv",e.target.checked)} style={{marginTop:2,accentColor:C.p}}/>
                    <span>J'accepte les <span style={{color:C.p,fontWeight:600}}>CGV</span> et la <span style={{color:C.p,fontWeight:600}}>Politique de confidentialité</span></span>
                  </label>
                  {err.cgv&&<div style={{fontSize:12,color:C.err,marginTop:4}}>{err.cgv}</div>}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn onClick={()=>setStep(0)} variant="ghost" style={{flex:1,padding:"12px"}}>← Retour</Btn>
                  <Btn onClick={doRegister} disabled={loading} style={{flex:2,padding:"12px"}}>
                    {loading?"Création…":userType==="pro"?"Créer compte Pro":"Créer mon compte"}
                  </Btn>
                </div>
              </>
            )}
          </>
        )}

        {err.email&&mode==="register"&&step===0&&<div style={{background:C.errl,color:C.err,borderRadius:8,padding:"10px 14px",fontSize:13,marginTop:12}}>❌ {err.email}</div>}
        <button onClick={()=>go("home")} style={{width:"100%",background:"none",border:"none",color:C.m,fontSize:13,cursor:"pointer",marginTop:16}}>← Retour à l'accueil</button>
      </div>
    </div>
  );
}

// SELL
// ═══════════════════════════════════════════════
function Sell({publishAnnonce,loading,go,profile}){
  const [step,setStep]=useState(0);
  const [f,setF]=useState({title:"",description:"",category:"",sub_category:"",brand:"",state:"",price:"",size:"",surface:"",env:"",shipping:"mondial"});
  const [photos,setPhotos]=useState([]);
  const [photoUploading,setPhotoUploading]=useState(false);
  const fileRef=useRef();
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const commission=f.price?(f.price*0.08).toFixed(2):0;
  const gain=f.price?(f.price*0.92).toFixed(2):0;
  const STEPS=["Catégorie","Photos","Détails","Prix","Expédition","Confirmation"];

  const handlePhotoUpload=async(e)=>{
    const files=Array.from(e.target.files);
    if(photos.length+files.length>8){alert("Maximum 8 photos");return}
    setPhotoUploading(true);
    try{
      const urls=await Promise.all(files.map(f=>uploadPhoto(f)));
      setPhotos(p=>[...p,...urls]);
    }catch(e){alert("Erreur upload, réessayez")}
    finally{setPhotoUploading(false)}
  };

  const removePhoto=(i)=>setPhotos(p=>p.filter((_,idx)=>idx!==i));

  const canNext=()=>{
    if(step===0)return f.category;
    if(step===1)return photos.length>0;
    if(step===2)return f.brand&&f.state&&f.title;
    if(step===3)return f.price>0;
    if(step===4)return f.shipping;
    return true;
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.b}`,padding:"0 20px",display:"flex",alignItems:"center",height:56,gap:12}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>←</button>
        <Logo size={18}/>
        <span style={{fontSize:13,color:C.m}}>› Vendre un article</span>
      </nav>

      {/* Stepper */}
      <div style={{background:C.w,borderBottom:`1px solid ${C.b}`,padding:"14px 20px",overflowX:"auto"}}>
        <div style={{display:"flex",alignItems:"center",minWidth:"max-content",margin:"0 auto"}}>
          {STEPS.map((s,i)=>(
            <React.Fragment key={s}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:i<step?C.p:i===step?C.p:C.gl,color:i<=step?"#fff":C.g,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>
                  {i<step?"✓":i+1}
                </div>
                <span style={{fontSize:11,color:i===step?C.t:C.m,fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i<STEPS.length-1&&<div style={{width:24,height:1,background:i<step?C.p:C.b,margin:"0 6px",flexShrink:0}}/>}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div style={{maxWidth:600,margin:"28px auto",padding:"0 20px"}}>

        {/* STEP 0 - Catégorie */}
        {step===0&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Quelle catégorie ?</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Sélectionnez le sport de votre article.</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:10}}>
              {CATS.map(c=>(
                <button key={c} onClick={()=>set("category",c)}
                  style={{background:f.category===c?C.pl:C.w,border:`2px solid ${f.category===c?C.p:C.b}`,borderRadius:12,padding:"16px 8px",cursor:"pointer",textAlign:"center",fontWeight:f.category===c?700:400}}>
                  <div style={{fontSize:28}}>{ICONS[c]}</div>
                  <div style={{fontSize:13,marginTop:6}}>{c}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* STEP 1 - Photos */}
        {step===1&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Photos de l'article</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Ajoutez jusqu'à 8 photos. La première sera la photo principale.</p>

            {/* Zone upload */}
            <div onClick={()=>!photoUploading&&fileRef.current.click()}
              style={{border:`2px dashed ${C.p}`,borderRadius:14,padding:"28px",textAlign:"center",cursor:"pointer",background:C.pl,marginBottom:16}}>
              <div style={{fontSize:36,marginBottom:8}}>📸</div>
              <div style={{fontSize:14,fontWeight:600,color:C.pd}}>
                {photoUploading?"Upload en cours…":"Cliquez pour ajouter des photos"}
              </div>
              <div style={{fontSize:12,color:C.m,marginTop:4}}>JPG, PNG · Max 8 photos · 10MB par photo</div>
              <input ref={fileRef} type="file" accept="image/*" multiple onChange={handlePhotoUpload}
                style={{display:"none"}}/>
            </div>

            {/* Aperçu photos */}
            {photos.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {photos.map((url,i)=>(
                  <div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:10,overflow:"hidden",border:`2px solid ${i===0?C.p:C.b}`}}>
                    <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    {i===0&&<span style={{position:"absolute",bottom:4,left:4,background:C.p,color:"#fff",fontSize:9,borderRadius:4,padding:"2px 6px",fontWeight:700}}>Principale</span>}
                    <button onClick={()=>removePhoto(i)}
                      style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,0.6)",color:"#fff",border:"none",borderRadius:"50%",width:22,height:22,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                  </div>
                ))}
                {photos.length<8&&(
                  <div onClick={()=>fileRef.current.click()}
                    style={{aspectRatio:"1",borderRadius:10,border:`2px dashed ${C.b}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:24,color:C.g,background:C.gl}}>
                    +
                  </div>
                )}
              </div>
            )}

            {photos.length===0&&(
              <div style={{background:C.warnl,borderRadius:8,padding:"10px 14px",fontSize:13,color:C.warn}}>
                ⚠️ Au moins 1 photo est requise pour publier votre annonce.
              </div>
            )}
          </div>
        )}

        {/* STEP 2 - Détails */}
        {step===2&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <h2 style={{fontSize:20,fontWeight:800,margin:0}}>Décrivez votre article</h2>
            <div>
              <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:8}}>Marque *</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {(BRANDS[f.category]||["Autre"]).concat(["Autre"]).filter((v,i,a)=>a.indexOf(v)===i).map(b=>(
                  <button key={b} onClick={()=>set("brand",b)}
                    style={{background:f.brand===b?C.p:C.w,color:f.brand===b?"#fff":C.t,border:`1px solid ${f.brand===b?C.p:C.b}`,borderRadius:20,padding:"7px 14px",fontSize:13,cursor:"pointer"}}>
                    {b}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:8}}>État *</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {STATES.map(s=>(
                  <button key={s} onClick={()=>set("state",s)}
                    style={{background:f.state===s?C.p:C.w,color:f.state===s?"#fff":C.t,border:`1px solid ${f.state===s?C.p:C.b}`,borderRadius:20,padding:"7px 14px",fontSize:13,cursor:"pointer"}}>
                    {s}
                  </button>
                ))}
              </div>
            </div>
            <Input label="Titre de l'annonce" value={f.title} onChange={e=>set("title",e.target.value)} placeholder={`Ex: ${f.brand||"Wilson"} ${f.category} — ${f.state||"Très bon état"}`} required/>
            <div>
              <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Description</label>
              <textarea value={f.description} onChange={e=>set("description",e.target.value)} rows={4}
                placeholder="Décrivez l'article : modèle, année, raison de la vente, défauts éventuels…"
                style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${C.b}`,fontSize:14,resize:"vertical",boxSizing:"border-box"}}/>
            </div>
          </div>
        )}

        {/* STEP 3 - Prix */}
        {step===3&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Fixez votre prix</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Entrez le prix de vente de votre article.</p>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <input type="number" value={f.price} onChange={e=>set("price",e.target.value)} placeholder="0"
                style={{width:140,padding:"14px 16px",borderRadius:10,border:`2px solid ${C.p}`,fontSize:24,fontWeight:800,textAlign:"center"}}/>
              <span style={{fontSize:24,fontWeight:700,color:C.m}}>€</span>
            </div>
            {f.price>0&&(
              <Card style={{background:C.pl}}>
                <div style={{fontSize:13,color:C.m,marginBottom:10}}>Récapitulatif</div>
                {[["Prix de vente",`${f.price} €`],["Commission SMASHD (8%)",`- ${commission} €`]].map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}><span style={{color:C.m}}>{k}</span><span>{v}</span></div>
                ))}
                <div style={{borderTop:`1px solid ${C.b}`,paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:900}}>
                  <span>Vous recevez</span><span style={{color:C.p}}>{gain} €</span>
                </div>
              </Card>
            )}
          </div>
        )}

        {/* STEP 4 - Expédition */}
        {step===4&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Mode d'expédition</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>L'étiquette est générée automatiquement après la vente.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {SHIPPING.map(s=>(
                <button key={s.id} onClick={()=>set("shipping",s.id)}
                  style={{background:f.shipping===s.id?C.pl:C.w,border:`2px solid ${f.shipping===s.id?C.p:C.b}`,borderRadius:12,padding:"16px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15}}>{s.label}</div>
                    <div style={{fontSize:12,color:C.m,marginTop:2}}>Délai : {s.delay}</div>
                  </div>
                  <div style={{fontWeight:800,fontSize:16,color:f.shipping===s.id?C.p:C.t}}>{s.price===0?"Gratuit":`${s.price} €`}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* STEP 5 - Confirmation */}
        {step===5&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Vérifiez votre annonce</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Tout est correct ? Publiez en un clic.</p>
            <Card>
              {photos.length>0?(
                <img src={photos[0]} alt="" style={{width:"100%",height:200,objectFit:"cover",borderRadius:10,marginBottom:16}}/>
              ):(
                <div style={{background:C.gl,borderRadius:10,height:140,display:"flex",alignItems:"center",justifyContent:"center",fontSize:64,marginBottom:16}}>{ICONS[f.category]||"📦"}</div>
              )}
              {photos.length>1&&(
                <div style={{display:"flex",gap:6,marginBottom:14}}>
                  {photos.slice(1,5).map((url,i)=>(
                    <img key={i} src={url} alt="" style={{width:56,height:56,objectFit:"cover",borderRadius:8,border:`1px solid ${C.b}`}}/>
                  ))}
                </div>
              )}
              <div style={{fontSize:12,color:C.m}}>{f.brand} · {f.category}</div>
              <div style={{fontSize:18,fontWeight:800,margin:"4px 0 8px"}}>{f.title}</div>
              <div style={{display:"flex",gap:8,marginBottom:12}}><Badge label={f.state}/></div>
              <div style={{fontSize:24,fontWeight:900}}>{f.price} €</div>
              <div style={{fontSize:12,color:C.m,marginTop:2}}>Vous recevrez {gain} € · Via {SHIPPING.find(s=>s.id===f.shipping)?.label}</div>
            </Card>
          </div>
        )}

        {/* NAV BUTTONS */}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:28,paddingBottom:40}}>
          {step>0
            ?<Btn onClick={()=>setStep(s=>s-1)} variant="ghost" style={{padding:"11px 24px"}}>← Retour</Btn>
            :<div/>
          }
          {step<STEPS.length-1
            ?<Btn onClick={()=>canNext()&&setStep(s=>s+1)} disabled={!canNext()||photoUploading} style={{padding:"11px 28px"}}>
              {photoUploading?"Upload…":"Continuer →"}
            </Btn>
            :<Btn onClick={()=>publishAnnonce({...f,photos,photo_url:photos[0]||null})} disabled={loading} style={{padding:"11px 28px"}}>
              {loading?"Publication…":"🚀 Publier l'annonce"}
            </Btn>
          }
        </div>
      </div>
    </div>
  );
}

  const canNext=()=>{
    if(step===0)return f.category;
    if(step===1)return f.brand&&f.state&&f.title;
    if(step===2)return f.price>0;
    if(step===3)return f.shipping;
    return true;
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.b}`,padding:"0 20px",display:"flex",alignItems:"center",height:56,gap:12}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>←</button>
        <Logo size={18}/>
        <span style={{fontSize:13,color:C.m}}>› Vendre un article</span>
      </nav>

      {/* Stepper */}
      <div style={{background:C.w,borderBottom:`1px solid ${C.b}`,padding:"14px 20px"}}>
        <div style={{display:"flex",alignItems:"center",maxWidth:600,margin:"0 auto"}}>
          {STEPS.map((s,i)=>(
            <React.Fragment key={s}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:i<step?C.p:i===step?C.p:C.gl,color:i<=step?"#fff":C.g,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700}}>
                  {i<step?"✓":i+1}
                </div>
                <span style={{fontSize:11,color:i===step?C.t:C.m,fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i<STEPS.length-1&&<div style={{flex:1,height:1,background:i<step?C.p:C.b,margin:"0 6px"}}/>}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div style={{maxWidth:600,margin:"28px auto",padding:"0 20px"}}>
        {/* STEP 0 - Catégorie */}
        {step===0&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Quelle catégorie ?</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Sélectionnez le sport de votre article.</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10}}>
              {CATS.map(c=>(
                <button key={c} onClick={()=>set("category",c)}
                  style={{background:f.category===c?C.pl:C.w,border:`2px solid ${f.category===c?C.p:C.b}`,borderRadius:12,padding:"16px 8px",cursor:"pointer",textAlign:"center",fontWeight:f.category===c?700:400}}>
                  <div style={{fontSize:28}}>{ICONS[c]}</div>
                  <div style={{fontSize:13,marginTop:6}}>{c}</div>
                </button>
              ))}
            </div>
            {profile?.user_type==="pro"&&(
              <div style={{marginTop:16,background:C.warnl,borderRadius:10,padding:"12px 16px",fontSize:13,color:C.warn}}>
                🏪 <strong>Espace Pro</strong> — Vous pouvez également publier des invendus dans la catégorie "Invendus Pro"
              </div>
            )}
          </div>
        )}

        {/* STEP 1 - Détails */}
        {step===1&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <h2 style={{fontSize:20,fontWeight:800,margin:0}}>Décrivez votre article</h2>
            <div>
              <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:8}}>Marque *</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {(BRANDS[f.category]||["Autre"]).concat(["Autre"]).filter((v,i,a)=>a.indexOf(v)===i).map(b=>(
                  <button key={b} onClick={()=>set("brand",b)}
                    style={{background:f.brand===b?C.p:C.w,color:f.brand===b?"#fff":C.t,border:`1px solid ${f.brand===b?C.p:C.b}`,borderRadius:20,padding:"7px 14px",fontSize:13,cursor:"pointer"}}>
                    {b}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:8}}>État *</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {STATES.map(s=>(
                  <button key={s} onClick={()=>set("state",s)}
                    style={{background:f.state===s?C.p:C.w,color:f.state===s?"#fff":C.t,border:`1px solid ${f.state===s?C.p:C.b}`,borderRadius:20,padding:"7px 14px",fontSize:13,cursor:"pointer"}}>
                    {s}
                  </button>
                ))}
              </div>
            </div>
            <Input label="Titre de l'annonce" value={f.title} onChange={e=>set("title",e.target.value)} placeholder={`Ex: ${f.brand||"Wilson"} ${f.category} — ${f.state||"Très bon état"}`} required/>
            <div>
              <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Description</label>
              <textarea value={f.description} onChange={e=>set("description",e.target.value)} rows={4}
                placeholder="Décrivez l'article : modèle, année, raison de la vente, défauts éventuels…"
                style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${C.b}`,fontSize:14,resize:"vertical",boxSizing:"border-box"}}/>
            </div>
          </div>
        )}

        {/* STEP 2 - Prix */}
        {step===2&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Fixez votre prix</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Entrez le prix de vente de votre article.</p>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <input type="number" value={f.price} onChange={e=>set("price",e.target.value)} placeholder="0"
                style={{width:140,padding:"14px 16px",borderRadius:10,border:`2px solid ${C.p}`,fontSize:24,fontWeight:800,textAlign:"center"}}/>
              <span style={{fontSize:24,fontWeight:700,color:C.m}}>€</span>
            </div>
            {f.price>0&&(
              <Card style={{background:C.pl}}>
                <div style={{fontSize:13,color:C.m,marginBottom:10}}>Récapitulatif</div>
                {[["Prix de vente",`${f.price} €`],["Commission SMASHD (8%)",`- ${commission} €`]].map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}><span style={{color:C.m}}>{k}</span><span>{v}</span></div>
                ))}
                <div style={{borderTop:`1px solid ${C.b}`,paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:900}}>
                  <span>Vous recevez</span><span style={{color:C.p}}>{gain} €</span>
                </div>
              </Card>
            )}
          </div>
        )}

        {/* STEP 3 - Expédition */}
        {step===3&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Mode d'expédition</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>L'étiquette est générée automatiquement après la vente.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {SHIPPING.map(s=>(
                <button key={s.id} onClick={()=>set("shipping",s.id)}
                  style={{background:f.shipping===s.id?C.pl:C.w,border:`2px solid ${f.shipping===s.id?C.p:C.b}`,borderRadius:12,padding:"16px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15}}>{s.label}</div>
                    <div style={{fontSize:12,color:C.m,marginTop:2}}>Délai : {s.delay}</div>
                  </div>
                  <div style={{fontWeight:800,fontSize:16,color:f.shipping===s.id?C.p:C.t}}>{s.price===0?"Gratuit":`${s.price} €`}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* STEP 4 - Confirmation */}
        {step===4&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Vérifiez votre annonce</h2>
            <p style={{color:C.m,fontSize:14,marginBottom:20}}>Tout est correct ? Publiez en un clic.</p>
            <Card>
              <div style={{background:C.gl,borderRadius:10,height:120,display:"flex",alignItems:"center",justifyContent:"center",fontSize:64,marginBottom:16}}>{ICONS[f.category]||"📦"}</div>
              <div style={{fontSize:12,color:C.m}}>{f.brand} · {f.category}</div>
              <div style={{fontSize:18,fontWeight:800,margin:"4px 0 8px"}}>{f.title}</div>
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                <Badge label={f.state}/>
              </div>
              <div style={{fontSize:24,fontWeight:900}}>{f.price} €</div>
              <div style={{fontSize:12,color:C.m,marginTop:2}}>Vous recevrez {gain} € · Via {SHIPPING.find(s=>s.id===f.shipping)?.label}</div>
            </Card>
          </div>
        )}

        {/* NAV BUTTONS */}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:28,paddingBottom:40}}>
          {step>0
            ?<Btn onClick={()=>setStep(s=>s-1)} variant="ghost" style={{padding:"11px 24px"}}>← Retour</Btn>
            :<div/>
          }
          {step<STEPS.length-1
            ?<Btn onClick={()=>canNext()&&setStep(s=>s+1)} disabled={!canNext()} style={{padding:"11px 28px"}}>Continuer →</Btn>
            :<Btn onClick={()=>publishAnnonce(f)} disabled={loading} style={{padding:"11px 28px"}}>
              {loading?"Publication…":"🚀 Publier l'annonce"}
            </Btn>
          }
        </div>
      </div>
    </div>
  );
}

// ARTICLE

function Article({selected,go,user,placeOrder,loading,sendMessage}){
  const a=selected;
  const [tab,setTab]=useState("desc");
  const [shipping,setShipping]=useState("mondial");
  const [offer,setOffer]=useState("");
  const [offerSent,setOfferSent]=useState(false);
  const [msgText,setMsgText]=useState("");
  const [checkout,setCheckout]=useState(false);
  const [ordered,setOrdered]=useState(false);
  if(!a)return null;
  const commission=(a.price*0.08).toFixed(2);
  const shippingCost=SHIPPING.find(s=>s.id===shipping)?.price||0;
  const total=(parseFloat(a.price)+parseFloat(commission)+shippingCost).toFixed(2);

  const doOrder=async()=>{
    await placeOrder(a,shipping);
    setOrdered(true);
  };

  const doMsg=async()=>{
    if(!msgText.trim())return;
    await sendMessage(a.id,a.user_id,msgText);
    setMsgText("");
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>

        <Logo size={18}/>

      </nav>

      {checkout&&!ordered&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
          <Card style={{maxWidth:440,width:"100%"}}>
            <h3 style={{fontSize:18,fontWeight:800,marginBottom:16}}>Finaliser l'achat</h3>
            <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16,background:C.gl,borderRadius:10,padding:"12px"}}>
              <div style={{fontSize:32}}>{ICONS[a.category]}</div>
              <div><div style={{fontWeight:700}}>{a.title}</div><div style={{fontSize:12,color:C.m}}>{a.state}</div></div>
              <div style={{marginLeft:"auto",fontWeight:900}}>{a.price} €</div>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Mode de livraison</div>
              {SHIPPING.map(s=>(
                <button key={s.id} onClick={()=>setShipping(s.id)}
                  style={{width:"100%",background:shipping===s.id?C.pl:C.w,border:`1.5px solid ${shipping===s.id?C.p:C.b}`,borderRadius:10,padding:"10px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",marginBottom:6,textAlign:"left"}}>
                  <div><div style={{fontSize:13,fontWeight:600}}>{s.label}</div><div style={{fontSize:11,color:C.m}}>{s.delay}</div></div>
                  <div style={{fontWeight:700,color:shipping===s.id?C.p:C.t}}>{s.price===0?"Gratuit":`${s.price} €`}</div>
                </button>
              ))}
            </div>
            <div style={{background:C.gl,borderRadius:10,padding:"12px 14px",marginBottom:16}}>
              {[["Article",`${a.price} €`],["Livraison",`${shippingCost} €`],["Protection acheteur",`${commission} €`]].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span style={{color:C.m}}>{k}</span><span>{v}</span></div>
              ))}
              <div style={{borderTop:`1px solid ${C.b}`,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:16}}>
                <span>Total</span><span style={{color:C.p}}>{total} €</span>
              </div>
            </div>
            <div style={{fontSize:11,color:C.m,marginBottom:14}}>🔒 Paiement sécurisé · Fonds libérés après confirmation de réception</div>

              <Btn onClick={()=>setCheckout(false)} variant="ghost" style={{flex:1,padding:"12px"}}>Annuler</Btn>

                {loading?"Traitement…":`Payer ${total} €`}
              </Btn>
            </div>
          </Card>
        </div>
      )}

      {ordered&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
          <Card style={{maxWidth:380,width:"100%",textAlign:"center",padding:"40px 28px"}}>
            <div style={{fontSize:56,marginBottom:14}}>🎉</div>
            <h3 style={{fontSize:20,fontWeight:800,marginBottom:8}}>Commande confirmée !</h3>
            <p style={{color:C.m,fontSize:14,marginBottom:24}}>Le vendeur a 7 jours pour expédier. Vous serez notifié dès l'envoi.</p>
            <Btn onClick={()=>go("dashboard")} style={{width:"100%",padding:"13px"}}>Voir mes commandes</Btn>
          </Card>
        </div>
      )}

      <div style={{maxWidth:960,margin:"24px auto",padding:"0 20px",display:"grid",gridTemplateColumns:"1fr 320px",gap:24}}>

              <div key={i} style={{width:64,height:64,borderRadius:8,border:`2px solid ${i===0?C.p:C.b}`,background:C.gl,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,cursor:"pointer"}}>{p}</div>

          {tab==="specs"&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[["Catégorie",a.category],["Marque",a.brand||"—"],["État",a.state],["Surface",a.surface||"—"],["Environnement",a.env||"—"],["Taille",a.size||"—"]].map(([k,v])=>(
                <Card key={k} style={{padding:"12px 14px"}}>
                  <div style={{fontSize:11,color:C.m,marginBottom:2}}>{k}</div>
                  <div style={{fontSize:14,fontWeight:600}}>{v}</div>
                </Card>

            </div>
          )}
          {tab==="msg"&&(
            <div>
              <div style={{background:C.w,border:`1px solid ${C.b}`,borderRadius:12,padding:14,marginBottom:12,minHeight:120,display:"flex",alignItems:"center",justifyContent:"center"}}>

                <Btn onClick={doMsg} style={{padding:"10px 18px",fontSize:13}}>Envoyer</Btn>
              </div>
            </div>
          )}
        </div>

        {/* RIGHT - STICKY */}
        <div style={{position:"sticky",top:20,alignSelf:"start"}}>
          <Card>
            <div style={{fontSize:12,color:C.m,marginBottom:4}}>{a.brand} · {a.category}</div>
            <h1 style={{fontSize:17,fontWeight:800,margin:"0 0 10px",lineHeight:1.3}}>{a.title}</h1>
            <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:4}}>
              <span style={{fontSize:26,fontWeight:900}}>{a.price} €</span>
            </div>
            <div style={{fontSize:12,color:C.m,marginBottom:6}}>+ Protection acheteur : {commission} €</div>
            <Badge label={a.state}/>

            {offerSent&&(
              <div style={{background:C.pl,border:`1px solid ${C.p}`,borderRadius:8,padding:"10px 14px",fontSize:13,color:C.pd,margin:"14px 0"}}>
                ✅ Offre de <strong>{offer} €</strong> envoyée. En attente du vendeur.
              </div>
            )}

            <div style={{display:"flex",flexDirection:"column",gap:10,margin:"16px 0"}}>
              <Btn onClick={()=>user?setCheckout(true):go("auth")} style={{padding:"14px",fontSize:15,width:"100%"}}>Acheter maintenant</Btn>
              <div style={{display:"flex",gap:8}}>
                <input type="number" value={offer} onChange={e=>setOffer(e.target.value)} placeholder="Votre offre €"
                  style={{flex:1,padding:"10px 12px",borderRadius:10,border:`1px solid ${C.b}`,fontSize:14}}/>
                <Btn onClick={()=>{if(offer){setOfferSent(true)}}} variant="outline" style={{padding:"10px 14px",fontSize:13}}>Offrir</Btn>
              </div>

            <div style={{borderTop:`1px solid ${C.b}`,paddingTop:14}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Vendeur</div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:C.pl,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,color:C.pd}}>V</div>
                <div><div style={{fontWeight:600,fontSize:14}}>Vendeur SMASHD</div><div style={{fontSize:12,color:C.m}}>⭐ 5.0 · Membre depuis 2024</div></div>
              </div>
            </div>

            <div style={{borderTop:`1px solid ${C.b}`,paddingTop:12}}>
              {[["🚚","Livraison dès 3,99 €"],["🔒","Paiement sécurisé"],["✅","Protection acheteur"],["↩️","Retour 14 jours"]].map(([i,l])=>(
                <div key={l} style={{display:"flex",gap:8,fontSize:12,color:C.m,marginBottom:6}}><span>{i}</span><span>{l}</span></div>
              ))}
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

      <div style={{display:"flex",flex:1}}>
        {/* SIDEBAR */}
        <aside style={{width:210,background:C.w,borderRight:`1px solid ${C.b}`,padding:"16px 10px",flexShrink:0}}>
          <div style={{marginBottom:16,padding:"10px 12px",background:C.gl,borderRadius:10}}>
            <div style={{fontSize:13,fontWeight:700}}>{profile?.name||"Utilisateur"}</div>
            <div style={{fontSize:11,color:C.m,marginTop:2}}>{profile?.email||""}</div>
            {isPro&&<Badge label="Vendeur Pro" color="orange"/>}
          </div>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setDashTab(t.id)}
              style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:"none",background:dashTab===t.id?C.pl:"transparent",color:dashTab===t.id?C.pd:C.m,fontWeight:dashTab===t.id?700:400,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left"}}>
              <span>{t.icon}</span>{t.label}
            </button>
          ))}
          <div style={{borderTop:`1px solid ${C.b}`,marginTop:12,paddingTop:12}}>
            <button onClick={logout} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:"none",background:"transparent",color:C.err,fontSize:13,cursor:"pointer",fontWeight:600}}>
              🚪 Déconnexion
            </button>
          </div>
        </aside>

        {/* MAIN */}
        <main style={{flex:1,padding:"24px",overflowY:"auto"}}>

          {/* OVERVIEW */}
          {dashTab==="overview"&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}>Bonjour, {profile?.name?.split(" ")[0]||"là"} 👋</h2>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12,marginBottom:24}}>
                <StatCard icon="💰" label="Revenus totaux" value={`${totalRevenu.toFixed(2)} €`} color={C.p}/>
                <StatCard icon="📦" label="Annonces actives" value={activeAnn}/>
                <StatCard icon="🛒" label="Ventes réalisées" value={mySales.length}/>
                <StatCard icon="📬" label="Achats effectués" value={myOrders.length}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                <Card>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Activité récente</div>
                  {myAnnonces.slice(0,3).map(a=>(
                    <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.b}`}}>
                      <span style={{fontSize:20}}>{ICONS[a.category]||"📦"}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                        <div style={{fontSize:11,color:C.m}}>{a.price} €</div>
                      </div>
                      <Badge label={a.status==="active"?"En ligne":a.status==="pause"?"En pause":"Vendu"} color={a.status==="active"?"green":a.status==="pause"?"orange":"gray"}/>
                    </div>
                  ))}
                  {myAnnonces.length===0&&<div style={{fontSize:13,color:C.m,textAlign:"center",padding:"20px 0"}}>Aucune annonce pour l'instant</div>}
                </Card>
                <Card>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>E-Wallet</div>
                  <div style={{fontSize:32,fontWeight:900,color:C.p,marginBottom:6}}>{wallet.toFixed(2)} €</div>
                  <div style={{fontSize:12,color:C.m,marginBottom:16}}>Solde disponible</div>
                  <Btn onClick={()=>setDashTab("wallet")} variant="outline" style={{width:"100%",padding:"10px"}}>Gérer mon wallet</Btn>
                </Card>
              </div>
            </div>
          )}

          {/* ANNONCES */}
          {dashTab==="annonces"&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                <h2 style={{fontSize:20,fontWeight:800,margin:0}}>Mes annonces</h2>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:C.m}}>
                    🌴 Mode vacances
                    <button onClick={()=>setVacanceMode(v=>!v)} style={{width:44,height:24,borderRadius:12,background:vacanceMode?C.p:C.gl,border:"none",cursor:"pointer",position:"relative",transition:"background .2s"}}>
                      <div style={{width:18,height:18,borderRadius:"50%",background:C.w,position:"absolute",top:3,left:vacanceMode?23:3,transition:"left .2s"}}/>
                    </button>
                  </div>
                  <Btn onClick={()=>go("sell")} style={{padding:"8px 16px",fontSize:13}}>+ Nouvelle</Btn>
                </div>
              </div>
              {vacanceMode&&<div style={{background:C.warnl,border:`1px solid ${C.warn}`,borderRadius:10,padding:"10px 14px",fontSize:13,color:C.warn,marginBottom:16}}>🌴 Mode vacances actif — Vos annonces sont masquées aux acheteurs</div>}
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {myAnnonces.map(a=>(
                  <Card key={a.id} style={{display:"flex",alignItems:"center",gap:14}}>
                    <div style={{fontSize:32,background:C.gl,borderRadius:8,width:52,height:52,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{ICONS[a.category]||"📦"}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,marginBottom:2}}>{a.title}</div>
                      <div style={{fontSize:12,color:C.m}}>{a.category} · {a.state} · {a.price} €</div>
                      <div style={{fontSize:11,color:C.m,marginTop:3}}>👁️ {a.views||0} vues · ❤️ {a.favs||0} favoris</div>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
                      <Badge label={a.status==="active"?"En ligne":a.status==="pause"?"En pause":a.status==="vendu"?"Vendu":"Supprimé"} color={a.status==="active"?"green":a.status==="pause"?"orange":a.status==="vendu"?"blue":"gray"}/>
                      {a.status!=="vendu"&&a.status!=="supprimé"&&(
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={()=>toggleAnnonceStatus(a.id,a.status==="pause"?"active":"pause")}
                            style={{fontSize:11,background:C.gl,border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",color:C.m,fontWeight:600}}>
                            {a.status==="pause"?"Activer":"Pause"}
                          </button>
                          {!boosted.includes(a.id)?(
                            <button onClick={()=>setBoostId(a.id)}
                              style={{fontSize:11,background:C.warnl,border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",color:C.warn,fontWeight:600}}>
                              🚀 Booster
                            </button>
                          ):(
                            <Badge label="✅ Boosté" color="green"/>
                          )}
                          <button onClick={()=>deleteAnnonce(a.id)}
                            style={{fontSize:11,background:C.errl,border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",color:C.err,fontWeight:600}}>
                            🗑️
                          </button>
                        </div>
                      )}
                    </div>
                  </Card>
                ))}
                {myAnnonces.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:C.m}}>Aucune annonce. <span style={{color:C.p,cursor:"pointer",fontWeight:600}} onClick={()=>go("sell")}>Publiez votre premier article →</span></div>}
              </div>

              {boostId&&(
                <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
                  <Card style={{maxWidth:360,width:"90%",textAlign:"center"}}>
                    <div style={{fontSize:40,marginBottom:10}}>🚀</div>
                    <h3 style={{fontSize:17,fontWeight:800,marginBottom:8}}>Booster cette annonce</h3>
                    <p style={{fontSize:13,color:C.m,marginBottom:20}}>Mise en avant 7 jours pour <strong>3,50 €</strong>. Multipliez vos vues par 5 !</p>
                    <div style={{display:"flex",gap:10}}>
                      <Btn onClick={()=>setBoostId(null)} variant="ghost" style={{flex:1,padding:"11px"}}>Annuler</Btn>
                      <Btn onClick={()=>{setBoosted(b=>[...b,boostId]);setBoostId(null);showToast("Annonce boostée 🚀")}} style={{flex:2,padding:"11px",background:C.a}}>Payer 3,50 €</Btn>
                    </div>
                  </Card>
                </div>
              )}
            </div>
          )}

          {/* VENTES */}
          {dashTab==="ventes"&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}>Mes ventes</h2>
              {mySales.length===0?(
                <div style={{textAlign:"center",padding:"40px 0",color:C.m}}>Aucune vente pour l'instant.</div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {mySales.map(v=>(
                    <Card key={v.id}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                        <div><div style={{fontSize:14,fontWeight:700}}>Commande #{v.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.m}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div></div>
                        <Badge label={v.status} color={v.status==="livré"?"green":v.status==="expédié"?"blue":v.status==="en attente"?"orange":"gray"}/>
                      </div>
                      <div style={{display:"flex",gap:16,fontSize:13}}>
                        <span><span style={{color:C.m}}>Prix : </span><strong>{v.price} €</strong></span>
                        <span><span style={{color:C.m}}>Commission : </span><span style={{color:C.a}}>- {v.commission} €</span></span>
                        <span><span style={{color:C.m}}>Gain net : </span><strong style={{color:C.p}}>{v.gain} €</strong></span>
                      </div>
                      {v.status==="en attente"&&(
                        <div style={{marginTop:10}}>
                          <Btn style={{padding:"8px 16px",fontSize:12}}>📦 Imprimer l'étiquette</Btn>
                        </div>
                      )}
                    </Card>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ACHATS */}
          {dashTab==="achats"&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}>Mes achats</h2>
              {myOrders.length===0?(
                <div style={{textAlign:"center",padding:"40px 0",color:C.m}}>Aucun achat pour l'instant. <span style={{color:C.p,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>Explorer le catalogue →</span></div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {myOrders.map(o=>(
                    <Card key={o.id}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                        <div><div style={{fontSize:14,fontWeight:700}}>Commande #{o.id?.slice(0,8)}</div><div style={{fontSize:12,color:C.m}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</div></div>
                        <Badge label={o.status} color={o.status==="livré"?"green":o.status==="expédié"?"blue":o.status==="en attente"?"orange":"gray"}/>
                      </div>
                      <div style={{fontSize:14,fontWeight:700}}>{o.price} € · {o.shipping_method}</div>
                    </Card>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* WALLET */}
          {dashTab==="wallet"&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}>Mon E-Wallet</h2>
              <div style={{background:C.p,borderRadius:16,padding:"28px 24px",marginBottom:20,color:"#fff",textAlign:"center"}}>
                <div style={{fontSize:13,opacity:.8,marginBottom:6}}>Solde disponible</div>
                <div style={{fontSize:42,fontWeight:900,marginBottom:16}}>{wallet.toFixed(2)} €</div>
                <Btn style={{background:"#fff",color:C.p,padding:"11px 28px"}}>🏦 Retirer les fonds</Btn>
              </div>
              <Card>
                <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Historique des transactions</div>
                {mySales.length===0?(
                  <div style={{textAlign:"center",padding:"20px 0",color:C.m,fontSize:13}}>Aucune transaction pour l'instant.</div>
                ):(
                  mySales.map((s,i)=>(
                    <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<mySales.length-1?`1px solid ${C.b}`:"none"}}>
                      <div><div style={{fontSize:13,fontWeight:600}}>Vente #{s.id?.slice(0,8)}</div><div style={{fontSize:11,color:C.m}}>{new Date(s.created_at).toLocaleDateString("fr-FR")}</div></div>
                      <div style={{fontSize:15,fontWeight:800,color:C.p}}>+{s.gain} €</div>
                    </div>
                  ))
                )}
              </Card>
            </div>
          )}

          {/* STATS */}
          {dashTab==="stats"&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}>Statistiques</h2>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12,marginBottom:24}}>
                <StatCard icon="👁️" label="Vues totales" value={myAnnonces.reduce((a,x)=>a+(x.views||0),0)}/>
                <StatCard icon="❤️" label="Favoris" value={myAnnonces.reduce((a,x)=>a+(x.favs||0),0)} color={C.a}/>
                <StatCard icon="🛒" label="Ventes" value={mySales.length} color={C.p}/>
                <StatCard icon="💰" label="Revenus" value={`${totalRevenu.toFixed(0)} €`} color={C.p}/>
              </div>
              <Card>
                <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Performance par annonce</div>
                {myAnnonces.map(a=>(
                  <div key={a.id} style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                      <span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"60%"}}>{a.title}</span>
                      <span style={{color:C.m}}>{a.views||0} vues</span>
                    </div>
                    <div style={{background:C.gl,borderRadius:4,height:8,overflow:"hidden"}}>
                      <div style={{background:C.p,height:"100%",borderRadius:4,width:`${Math.min((a.views||0)/Math.max(...myAnnonces.map(x=>x.views||1))*100,100)}%`}}/>
                    </div>
                  </div>
                ))}
                {myAnnonces.length===0&&<div style={{textAlign:"center",padding:"20px 0",color:C.m,fontSize:13}}>Pas encore de données.</div>}
              </Card>
            </div>
          )}

          {/* PRO */}
          {dashTab==="pro"&&isPro&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:6}}>Espace Vendeur Pro 🏪</h2>
              <p style={{color:C.m,fontSize:14,marginBottom:20}}>Gérez vos invendus et votre espace publicitaire.</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
                <Card style={{background:C.warnl,border:`1px solid ${C.warn}`}}>
                  <div style={{fontSize:22,marginBottom:8}}>🏅</div>
                  <div style={{fontSize:16,fontWeight:800,color:C.warn}}>Abonnement Pro</div>
                  <div style={{fontSize:13,color:C.warn,marginTop:4}}>Actif · Renouvellement le 01/01/2027</div>
                </Card>
                <Card>
                  <div style={{fontSize:22,marginBottom:8}}>📢</div>
                  <div style={{fontSize:16,fontWeight:800}}>Espace publicitaire</div>
                  <div style={{fontSize:13,color:C.m,marginTop:4}}>Gérez vos bannières promotionnelles</div>
                </Card>
              </div>
              <Card>
                <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Mes invendus</div>
                <Btn onClick={()=>go("sell")} style={{padding:"10px 20px",fontSize:13}}>+ Ajouter un invendu</Btn>
                <div style={{textAlign:"center",padding:"20px 0",color:C.m,fontSize:13,marginTop:10}}>Aucun invendu publié pour l'instant.</div>
              </Card>
            </div>
          )}

          {/* SETTINGS */}
          {dashTab==="settings"&&(
            <div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}>Paramètres</h2>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {[
                  ["👤","Informations personnelles","Nom, email, téléphone"],
                  ["🔒","Sécurité","Mot de passe, double authentification"],
                  ["💳","Moyens de paiement","Carte bancaire, IBAN"],
                  ["🔔","Notifications","Email, push, SMS"],
                  ["🌍","Langue","Français / English"],
                  ["🍪","Cookies & confidentialité","Gérer vos préférences"],
                  ["🗑️","Supprimer mon compte","Action irréversible"],
                ].map(([icon,title,sub])=>(
                  <Card key={title} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",padding:"14px 18px"}}>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <span style={{fontSize:20}}>{icon}</span>
                      <div>
                        <div style={{fontSize:14,fontWeight:600,color:title.includes("Supprimer")?C.err:C.t}}>{title}</div>
                        <div style={{fontSize:12,color:C.m}}>{sub}</div>
                      </div>
                    </div>
                    <span style={{color:C.m,fontSize:18}}>›</span>
                  </Card>
                ))}
              </div>
            </div>
          )}

        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
