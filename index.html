// API
const sbApi=async(path,opts={})=>{
  const res=await fetch(`${SB_URL}/rest/v1/${path}`,{
    headers:{"apikey":SB_KEY,"Authorization":`Bearer ${getToken()}`,"Content-Type":"application/json","Prefer":opts.prefer||"return=representation",...(opts.headers||{})},
    ...opts
  });
  if(!res.ok){const e=await res.json();throw new Error(e.message||"Erreur")}
  const tx=await res.text();return tx?JSON.parse(tx):[];
};
const sbAuth=async(ep,body)=>{
  const res=await fetch(`${SB_URL}/auth/v1/${ep}`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await res.json();
  if(d.error||d.error_description)throw new Error(d.error_description||d.error);
  return d;
};
const uploadPhoto=async(file)=>{
  const ext=file.name.split('.').pop();
  const name=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const res=await fetch(`${SB_URL}/storage/v1/object/smashd-photos/${name}`,{
    method:"POST",headers:{"apikey":SB_KEY,"Authorization":`Bearer ${getToken()}`,"Content-Type":file.type},body:file
  });
  if(!res.ok)throw new Error("Erreur upload");
  return `${SB_URL}/storage/v1/object/public/smashd-photos/${name}`;
};

const IconPlus=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
const IconArrow=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>;
const IconHeart=({filled})=><svg width="18" height="18" viewBox="0 0 24 24" fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;

const IconX=()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>;
const IconCheck=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M20 6 9 17l-5-5"/></svg>;
const IconLeaf=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
const IconShield=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
const IconTruck=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>;
const IconChevron=({dir="right"})=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{transform:dir==="down"?"rotate(90deg)":dir==="left"?"rotate(180deg)":"none"}}><path d="M9 18l6-6-6-6"/></svg>;
const IconGrid=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;

// UI Components
const Logo=({size=22,dark=false})=>(
  <span style={{fontWeight:900,fontSize:size,letterSpacing:"-1px",color:dark?D.white:D.black,cursor:"pointer"}}>
    SMASH<span style={{color:D.orange}}>D</span>
  </span>
);

const Toast=({msg,type})=>(
  <div style={{position:"fixed",bottom:32,left:"50%",transform:"translateX(-50%)",background:type==="error"?D.red:D.green,color:D.white,borderRadius:100,padding:"14px 28px",fontSize:14,fontWeight:600,zIndex:9999,boxShadow:"0 8px 32px rgba(0,0,0,.2)",whiteSpace:"nowrap"}}>

const Pill=({label,active,onClick,color})=>(

const StateTag=({state})=>{

// ═══════════ APP ═══════════
function App(){
  const [screen,setScreen]=useState("home");
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [annonces,setAnnonces]=useState([]);
  const [myAnnonces,setMyAnnonces]=useState([]);
  const [myOrders,setMyOrders]=useState([]);
  const [mySales,setMySales]=useState([]);
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(false);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("Tous");
  const [filterState,setFilterState]=useState("Tous");
  const [filterPrice,setFilterPrice]=useState({min:"",max:""});
  const [selected,setSelected]=useState(null);
  const [dashTab,setDashTab]=useState("overview");
  const [lang,setLang]=useState("FR");
  const [favs,setFavs]=useState({});

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000)};
  const go=(s,data=null)=>{setScreen(s);if(data)setSelected(data);window.scrollTo(0,0)};

  const loadAnnonces=async()=>{
    try{const d=await sbApi("annonces?status=eq.active&order=created_at.desc&limit=50");setAnnonces(d)}
    catch(e){console.error(e)}
  };
  const loadMyData=async(uid)=>{
    try{
      const [ann,orders,sales]=await Promise.all([
        sbApi(`annonces?user_id=eq.${uid}&order=created_at.desc`),
        sbApi(`commandes?buyer_id=eq.${uid}&order=created_at.desc`),
        sbApi(`commandes?seller_id=eq.${uid}&order=created_at.desc`),
      ]);
      setMyAnnonces(ann);setMyOrders(orders);setMySales(sales);
    }catch(e){console.error(e)}
  };
  useEffect(()=>{loadAnnonces()},[]);

  const login=async(email,pwd)=>{
    setLoading(true);
    try{
      const d=await sbAuth("token?grant_type=password",{email,password:pwd});
      setToken(d.access_token);setUser(d.user);
      const p=await sbApi(`profiles?id=eq.${d.user.id}`);
      setProfile(p[0]||null);
      await loadMyData(d.user.id);
      showToast("Bienvenue sur SMASHD");go("home");
    }catch(e){throw e}finally{setLoading(false)}
  };
  const register=async(email,pwd,name,userType,siret,company)=>{
    setLoading(true);
    try{
      const d=await sbAuth("signup",{email,password:pwd});
      if(d.user){
        if(d.access_token)setToken(d.access_token);
        await sbApi("profiles",{method:"POST",body:JSON.stringify({id:d.user.id,name,email,user_type:userType,siret:siret||null,company:company||null})});
        setUser(d.user);setProfile({id:d.user.id,name,email,user_type:userType});
        showToast("Compte créé avec succès");go("home");
      }
    }catch(e){throw e}finally{setLoading(false)}
  };
  const logout=()=>{clearToken();setUser(null);setProfile(null);setMyAnnonces([]);setMyOrders([]);setMySales([]);go("home")};

  const publishAnnonce=async(form)=>{
    if(!user){go("auth");return}
    setLoading(true);
    try{
      await sbApi("annonces",{method:"POST",body:JSON.stringify({user_id:user.id,...form,status:"active"})});
      showToast("Annonce publiée");await loadAnnonces();await loadMyData(user.id);
      go("dashboard");setDashTab("annonces");
    }catch(e){showToast("Erreur : "+e.message,"error")}
    finally{setLoading(false)}
  };
  const toggleAnnonceStatus=async(id,status)=>{
    try{await sbApi(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});await loadMyData(user.id);await loadAnnonces()}
    catch(e){showToast("Erreur","error")}
  };
  const deleteAnnonce=async(id)=>{
    try{await sbApi(`annonces?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status:"supprimé"})});await loadMyData(user.id);await loadAnnonces()}
    catch(e){showToast("Erreur","error")}
  };
  const placeOrder=async(annonce,shippingMethod)=>{
    if(!user){go("auth");return false}
    setLoading(true);
    try{
      const commission=parseFloat((annonce.price*0.08).toFixed(2));
      const gain=parseFloat((annonce.price-commission).toFixed(2));
      await sbApi("commandes",{method:"POST",body:JSON.stringify({annonce_id:annonce.id,buyer_id:user.id,seller_id:annonce.user_id,price:annonce.price,commission,gain,shipping_method:shippingMethod,status:"en attente"})});
      await sbApi(`annonces?id=eq.${annonce.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});
      showToast("Commande confirmée");await loadAnnonces();await loadMyData(user.id);return true;
    }catch(e){showToast("Erreur","error");return false}
    finally{setLoading(false)}
  };

  const filtered=annonces
    .filter(a=>filterCat==="Tous"||a.category===filterCat)
    .filter(a=>filterState==="Tous"||a.state===filterState)
    .filter(a=>!filterPrice.min||a.price>=parseFloat(filterPrice.min))
    .filter(a=>!filterPrice.max||a.price<=parseFloat(filterPrice.max))
    .filter(a=>!search||a.title?.toLowerCase().includes(search.toLowerCase())||a.brand?.toLowerCase().includes(search.toLowerCase()));

  const wallet=Math.round(mySales.reduce((acc,s)=>acc+(s.gain||0),0)*100)/100;
  const props={user,profile,loading,showToast,go,login,register,logout,publishAnnonce,toggleAnnonceStatus,deleteAnnonce,placeOrder,myAnnonces,myOrders,mySales,wallet,dashTab,setDashTab,annonces:filtered,allAnnonces:annonces,search,setSearch,filterCat,setFilterCat,filterState,setFilterState,filterPrice,setFilterPrice,selected,loadMyData,lang,setLang,favs,setFavs};

  return(
    <div>
      {toast&&<Toast {...toast}/>}
      {screen==="home"&&<Home {...props}/>}
      {screen==="auth"&&<Auth {...props}/>}
      {screen==="sell"&&<Sell {...props}/>}
      {screen==="article"&&<Article {...props}/>}
      {screen==="dashboard"&&<Dashboard {...props}/>}
    </div>
  );
}

// ═══════════ HOME ═══════════
function Home({user,profile,annonces,allAnnonces,search,setSearch,filterCat,setFilterCat,filterState,setFilterState,filterPrice,setFilterPrice,go,lang,setLang,favs,setFavs}){

  const [scrolled,setScrolled]=useState(false);
  useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>20);
    window.addEventListener("scroll",h);return()=>window.removeEventListener("scroll",h);
  },[]);

  return(
    <div style={{minHeight:"100vh",background:D.white}}>
      {/* NAV */}
      <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:scrolled?"rgba(255,255,255,.95)":"transparent",backdropFilter:scrolled?"blur(20px)":"none",borderBottom:scrolled?`1px solid ${D.gray200}`:"none",transition:"all .3s ease",padding:"0 40px",display:"flex",alignItems:"center",height:64,gap:32}}>
        <Logo size={22}/>
        <div style={{flex:1}}/>
        <div style={{display:"flex",alignItems:"center",gap:8,background:scrolled?D.gray100:"rgba(255,255,255,.15)",borderRadius:100,padding:"8px 16px",backdropFilter:"blur(10px)"}}>
          <IconSearch/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={lang==="FR"?"Raquette, marque…":"Racket, brand…"}
            style={{border:"none",background:"transparent",fontSize:14,outline:"none",width:200,color:scrolled?D.black:D.white}}/>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{display:"flex",background:"rgba(255,255,255,.15)",backdropFilter:"blur(10px)",borderRadius:100,overflow:"hidden",border:`1px solid rgba(255,255,255,.2)`}}>
            {["FR","EN"].map(l=>(
              <button key={l} onClick={()=>setLang(l)}
                style={{padding:"6px 14px",fontSize:12,fontWeight:700,border:"none",cursor:"pointer",background:lang===l?D.white:"transparent",color:lang===l?D.black:"rgba(255,255,255,.8)",transition:"all .15s",borderRadius:100}}>
                {l}
              </button>
            ))}
          </div>
          {user?(
            <>
              <button onClick={()=>go("sell")} className="btn-hover"
                style={{display:"flex",alignItems:"center",gap:6,background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                <IconPlus/> {lang==="FR"?"Vendre":"Sell"}
              </button>
              <button onClick={()=>go("dashboard")} className="btn-hover"
                style={{width:40,height:40,borderRadius:"50%",background:D.green,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:D.white,fontWeight:700,fontSize:14}}>
                {profile?.name?.charAt(0)||"?"}
              </button>
            </>
          ):(
            <>
              <button onClick={()=>go("auth")} className="btn-hover"
                style={{background:"rgba(255,255,255,.15)",color:D.white,border:"1px solid rgba(255,255,255,.3)",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer",backdropFilter:"blur(10px)"}}>
                {lang==="FR"?"Connexion":"Login"}
              </button>
              <button onClick={()=>go("auth")} className="btn-hover"
                style={{background:D.white,color:D.black,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                {lang==="FR"?"S'inscrire":"Sign up"}
              </button>
            </>
          )}
        </div>
      </nav>

      {/* HERO */}
      <div style={{background:D.green,minHeight:"90vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"120px 40px 80px",textAlign:"center",position:"relative",overflow:"hidden"}}>
        {/* BG Pattern */}
        <div style={{position:"absolute",inset:0,opacity:.05,backgroundImage:"radial-gradient(circle at 20% 50%, white 1px, transparent 1px), radial-gradient(circle at 80% 20%, white 1px, transparent 1px)",backgroundSize:"60px 60px"}}/>

        <div className="fade-up" style={{animationDelay:".1s"}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.1)",borderRadius:100,padding:"8px 18px",fontSize:12,fontWeight:600,color:"rgba(255,255,255,.8)",marginBottom:32,border:"1px solid rgba(255,255,255,.15)"}}>
            <IconLeaf/> {lang==="FR"?"Marketplace éco-responsable":"Eco-friendly marketplace"}
          </div>
        </div>

        <h1 className="fade-up" style={{animationDelay:".2s",fontSize:72,fontWeight:900,color:D.white,lineHeight:1.05,letterSpacing:"-2px",maxWidth:800,margin:"0 0 24px"}}>
          {lang==="FR"?"La seconde main pour les":"The second-hand for"}<br/>
          <span style={{color:D.greenAccent}}>{lang==="FR"?"sports de raquette":"racket sports"}</span>
        </h1>

        <p className="fade-up" style={{animationDelay:".3s",fontSize:18,color:"rgba(255,255,255,.7)",maxWidth:520,lineHeight:1.7,margin:"0 0 48px"}}>
          {lang==="FR"
            ?"Achetez et vendez vos équipements de tennis, padel, badminton et plus. Simple, sécurisé, éco-responsable."

        <div className="fade-up" style={{animationDelay:".4s",display:"flex",gap:12,flexWrap:"wrap",justifyContent:"center"}}>

        </div>

        {/* Stats */}

function Auth({login,register,loading,go}){

                      <input type="checkbox" checked={f.cgv} onChange={e=>set("cgv",e.target.checked)} style={{marginTop:3,accentColor:D.green}}/>

function Sell({publishAnnonce,loading,go}){
  const [step,setStep]=useState(0);
  const [f,setF]=useState({title:"",description:"",category:"",brand:"",state:"",price:"",shipping:"mondial"});
  const [photos,setPhotos]=useState([]);
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef();
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const STEPS=["Sport","Photos","Article","Prix","Envoi","Vérification"];
  const commission=f.price?(f.price*0.08).toFixed(2):0;
  const gain=f.price?(f.price*0.92).toFixed(2):0;

  const handleUpload=async(e)=>{
    const files=Array.from(e.target.files);
    if(photos.length+files.length>8){return}
    setUploading(true);
    try{const urls=await Promise.all(files.map(f=>uploadPhoto(f)));setPhotos(p=>[...p,...urls])}
    catch(e){alert("Erreur upload")}
    finally{setUploading(false)}
  };

  const canNext=()=>{
    if(step===0)return f.category;
    if(step===1)return photos.length>0;
    if(step===2)return f.brand&&f.state&&f.title;
    if(step===3)return f.price>0;
    if(step===4)return f.shipping;
    return true;
  };

  return(
    <div style={{minHeight:"100vh",background:D.white}}>
      {/* Header */}
      <div style={{background:D.white,borderBottom:`1px solid ${D.gray200}`,padding:"0 40px",display:"flex",alignItems:"center",height:64,gap:16,position:"sticky",top:0,zIndex:100}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:D.gray600,display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:500}}>
          <IconChevron dir="left"/> Retour
        </button>
        <Logo size={20}/>
        <div style={{flex:1,display:"flex",justifyContent:"center",gap:4}}>
          {STEPS.map((s,i)=>(
            <div key={s} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:i<step?D.green:i===step?D.black:D.gray100,color:i<=step?D.white:D.gray400,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>
                  {i<step?<IconCheck/>:i+1}
                </div>
                <span style={{fontSize:12,color:i===step?D.black:D.gray400,fontWeight:i===step?700:400,display:window.innerWidth<600?"none":"block"}}>{s}</span>
              </div>
              {i<STEPS.length-1&&<div style={{width:16,height:1,background:i<step?D.green:D.gray200,margin:"0 4px"}}/>}
            </div>
          ))}
        </div>
      </div>

      <div style={{maxWidth:600,margin:"0 auto",padding:"48px 24px"}}>

        {step===0&&(
          <div>
            <h2 style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Quel sport ?</h2>
            <p style={{color:D.gray400,fontSize:15,marginBottom:32}}>Sélectionnez la catégorie de votre article.</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
              {CATS.map(c=>(
                <button key={c} onClick={()=>set("category",c)} className="btn-hover"
                  style={{background:f.category===c?D.green:D.gray50,border:`1.5px solid ${f.category===c?D.green:D.gray200}`,borderRadius:16,padding:"24px 20px",cursor:"pointer",textAlign:"left",transition:"all .15s"}}>
                  <div style={{fontSize:13,fontWeight:700,color:f.category===c?D.greenAccent:"rgba(0,0,0,.3)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}}>Sport</div>
                  <div style={{fontSize:18,fontWeight:800,color:f.category===c?D.white:D.black}}>{c}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {step===1&&(
          <div>
            <h2 style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Les photos</h2>
            <p style={{color:D.gray400,fontSize:15,marginBottom:32}}>Jusqu'à 8 photos. La première sera la principale.</p>
            <div onClick={()=>!uploading&&fileRef.current.click()}
              style={{border:`2px dashed ${D.gray200}`,borderRadius:20,padding:"48px",textAlign:"center",cursor:"pointer",background:D.gray50,transition:"all .15s",marginBottom:20}}>
              <div style={{width:56,height:56,background:D.green,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}><IconPlus/></div>
              <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>{uploading?"Upload en cours…":"Ajouter des photos"}</div>
              <div style={{fontSize:13,color:D.gray400}}>JPG, PNG — Max 8 photos</div>
              <input ref={fileRef} type="file" accept="image/*" multiple onChange={handleUpload} style={{display:"none"}}/>
            </div>
            {photos.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {photos.map((url,i)=>(
                  <div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:12,overflow:"hidden",border:`2px solid ${i===0?D.green:D.gray200}`}}>
                    <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    {i===0&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:D.green,color:D.white,fontSize:10,fontWeight:700,padding:"4px 8px",textAlign:"center"}}>PRINCIPALE</div>}
                    <button onClick={()=>setPhotos(p=>p.filter((_,idx)=>idx!==i))}
                      style={{position:"absolute",top:6,right:6,width:24,height:24,background:"rgba(0,0,0,.7)",color:D.white,border:"none",borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><IconX/></button>
                  </div>
                ))}
                {photos.length<8&&<div onClick={()=>fileRef.current.click()} style={{aspectRatio:"1",borderRadius:12,border:`2px dashed ${D.gray200}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:24,color:D.gray400,background:D.gray50}}>+</div>}
              </div>
            )}
            {photos.length===0&&<div style={{background:"#FFF8E1",borderRadius:10,padding:"12px 16px",fontSize:13,color:"#8a6a00"}}>Au moins 1 photo requise pour continuer.</div>}
          </div>
        )}

        {step===2&&(
          <div>
            <h2 style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>L'article</h2>
            <p style={{color:D.gray400,fontSize:15,marginBottom:32}}>Décrivez votre article avec précision.</p>
            <div style={{marginBottom:24}}>
              <label style={{fontSize:13,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400}}>Marque</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {[...(BRANDS[f.category]||[]),"Autre"].filter((v,i,a)=>a.indexOf(v)===i).map(b=>(
                  <Pill key={b} label={b} active={f.brand===b} onClick={()=>set("brand",b)}/>
                ))}
              </div>
            </div>
            <div style={{marginBottom:24}}>
              <label style={{fontSize:13,fontWeight:700,display:"block",marginBottom:10,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400}}>État</label>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {STATES.map(s=><Pill key={s} label={s} active={f.state===s} onClick={()=>set("state",s)}/>)}
              </div>
            </div>
            <div style={{marginBottom:20}}>
              <label style={{fontSize:13,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400}}>Titre *</label>
              <input value={f.title} onChange={e=>set("title",e.target.value)} placeholder={`Ex: ${f.brand||"Wilson"} ${f.category} — Très bon état`}
                style={{width:"100%",padding:"14px 16px",borderRadius:12,border:`1.5px solid ${D.gray200}`,fontSize:15,outline:"none",boxSizing:"border-box"}}/>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:700,display:"block",marginBottom:8,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400}}>Description</label>
              <textarea value={f.description} onChange={e=>set("description",e.target.value)} rows={4}
                placeholder="Décrivez l'article : modèle, année, raison de la vente, défauts éventuels…"
                style={{width:"100%",padding:"14px 16px",borderRadius:12,border:`1.5px solid ${D.gray200}`,fontSize:15,resize:"vertical",boxSizing:"border-box",outline:"none"}}/>
            </div>
          </div>
        )}

        {step===3&&(
          <div>
            <h2 style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Le prix</h2>
            <p style={{color:D.gray400,fontSize:15,marginBottom:40}}>Positionnez-vous bien pour vendre rapidement.</p>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:32}}>
              <input type="number" value={f.price} onChange={e=>set("price",e.target.value)} placeholder="0"
                style={{width:180,padding:"20px 20px",borderRadius:16,border:`2px solid ${D.black}`,fontSize:36,fontWeight:900,textAlign:"center",outline:"none",letterSpacing:"-1px"}}/>
              <span style={{fontSize:36,fontWeight:900,color:D.gray400}}>€</span>
            </div>
            {f.price>0&&(
              <div style={{background:D.greenLight,borderRadius:16,padding:"20px 24px"}}>
                <div style={{fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400,marginBottom:14}}>Récapitulatif</div>
                {[["Prix de vente",`${f.price} €`],["Commission SMASHD (8%)",`- ${commission} €`]].map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:8,color:D.gray600}}><span>{k}</span><span>{v}</span></div>
                ))}
                <div style={{borderTop:`1px solid ${D.gray200}`,paddingTop:12,display:"flex",justifyContent:"space-between",fontSize:18,fontWeight:900}}>
                  <span>Vous recevez</span><span style={{color:D.green}}>{gain} €</span>
                </div>
              </div>
            )}
          </div>
        )}

        {step===4&&(
          <div>
            <h2 style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>L'envoi</h2>
            <p style={{color:D.gray400,fontSize:15,marginBottom:32}}>L'étiquette sera générée automatiquement après la vente.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {SHIPPING.map(s=>(
                <button key={s.id} onClick={()=>set("shipping",s.id)} className="btn-hover"
                  style={{background:f.shipping===s.id?D.green:D.white,border:`1.5px solid ${f.shipping===s.id?D.green:D.gray200}`,borderRadius:16,padding:"20px 24px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left",transition:"all .15s"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15,color:f.shipping===s.id?D.white:D.black}}>{s.label}</div>
                    <div style={{fontSize:13,color:f.shipping===s.id?"rgba(255,255,255,.6)":D.gray400,marginTop:2}}>Délai : {s.delay}</div>
                  </div>
                  <div style={{fontWeight:800,fontSize:18,color:f.shipping===s.id?D.white:D.black}}>{s.price===0?"Gratuit":`${s.price} €`}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {step===5&&(
          <div>
            <h2 style={{fontSize:28,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Vérification</h2>
            <p style={{color:D.gray400,fontSize:15,marginBottom:28}}>Tout est correct ? Publiez votre annonce.</p>
            <div style={{background:D.white,border:`1.5px solid ${D.gray200}`,borderRadius:20,overflow:"hidden",marginBottom:20}}>
              {photos.length>0
                ?<img src={photos[0]} alt="" style={{width:"100%",height:220,objectFit:"cover"}}/>
                :<div style={{height:140,background:D.gray100,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <div style={{width:48,height:48,background:CAT_COLORS[f.category]||D.green,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center"}}><IconGrid/></div>
                </div>
              }
              <div style={{padding:"20px 24px"}}>
                <StateTag state={f.state}/>
                <div style={{fontSize:20,fontWeight:800,margin:"8px 0 4px",letterSpacing:"-0.3px"}}>{f.title}</div>
                <div style={{fontSize:14,color:D.gray400,marginBottom:16}}>{f.brand} · {f.category}</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:28,fontWeight:900,letterSpacing:"-1px"}}>{f.price} €</div>
                  <div style={{fontSize:13,color:D.gray400}}>Vous recevrez {gain} €<br/>via {SHIPPING.find(s=>s.id===f.shipping)?.label}</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Nav */}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:40,paddingTop:32,borderTop:`1px solid ${D.gray200}`}}>
          {step>0
            ?<button onClick={()=>setStep(s=>s-1)} style={{background:D.gray100,color:D.black,border:"none",borderRadius:100,padding:"14px 28px",fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}><IconChevron dir="left"/> Retour</button>
            :<div/>
          }
          {step<STEPS.length-1
            ?<button onClick={()=>canNext()&&setStep(s=>s+1)} disabled={!canNext()||uploading} className="btn-hover"
                style={{background:canNext()&&!uploading?D.black:"#ccc",color:D.white,border:"none",borderRadius:100,padding:"14px 28px",fontSize:14,fontWeight:700,cursor:canNext()?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:8}}>
                {uploading?"Upload…":"Continuer"} {!uploading&&<IconArrow/>}
              </button>
            :<button onClick={()=>publishAnnonce({...f,photo_url:photos[0]||null,photos})} disabled={loading} className="btn-hover"
                style={{background:D.green,color:D.white,border:"none",borderRadius:100,padding:"14px 32px",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
                {loading?"Publication…":"Publier l'annonce"} {!loading&&<IconArrow/>}
              </button>
          }
        </div>
      </div>
    </div>
  );
}

// ═══════════ ARTICLE ═══════════
function Article({selected,go,user,placeOrder,loading,favs,setFavs}){
  const a=selected;
  const [tab,setTab]=useState("desc");
  const [shipping,setShipping]=useState("mondial");
  const [offer,setOffer]=useState("");
  const [offerSent,setOfferSent]=useState(false);
  const [checkout,setCheckout]=useState(false);
  const [ordered,setOrdered]=useState(false);
  const [mainPhoto,setMainPhoto]=useState(0);
  if(!a)return null;
  const photos=a.photos&&a.photos.length>0?a.photos:(a.photo_url?[a.photo_url]:[]);
  const commission=(a.price*0.08).toFixed(2);
  const shippingCost=SHIPPING.find(s=>s.id===shipping)?.price||0;
  const total=(parseFloat(a.price)+parseFloat(commission)+shippingCost).toFixed(2);
  const doOrder=async()=>{const ok=await placeOrder(a,shipping);if(ok)setOrdered(true)};

  return(
    <div style={{minHeight:"100vh",background:D.white}}>
      <nav style={{background:D.white,borderBottom:`1px solid ${D.gray200}`,padding:"0 40px",display:"flex",alignItems:"center",height:64,gap:16,position:"sticky",top:0,zIndex:100}}>
        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:D.gray600,display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:500}}><IconChevron dir="left"/> Retour</button>
        <Logo size={20}/>
      </nav>

      {checkout&&!ordered&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
          <div style={{background:D.white,borderRadius:24,padding:"32px",maxWidth:480,width:"100%",boxShadow:"0 32px 80px rgba(0,0,0,.2)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
              <h3 style={{fontSize:20,fontWeight:800}}>Finaliser l'achat</h3>
              <button onClick={()=>setCheckout(false)} style={{background:D.gray100,border:"none",borderRadius:"50%",width:36,height:36,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><IconX/></button>
            </div>
            <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:24,background:D.gray50,borderRadius:14,padding:"14px"}}>
              {photos.length>0?<img src={photos[0]} alt="" style={{width:56,height:56,objectFit:"cover",borderRadius:10}}/>:<div style={{width:56,height:56,background:D.gray200,borderRadius:10}}/>}
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>{a.title}</div><StateTag state={a.state}/></div>
              <div style={{fontWeight:900,fontSize:18}}>{a.price} €</div>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400,marginBottom:12}}>Mode de livraison</div>
              {SHIPPING.map(s=>(
                <button key={s.id} onClick={()=>setShipping(s.id)}
                  style={{width:"100%",background:shipping===s.id?D.greenLight:D.white,border:`1.5px solid ${shipping===s.id?D.green:D.gray200}`,borderRadius:12,padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",marginBottom:8,textAlign:"left",transition:"all .15s"}}>
                  <div><div style={{fontSize:14,fontWeight:600}}>{s.label}</div><div style={{fontSize:12,color:D.gray400}}>{s.delay}</div></div>
                  <div style={{fontWeight:700,color:shipping===s.id?D.green:D.black}}>{s.price===0?"Gratuit":`${s.price} €`}</div>
                </button>
              ))}
            </div>
            <div style={{background:D.gray50,borderRadius:14,padding:"16px",marginBottom:20}}>
              {[["Article",`${a.price} €`],["Livraison",`${shippingCost} €`],["Protection acheteur",`${commission} €`]].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:6,color:D.gray600}}><span>{k}</span><span>{v}</span></div>
              ))}
              <div style={{borderTop:`1px solid ${D.gray200}`,paddingTop:10,display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:18,marginTop:6}}>
                <span>Total</span><span style={{color:D.green}}>{total} €</span>
              </div>
            </div>
            <div style={{fontSize:12,color:D.gray400,marginBottom:16,display:"flex",alignItems:"center",gap:6}}><IconShield/> Paiement sécurisé — Fonds libérés après réception</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setCheckout(false)} style={{flex:1,background:D.gray100,color:D.black,border:"none",borderRadius:100,padding:"14px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Annuler</button>
              <button onClick={doOrder} disabled={loading} className="btn-hover"
                style={{flex:2,background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                {loading?"Traitement…":`Payer ${total} €`}
              </button>
            </div>
          </div>
        </div>
      )}

      {ordered&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
          <div style={{background:D.white,borderRadius:24,padding:"48px 40px",maxWidth:400,textAlign:"center",boxShadow:"0 32px 80px rgba(0,0,0,.2)"}}>
            <div style={{width:72,height:72,background:D.greenLight,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px",color:D.green}}><IconCheck/></div>
            <h3 style={{fontSize:24,fontWeight:900,marginBottom:10}}>Commande confirmée</h3>
            <p style={{color:D.gray400,fontSize:14,marginBottom:32,lineHeight:1.7}}>Le vendeur a 7 jours pour expédier votre article. Vous serez notifié dès l'envoi.</p>
            <button onClick={()=>go("dashboard")} className="btn-hover"
              style={{background:D.green,color:D.white,border:"none",borderRadius:100,padding:"16px 36px",fontSize:15,fontWeight:700,cursor:"pointer",width:"100%"}}>
              Voir mes commandes
            </button>
          </div>
        </div>
      )}

      <div style={{maxWidth:1100,margin:"0 auto",padding:"48px 40px",display:"grid",gridTemplateColumns:"1fr 360px",gap:48}}>
        <div>
          {/* Main photo */}
          <div style={{background:D.gray100,borderRadius:20,height:400,overflow:"hidden",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {photos.length>0
              ?<img src={photos[mainPhoto]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              :<div style={{width:80,height:80,background:CAT_COLORS[a.category]||D.green,borderRadius:20,display:"flex",alignItems:"center",justifyContent:"center"}}><IconGrid/></div>
            }
          </div>
          {photos.length>1&&(
            <div style={{display:"flex",gap:8,marginBottom:32}}>
              {photos.map((url,i)=>(
                <div key={i} onClick={()=>setMainPhoto(i)}
                  style={{width:72,height:72,borderRadius:12,overflow:"hidden",border:`2px solid ${mainPhoto===i?D.black:D.gray200}`,cursor:"pointer",flexShrink:0}}>
                  <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                </div>
              ))}
            </div>
          )}

          {/* Tabs */}
          <div style={{display:"flex",borderBottom:`1px solid ${D.gray200}`,marginBottom:24}}>
            {[["desc","Description"],["specs","Caractéristiques"]].map(([id,l])=>(
              <button key={id} onClick={()=>setTab(id)}
                style={{background:"none",border:"none",borderBottom:`2px solid ${tab===id?D.black:"transparent"}`,padding:"12px 0",marginRight:32,fontSize:14,fontWeight:tab===id?700:400,color:tab===id?D.black:D.gray400,cursor:"pointer"}}>
                {l}
              </button>
            ))}
          </div>
          {tab==="desc"&&<p style={{fontSize:15,lineHeight:1.8,color:D.gray600}}>{a.description||"Aucune description fournie."}</p>}
          {tab==="specs"&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[["Catégorie",a.category],["Marque",a.brand||"—"],["État",a.state],["Livraison",SHIPPING.find(s=>s.id===a.shipping)?.label||"—"]].map(([k,v])=>(
                <div key={k} style={{background:D.gray50,borderRadius:12,padding:"14px 16px"}}>
                  <div style={{fontSize:11,fontWeight:700,color:D.gray400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:4}}>{k}</div>
                  <div style={{fontSize:15,fontWeight:600}}>{v}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Sticky panel */}
        <div style={{position:"sticky",top:80,alignSelf:"start"}}>
          <div style={{fontSize:12,fontWeight:700,color:D.gray400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}}>{a.brand} · {a.category}</div>
          <h1 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:8,lineHeight:1.2}}>{a.title}</h1>
          <StateTag state={a.state}/>
          <div style={{fontSize:42,fontWeight:900,letterSpacing:"-2px",margin:"16px 0 4px"}}>{a.price} €</div>
          <div style={{fontSize:13,color:D.gray400,marginBottom:24}}>+ protection acheteur {commission} €</div>

          {offerSent&&(
            <div style={{background:D.greenLight,border:`1px solid ${D.green}`,borderRadius:12,padding:"12px 16px",fontSize:13,color:D.green,marginBottom:16,fontWeight:500}}>
              Offre de <strong>{offer} €</strong> envoyée au vendeur.
            </div>
          )}

          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>
            <button onClick={()=>user?setCheckout(true):go("auth")} className="btn-hover"
              style={{background:D.green,color:D.white,border:"none",borderRadius:100,padding:"18px",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              Acheter maintenant <IconArrow/>
            </button>
            <div style={{display:"flex",gap:8}}>
              <input type="number" value={offer} onChange={e=>setOffer(e.target.value)} placeholder="Proposer un prix €"
                style={{flex:1,padding:"14px 16px",borderRadius:100,border:`1.5px solid ${D.gray200}`,fontSize:14,outline:"none"}}/>
              <button onClick={()=>offer&&setOfferSent(true)} className="btn-hover"
                style={{background:D.white,color:D.black,border:`1.5px solid ${D.black}`,borderRadius:100,padding:"14px 20px",fontSize:14,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                Offrir
              </button>
            </div>
            <button onClick={()=>setFavs(f=>({...f,[a.id]:!f[a.id]}))}
              style={{background:"none",border:`1.5px solid ${favs[a.id]?D.orange:D.gray200}`,borderRadius:100,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer",color:favs[a.id]?D.orange:D.gray400,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <IconHeart filled={favs[a.id]}/> {favs[a.id]?"Sauvegardé":"Sauvegarder"}
            </button>
          </div>

          <div style={{borderTop:`1px solid ${D.gray200}`,paddingTop:20}}>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {[[<IconTruck/>,"Livraison dès 3,99 €"],[<IconShield/>,"Paiement sécurisé Stripe"],[<IconCheck/>,"Protection acheteur incluse"],[<IconLeaf/>,"Article de seconde main vérifié"]].map(([icon,l])=>(
                <div key={l} style={{display:"flex",gap:12,alignItems:"center",fontSize:14,color:D.gray600}}>
                  <div style={{color:D.green,flexShrink:0}}>{icon}</div>
                  {l}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════ DASHBOARD ═══════════
function Dashboard({user,profile,go,logout,myAnnonces,myOrders,mySales,wallet,dashTab,setDashTab,toggleAnnonceStatus,deleteAnnonce,showToast}){

    {id:"overview",label:"Vue d'ensemble"},
    {id:"annonces",label:"Mes annonces"},
    {id:"ventes",label:"Mes ventes"},
    {id:"achats",label:"Mes achats"},
    {id:"wallet",label:"E-Wallet"},
    {id:"stats",label:"Statistiques"},

    <div style={{minHeight:"100vh",background:D.gray50}}>
      {/* Top nav */}
      <nav style={{background:D.white,borderBottom:`1px solid ${D.gray200}`,padding:"0 40px",display:"flex",alignItems:"center",height:64,gap:16,position:"sticky",top:0,zIndex:100}}>

        <Logo size={20}/>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:12}}>
          <button onClick={()=>go("sell")} className="btn-hover"
            style={{background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
            <IconPlus/> Vendre
          </button>
          <div style={{width:40,height:40,borderRadius:"50%",background:isPro?D.black:D.green,display:"flex",alignItems:"center",justifyContent:"center",color:D.white,fontWeight:700,fontSize:15}}>
            {profile?.name?.charAt(0)||"?"}
          </div>
        </div>
      </nav>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"32px 40px",display:"grid",gridTemplateColumns:"200px 1fr",gap:32}}>
        {/* Sidebar */}
        <div>
          <div style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"16px",marginBottom:12}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:2}}>{profile?.name||"Utilisateur"}</div>
            <div style={{fontSize:12,color:D.gray400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{profile?.email}</div>
            {isPro&&<div style={{marginTop:8,background:D.black,color:D.white,borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,display:"inline-block"}}>PRO</div>}
          </div>
          <div style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"8px",overflow:"hidden"}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setDashTab(t.id)}
                style={{width:"100%",display:"block",padding:"10px 14px",borderRadius:10,border:"none",background:dashTab===t.id?D.black:"transparent",color:dashTab===t.id?D.white:D.gray600,fontWeight:dashTab===t.id?700:500,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left",transition:"all .15s"}}>
                {t.label}
              </button>
            ))}
            <div style={{borderTop:`1px solid ${D.gray200}`,marginTop:8,paddingTop:8}}>
              <button onClick={logout}
                style={{width:"100%",display:"block",padding:"10px 14px",borderRadius:10,border:"none",background:"transparent",color:D.red,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>
                Déconnexion
              </button>
            </div>
          </div>
        </div>

        {/* Main */}
        <div>

          {dashTab==="overview"&&(
            <div>
              <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:24}}>Bonjour, {profile?.name?.split(" ")[0]} 👋</h2>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>
                {[[`${totalRevenu.toFixed(2)} €`,"Revenus",D.green],[myAnnonces.filter(a=>a.status==="active").length,"Annonces actives",D.black],[mySales.length,"Ventes",D.orange],[myOrders.length,"Achats",D.gray800]].map(([v,l,c])=>(
                  <div key={l} style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"20px"}}>
                    <div style={{fontSize:28,fontWeight:900,color:c,letterSpacing:"-1px"}}>{v}</div>
                    <div style={{fontSize:13,color:D.gray400,marginTop:4,fontWeight:500}}>{l}</div>
                  </div>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                <div style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"20px"}}>
                  <div style={{fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400,marginBottom:16}}>Annonces récentes</div>
                  {myAnnonces.slice(0,4).map(a=>(
                    <div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:`1px solid ${D.gray100}`}}>
                      <div style={{width:40,height:40,borderRadius:10,overflow:"hidden",background:D.gray100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:20,height:20,background:CAT_COLORS[a.category]||D.green,borderRadius:4}}/>}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                        <div style={{fontSize:12,color:D.gray400}}>{a.price} €</div>
                      </div>
                      <div style={{fontSize:11,fontWeight:700,color:a.status==="active"?D.green:D.gray400,textTransform:"uppercase"}}>{a.status==="active"?"Actif":"Inactif"}</div>
                    </div>
                  ))}
                  {myAnnonces.length===0&&<div style={{fontSize:13,color:D.gray400,textAlign:"center",padding:"20px 0"}}>Aucune annonce</div>}
                </div>
                <div style={{background:D.green,borderRadius:16,padding:"24px"}}>
                  <div style={{fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.5)",marginBottom:8}}>E-Wallet</div>
                  <div style={{fontSize:40,fontWeight:900,color:D.white,letterSpacing:"-2px",marginBottom:4}}>{wallet.toFixed(2)} €</div>
                  <div style={{fontSize:13,color:"rgba(255,255,255,.5)",marginBottom:24}}>Solde disponible</div>
                  <button onClick={()=>setDashTab("wallet")} className="btn-hover"

                    Gérer mon wallet

                </div>
              </div>
            </div>
          )}

          {dashTab==="annonces"&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
                <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px"}}>Mes annonces</h2>
                <button onClick={()=>go("sell")} className="btn-hover"
                  style={{background:D.black,color:D.white,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>

              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {myAnnonces.map(a=>(
                  <div key={a.id} style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"16px 20px",display:"flex",alignItems:"center",gap:16}}>

                      {a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:24,height:24,background:CAT_COLORS[a.category]||D.green,borderRadius:6}}/>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:15,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                      <div style={{fontSize:13,color:D.gray400,marginTop:2}}>{a.category} · {a.price} €</div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{fontSize:11,fontWeight:700,color:a.status==="active"?D.green:a.status==="pause"?D.orange:D.gray400,textTransform:"uppercase",letterSpacing:".5px",background:a.status==="active"?D.greenLight:a.status==="pause"?"#FFF3E0":D.gray100,padding:"4px 10px",borderRadius:100}}>{a.status==="active"?"En ligne":a.status==="pause"?"En pause":"Vendu"}</div>
                      {a.status!=="vendu"&&a.status!=="supprimé"&&(

                            {a.status==="pause"?"Activer":"Pause"}
                          </button>

                          <button onClick={()=>deleteAnnonce(a.id)}

              </div>
              {boostId&&(

                      <button onClick={()=>{setBoosted(b=>[...b,boostId]);setBoostId(null);showToast&&showToast("Annonce boostée !")}} className="btn-hover"
                        style={{flex:2,background:D.orange,color:D.white,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Payer 3,50 €</button>
                    </div>

                </div>

          {dashTab==="ventes"&&(
            <div>
              <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:24}}>Mes ventes</h2>

                  {mySales.map(v=>(
                    <div key={v.id} style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"18px 22px"}}>

                        <div><div style={{fontSize:15,fontWeight:700}}>Commande #{v.id?.slice(0,8)}</div><div style={{fontSize:13,color:D.gray400,marginTop:2}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div></div>

                      </div>
                      <div style={{display:"flex",gap:24,fontSize:14}}>
                        <span><span style={{color:D.gray400}}>Prix : </span><strong>{v.price} €</strong></span>
                        <span><span style={{color:D.gray400}}>Commission : </span><span style={{color:D.red}}>- {v.commission} €</span></span>
                        <span><span style={{color:D.gray400}}>Net : </span><strong style={{color:D.green}}>{v.gain} €</strong></span>
                      </div>
                    </div>
                  ))}
                </div>
              }
            </div>
          )}

          {dashTab==="achats"&&(
            <div>
              <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:24}}>Mes achats</h2>

                ?<div style={{textAlign:"center",padding:"60px",color:D.gray400,background:D.white,borderRadius:16,border:`1px solid ${D.gray200}`}}>Aucun achat. <span style={{color:D.green,cursor:"pointer",fontWeight:600}} onClick={()=>go("home")}>Explorer le catalogue</span></div>

                  {myOrders.map(o=>(
                    <div key={o.id} style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"18px 22px"}}>

                    <div key={s.id} style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderBottom:i<mySales.length-1?`1px solid ${D.gray100}`:"none"}}>

                  <div key={l} style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"20px"}}>
                    <div style={{fontSize:26,fontWeight:900,letterSpacing:"-1px"}}>{v}</div>

                <div style={{fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400,marginBottom:16}}>Performance par annonce</div>

                    <div key={a.id} style={{marginBottom:16}}>

                        <span style={{color:D.gray400}}>{a.views||0} vues</span>

                      </div>
                    </div>
                  ))
                }
              </div>
            </div>
          )}

          {dashTab==="pro"&&isPro&&(
            <div>
              <h2 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Espace Vendeur Pro</h2>

                <div style={{background:D.black,borderRadius:16,padding:"24px",color:D.white}}>
                  <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:12}}>Abonnement</div>
                  <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>PRO Actif</div>

                <div style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"24px"}}>
                  <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400,marginBottom:12}}>Publicité</div>
                  <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>Espace pub</div>
                  <div style={{fontSize:13,color:D.gray400}}>Gérez vos bannières</div>
                </div>
              </div>
              <div style={{background:D.white,border:`1px solid ${D.gray200}`,borderRadius:16,padding:"24px"}}>
                <div style={{fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:D.gray400,marginBottom:16}}>Invendus</div>

                {[["Informations personnelles","Nom, email, téléphone"],["Sécurité","Mot de passe, 2FA"],["Moyens de paiement","Carte bancaire, IBAN"],["Notifications","Email, push, SMS"],["Langue","Français / English"],["Supprimer mon compte","Action irréversible"]].map(([t,s],i)=>(
