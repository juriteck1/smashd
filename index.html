.drop-header{background:#0A2A1E;border-radius:24px 24px 0 0;padding:28px 28px 24px;position:relative;overflow:hidden}
.drop-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0%,rgba(0,196,106,.15),transparent 60%)}
.drop-header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,196,106,.15);border:1px solid rgba(0,196,106,.25);border-radius:100px;padding:4px 12px;font-size:11px;font-weight:700;color:#00C46A;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px}

.drop-header p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}

.drop-close:hover{background:rgba(255,255,255,.2)}

.drop-group{margin-bottom:15px}
.drop-label{font-size:11px;font-weight:700;color:#9A9A9A;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px}

.mode-card:hover{border-color:#9A9A9A}
.mode-card.selected{border-color:#0A2A1E;background:#F0F7F4}
.mode-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

  return txt
    .replace(/(\+33|0)[0-9][\s.\-]?([0-9]{2}[\s.\-]?){4}/g,"[numéro masqué]")

    for(let i=0;i<3;i++){
      if(dates[`${drop.id}_${i}`]&&lieux[`${drop.id}_${i}`])
        slots.push({remise_id:drop.id,date_heure:dates[`${drop.id}_${i}`],lieu_precis:lieux[`${drop.id}_${i}`]});
    }
    if(!slots.length){tw("Ajoutez au moins 1 créneau","error");return;}
    setBusy(true);
    try{
      await Promise.all(slots.map(s=>api("drop_creneaux",{method:"POST",body:JSON.stringify(s)})));
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({status:"creneaux_proposes",updated_at:new Date().toISOString()})});
      tw("Créneaux envoyés à l'acheteur !");
      // Notifier l'acheteur
      try{
        const remiseData=await api("drop_remises?id=eq."+drop.id);
        const acheteur=await api("profiles?id=eq."+remiseData[0]?.acheteur_id);
        if(acheteur[0]?.email){
          const annonce=annonces.find(a=>a.id===drop.annonce_id);
          sendNotif("creneaux_disponibles",acheteur[0].email,{titre:annonce?.title||"Article",nb_creneaux:slots.length});
        }
      }catch(e){}
      onRefresh();setSel(null);
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };

  const validerCode=async(drop)=>{
    const code=codeVal.trim().toUpperCase();
    if(code!==drop.code){setCodeErr("Code incorrect");return;}
    setBusy(true);
    try{
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({status:"confirme",code_used:true,updated_at:new Date().toISOString()})});
      await api(`commandes?id=eq.${drop.commande_id}`,{method:"PATCH",body:JSON.stringify({status:"livré",escrow_status:"libéré",drop_status:"confirme"})});
      tw("🎉 Transaction validée ! Fonds débloqués dans votre wallet.");
      // Notifier le vendeur
      try{
        const vendeur=await api("profiles?id=eq."+user.id);
        if(vendeur[0]?.email){
          const annonce=annonces.find(a=>a.id===drop.annonce_id);
          sendNotif("transaction_validee",vendeur[0].email,{titre:annonce?.title||"Article",gain:annonce?.price||"—"});
        }
      }catch(e){}
      onRefresh();setCodeVal("");setCodeErr("");
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };

  const pending=drops.filter(d=>d.status==="mode_choisi");
  const active=drops.filter(d=>["creneaux_proposes","creneau_accepte","code_envoye"].includes(d.status));
  const done=drops.filter(d=>["confirme","litige","expire"].includes(d.status));


  return(
    <div>
      <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Drop Vendeur</h2>
      <p style={{fontSize:14,color:"#9A9A9A",marginBottom:20}}>Gérez vos ventes et proposez des créneaux à vos acheteurs.</p>
      {drops.length===0
        ?<div style={{textAlign:"center",padding:"44px",color:"#9A9A9A",background:"#fff",borderRadius:13,border:"1px solid #E8E8E8"}}><div style={{fontSize:32,marginBottom:12}}>📦</div><div style={{fontWeight:600}}>Aucune vente en cours</div></div>
        :<div>
          {pending.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:"#C25A00",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
              ⚡ Action requise — Proposez des créneaux ({pending.length})
            </div>
            {pending.map(d=><DropVendeurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} messages={messages} sel={sel} setSel={setSel} dates={dates} setDates={setDates} lieux={lieux} setLieux={setLieux} codeVal={codeVal} setCodeVal={setCodeVal} codeErr={codeErr} setCodeErr={setCodeErr} busy={busy} validerCode={validerCode} proposer={proposer} api={api} tw={tw}/>)}
          </div>}
          {active.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:"#1A3A8C",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>📅 En cours ({active.length})</div>
            {active.map(d=><DropVendeurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} messages={messages} sel={sel} setSel={setSel} dates={dates} setDates={setDates} lieux={lieux} setLieux={setLieux} codeVal={codeVal} setCodeVal={setCodeVal} codeErr={codeErr} setCodeErr={setCodeErr} busy={busy} validerCode={validerCode} proposer={proposer} api={api} tw={tw}/>)}
          </div>}
          {done.length>0&&<div>
            <div style={{fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px",marginBottom:8}}>✅ Terminés ({done.length})</div>
            {done.map(d=><DropVendeurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} messages={messages} sel={sel} setSel={setSel} dates={dates} setDates={setDates} lieux={lieux} setLieux={setLieux} codeVal={codeVal} setCodeVal={setCodeVal} codeErr={codeErr} setCodeErr={setCodeErr} busy={busy} validerCode={validerCode} proposer={proposer} api={api} tw={tw}/>)}
          </div>}
        </div>
      }
    </div>
  );
}

function DropAcheteurPanel({drops=[],creneaux=[],messages=[],annonces=[],user,tw,onRefresh}){
  const[sel,setSel]=useState(null);
  const[busy,setBusy]=useState(false);

  const getAnnonce=(drop)=>annonces.find(a=>a.id===drop.annonce_id);

  const accepter=async(drop,cr)=>{
    setBusy(true);
    try{
      await api(`drop_creneaux?id=eq.${cr.id}`,{method:"PATCH",body:JSON.stringify({status:"accepté"})});
      const autres=creneaux.filter(c=>c.remise_id===drop.id&&c.id!==cr.id);
      await Promise.all(autres.map(c=>api(`drop_creneaux?id=eq.${c.id}`,{method:"PATCH",body:JSON.stringify({status:"refusé"})})));
      const code=genCode();
      const expires=new Date(Date.now()+48*3600*1000).toISOString();
      await api(`drop_remises?id=eq.${drop.id}`,{method:"PATCH",body:JSON.stringify({
        status:"code_envoye",creneau_retenu_id:cr.id,
        lieu_final:cr.lieu_precis,date_finale:cr.date_heure,
        code,code_expires_at:expires,updated_at:new Date().toISOString()
      })});
      tw("✅ RDV confirmé ! Votre code Drop est prêt.");
      // Notifier le vendeur
      try{
        const remiseData=await api("drop_remises?id=eq."+drop.id);
        const vendeur=await api("profiles?id=eq."+remiseData[0]?.vendeur_id);
        if(vendeur[0]?.email){
          const annonce=annonces.find(a=>a.id===drop.annonce_id);
          const dateStr=new Date(cr.date_heure).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
          sendNotif("creneau_accepte",vendeur[0].email,{titre:annonce?.title||"Article",date:dateStr,lieu:cr.lieu_precis});
        }
      }catch(e){}
      onRefresh();
    }catch(e){tw("Erreur","error")}
    finally{setBusy(false)}
  };


  return(
    <div>
      <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Drop Acheteur</h2>
      <p style={{fontSize:14,color:"#9A9A9A",marginBottom:20}}>Suivez vos achats et confirmez les remises.</p>
      {drops.length===0
        ?<div style={{textAlign:"center",padding:"44px",color:"#9A9A9A",background:"#fff",borderRadius:13,border:"1px solid #E8E8E8"}}><div style={{fontSize:32,marginBottom:12}}>🛒</div><div style={{fontWeight:600}}>Aucun achat en cours</div></div>
        :drops.map(d=><DropAcheteurCard key={d.id} drop={d} annonces={annonces} creneaux={creneaux} sel={sel} setSel={setSel} busy={busy} accepter={accepter} tw={tw}/>)
      }
    </div>
  );
}

function ProfilPublic({userId, go, user, tw}){
  const[profil,setProfil]=useState(null);
  const[annonces,setAnnonces]=useState([]);
  const[avis,setAvis]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAvisForm,setShowAvisForm]=useState(false);
  const[myNote,setMyNote]=useState(0);
  const[myComment,setMyComment]=useState("");
  const[sendingAvis,setSendingAvis]=useState(false);
  const[editBio,setEditBio]=useState(false);
  const[bioText,setBioText]=useState("");
  const[avatarLoad,setAvatarLoad]=useState(false);
  const[canRate,setCanRate]=useState(false);
  const[alreadyRated,setAlreadyRated]=useState(false);
  const avatarRef=useRef();

  const isOwnProfile=user?.id===userId;
  const avgNote=avis.length>0?(avis.reduce((a,b)=>a+b.note,0)/avis.length).toFixed(1):null;

  useEffect(()=>{
    if(!userId)return;
    setLoading(true);
    const promises = [
      api(`profiles?id=eq.${userId}`),
      api(`annonces?user_id=eq.${userId}&status=eq.active&order=created_at.desc&limit=12`),
      api(`avis?cible_id=eq.${userId}&order=created_at.desc`)
    ];
    // Vérifier si l'utilisateur connecté a une transaction confirmée avec ce vendeur
    if(user?.id && user.id !== userId){
      promises.push(
        api(`drop_remises?vendeur_id=eq.${userId}&acheteur_id=eq.${user.id}&status=eq.confirme`),
        api(`avis?cible_id=eq.${userId}&auteur_id=eq.${user.id}`)
      );
    }
    Promise.all(promises).then(([p,a,av,transactions,myAvis])=>{
      setProfil(p[0]||null);
      setBioText(p[0]?.bio||"");
      setAnnonces(a);
      setAvis(av);
      if(transactions!==undefined) setCanRate(transactions.length>0);
      if(myAvis!==undefined) setAlreadyRated(myAvis.length>0);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[userId]);

  const saveAvis=async()=>{
    if(!myNote){tw("Choisissez une note","error");return;}
    if(!user){go("auth");return;}
    setSendingAvis(true);
    try{
      await api("avis",{method:"POST",body:JSON.stringify({
        auteur_id:user.id,
        cible_id:userId,
        role_auteur:"acheteur",
        note:myNote,
        commentaire:myComment||null
      })});
      tw("Avis publié !");
      setShowAvisForm(false);
      const av=await api(`avis?cible_id=eq.${userId}&order=created_at.desc`);
      setAvis(av);
    }catch(e){tw("Erreur : vous avez peut-être déjà laissé un avis","error")}
    finally{setSendingAvis(false)}
  };

  const saveBio=async()=>{
    try{
      await api(`profiles?id=eq.${userId}`,{method:"PATCH",body:JSON.stringify({bio:bioText})});
      setProfil(p=>({...p,bio:bioText}));
      setEditBio(false);
      tw("Bio mise à jour !");
    }catch(e){tw("Erreur","error")}
  };

  const uploadAvatar=async(e)=>{
    const f=e.target.files[0];if(!f)return;
    setAvatarLoad(true);
    try{
      const url=await uploadPhoto(f);
      await api(`profiles?id=eq.${userId}`,{method:"PATCH",body:JSON.stringify({avatar_url:url})});

    </div>

        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",gap:5,fontSize:14}}><Ico.chL/> Retour</button>
        <Logo s={18}/>
      </nav>

      <div style={{maxWidth:900,margin:"0 auto",padding:"32px 20px"}}>

function ResetPassword({go}){
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[load,setLoad]=useState(false);
  const[done,setDone]=useState(false);
  const[err,setErr]=useState("");

  const doReset=async()=>{
    if(!pwd||pwd.length<6){setErr("6 caractères minimum");return;}
    if(pwd!==pwd2){setErr("Les mots de passe ne correspondent pas");return;}
    setLoad(true);
    try{
      // Récupérer le token depuis le hash Supabase (#access_token=xxx&type=recovery)
      const hash=window.location.hash.substring(1); // enlever le #
      const hashParams=new URLSearchParams(hash);
      const searchParams=new URLSearchParams(window.location.search);
      const accessToken=hashParams.get("access_token")||searchParams.get("access_token")||hashParams.get("token");
      if(!accessToken){setErr("Lien invalide ou expiré");setLoad(false);return;}
      const r=await fetch(`${SB}/auth/v1/user`,{
        method:"PUT",
        headers:{"apikey":KEY,"Authorization":`Bearer ${accessToken}`,"Content-Type":"application/json"},
        body:JSON.stringify({password:pwd})
      });
      if(!r.ok){const e=await r.json();throw new Error(e.message||"Erreur");}
      setDone(true);
      // Nettoyer l'URL
      window.history.replaceState({},"",window.location.pathname);
    }catch(e){setErr(e.message||"Erreur, réessayez")}
    finally{setLoad(false)}
  };

  return(
    <div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center"}}><Logo s={18}/></nav>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%"}}>
          {done?(
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:48,marginBottom:16}}>✅</div>
              <h2 style={{fontSize:22,fontWeight:900,marginBottom:8}}>Mot de passe modifié !</h2>
              <p style={{fontSize:14,color:C.f400,marginBottom:24,lineHeight:1.7}}>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
              <button onClick={()=>go("auth")} style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:100,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Se connecter →</button>
            </div>
          ):(
            <div>
              <div style={{fontSize:40,marginBottom:16,textAlign:"center"}}>🔐</div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6,textAlign:"center"}}>Nouveau mot de passe</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:24,lineHeight:1.6,textAlign:"center"}}>Choisissez un nouveau mot de passe sécurisé.</p>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Nouveau mot de passe</label>
                <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum" style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
              </div>
              <div style={{marginBottom:20}}>
                <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Confirmer</label>
                <input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} placeholder="Répétez le mot de passe" onKeyDown={e=>e.key==="Enter"&&doReset()} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
              </div>
              {err&&<div style={{background:C.rl,color:C.r,borderRadius:10,padding:"10px 13px",fontSize:13,marginBottom:16}}>❌ {err}</div>}
              <button onClick={doReset} disabled={load} style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:100,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>
                {load?"Modification…":"Changer le mot de passe"}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

        price:a.price,commission:c,gain:g,
        shipping_method:modeChoisi,status:"en attente",
        escrow_status:"bloqué",drop_status:"en_attente"
      })});
      const cmd=cmds[0];
      if(cmd?.id){
        await api("drop_remises",{method:"POST",body:JSON.stringify({
          commande_id:cmd.id,annonce_id:a.id,
          vendeur_id:a.user_id,acheteur_id:user.id,
          mode_choisi:modeChoisi,status:"mode_choisi"
        })});
      }
      await api(`annonces?id=eq.${a.id}`,{method:"PATCH",body:JSON.stringify({status:"vendu"})});
      tw("Commande confirmée ! Paiement sécurisé en escrow.");
      // Notifier le vendeur par email
      try{
        const vendeur=await api(`profiles?id=eq.${a.user_id}`);
        if(vendeur[0]?.email){
          sendNotif("vente_confirmee",vendeur[0].email,{titre:a.title,prix:a.price});
        }
      }catch(e){}
      await loadA();await loadMy(user.id);await loadDrops(user.id);
      return true;
    }catch(e){tw("Erreur","error");return false}
    finally{setLoad(false)}
  };

  const onDropRefresh=()=>{if(user?.id)loadDrops(user.id)};

  const fil=ann
    .filter(a=>fcat==="Tous"||a.category===fcat||a.sub_category===fcat)
    .filter(a=>fst==="Tous"||a.state===fst)
    .filter(a=>!fpr.min||a.price>=parseFloat(fpr.min))
    .filter(a=>!fpr.max||a.price<=parseFloat(fpr.max))
    .filter(a=>!srch||a.title?.toLowerCase().includes(srch.toLowerCase())||a.brand?.toLowerCase().includes(srch.toLowerCase()))
    // Annonces Pro en tête de liste
    .sort((a,b)=>{
      const aP=a.is_pro_seller?1:0;
      const bP=b.is_pro_seller?1:0;
      if(bP!==aP) return bP-aP;
      return new Date(b.created_at)-new Date(a.created_at);
    });

  const pendingV=myDropsV.filter(d=>d.status==="mode_choisi").length;
  const pendingA=myDropsA.filter(d=>d.status==="creneaux_proposes").length;

  const p={user,prof,load,tw,go,login,register,logout,publish,toggleA,deleteA,placeOrder,toggleFavori,isAdmin,

    ann:fil,allAnn:ann,srch,setSrch,fcat,setFcat,fst,setFst,fpr,setFpr,sel,
    lang,setLang,favs,setFavs,pendingV,pendingA,onDropRefresh};

  return(

  );
}

    if(!progRef.current)return;
    progRef.current.style.transition='none';
    progRef.current.style.width='0%';
    setTimeout(()=>{
      if(!progRef.current)return;
      progRef.current.style.transition='width 4s linear';
      progRef.current.style.width='100%';
    },50);

function TopSellers({go}){
  const[sellers,setSellers]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    // Charger les profils avec le plus d'annonces actives
    api("annonces?status=eq.active&select=user_id")
      .then(async rows=>{
        const counts={};
        rows.forEach(r=>{counts[r.user_id]=(counts[r.user_id]||0)+1;});
        const topIds=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id])=>id);
        if(!topIds.length){setLoading(false);return;}
        const profiles=await api(`profiles?id=in.(${topIds.join(",")})&select=id,name,avatar_url,user_type`);
        const avis=await Promise.all(topIds.map(id=>api(`avis?cible_id=eq.${id}&select=note`).catch(()=>[])));
        const enriched=topIds.map((id,i)=>{
          const p=profiles.find(x=>x.id===id)||{id,name:"Vendeur",user_type:"particulier"};
          const notes=avis[i]||[];
          const avg=notes.length>0?(notes.reduce((s,a)=>s+a.note,0)/notes.length).toFixed(1):null;
          return{...p,count:counts[id],avg,nbAvis:notes.length};
        });
        setSellers(enriched);
        setLoading(false);
      }).catch(()=>setLoading(false));
  },[]);

  if(loading) return(
    <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:4}}>
      {[1,2,3,4,5].map(i=>(
        <div key={i} style={{flexShrink:0,width:110,height:130,borderRadius:14,background:"#F5F5F5",animation:"fu 1s ease infinite alternate"}}/>
      ))}
    </div>
  );

  if(!sellers.length) return null;

  return(
    <div style={{padding:"32px 20px 12px",maxWidth:1200,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div>

          <div style={{fontSize:20,fontWeight:900,letterSpacing:"-0.5px"}}>Vendeurs en vue 🏅</div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:8,scrollbarWidth:"none"}}>
        {sellers.map(s=>(
          <div key={s.id} onClick={()=>go("profil",null,s.id)} className="card" style={{flexShrink:0,width:120,background:C.w,borderRadius:14,border:`1px solid ${C.f200}`,padding:"16px 12px 14px",textAlign:"center",cursor:"pointer"}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:C.gl,margin:"0 auto 10px",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",border:`2px solid ${s.user_type==="pro"?"#FFD700":C.f200}`}}>
              {s.avatar_url
                ?<img src={s.avatar_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                :<span style={{fontSize:20,fontWeight:900,color:C.g}}>{(s.name||"?").charAt(0).toUpperCase()}</span>

// ═══ STATS PRO PANEL ═══
function StatsPanel({myA, user, isPro, go}){
  const[stats,setStats]=useState([]);
  const[loading,setLoading]=useState(true);
  const[period,setPeriod]=useState(7);

  useEffect(()=>{
    if(!user||!myA.length){setLoading(false);return;}
    setLoading(true);
    const annonceIds=myA.map(a=>a.id);
    const since=new Date(Date.now()-period*24*3600*1000).toISOString();

    Promise.all(
      annonceIds.map(id=>
        Promise.all([
          api(`annonce_views?annonce_id=eq.${id}&viewed_at=gte.${since}`),
          api(`favoris?annonce_id=eq.${id}`)
        ]).then(([views,favs])=>({
          annonce:myA.find(a=>a.id===id),
          vues:views.length,
          favoris:favs.length,
        }))
      )
    ).then(data=>{
      setStats(data.sort((a,b)=>b.vues-a.vues));
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[user?.id, myA.length, period]);

  const totalVues=stats.reduce((s,d)=>s+d.vues,0);
  const totalFavoris=stats.reduce((s,d)=>s+d.favoris,0);
  const activeAnn=myA.filter(a=>a.status==="active").length;
  const convRate=totalVues>0?((myA.filter(a=>a.status==="vendu").length/Math.max(totalVues,1))*100).toFixed(1):0;



  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div>
          <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:4}}>📊 Stats Pro</h2>
          <p style={{fontSize:13,color:"#9A9A9A",margin:0}}>Performances de vos annonces</p>
        </div>
        <div style={{display:"flex",gap:6,background:"#F5F5F5",borderRadius:100,padding:3}}>
          {[[7,"7j"],[30,"30j"],[90,"90j"]].map(([d,l])=>(
            <button key={d} onClick={()=>setPeriod(d)} style={{padding:"6px 14px",borderRadius:100,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",background:period===d?"#0A2A1E":"transparent",color:period===d?"#fff":"#9A9A9A",transition:"all .2s"}}>{l}</button>
          ))}
        </div>
      </div>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}} className="g2m">
        {[
          {v:totalVues,l:"Vues totales",ico:"👁️",color:"#0A2A1E"},
          {v:totalFavoris,l:"Mis en favoris",ico:"❤️",color:"#E8470A"},
          {v:activeAnn,l:"Annonces actives",ico:"📦",color:"#0A2A1E"},
          {v:convRate+"%",l:"Taux conversion",ico:"🎯",color:"#00C46A"},
        ].map((kpi,i)=>(
          <div key={i} style={{background:"#fff",border:"1px solid #E8E8E8",borderRadius:14,padding:"16px",textAlign:"center"}}>
            <div style={{fontSize:24,marginBottom:6}}>{kpi.ico}</div>
            <div style={{fontSize:22,fontWeight:900,color:kpi.color,letterSpacing:"-1px"}}>{kpi.v}</div>
            <div style={{fontSize:11,color:"#9A9A9A",marginTop:3}}>{kpi.l}</div>
          </div>
        ))}
      </div>

      {/* Tableau par annonce */}
      <div style={{background:"#fff",border:"1px solid #E8E8E8",borderRadius:16,overflow:"hidden"}}>
        <div style={{padding:"14px 18px",borderBottom:"1px solid #F5F5F5",display:"grid",gridTemplateColumns:"1fr 80px 80px 80px",gap:8,fontSize:11,fontWeight:700,color:"#9A9A9A",textTransform:"uppercase",letterSpacing:"1px"}}>
          <span>Annonce</span>
          <span style={{textAlign:"center"}}>Vues</span>
          <span style={{textAlign:"center"}}>Favoris</span>
          <span style={{textAlign:"center"}}>Statut</span>
        </div>
        {loading?(
          <div style={{padding:40,textAlign:"center",color:"#9A9A9A"}}>Chargement…</div>
        ):stats.length===0?(
          <div style={{padding:40,textAlign:"center",color:"#9A9A9A"}}>Aucune annonce</div>
        ):stats.map((d,i)=>(
          <div key={i} style={{padding:"12px 18px",borderBottom:i<stats.length-1?"1px solid #F5F5F5":"none",display:"grid",gridTemplateColumns:"1fr 80px 80px 80px",gap:8,alignItems:"center"}}>
            <div style={{display:"flex",gap:10,alignItems:"center",minWidth:0}}>
              <div style={{width:36,height:36,borderRadius:8,overflow:"hidden",background:"#F5F5F5",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>
                {d.annonce?.photo_url?<img src={d.annonce.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"🏅"}
              </div>
              <div style={{minWidth:0}}>

function AdminPanel({user, prof, go, tw, api}){
  const[tab,setTab]=useState("litiges");
  const[litiges,setLitiges]=useState([]);
  const[sel,setSel]=useState(null);
  const[note,setNote]=useState("");
  const[loading,setLoading]=useState(true);
  const[stats,setStats]=useState({total:0,ouverts:0,resolus:0,rejetes:0});

  const loadLitiges=async()=>{
    setLoading(true);
    try{
      const data=await api("drop_litiges?order=created_at.desc&limit=100");
      setLitiges(data||[]);
      setStats({
        total:data.length,
        ouverts:data.filter(l=>l.statut==="ouvert").length,
        resolus:data.filter(l=>l.statut==="resolu").length,
        rejetes:data.filter(l=>l.statut==="rejete").length,
      });
    }catch(e){tw("Erreur chargement","error")}
    setLoading(false);
  };

  useEffect(()=>{loadLitiges();},[]);

  const decider=async(litige,decision)=>{
    try{
      await api(`drop_litiges?id=eq.${litige.id}`,{
        method:"PATCH",
        body:JSON.stringify({
          statut:decision==="rembourser"?"resolu":"rejete",
          decision,
          note_admin:note,
          updated_at:new Date().toISOString()
        }),
        prefer:"return=minimal"
      });
      // Si remboursement : débloquer l'escrow côté acheteur
      if(decision==="rembourser"&&litige.commande_id){
        await api(`commandes?id=eq.${litige.commande_id}`,{
          method:"PATCH",
          body:JSON.stringify({escrow_status:"rembourse",drop_status:"litige_resolu"}),
          prefer:"return=minimal"
        });
      }
      // Si libérer les fonds : créditer le vendeur
      if(decision==="liberer_fonds"&&litige.commande_id){
        await api(`commandes?id=eq.${litige.commande_id}`,{
          method:"PATCH",
          body:JSON.stringify({escrow_status:"libere",drop_status:"litige_resolu"}),
          prefer:"return=minimal"
        });
      }
      tw(decision==="rembourser"?"Remboursement déclenché":"Décision enregistrée");
      setSel(null);setNote("");
      loadLitiges();
    }catch(e){tw("Erreur","error")}
  };

  const MOTIFS={
    "article_non_conforme":"Article non conforme",
    "article_endommage":"Article endommagé",
    "vendeur_absent":"Vendeur absent au RDV",
    "acheteur_absent":"Acheteur absent au RDV",
    "code_refuse":"Code refusé",
    "autre":"Autre"
  };

  const STATUS_COLOR={
    ouvert:{bg:"#FFF3E0",color:"#E65100"},
    resolu:{bg:"#E8F5E9",color:"#2E7D32"},
    rejete:{bg:"#FFEBEE",color:"#C62828"},
  };

  return(
    <div style={{minHeight:"100vh",background:C.f50}}>
      {/* Nav admin */}
      <nav style={{background:C.k,padding:"0 24px",height:54,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,.5)",display:"flex",alignItems:"center",gap:5,fontSize:13}}><Ico.chL/> Retour</button>
          <div style={{width:1,height:20,background:"rgba(255,255,255,.1)"}}/>
          <Logo s={18}/>
          <div style={{background:"#E8470A",color:"#fff",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:4,letterSpacing:"1px"}}>ADMIN</div>
        </div>
        <div style={{fontSize:13,color:"rgba(255,255,255,.5)"}}>Connecté : {prof?.name||user?.email}</div>
      </nav>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 20px"}}>

        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>
          {[
            {v:stats.total,l:"Total litiges",color:C.k},
            {v:stats.ouverts,l:"En cours",color:"#E65100"},
            {v:stats.resolus,l:"Résolus",color:"#2E7D32"},
            {v:stats.rejetes,l:"Rejetés",color:"#C62828"},
          ].map((s,i)=>(
            <div key={i} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px 20px"}}>
              <div style={{fontSize:28,fontWeight:900,color:s.color,letterSpacing:"-1px"}}>{s.v}</div>
              <div style={{fontSize:12,color:C.f400,marginTop:4}}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* Onglets */}
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {[["litiges","Litiges Drop"],["all_litiges","Tous les litiges"]].map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)} style={{padding:"8px 18px",borderRadius:100,border:`1.5px solid ${tab===id?C.k:C.f200}`,background:tab===id?C.k:"transparent",color:tab===id?C.w:C.f600,fontSize:13,fontWeight:600,cursor:"pointer"}}>
              {label} {id==="litiges"&&stats.ouverts>0&&<span style={{background:"#E8470A",color:"#fff",borderRadius:"50%",width:18,height:18,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,marginLeft:4}}>{stats.ouverts}</span>}
            </button>
          ))}
          <button onClick={loadLitiges} style={{marginLeft:"auto",padding:"8px 14px",borderRadius:100,border:`1px solid ${C.f200}`,background:"transparent",color:C.f600,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Actualiser
          </button>
        </div>

        {/* Liste litiges */}
        <div style={{display:"grid",gap:10}}>
          {loading?(
            <div style={{textAlign:"center",padding:40,color:C.f400}}>Chargement...</div>
          ):litiges.length===0?(
            <div style={{textAlign:"center",padding:40,background:C.w,borderRadius:16,border:`1px solid ${C.f200}`}}>
              <div style={{fontSize:32,marginBottom:12}}>🎉</div>
              <div style={{fontSize:16,fontWeight:700}}>Aucun litige en cours</div>
              <div style={{fontSize:13,color:C.f400,marginTop:4}}>La plateforme tourne bien !</div>
            </div>
          ):litiges
            .filter(l=>tab==="litiges"?l.statut==="ouvert":true)
            .map(l=>(
              <div key={l.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,overflow:"hidden"}}>
                {/* Header litige */}
                <div style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",borderBottom:sel?.id===l.id?`1px solid ${C.f200}`:"none"}}
                  onClick={()=>setSel(sel?.id===l.id?null:l)}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                      <span style={{fontSize:12,fontWeight:700,background:STATUS_COLOR[l.statut]?.bg||C.f100,color:STATUS_COLOR[l.statut]?.color||C.f600,padding:"2px 8px",borderRadius:100}}>
                        {l.statut.toUpperCase()}
                      </span>
                      <span style={{fontSize:12,color:C.f400}}>{MOTIFS[l.motif]||l.motif}</span>
                      <span style={{fontSize:11,color:C.f300}}>#{l.id.slice(0,8)}</span>
                    </div>
                    <div style={{fontSize:13,color:C.f600,lineHeight:1.5}}>{l.description||"Pas de description"}</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:11,color:C.f400}}>{new Date(l.created_at).toLocaleDateString("fr-FR")}</div>
                    <div style={{fontSize:20,color:C.f300,marginTop:4}}>{sel?.id===l.id?"▲":"▼"}</div>
                  </div>
                </div>

                {/* Détail litige */}
                {sel?.id===l.id&&(
                  <div style={{padding:"18px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}} className="g1m">
                      <div style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}>
                        <div style={{fontSize:11,color:C.f400,marginBottom:4,letterSpacing:"1px",fontWeight:600}}>ACHETEUR</div>
                        <div style={{fontSize:13,fontWeight:600}}>{l.acheteur_id?.slice(0,8)}...</div>
                      </div>
                      <div style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}>
                        <div style={{fontSize:11,color:C.f400,marginBottom:4,letterSpacing:"1px",fontWeight:600}}>VENDEUR</div>
                        <div style={{fontSize:13,fontWeight:600}}>{l.vendeur_id?.slice(0,8)}...</div>
                      </div>
                    </div>

                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:12,fontWeight:700,color:C.f600,marginBottom:6}}>Note admin (optionnelle)</div>
                      <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Votre décision et justification..." rows={3}
                        style={{width:"100%",padding:"10px 12px",borderRadius:8,border:`1px solid ${C.f200}`,fontSize:13,resize:"vertical",outline:"none",fontFamily:"inherit"}}/>
                    </div>

                    {l.statut==="ouvert"&&(
                      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                        <button onClick={()=>decider(l,"rembourser")} style={{background:"#2E7D32",color:"#fff",border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                          Rembourser l'acheteur
                        </button>
                        <button onClick={()=>decider(l,"liberer_fonds")} style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                          Libérer les fonds au vendeur
                        </button>
                        <button onClick={()=>decider(l,"rejete")} style={{background:"transparent",color:C.r,border:`1px solid ${C.r}`,borderRadius:100,padding:"10px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                          Rejeter le litige
                        </button>
                      </div>
                    )}
                    {l.statut!=="ouvert"&&(
                      <div style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}>
                        <div style={{fontSize:12,fontWeight:700,color:C.f600,marginBottom:4}}>Décision prise</div>
                        <div style={{fontSize:13,color:C.k}}>{l.decision}</div>
                        {l.note_admin&&<div style={{fontSize:12,color:C.f400,marginTop:4}}>{l.note_admin}</div>}
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))
          }
        </div>

      </div>
    </div>
  );
}

        <div style={{display:"flex",gap:6,alignItems:"center",background:C.w,borderRadius:100,padding:"4px 14px",border:"1.5px solid rgba(255,255,255,.2)"}}><input type="number" value={fpr.min} onChange={e=>setFpr(f=>({...f,min:e.target.value}))} placeholder="Min €" style={{width:54,border:"none",background:"transparent",fontSize:13,outline:"none",color:C.k}}/><span style={{color:C.f400}}>—</span><input type="number" value={fpr.max} onChange={e=>setFpr(f=>({...f,max:e.target.value}))} placeholder="Max €" style={{width:54,border:"none",background:"transparent",fontSize:13,outline:"none",color:C.k}}/></div>
        <span style={{marginLeft:"auto",fontSize:13,color:"rgba(255,255,255,.6)",fontWeight:500}}>{ann.length} résultat{ann.length!==1?"s":""}</span>
      </div>


      {/* GRID */}
      <div style={{padding:"16px 20px 80px",maxWidth:1200,margin:"0 auto"}}>
        {ann.length===0?(
          <div style={{textAlign:"center",padding:"72px 0"}}>
            <div style={{fontSize:48,marginBottom:16}}>🎾</div>
            <div style={{fontSize:17,fontWeight:700,marginBottom:8,color:C.w}}>Aucune annonce pour l'instant</div>
            <div style={{fontSize:14,color:"rgba(255,255,255,.5)",marginBottom:24}}>Soyez le premier à vendre sur SMASHD</div>
            {user&&<button onClick={()=>go("sell")} className="btn" style={{background:C.w,color:C.g,border:"none",borderRadius:100,padding:"12px 26px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Publier une annonce</button>}
          </div>
        ):(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:14}}>
            {ann.map(a=>(
              <div key={a.id} className="card" onClick={()=>go("article",a)} style={{background:C.w,borderRadius:16,overflow:"hidden",cursor:"pointer",border:"none"}}>
                <div style={{background:C.f100,height:170,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
                  {a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:44,height:44,background:C.g,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{CAT_TREE[a.category]?.icon||"🏅"}</div>}
                  <button onClick={e=>{e.stopPropagation();toggleFavori(a.id)}} style={{position:"absolute",top:10,right:10,width:30,height:30,borderRadius:"50%",background:C.w,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:favs[a.id]?C.o:C.f400}}>{Ico.heart(favs[a.id])}</button>
                  {a.brand&&<div style={{position:"absolute",bottom:8,left:8,background:"rgba(0,0,0,.65)",color:C.w,fontSize:11,fontWeight:700,borderRadius:6,padding:"3px 8px"}}>{a.brand}</div>}
                  {a.is_pro_seller&&<div style={{position:"absolute",top:8,left:8,background:"#FFD700",color:"#5A4000",fontSize:9,fontWeight:800,borderRadius:6,padding:"2px 8px",letterSpacing:"0.5px"}}>★ EN AVANT</div>}
                  {a.drop_modes&&a.drop_modes.length>0&&<div style={{position:"absolute",top:a.is_pro_seller?28:8,left:8,background:"rgba(10,42,30,.85)",color:C.ga,fontSize:9,fontWeight:700,borderRadius:6,padding:"2px 7px",display:"flex",alignItems:"center",gap:3}}><Ico.drop/><span>Drop</span></div>}
                </div>
                <div style={{padding:"12px 14px"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:5}}><Tag state={a.state}/>{a.sub_category&&<span style={{fontSize:10,fontWeight:600,color:C.f400}}>· {a.sub_category}</span>}</div>
                  <div style={{fontSize:14,fontWeight:700,margin:"4px 0 3px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:C.k}}>{a.title}</div>
                  <div style={{fontSize:12,color:C.f400,marginBottom:10}}>{a.category}</div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <span style={{fontSize:20,fontWeight:900,letterSpacing:"-0.5px",color:C.k}}>{a.price} €</span>
                    <div style={{width:30,height:30,borderRadius:"50%",background:C.g,display:"flex",alignItems:"center",justifyContent:"center",color:C.w}}><Ico.arr/></div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      </div>{/* fin bg vert */}

      {/* TRUST */}
      <div style={{background:C.f50,borderTop:`1px solid ${C.f200}`,padding:"56px 20px"}}>
        <div style={{maxWidth:960,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:36}}>
          {[[<Ico.shld/>,"Paiement escrow","Argent bloqué jusqu'à remise confirmée."],[<Ico.drop/>,"SMASHD Drop","Livraison communautaire 100% gratuite."],[<Ico.leaf/>,"Éco-responsable","Seconde vie à vos équipements."],[<Ico.chk/>,"Anti-bypass","Messagerie sécurisée, coordonnées masquées."]].map(([icon,t,d],i)=>(
            <div key={i}><div style={{width:38,height:38,background:C.gl,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",color:C.g,marginBottom:12}}>{icon}</div><div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{t}</div><div style={{fontSize:13,color:C.f600,lineHeight:1.6}}>{d}</div></div>
          ))}
        </div>
      </div>

      <footer style={{background:C.k,color:C.w,padding:"44px 20px 32px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:28,marginBottom:36}}>
            <div><Logo s={20}/><p style={{fontSize:13,color:"rgba(255,255,255,.35)",marginTop:12,lineHeight:1.7,maxWidth:220}}>La marketplace de seconde main dédiée aux sports de raquette.</p></div>
            {[["Acheter",["Catalogue","Nouveautés","Bons plans"]],["Vendre",["Déposer une annonce","SMASHD Drop","FAQ"]],["SMASHD",["À propos","Contact","Blog"]]].map(([t,ls])=><div key={t}><div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:12}}>{t}</div>{ls.map(l=><div key={l} style={{fontSize:13,color:"rgba(255,255,255,.5)",marginBottom:8,cursor:"pointer"}}>{l}</div>)}</div>)}
          </div>
          <div style={{borderTop:"1px solid rgba(255,255,255,.08)",paddingTop:18,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:12,color:"rgba(255,255,255,.2)"}}>© 2026 SMASHD.</div>
            <div style={{display:"flex",gap:14,fontSize:12,color:"rgba(255,255,255,.2)"}}>{[["CGU","cgu"],["Confidentialité","confidentialite"],["Mentions légales","mentions"]].map(([l,p])=><button key={p} onClick={()=>go("legal",null,null,p)} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"rgba(255,255,255,.35)",padding:0,textDecoration:"underline"}}>{l}</button>)}</div>
          </div>
        </div>
      </footer>
    </div>
  );
}

// ═══ AUTH ═══
function Field({label,children,error}){
  return(
    <div style={{marginBottom:14}}>
      <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>{label}</label>
      {children}
      {error&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{error}</div>}
    </div>
  );
}

function Auth({login,register,load,go,initMode="login"}){
  const[mode,setMode]=useState(initMode);
  const[step,setStep]=useState(0);
  const[ut,setUt]=useState("particulier");
  const[email,setEmail]=useState("");
  const[pwd,setPwd]=useState("");
  const[pwd2,setPwd2]=useState("");
  const[name,setName]=useState("");
  const[siret,setSiret]=useState("");
  const[company,setCompany]=useState("");
  const[cgv,setCgv]=useState(false);
  const[err,setErr]=useState({});
  const[forgot,setForgot]=useState(false);
  const[forgotEmail,setForgotEmail]=useState("");
  const[forgotSent,setForgotSent]=useState(false);
  const[forgotLoad,setForgotLoad]=useState(false);
  const[remember,setRemember]=useState(false);

  const doOAuth=async(provider)=>{
    try{
      const r=await fetch(`${SB}/auth/v1/authorize?provider=${provider}&redirect_to=${encodeURIComponent(window.location.href)}`,{
        headers:{"apikey":KEY}
      });
      // Supabase OAuth : redirection directe
      window.location.href=`${SB}/auth/v1/authorize?provider=${provider}&redirect_to=${encodeURIComponent(window.location.origin+window.location.pathname)}`;
    }catch(e){setErr({email:"Erreur SSO, réessayez"});}
  };

  const SSOButtons=()=>(
    <div style={{marginBottom:20}}>
      {[
        {id:"google",label:"Continuer avec Google",icon:<svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>},
        {id:"apple",label:"Continuer avec Apple",icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>},
        {id:"facebook",label:"Continuer avec Facebook",icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>},
      ].map(({id,label,icon})=>(
        <button key={id} onClick={()=>doOAuth(id)} className="btn" style={{width:"100%",background:C.w,color:C.k,border:`1.5px solid ${C.f200}`,borderRadius:12,padding:"12px 16px",fontSize:14,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:10}}>
          {icon}{label}
        </button>
      ))}
      <div style={{display:"flex",alignItems:"center",gap:10,margin:"20px 0 4px"}}>
        <div style={{flex:1,height:1,background:C.f200}}/>
        <span style={{fontSize:12,color:C.f400,fontWeight:500,whiteSpace:"nowrap"}}>ou continuer avec email</span>
        <div style={{flex:1,height:1,background:C.f200}}/>
      </div>
    </div>
  );

  const doForgot=async()=>{
    if(!forgotEmail||!/\S+@\S+\.\S+/.test(forgotEmail)){setErr({forgotEmail:"Email invalide"});return;}
    setForgotLoad(true);
    try{
      await fetch(`${SB}/auth/v1/recover`,{
        method:"POST",
        headers:{"apikey":KEY,"Content-Type":"application/json"},
        body:JSON.stringify({email:forgotEmail})
      });
      setForgotSent(true);
    }catch(e){setErr({forgotEmail:"Erreur, réessayez"})}
    finally{setForgotLoad(false)}
  };

  const inp={width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"};
  const v0=()=>{const e={};if(!email||!/\S+@\S+\.\S+/.test(email))e.email="Email invalide";if(!pwd||pwd.length<6)e.pwd="6 min";if(mode==="register"&&pwd!==pwd2)e.pwd2="Différents";setErr(e);return!Object.keys(e).length};
  const v1=()=>{const e={};if(!name)e.name="Requis";if(ut==="pro"&&!siret)e.siret="Requis";if(!cgv)e.cgv="Requis";setErr(e);return!Object.keys(e).length};
  const doLogin=async()=>{if(!v0())return;try{await login(email,pwd,remember)}catch(e){setErr({email:"Email ou mot de passe incorrect"})}};
  const doReg=async()=>{if(!v1())return;try{await register(email,pwd,name,ut,siret,company)}catch(e){setErr({email:e.message})}};



  return(
    <div style={{minHeight:"100vh",background:C.f50,display:"flex",flexDirection:"column"}}>
      <nav style={{background:C.w,borderBottom:`1px solid ${C.f200}`,padding:"0 20px",height:54,display:"flex",alignItems:"center"}}><Logo s={18}/></nav>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
        <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:20,padding:"28px 24px",maxWidth:400,width:"100%"}}>
          <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f400,fontSize:13,display:"flex",alignItems:"center",gap:5,marginBottom:20}}><Ico.chL/> Retour</button>
          <div style={{display:"flex",gap:6,marginBottom:24,background:C.f100,borderRadius:12,padding:4}}>
            {[["login","Connexion"],["register","S'inscrire"]].map(([m,l])=>(
              <button key={m} onClick={()=>{setMode(m);setErr({});setStep(0)}} style={{flex:1,background:mode===m?C.w:"transparent",color:mode===m?C.k:C.f400,border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .15s"}}>{l}</button>
            ))}
          </div>
          {mode==="login"&&(
            <div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Bon retour</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:22}}>Connectez-vous à votre compte SMASHD</p>
              <SSOButtons/>
              <Field label="Email" error={err.email}><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vous@exemple.com" style={{...inp,border:`1.5px solid ${err.email?C.r:C.f200}`}}/></Field>
              <Field label="Mot de passe"><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()} style={inp}/></Field>
              <label style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer",fontSize:13,color:C.f600,marginBottom:16,userSelect:"none"}}>
                <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} style={{width:16,height:16,accentColor:C.g,cursor:"pointer"}}/>
                <span>Se souvenir de moi</span>
              </label>
              <button onClick={doLogin} disabled={load} className="btn" style={{width:"100%",background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:8}}>{load?"Connexion…":"Se connecter"}</button>
              <button onClick={()=>setForgot(true)} style={{width:"100%",background:"none",border:"none",color:C.f400,fontSize:13,cursor:"pointer",marginTop:12,textDecoration:"underline"}}>Mot de passe oublié ?</button>
            </div>
          )}

          {/* FORGOT PASSWORD */}
          {forgot&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>
              <div style={{background:C.w,borderRadius:20,padding:"28px 24px",maxWidth:380,width:"100%"}}>
                {forgotSent?(
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:40,marginBottom:16}}>📧</div>
                    <h3 style={{fontSize:18,fontWeight:900,marginBottom:8}}>Email envoyé !</h3>
                    <p style={{fontSize:14,color:C.f400,lineHeight:1.7,marginBottom:20}}>Vérifiez votre boîte mail. Le lien est valable 1 heure.</p>
                    <button onClick={()=>{setForgot(false);setForgotSent(false);setForgotEmail("");}} style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:100,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Retour à la connexion</button>
                  </div>
                ):(
                  <div>
                    <h3 style={{fontSize:18,fontWeight:900,marginBottom:6}}>Mot de passe oublié</h3>
                    <p style={{fontSize:13,color:C.f400,marginBottom:20,lineHeight:1.6}}>Entrez votre email — nous vous enverrons un lien de réinitialisation.</p>
                    <div style={{marginBottom:16}}>
                      <label style={{fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Email</label>
                      <input type="email" value={forgotEmail} onChange={e=>setForgotEmail(e.target.value)} placeholder="vous@exemple.com" onKeyDown={e=>e.key==="Enter"&&doForgot()} style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${err.forgotEmail?C.r:C.f200}`,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
                      {err.forgotEmail&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.forgotEmail}</div>}
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>{setForgot(false);setErr({});}} style={{flex:1,background:C.f100,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Annuler</button>
                      <button onClick={doForgot} disabled={forgotLoad} style={{flex:2,background:forgotLoad?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:100,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{forgotLoad?"Envoi…":"Envoyer le lien"}</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
          {mode==="register"&&(
            <div>
              <h2 style={{fontSize:22,fontWeight:900,letterSpacing:"-0.5px",marginBottom:6}}>Créer un compte</h2>
              <p style={{fontSize:13,color:C.f400,marginBottom:18}}>Rejoignez la communauté SMASHD</p>
              <SSOButtons/>
              <div style={{display:"flex",gap:6,marginBottom:18}}>
                {[["particulier","Particulier"],["pro","Vendeur Pro"]].map(([id,l])=>(
                  <button key={id} onClick={()=>setUt(id)} style={{flex:1,background:ut===id?C.g:C.f100,color:ut===id?C.w:C.f600,border:"none",borderRadius:10,padding:"10px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{l}</button>
                ))}
              </div>
              {ut==="pro"&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:12,color:C.g,marginBottom:16,fontWeight:500}}>Abonnement 99€/an — Invendus + espace publicitaire</div>}
              <div style={{display:"flex",gap:4,marginBottom:20}}>{["Compte","Profil"].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>i?C.g:step===i?C.ga:C.f200,transition:"background .3s"}}/>)}</div>
              {step===0&&(
                <div>
                  <Field label="Email *" error={err.email}><input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{...inp,border:`1.5px solid ${err.email?C.r:C.f200}`}}/></Field>
                  <Field label="Mot de passe *" error={err.pwd}><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum" style={{...inp,border:`1.5px solid ${err.pwd?C.r:C.f200}`}}/></Field>
                  <Field label="Confirmer *" error={err.pwd2}><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} style={{...inp,border:`1.5px solid ${err.pwd2?C.r:C.f200}`}}/></Field>
                  <button onClick={()=>v0()&&setStep(1)} className="btn" style={{width:"100%",background:C.g,color:C.w,border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Continuer →</button>
                </div>
              )}
              {step===1&&(
                <div>
                  <Field label={ut==="pro"?"Nom du responsable *":"Nom complet *"} error={err.name}><input value={name} onChange={e=>setName(e.target.value)} placeholder="Jean Dupont" style={{...inp,border:`1.5px solid ${err.name?C.r:C.f200}`}}/></Field>
                  {ut==="pro"&&(
                    <div>
                      <Field label="SIRET *" error={err.siret}><input value={siret} onChange={e=>setSiret(e.target.value)} placeholder="123 456 789 00012" style={{...inp,border:`1.5px solid ${err.siret?C.r:C.f200}`}}/></Field>
                      <Field label="Nom commercial"><input value={company} onChange={e=>setCompany(e.target.value)} style={inp}/></Field>
                    </div>
                  )}
                  <div style={{marginBottom:18}}>
                    <label style={{display:"flex",alignItems:"flex-start",gap:9,cursor:"pointer",fontSize:13,color:C.f600}}>
                      <input type="checkbox" checked={cgv} onChange={e=>setCgv(e.target.checked)} style={{marginTop:3,accentColor:C.g}}/>
                      <span>J'accepte les <span style={{color:C.g,fontWeight:600}}>CGV</span> et la <span style={{color:C.g,fontWeight:600}}>Politique de confidentialité</span></span>
                    </label>
                    {err.cgv&&<div style={{fontSize:12,color:C.r,marginTop:4}}>{err.cgv}</div>}
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>setStep(0)} style={{flex:1,background:C.f100,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Retour</button>
                    <button onClick={doReg} disabled={load} className="btn" style={{flex:2,background:load?"#9FE1CB":C.g,color:C.w,border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{load?"Création…":ut==="pro"?"Créer compte Pro":"Créer mon compte"}</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

          {photos.length>1&&<div style={{display:"flex",gap:8,marginBottom:24,overflowX:"auto"}}>{photos.map((url,i)=><div key={i} onClick={()=>setMp(i)} style={{width:64,height:64,borderRadius:10,overflow:"hidden",border:`2px solid ${mp===i?C.k:C.f200}`,cursor:"pointer",flexShrink:0}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>)}</div>}
          <div style={{display:"flex",borderBottom:`1px solid ${C.f200}`,marginBottom:18}}>
            {[["desc","Description"],["specs","Caractéristiques"],["drop","Livraison Drop"]].map(([id,l])=>(

            ))}
          </div>
          {tab==="desc"&&<p style={{fontSize:14,lineHeight:1.8,color:C.f600}}>{a.description||"Aucune description fournie."}</p>}
          {tab==="specs"&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {Object.keys(parsedAttrs).length>0

                :[["Sport",a.category],["Type",a.sub_category||"—"],["État",a.state]].map(([k,v])=><div key={k} style={{background:C.f50,borderRadius:10,padding:"12px 14px"}}><div style={{fontSize:11,fontWeight:700,color:C.f400,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{k}</div><div style={{fontSize:14,fontWeight:600}}>{v}</div></div>)
              }
            </div>
          )}
          {tab==="drop"&&(
            <div>
              <div style={{background:C.k,borderRadius:14,padding:"20px 22px",color:C.w,marginBottom:12}}>
                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:10}}>SMASHD Drop</div>
                {dropInfo.modes?.length>0?(
                  <div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                      {dropInfo.modes.map(m=><span key={m} style={{background:"rgba(255,255,255,.1)",borderRadius:100,padding:"5px 12px",fontSize:13,fontWeight:700}}>{DROP_MODES[m]?.icon} {DROP_MODES[m]?.label}</span>)}
                    </div>
                    <div style={{fontSize:12,color:"rgba(255,255,255,.4)"}}>Zone : Dép. {dropInfo.dept} {dropInfo.ville?`· ${dropInfo.ville}`:""}</div>
                    <div style={{marginTop:8,background:"rgba(0,196,106,.1)",borderRadius:8,padding:"8px 12px",fontSize:12,color:C.ga}}>🔐 Paiement bloqué en escrow · Code Drop généré après confirmation RDV</div>
                  </div>
                ):<div style={{fontSize:13,color:"rgba(255,255,255,.5)"}}>Livraison SMASHD Drop — détails après commande.</div>}
              </div>
            </div>
          )}
        </div>

        <div style={{position:"sticky",top:64,alignSelf:"start"}}>
          <div style={{display:"flex",gap:7,marginBottom:10,flexWrap:"wrap"}}>
            <span style={{background:C.gl,color:C.g,fontSize:11,fontWeight:700,borderRadius:6,padding:"3px 9px"}}>{CAT_TREE[a.category]?.icon} {a.category}</span>
            {a.sub_category&&<span style={{background:C.f100,color:C.f600,fontSize:11,fontWeight:600,borderRadius:6,padding:"3px 9px"}}>{a.sub_category}</span>}
            <span style={{background:C.k,color:C.ga,fontSize:11,fontWeight:700,borderRadius:6,padding:"3px 9px",display:"flex",alignItems:"center",gap:4}}><Ico.drop/><span>Drop</span></span>
          </div>
          <h1 style={{fontSize:20,fontWeight:900,letterSpacing:"-0.5px",marginBottom:7,lineHeight:1.2}}>{a.title}</h1>
          <Tag state={a.state}/>
          <div style={{fontSize:36,fontWeight:900,letterSpacing:"-2px",margin:"13px 0 4px"}}>{a.price} €</div>
          <div style={{fontSize:13,color:C.f400,marginBottom:20}}>+ protection acheteur {protection} €</div>
          {ofrSent&&<div style={{background:C.gl,border:`1px solid ${C.ga}`,borderRadius:10,padding:"10px 13px",fontSize:13,color:C.g,marginBottom:13}}>Offre de <strong>{ofr} €</strong> envoyée.</div>}
          <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:18}}>
            <button onClick={()=>user?setShowBuyDrop(true):go("auth")} className="btn" style={{background:C.g,color:C.w,border:"none",borderRadius:100,padding:"15px",fontSize:15,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
              🔐 Acheter via SMASHD Drop <Ico.arr/>
            </button>
            <div style={{display:"flex",gap:7}}>
              <input type="number" value={ofr} onChange={e=>setOfr(e.target.value)} placeholder="Proposer un prix €" style={{flex:1,padding:"12px 13px",borderRadius:100,border:`1.5px solid ${C.f200}`,fontSize:14,outline:"none"}}/>
              <button onClick={()=>ofr&&setOfrSent(true)} className="btn" style={{background:C.w,color:C.k,border:`1.5px solid ${C.k}`,borderRadius:100,padding:"12px 16px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Offrir</button>
            </div>
            <button onClick={()=>toggleFavori(a.id)} style={{background:"none",border:`1.5px solid ${favs[a.id]?C.o:C.f200}`,borderRadius:100,padding:"11px",fontSize:14,fontWeight:600,cursor:"pointer",color:favs[a.id]?C.o:C.f400,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>{Ico.heart(favs[a.id])} {favs[a.id]?"Sauvegardé":"Sauvegarder"}</button>
          <button onClick={()=>go("profil",null,a.user_id)} style={{background:"none",border:`1.5px solid ${C.f200}`,borderRadius:100,padding:"11px",fontSize:13,fontWeight:600,cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>👤 Voir le profil vendeur</button>
          </div>
          <div style={{borderTop:`1px solid ${C.f200}`,paddingTop:16}}>
            {[[<Ico.drop/>,"Livraison SMASHD Drop gratuite"],[<Ico.shld/>,"Paiement bloqué en escrow"],[<Ico.chk/>,"Protection acheteur garantie"],[<Ico.leaf/>,"Article éco-responsable"]].map(([icon,l],i)=>(
              <div key={i} style={{display:"flex",gap:10,alignItems:"center",fontSize:13,color:C.f600,marginBottom:9}}><div style={{color:C.g,flexShrink:0}}>{icon}</div>{l}</div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══ DASHBOARD ═══
function Dash({user,prof,go,logout,myA,myO,myS,myDropsV,myDropsA,myDropCr,myDropMsgs,wal,dtab,setDtab,toggleA,deleteA,tw,pendingV,pendingA,onDropRefresh,isAdmin}){
  const isPro=prof?.user_type==="pro";
  const rev=myS.filter(s=>myDropsV.find(d=>d.commande_id===s.id&&d.status==="confirme")).reduce((acc,s)=>acc+(s.gain||0),0);
  const fn=(prof?.name&&!prof.name.includes("@"))?prof.name.split(" ")[0]:"Mon compte";
  const DTABS=[
    {id:"overview",l:"Vue d'ensemble"},
    {id:"annonces",l:"Mes annonces"},
    {id:"drop-vendeur",l:`Drop Vendeur${pendingV>0?` (${pendingV})`:""}`},
    {id:"drop-acheteur",l:`Drop Acheteur${pendingA>0?` (${pendingA})`:""}`},
    {id:"ventes",l:"Mes ventes"},
    {id:"achats",l:"Mes achats"},
    {id:"wallet",l:"E-Wallet"},
    {id:"settings",l:"Paramètres"},

        <button onClick={()=>go("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.f600,display:"flex",alignItems:"center",fontSize:14}}><Ico.chL/></button>
        <Logo s={18}/>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          {(pendingV+pendingA)>0&&<div style={{background:C.o,color:"#fff",borderRadius:100,padding:"4px 10px",fontSize:12,fontWeight:700}}>{pendingV+pendingA} Drop en attente</div>}
          <button onClick={()=>go("profil",null,user?.id)} className="btn hm" style={{background:C.f100,color:C.k,border:`1px solid ${C.f200}`,borderRadius:100,padding:"8px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>👤 Mon profil</button>
          <button onClick={()=>go("sell")} className="btn" style={{background:C.o,color:C.w,border:"none",borderRadius:100,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Vendre</button>
          <button onClick={logout} className="btn" style={{background:C.f100,color:C.r,border:`1px solid ${C.f200}`,borderRadius:100,padding:"8px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Déconnexion</button>
        </div>
      </nav>

      <div style={{maxWidth:1060,margin:"0 auto",padding:"16px",display:"grid",gridTemplateColumns:"200px 1fr",gap:20}} className="g1m">
        {/* Sidebar */}

          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"14px",marginBottom:10}}>
            <div style={{fontSize:15,fontWeight:700}}>{prof?.name&&!prof.name.includes("@")?prof.name.split(" ")[0]:"Mon compte"}</div>
            
            {isPro&&<div style={{marginTop:7,background:C.k,color:C.w,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,display:"inline-block"}}>PRO</div>}
          </div>
          <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"8px"}}>
            {DTABS.map(t=>(
              <button key={t.id} onClick={()=>setDtab(t.id)} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:dtab===t.id?C.k:"transparent",color:dtab===t.id?C.w:t.id.includes("drop")&&(pendingV+pendingA)>0?C.o:C.f600,fontWeight:dtab===t.id?700:500,fontSize:13,cursor:"pointer",marginBottom:2,textAlign:"left"}}>{t.l}</button>
            ))}
            <div style={{borderTop:`1px solid ${C.f200}`,marginTop:7,paddingTop:7}}>
              <button onClick={()=>go("pro")} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:prof?.user_type==="pro"?"rgba(0,196,106,.1)":"transparent",color:prof?.user_type==="pro"?"#00C46A":C.f600,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left",marginBottom:2}}>
                {prof?.user_type==="pro"?"✦ Mon abonnement Pro":"🚀 Passer Pro — 99€/an"}</button>
              {isAdmin&&<button onClick={()=>go("admin")} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:"rgba(232,71,10,.08)",color:"#E8470A",fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"left",marginBottom:2}}>
                Admin — Litiges
              </button>}
              <button onClick={logout} style={{width:"100%",display:"block",padding:"9px 12px",borderRadius:10,border:"none",background:"transparent",color:C.r,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>Déconnexion</button>
            </div>
          </div>
        </div>

        <div style={{minWidth:0}}>

          {dtab==="overview"&&(
            <div>
              <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px",marginBottom:18}}>Bonjour 👋</h2>
              {(pendingV+pendingA)>0&&(
                <div style={{background:"#FFF3E0",border:"1px solid #F5C07A",borderRadius:13,padding:"14px 18px",marginBottom:16,display:"flex",gap:12,alignItems:"center"}}>
                  <span style={{fontSize:20}}>⚡</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#8a4a00"}}>Actions SMASHD Drop requises</div>

                    {pendingA>0&&<div style={{fontSize:13,color:"#b05a00",marginTop:4}}>
                      📅 <strong>{pendingA} créneau{pendingA>1?"x":""}</strong> disponible{pendingA>1?"s":""} — Choisissez votre RDV
                    </div>}
                  </div>
                  <button onClick={()=>setDtab(pendingV>0?"drop-vendeur":"drop-acheteur")} style={{background:C.o,color:"#fff",border:"none",borderRadius:100,padding:"8px 16px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>Gérer →</button>
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}} className="g2m dash-overview-stats">
                {[[`${rev.toFixed(2)} €`,"Revenus confirmés",C.g],[myA.filter(a=>a.status==="active").length,"Annonces actives",C.k],[myS.length,"Ventes",C.o],[myO.length,"Achats",C.f600]].map(([v,l,col])=>(
                  <div key={l} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:12,padding:"16px"}}>
                    <div style={{fontSize:22,fontWeight:900,color:col,letterSpacing:"-1px"}}>{v}</div>
                    <div style={{fontSize:12,color:C.f400,marginTop:3}}>{l}</div>

                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="g1m">
                <div style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:14,padding:"16px"}}>
                  <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:C.f400,marginBottom:12}}>Annonces récentes</div>
                  {myA.slice(0,4).map(a=>(
                    <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.f100}`}}>
                      <div style={{width:36,height:36,borderRadius:8,background:C.f100,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,overflow:"hidden"}}>{a.photo_url?<img src={a.photo_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:CAT_TREE[a.category]?.icon||"🏅"}</div>
                      <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div><div style={{fontSize:12,color:C.f400}}>{a.price} €</div></div>
                      <div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:C.f400,textTransform:"uppercase"}}>{a.status==="active"?"En ligne":"—"}</div>
                    </div>
                  ))}
                  {myA.length===0&&<div style={{fontSize:13,color:C.f400,textAlign:"center",padding:"14px 0"}}>Aucune annonce</div>}
                </div>
                <div style={{background:C.g,borderRadius:14,padding:"20px",color:C.w}}>
                  <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,.4)",marginBottom:6}}>E-Wallet</div>
                  <div style={{fontSize:34,fontWeight:900,letterSpacing:"-2px",marginBottom:4}}>{wal.toFixed(2)} €</div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:18}}>Revenus Drop confirmés</div>
                  <button onClick={()=>setDtab("wallet")} style={{background:"rgba(255,255,255,.15)",color:C.w,border:"1px solid rgba(255,255,255,.2)",borderRadius:100,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Gérer mon wallet</button>
                </div>
              </div>
            </div>

          {dtab==="annonces"&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
                <h2 style={{fontSize:21,fontWeight:900,letterSpacing:"-0.5px"}}>Mes annonces</h2>
                <button onClick={()=>go("sell")} className="btn" style={{background:C.k,color:C.w,border:"none",borderRadius:100,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}><Ico.plus/> Nouvelle</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {myA.map(a=>{
                  let di={};try{if(a.drop_info)di=JSON.parse(a.drop_info)}catch(e){}
                  return(
                    <div key={a.id} style={{background:C.w,border:`1px solid ${C.f200}`,borderRadius:13,padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>

                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
                        <div style={{fontSize:12,color:C.f400,marginTop:1}}>{a.category} · {a.price} €</div>

                      <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                        <div style={{fontSize:10,fontWeight:700,color:a.status==="active"?C.g:a.status==="pause"?C.o:C.f400,textTransform:"uppercase",background:a.status==="active"?C.gl:a.status==="pause"?"#FFF3E0":C.f100,padding:"4px 9px",borderRadius:100}}>{a.status==="active"?"En ligne":a.status==="pause"?"Pause":"Vendu"}</div>
                        {a.status!=="vendu"&&a.status!=="supprimé"&&(

            </div>

          {dtab==="drop-vendeur"&&(
